래란 모든 법의 있는 그대로(여여함)를 뜻하기 때문이다. … 그러므로 여래는 '모든 법이 다 불법'이라 한다. 수보리여, 모든 법이라 한 것은 모든 법이 아니라 그 이름이 모든 법이다. … 보살도 이와 같아서 '내가 한량없는 중생을 건지리라' 한다면 보살이라 할 수 없다. … 그러므로 부처님은 모든 법에는 나도 없고 남도 없고 중생도 없고 수명도 없다고 한다. … 수보리여, 보살이 무아의 법을 꿰뚫어 알면 여래는 그를 참된 보살이라 한다.\"", "z": "\"여래(如來)\"는 \"있는 그대로(如) 오신 분\"입니다. 나라는 것이 없음(무아)을 꿰뚫은 이가 참 보살입니다.", "e": "Then Subhuti asked again how one who sets out for supreme awakening should abide and subdue the mind. The Buddha said: \"Give rise to the thought, 'I will liberate all beings,' yet having liberated them all, not one being is actually liberated… In truth there is no dharma of setting out for supreme awakening… Had the Tathagata attained some dharma, Dipankara Buddha would not have predicted, 'In the future you will become the Buddha Shakyamuni.' Because there was truly nothing to attain, he gave the prediction. Why? Tathagata means the suchness of all dharmas… Thus the Tathagata says all dharmas are Buddha-dharmas; yet 'all dharmas' are not all dharmas — they are called all dharmas… A bodhisattva who says 'I will liberate countless beings' is not a bodhisattva… Thus the Buddha says all dharmas are without self, person, being or life-span… A bodhisattva who penetrates the Dharma of no-self, the Tathagata calls a true bodhisattva.\"", "w": ["여래", "무아", "수기"], "ti": "제17분 구경무아분 — 끝내 나라는 것은 없음", "th": "究竟無我分"}, {"h": "須菩提 於意云何 如來有肉眼不 如是 世尊 如來有肉眼 須菩提 於意云何 如來有天眼不 如是 世尊 如來有天眼 須菩提 於意云何 如來有慧眼不 如是 世尊 如來有慧眼 須菩提 於意云何 如來有法眼不 如是 世尊 如來有法眼 須菩提 於意云何 如來有佛眼不 如是 世尊 如來有佛眼 須菩提 於意云何 恒河中所有沙 佛說是沙不 如是 世尊 如來說是沙 須菩提 於意云何 如一恒河中所有沙 有如是等恒河 是諸恒河所有沙數佛世界 如是寧爲多不 甚多 世尊 佛告須菩提 爾所國土中 所有衆生若干種心 如來悉知 何以故 如來說諸心 皆爲非心 是名爲心 所以者何 須菩提 過去心不可得 現在心不可得 未來心不可得", "r": "수보리 어의운하 여래유육안부 여시 세존 여래유육안 수보리 어의운하 여래유천안부 여시 세존 여래유천안 수보리 어의운하 여래유혜안부 여시 세존 여래유혜안 수보리 어의운하 여래유법안부 여시 세존 여래유법안 수보리 어의운하 여래유불안부 여시 세존 여래유불안 수보리 어의운하 항하중소유사 불설시사부 여시 세존 여래설시사 수보리 어의운하 여일항하중소유사 유여시등항하 시제항하소유사수불세계 여시령위다부 심다 세존 불고수보리 이소국토중 소유중생약간종심 여래실지 하이고 여래설제심 개위비심 시명위심 소이자하 수보리 과거심불가득 현재심불가득 미래심불가득", "k": "\"수보리여, 어떻게 생각하느냐? 여래에게 육안(육신의 눈)이 있느냐?\" \"그렇습니다, 세존이시여. 여래께는 육안이 있습니다.\" (천안·혜안·법안·불안도 이와 같이 문답한다.) \"수보리여, 항하의 모래 수만큼 항하가 있고, 그 모든 항하의 모래 수만큼 불세계가 있다면 많겠느냐?\" \"매우 많습니다.\" 부처님께서 말씀하셨다. \"그 모든 국토에 있는 중생의 갖가지 마음을 여래는 다 안다. 왜냐하면 여래가 말한 모든 마음은 다 마음이 아니라 그 이름이 마음이기 때문이다. 왜 그런가? 수보리여, 과거의 마음도 얻을 수 없고, 현재의 마음도 얻을 수 없고, 미래의 마음도 얻을 수 없기 때문이다.\"", "z": "\"과거심 불가득, 현재심 불가득, 미래심 불가득\" — 붙잡을 수 있는 마음은 어디에도 없습니다. 덕산 스님의 \"점심(點心)\" 이야기로 유명한 구절입니다.", "e": "\"Subhuti, does the Tathagata have the physical eye?\" \"Yes.\" (So too the divine eye, wisdom eye, Dharma eye and Buddha eye.) \"If there were as many Buddha-worlds as the sands of as many Ganges Rivers as there are Ganges sands, would they be many?\" \"Very many.\" The Buddha said: \"The Tathagata fully knows all the various minds of the beings in all those lands. Why? The minds the Tathagata speaks of are not minds; they are called minds. Why? Subhuti, past mind cannot be grasped, present mind cannot be grasped, future mind cannot be grasped.\"", "w": ["오안", "마음"], "ti": "제18분 일체동관분 — 하나로 같이 봄", "th": "一體同觀分"}, {"h": "須菩提 於意云何 若有人滿三千大千世界七寶以用布施 是人以是因緣得福多不 如是 世尊 此人以是因緣得福甚多 須菩提 若福德有實 如來不說得福德多 以福德無故 如來說得福德多", "r": "수보리 어의운하 약유인만삼천대천세계칠보이용보시 시인이시인연득복다부 여시 세존 차인이시인연득복심다 수보리 약복덕유실 여래불설득복덕다 이복덕무고 여래설득복덕다", "k": "\"수보리여, 어떻게 생각하느냐? 어떤 사람이 삼천대천세계에 가득 찬 칠보로 보시한다면, 이 사람이 그 인연으로 얻는 복이 많겠느냐?\" \"그렇습니다, 세존이시여. 그 인연으로 얻는 복이 매우 많습니다.\" \"수보리여, 만약 복덕이 실제로 있는 것이라면 여래는 복덕을 얻음이 많다고 말하지 않을 것이다. 복덕이 (실체로) 없기에 여래는 복덕을 얻음이 많다고 말한다.\"", "z": "", "e": "\"Subhuti, if someone filled the billion-world universe with the seven treasures and gave them away, would the merit from these causes be great?\" \"Very great.\" \"Subhuti, if merit were real, the Tathagata would not speak of great merit. Because merit has no substance, the Tathagata speaks of great merit.\"", "w": ["칠보"], "ti": "제19분 법계통화분 — 온 법계를 두루 교화함", "th": "法界通化分"}, {"h": "須菩提 於意云何 佛可以具足色身見不 不也 世尊 如來不應以具足色身見 何以故 如來說具足色身 即非具足色身 是名具足色身 須菩提 於意云何 如來可以具足諸相見不 不也 世尊 如來不應以具足諸相見 何以故 如來說諸相具足 即非具足 是名諸相具足", "r": "수보리 어의운하 불가이구족색신견부 불야 세존 여래불응이구족색신견 하이고 여래설구족색신 즉비구족색신 시명구족색신 수보리 어의운하 여래가이구족제상견부 불야 세존 여래불응이구족제상견 하이고 여래설제상구족 즉비구족 시명제상구족", "k": "\"수보리여, 어떻게 생각하느냐? 부처를 완전한 몸(구족색신)으로 볼 수 있겠느냐?\" \"없습니다, 세존이시여. 여래를 완전한 몸으로 보아서는 안 됩니다. 여래께서 말씀하신 완전한 몸은 완전한 몸이 아니라 그 이름이 완전한 몸이기 때문입니다.\" \"여래를 완전한 모든 모습으로 볼 수 있겠느냐?\" \"없습니다. 여래께서 말씀하신 모든 모습의 완전함은 완전함이 아니라 그 이름이 모든 모습의 완전함입니다.\"", "z": "", "e": "\"Can the Buddha be seen through a perfect physical body?\" \"No. The perfect physical body is not a perfect body; it is called a perfect body.\" \"Can the Tathagata be seen through perfect marks?\" \"No. Perfect marks are not perfect; they are called perfect marks.\"", "w": [], "ti": "제20분 이색이상분 — 형색과 모습을 떠남", "th": "離色離相分"}, {"h": "須菩提 汝勿謂如來作是念 我當有所說法 莫作是念 何以故 若人言如來有所說法 即爲謗佛 不能解我所說故 須菩提 說法者 無法可說 是名說法 爾時 慧命須菩提白佛言 世尊 頗有衆生於未來世 聞說是法生信心不 佛言 須菩提 彼非衆生 非不衆生 何以故 須菩提 衆生 衆生者 如來說非衆生 是名衆生", "r": "수보리 여물위여래작시념 아당유소설법 막작시념 하이고 약인언여래유소설법 즉위방불 불능해아소설고 수보리 설법자 무법가설 시명설법 이시 혜명수보리백불언 세존 파유중생어미래세 문설시법생신심부 불언 수보리 피비중생 비부중생 하이고 수보리 중생 중생자 여래설비중생 시명중생", "k": "\"수보리여, 너는 여래가 '내가 설한 법이 있다'고 생각한다고 말하지 말라. 그런 생각을 하지 말라. 왜냐하면 누가 '여래가 설한 법이 있다'고 한다면 그것은 부처를 비방하는 것이니, 내가 말한 뜻을 이해하지 못했기 때문이다. 수보리여, 법을 설한다는 것은 설할 법이 없는 것, 그 이름이 설법이다.\" 그때 혜명 수보리가 여쭈었다. \"세존이시여, 미래세에 이 법을 듣고 믿는 마음을 낼 중생이 있겠습니까?\" \"수보리여, 그들은 중생도 아니고 중생 아님도 아니다. 왜냐하면 중생이라 하는 것을 여래는 중생이 아니라 하니, 그 이름이 중생이기 때문이다.\"", "z": "부처님은 49년간 설법하시고도 \"한 글자도 설한 바 없다\"고 하셨습니다.", "e": "\"Subhuti, do not say the Tathagata thinks, 'I have taught a Dharma.' Do not think so. Why? Whoever says the Tathagata has taught a Dharma slanders the Buddha, not understanding my meaning. Teaching the Dharma means there is no Dharma to teach; this is called teaching the Dharma.\" Then the wise Subhuti asked: \"Will there be beings in the future who hear this and have faith?\" \"Subhuti, they are neither beings nor non-beings. Why? 'Beings,' the Tathagata says, are not beings; they are called beings.\"", "w": ["설법"], "ti": "제21분 비설소설분 — 설함 없는 설법", "th": "非說所說分"}, {"h": "須菩提白佛言 世尊 佛得阿耨多羅三藐三菩提 爲無所得耶 如是 如是 須菩提 我於阿耨多羅三藐三菩提乃至無有少法可得 是名阿耨多羅三藐三菩提", "r": "수보리백불언 세존 불득아뇩다라삼먁삼보리 위무소득야 여시 여시 수보리 아어아뇩다라삼먁삼보리내지무유소법가득 시명아뇩다라삼먁삼보리", "k": "수보리가 부처님께 여쭈었다. \"세존이시여, 부처님께서 위없는 깨달음을 얻으신 것은 얻은 바가 없는 것입니까?\" \"그렇다, 그렇다. 수보리여, 나는 위없는 깨달음에서 조그마한 법도 얻은 것이 없으니, 그 이름이 위없는 깨달음이다.\"", "z": "깨달음은 무엇을 새로 얻는 것이 아니라 본래 그러함을 아는 것입니다.", "e": "Subhuti asked: \"World-Honored One, in attaining supreme awakening, did the Buddha attain nothing?\" \"So it is, Subhuti. In supreme awakening I attained not the slightest dharma; this is called supreme awakening.\"", "w": ["아뇩다라삼먁삼보리"], "ti": "제22분 무법가득분 — 얻을 법이 없음", "th": "無法可得分"}, {"h": "復次 須菩提 是法平等 無有高下 是名阿耨多羅三藐三菩提 以無我 無人 無衆生 無壽者 修一切善法 則得阿耨多羅三藐三菩提 須菩提 所言善法者 如來說非善法 是名善法", "r": "부차 수보리 시법평등 무유고하 시명아뇩다라삼먁삼보리 이무아 무인 무중생 무수자 수일체선법 즉득아뇩다라삼먁삼보리 수보리 소언선법자 여래설비선법 시명선법", "k": "\"또 수보리여, 이 법은 평등하여 높고 낮음이 없으니, 이를 위없는 깨달음이라 한다. 나도 없고 남도 없고 중생도 없고 수명도 없이 모든 선한 법을 닦으면 곧 위없는 깨달음을 얻는다. 수보리여, 선한 법이라 한 것은 여래가 선한 법이 아니라 하니, 그 이름이 선한 법이다.\"", "z": "\"나\"라는 생각 없이 선행을 하는 것 — 그것이 깨달음의 길입니다.", "e": "\"Moreover, Subhuti, this Dharma is equal, without high or low; this is called supreme awakening. Cultivating all good dharmas without self, person, being or life-span, one attains supreme awakening. Subhuti, good dharmas, the Tathagata says, are not good dharmas; they are called good dharmas.\"", "w": ["평등"], "ti": "제23분 정심행선분 — 깨끗한 마음으로 선을 행함", "th": "淨心行善分"}, {"h": "須菩提 若三千大千世界中所有諸須彌山王 如是等七寶聚 有人持用布施 若人以此般若波羅蜜經 乃至四句偈等 受持 讀誦 爲他人說 於前福德百分不及一 百千萬億分 乃至算數 譬喻所不能及", "r": "수보리 약삼천대천세계중소유제수미산왕 여시등칠보취 유인지용보시 약인이차반야바라밀경 내지사구게등 수지 독송 위타인설 어전복덕백분불급일 백천만억분 내지산수 비유소불능급", "k": "\"수보리여, 삼천대천세계에 있는 모든 수미산왕만큼 쌓인 칠보를 어떤 사람이 보시하더라도, 어떤 사람이 이 반야바라밀경의 사구게 하나라도 받아 지니고 읽고 외워 남을 위해 말해 준다면, 앞의 복덕은 이 복덕의 백분의 일, 백천만억분의 일에도 미치지 못하며, 어떤 숫자나 비유로도 미칠 수 없다.\"", "z": "", "e": "\"Subhuti, if someone gave away heaps of the seven treasures as large as all the Mount Sumerus in the billion-world universe, and another kept, read, recited and explained even a four-line verse of this Prajna Paramita Sutra, the former merit would not equal a hundredth, a billionth of the latter — beyond any number or simile.\"", "w": ["수미산", "사구게"], "ti": "제24분 복지무비분 — 복과 지혜는 비교할 수 없음", "th": "福智無比分"}, {"h": "須菩提 於意云何 汝等勿謂如來作是念 我當度衆生 須菩提 莫作是念 何以故 實無有衆生如來度者 若有衆生如來度者 如來則有我 人 衆生 壽者 須菩提 如來說有我者 則非有我 而凡夫之人以爲有我 須菩提 凡夫者 如來說則非凡夫", "r": "수보리 어의운하 여등물위여래작시념 아당도중생 수보리 막작시념 하이고 실무유중생여래도자 약유중생여래도자 여래즉유아 인 중생 수자 수보리 여래설유아자 즉비유아 이범부지인이위유아 수보리 범부자 여래설즉비범부", "k": "\"수보리여, 어떻게 생각하느냐? 너희는 여래가 '내가 중생을 건지리라'고 생각한다고 말하지 말라. 수보리여, 그런 생각을 하지 말라. 왜냐하면 실제로 여래가 건질 중생이 없기 때문이다. 만약 여래가 건질 중생이 있다면 여래에게도 나·남·중생·수명(이라는 생각)이 있는 것이다. 수보리여, 여래가 '나'라고 말하는 것은 나가 있는 것이 아닌데, 범부들은 나가 있다고 여긴다. 수보리여, 범부라는 것도 여래는 범부가 아니라 한다.\"", "z": "", "e": "\"Subhuti, do not say the Tathagata thinks, 'I will liberate beings.' Do not think so. Why? There are in truth no beings for the Tathagata to liberate. If there were, the Tathagata would have notions of self, person, being and life-span. Subhuti, when the Tathagata speaks of 'I,' there is no self, yet ordinary people think there is a self. Subhuti, 'ordinary people,' the Tathagata says, are not ordinary people.\"", "w": ["범부"], "ti": "제25분 화무소화분 — 교화하되 교화한 바 없음", "th": "化無所化分"}, {"h": "須菩提 於意云何 可以三十二相觀如來不 須菩提言 如是 如是 以三十二相觀如來 佛言 須菩提 若以三十二相觀如來者 轉輪聖王則是如來 須菩提白佛言 世尊 如我解佛所說義 不應以三十二相觀如來 爾時 世尊而說偈言 若以色見我 以音聲求我 是人行邪道 不能見如來", "r": "수보리 어의운하 가이삼십이상관여래부 수보리언 여시 여시 이삼십이상관여래 불언 수보리 약이삼십이상관여래자 전륜성왕즉시여래 수보리백불언 세존 여아해불소설의 불응이삼십이상관여래 이시 세존이설게언 약이색견아 이음성구아 시인행사도 불능견여래", "k": "\"수보리여, 어떻게 생각하느냐? 32상으로 여래를 볼 수 있겠느냐?\" 수보리가 말씀드렸다. \"그렇습니다, 그렇습니다. 32상으로 여래를 봅니다.\" 부처님께서 말씀하셨다. \"수보리여, 만약 32상으로 여래를 볼 수 있다면 전륜성왕도 곧 여래이겠구나.\" 수보리가 말씀드렸다. \"세존이시여, 제가 부처님 말씀의 뜻을 이해하기로는 32상으로 여래를 보아서는 안 됩니다.\" 그때 세존께서 게송으로 말씀하셨다. \"만약 형색으로 나를 보거나 음성으로 나를 구한다면, 이 사람은 삿된 길을 가는 것이니 여래를 볼 수 없으리라.\"", "z": "\"약이색견아 이음성구아 시인행사도 불능견여래\" — 금강경 사구게 가운데 둘째입니다. 겉모습과 소리로 부처를 찾지 말라는 가르침입니다.", "e": "\"Subhuti, can the Tathagata be contemplated through the thirty-two marks?\" Subhuti said: \"Yes, yes, through the thirty-two marks.\" The Buddha said: \"If the Tathagata could be contemplated through the thirty-two marks, then a wheel-turning king would be the Tathagata.\" Subhuti said: \"As I understand the Buddha's meaning, the Tathagata should not be contemplated through the thirty-two marks.\" Then the World-Honored One spoke this verse: \"Whoever sees me by form, whoever seeks me in sound, walks a mistaken path and cannot see the Tathagata.\"", "w": ["사구게", "삼십이상", "전륜성왕"], "ti": "제26분 법신비상분 — 법신은 모습이 아님", "th": "法身非相分"}, {"h": "須菩提 汝若作是念 如來不以具足相故 得阿耨多羅三藐三菩提 須菩提 莫作是念 如來不以具足相故 得阿耨多羅三藐三菩提 須菩提 汝若作是念 發阿耨多羅三藐三菩提者 說諸法斷滅相 莫作是念 何以故 發阿耨多羅三藐三菩提心者 於法不說斷滅相", "r": "수보리 여약작시념 여래불이구족상고 득아뇩다라삼먁삼보리 수보리 막작시념 여래불이구족상고 득아뇩다라삼먁삼보리 수보리 여약작시념 발아뇩다라삼먁삼보리자 설제법단멸상 막작시념 하이고 발아뇩다라삼먁삼보리심자 어법불설단멸상", "k": "\"수보리여, 너는 '여래는 완전한 모습을 갖추지 않았기에 위없는 깨달음을 얻었다'고 생각하지 말라. 또 '위없는 깨달음의 마음을 낸 이는 모든 법이 끊어져 없어진다고 말한다'고 생각하지 말라. 왜냐하면 위없는 깨달음의 마음을 낸 이는 법에 대해 끊어져 없어진다는 견해를 말하지 않기 때문이다.\"", "z": "\"공(空)\"은 아무것도 없다는 허무가 아닙니다. 모습에 집착하지 않되, 모든 것을 부정하는 것도 아닙니다.", "e": "\"Subhuti, do not think the Tathagata attained supreme awakening because he did not possess perfect marks. Nor think that one who sets out for supreme awakening declares all dharmas annihilated. Why? One who sets out for supreme awakening does not teach annihilation of dharmas.\"", "w": ["공"], "ti": "제27분 무단무멸분 — 끊어짐도 없어짐도 없음", "th": "無斷無滅分"}, {"h": "須菩提 若菩薩以滿恒河沙等世界七寶布施 若復有人知一切法無我 得成於忍 此菩薩勝前菩薩所得功德 須菩提 以諸菩薩不受福德故 須菩提白佛言 世尊 云何菩薩不受福德 須菩提 菩薩所作福德 不應貪著 是故說不受福德", "r": "수보리 약보살이만항하사등세계칠보보시 약부유인지일체법무아 득성어인 차보살승전보살소득공덕 수보리 이제보살불수복덕고 수보리백불언 세존 운하보살불수복덕 수보리 보살소작복덕 불응탐착 시고설불수복덕", "k": "\"수보리여, 어떤 보살이 항하의 모래 수만큼 많은 세계를 칠보로 가득 채워 보시하더라도, 또 어떤 사람이 모든 법에 나가 없음을 알아 인욕(무생법인)을 이룬다면, 이 보살이 앞의 보살보다 공덕이 뛰어나다. 수보리여, 모든 보살은 복덕을 받지 않기 때문이다.\" 수보리가 여쭈었다. \"세존이시여, 어찌하여 보살은 복덕을 받지 않습니까?\" \"수보리여, 보살은 지은 복덕에 탐착하지 않아야 하니, 그래서 복덕을 받지 않는다고 한다.\"", "z": "", "e": "\"Subhuti, if a bodhisattva filled worlds as many as the Ganges sands with the seven treasures and gave them away, and another knew all dharmas to be without self and attained patient acceptance, the latter's merit surpasses the former. Why? Bodhisattvas do not receive merit.\" Subhuti asked: \"Why do bodhisattvas not receive merit?\" \"Bodhisattvas should not crave the merit they create; therefore it is said they do not receive merit.\"", "w": ["무아", "인욕"], "ti": "제28분 불수불탐분 — 받지도 탐하지도 않음", "th": "不受不貪分"}, {"h": "須菩提 若有人言如來若來若去 若坐若臥 是人不解我所說義 何以故 如來者 無所從來 亦無所去 故名如來", "r": "수보리 약유인언여래약래약거 약좌약와 시인불해아소설의 하이고 여래자 무소종래 역무소거 고명여래", "k": "\"수보리여, 누가 '여래는 오기도 하고 가기도 하며, 앉기도 하고 눕기도 한다'고 말한다면, 이 사람은 내가 말한 뜻을 이해하지 못한 것이다. 왜냐하면 여래는 어디서 온 바도 없고 어디로 가는 바도 없기에 여래라 하기 때문이다.\"", "z": "", "e": "\"Subhuti, whoever says the Tathagata comes or goes, sits or lies down, does not understand my meaning. Why? The Tathagata comes from nowhere and goes nowhere; therefore he is called the Tathagata.\"", "w": ["여래"], "ti": "제29분 위의적정분 — 거동이 고요함", "th": "威儀寂靜分"}, {"h": "須菩提 若善男子 善女人以三千大千世界碎爲微塵 於意云何 是微塵衆寧爲多不 甚多 世尊 何以故 若是微塵衆實有者 佛則不說是微塵衆 所以者何 佛說微塵衆 則非微塵衆 是名微塵衆 世尊 如來所說三千大千世界 則非世界 是名世界 何以故 若世界實有者 則是一合相 如來說一合相 則非一合相 是名一合相 須菩提 一合相者 則是不可說 但凡夫之人貪著其事", "r": "수보리 약선남자 선녀인이삼천대천세계쇄위미진 어의운하 시미진중령위다부 심다 세존 하이고 약시미진중실유자 불즉불설시미진중 소이자하 불설미진중 즉비미진중 시명미진중 세존 여래소설삼천대천세계 즉비세계 시명세계 하이고 약세계실유자 즉시일합상 여래설일합상 즉비일합상 시명일합상 수보리 일합상자 즉시불가설 단범부지인탐착기사", "k": "\"수보리여, 어떤 선남자 선여인이 삼천대천세계를 부수어 티끌로 만든다면, 그 티끌이 많겠느냐?\" \"매우 많습니다, 세존이시여. 왜냐하면 만약 그 티끌이 실제로 있는 것이라면 부처님께서는 티끌이 많다고 말씀하지 않으셨을 것이기 때문입니다. … 여래께서 말씀하신 삼천대천세계도 세계가 아니라 그 이름이 세계입니다. 왜냐하면 만약 세계가 실제로 있다면 그것은 하나로 합한 모습(일합상)일 것인데, 여래께서는 일합상도 일합상이 아니라 그 이름이 일합상이라 하셨기 때문입니다.\" \"수보리여, 일합상이란 말할 수 없는 것인데, 다만 범부들이 그것에 탐착할 뿐이다.\"", "z": "", "e": "\"Subhuti, if good men or women ground the billion-world universe into dust, would the dust motes be many?\" \"Very many. Why? If the dust motes were real, the Buddha would not call them many… The billion-world universe the Tathagata speaks of is not a world; it is called a world. Why? If the world were real, it would be a composite whole; yet the Tathagata says a composite whole is not a composite whole; it is called a composite whole.\" \"Subhuti, a composite whole cannot be spoken of; only ordinary people crave and cling to it.\"", "w": ["범부"], "ti": "제30분 일합이상분 — 하나로 합한 모습의 이치", "th": "一合理相分"}, {"h": "須菩提 若人言佛說我見 人見 衆生見 壽者見 須菩提 於意云何 是人解我所說義不 世尊 是人不解如來所說義 何以故 世尊說我見 人見 衆生見 壽者見 即非我見 人見 衆生見 壽者見 是名我見 人見 衆生見 壽者見 須菩提 發阿耨多羅三藐三菩提心者 於一切法 應如是知 如是見 如是信解 不生法相 須菩提 所言法相者 如來說即非法相 是名法相", "r": "수보리 약인언불설아견 인견 중생견 수자견 수보리 어의운하 시인해아소설의부 세존 시인불해여래소설의 하이고 세존설아견 인견 중생견 수자견 즉비아견 인견 중생견 수자견 시명아견 인견 중생견 수자견 수보리 발아뇩다라삼먁삼보리심자 어일체법 응여시지 여시견 여시신해 불생법상 수보리 소언법상자 여래설즉비법상 시명법상", "k": "\"수보리여, 누가 '부처님이 나라는 견해, 남이라는 견해, 중생이라는 견해, 수명이라는 견해를 말했다'고 한다면, 이 사람이 내가 말한 뜻을 이해한 것이냐?\" \"아닙니다, 세존이시여. 이 사람은 여래께서 말씀하신 뜻을 이해하지 못한 것입니다. 세존께서 말씀하신 아견·인견·중생견·수자견은 곧 아견·인견·중생견·수자견이 아니라 그 이름이 아견·인견·중생견·수자견이기 때문입니다.\" \"수보리여, 위없는 깨달음의 마음을 낸 이는 모든 법에 대해 이와 같이 알고, 이와 같이 보고, 이와 같이 믿고 이해하여 법이라는 생각을 내지 말아야 한다. 수보리여, 법이라는 생각이라 한 것도 여래는 법이라는 생각이 아니라 하니, 그 이름이 법이라는 생각이다.\"", "z": "", "e": "\"Subhuti, if someone says the Buddha taught views of self, person, being and life-span, does that person understand my meaning?\" \"No. The views the World-Honored One speaks of are not those views; they are called those views.\" \"Subhuti, one who sets out for supreme awakening should know, see, believe and understand all dharmas thus, not giving rise to the notion of dharma. The notion of dharma, the Tathagata says, is not a notion of dharma; it is called a notion of dharma.\"", "w": ["사상"], "ti": "제31분 지견불생분 — 알음알이를 내지 않음", "th": "知見不生分"}, {"h": "須菩提 若有人以滿無量阿僧祇世界七寶持用布施 若有善男子 善女人發菩薩心者 持於此經乃至四句偈等 受持 讀誦 爲人演說 其福勝彼 云何爲人演說 不取於相 如如不動 何以故 一切有爲法 如夢 幻 泡 影 如露亦如電 應作如是觀 佛說是經已 長老須菩提及諸比丘 比丘尼 優婆塞 優婆夷 一切世間天 人 阿修羅 聞佛所說 皆大歡喜 信受奉行", "r": "수보리 약유인이만무량아승기세계칠보지용보시 약유선남자 선녀인발보살심자 지어차경내지사구게등 수지 독송 위인연설 기복승피 운하위인연설 불취어상 여여부동 하이고 일체유위법 여몽 환 포 영 여로역여전 응작여시관 불설시경이 장로수보리급제비구 비구니 우바새 우바이 일체세간천 인 아수라 문불소설 개대환희 신수봉행", "k": "\"수보리여, 어떤 사람이 한량없는 아승기 세계를 가득 채운 칠보로 보시하더라도, 어떤 선남자 선여인이 보살의 마음을 내어 이 경을 지니되 사구게 하나라도 받아 지니고 읽고 외워 남을 위해 설해 준다면 그 복이 저보다 뛰어나다. 어떻게 남을 위해 설하는가? 모습에 집착하지 않고, 있는 그대로 흔들림이 없게 하라. 왜냐하면 — 모든 함이 있는 법(유위법)은 꿈과 같고 허깨비와 같고 물거품과 같고 그림자와 같으며, 이슬과 같고 또한 번개와 같으니, 마땅히 이와 같이 관할지니라.\" 부처님께서 이 경을 다 설하시자, 장로 수보리와 모든 비구·비구니·우바새·우바이와 온 세상의 하늘·사람·아수라가 부처님 말씀을 듣고 모두 크게 기뻐하며 믿고 받들어 행하였다.", "z": "\"일체유위법 여몽환포영 여로역여전 응작여시관\" — 금강경 사구게 가운데 마지막이자 가장 많이 외우는 게송입니다. 모든 것은 꿈·허깨비·물거품·그림자·이슬·번개처럼 덧없으니, 그렇게 보고 집착하지 말라는 가르침으로 금강경이 끝납니다.", "e": "\"Subhuti, if someone filled countless asamkhya worlds with the seven treasures and gave them away, and a good man or woman with the bodhisattva mind kept even a four-line verse of this sutra, reading, reciting and explaining it to others, that merit surpasses it. How to explain it to others? Not grasping forms, abiding in suchness, unmoving. Why? — All conditioned things are like a dream, an illusion, a bubble, a shadow, like dew and like lightning; thus should you contemplate them.\" When the Buddha finished this sutra, the elder Subhuti, the monks, nuns, laymen, laywomen, and all the gods, humans and asuras of the world, hearing the Buddha's words, rejoiced greatly, believed, accepted and practiced it.", "w": ["사구게", "유위법", "무상"], "ti": "제32분 응화비진분 — 응하여 나툰 것은 참이 아님", "th": "應化非眞分"}], "chunsu": [{"h": "淨口業眞言", "r": "수리수리 마하수리 수수리 사바하 (세 번)", "k": "입으로 지은 업을 깨끗이 하는 참된 말씀. \"길상이여, 길상이여, 크나큰 길상이여, 지극한 길상이여, 이루어지이다.\"", "z": "경전을 읽기 전에 먼저 입을 깨끗이 합니다. \"수리\"는 \"길하다, 상서롭다\"는 뜻입니다. 진언은 뜻을 번역하지 않고 소리대로 외웁니다.", "e": "Mantra purifying the karma of speech: \"Auspicious, auspicious, greatly auspicious, supremely auspicious — svaha!\" (three times)", "w": ["진언", "업"], "ti": "정구업진언 — 입으로 지은 업을 맑히는 진언"}, {"h": "五方內外安慰諸神眞言", "r": "나무 사만다 못다남 옴 도로도로 지미 사바하 (세 번)", "k": "다섯 방위 안팎의 모든 신들을 편안하게 하는 진언.", "z": "독경하는 자리의 모든 신들께 인사드리고 편안히 해 드리는 진언입니다.", "e": "Mantra comforting the spirits of the five directions, within and without. (three times)", "w": ["진언"], "ti": "오방내외안위제신진언 — 모든 신을 편안케 하는 진언"}, {"h": "無上甚深微妙法 百千萬劫難遭遇 我今聞見得受持 願解如來眞實義", "r": "무상심심미묘법 백천만겁난조우 아금문견득수지 원해여래진실의", "k": "위없이 깊고 깊은 미묘한 법은 백천만 겁이 지나도 만나기 어려운데, 제가 이제 듣고 보고 받아 지니게 되었으니, 원하옵건대 여래의 참된 뜻을 알게 하소서.", "z": "모든 경전을 읽기 전에 외우는 유명한 게송입니다. 가르침을 만난 고마움과, 그 참뜻을 알고 싶은 바람을 담았습니다.", "e": "The unsurpassed, profound and wondrous Dharma is hard to meet in hundreds of thousands of eons. Now I hear, see, receive and keep it. May I understand the Tathagata's true meaning.", "w": ["겁", "여래"], "ti": "개경게 — 경을 여는 게송"}, {"h": "開法藏眞言", "r": "옴 아라남 아라다 (세 번)", "k": "진리의 창고(법장)를 여는 진언.", "z": "", "e": "Mantra opening the treasury of the Dharma. (three times)", "w": ["진언"], "ti": "개법장진언 — 법의 창고를 여는 진언"}, {"h": "千手千眼觀自在菩薩 廣大圓滿 無礙大悲心 大陀羅尼 啓請", "r": "천수천안 관자재보살 광대원만 무애대비심 대다라니 계청", "k": "천 개의 손과 천 개의 눈을 지니신 관자재보살의, 넓고 크고 원만하며 걸림 없는 큰 자비심의 대다라니를 청하옵니다.", "z": "이제부터 관세음보살님의 큰 다라니를 청하는 노래가 시작됩니다. 천 개의 손은 모든 중생을 돕는 손, 천 개의 눈은 모든 괴로움을 살피는 눈입니다.", "e": "Invoking the vast, perfect, unobstructed great-compassion dharani of Avalokiteshvara of the thousand hands and thousand eyes.", "w": ["관세음보살", "다라니"], "ti": "천수천안 관세음보살 대다라니 계청"}, {"h": "稽首觀音大悲主 願力洪深相好身 千臂莊嚴普護持 千眼光明遍觀照", "r": "계수관음대비주 원력홍심상호신 천비장엄보호지 천안광명변관조", "k": "큰 자비의 주인이신 관세음보살께 머리 숙여 절하옵니다. 원력이 넓고 깊으며 거룩한 모습을 갖추신 몸, 천 개의 팔로 장엄하여 널리 보호하시고, 천 개의 눈의 광명으로 두루 살펴 비추십니다.", "z": "", "e": "I bow to Avalokiteshvara, lord of great compassion, whose vows are vast and deep and whose body is adorned with excellent marks; with a thousand arms he protects all, with a thousand radiant eyes he watches over all.", "w": ["관세음보살", "원력"]}, {"h": "眞實語中宣密語 無爲心內起悲心 速令滿足諸希求 永使滅除諸罪業", "r": "진실어중선밀어 무위심내기비심 속령만족제희구 영사멸제제죄업", "k": "진실한 말씀 가운데 비밀한 말씀(다라니)을 펴시고, 함이 없는 마음 안에서 자비심을 일으키시어, 온갖 바람을 속히 이루어 주시고, 모든 죄업을 영원히 없애 주십니다.", "z": "", "e": "Within true speech he proclaims the secret words; within the unconditioned mind he raises compassion; he swiftly fulfills all wishes and forever removes all wrongdoing.", "w": ["죄업", "무위"]}, {"h": "天龍衆聖同慈護 百千三昧頓薰修 受持身是光明幢 受持心是神通藏", "r": "천룡중성동자호 백천삼매돈훈수 수지신시광명당 수지심시신통장", "k": "하늘과 용과 여러 성인이 함께 자비로 보호하시어, 백천 가지 삼매를 단번에 닦게 하시니, 이 다라니를 지니는 몸은 광명의 깃발이요, 지니는 마음은 신통의 창고입니다.", "z": "", "e": "Gods, dragons and sages together protect with kindness; hundreds of thousands of samadhis are cultivated at once. The body that keeps this dharani is a banner of light; the mind that keeps it is a treasury of spiritual powers.", "w": ["삼매"]}, {"h": "洗滌塵勞願濟海 超證菩提方便門 我今稱誦誓歸依 所願從心悉圓滿", "r": "세척진로원제해 초증보리방편문 아금칭송서귀의 소원종심실원만", "k": "번뇌의 티끌을 씻어 내고 고해를 건너기를 원하오며, 깨달음의 방편문을 뛰어올라 증득하기를 원합니다. 제가 이제 칭송하며 귀의하기를 맹세하오니, 바라는 바가 마음대로 모두 원만히 이루어지이다.", "z": "", "e": "Washing away the dust of affliction, I vow to cross the sea; leaping to realize the gate of skillful means to awakening. Now I recite and vow to take refuge — may all my wishes be fulfilled as my heart desires.", "w": ["번뇌", "방편", "귀의"]}, {"h": "南無大悲觀世音 願我速知一切法 南無大悲觀世音 願我早得智慧眼 南無大悲觀世音 願我速度一切衆 南無大悲觀世音 願我早得善方便 南無大悲觀世音 願我速乘般若船 南無大悲觀世音 願我早得越苦海 南無大悲觀世音 願我速得戒定道 南無大悲觀世音 願我早登圓寂山 南無大悲觀世音 願我速會無爲舍 南無大悲觀世音 願我早同法性身", "r": "나무대비관세음 원아속지일체법 / 나무대비관세음 원아조득지혜안 / 나무대비관세음 원아속도일체중 / 나무대비관세음 원아조득선방편 / 나무대비관세음 원아속승반야선 / 나무대비관세음 원아조득월고해 / 나무대비관세음 원아속득계정도 / 나무대비관세음 원아조등원적산 / 나무대비관세음 원아속회무위사 / 나무대비관세음 원아조동법성신", "k": "대자대비하신 관세음보살께 귀의하오니, 제가 ① 속히 모든 법을 알게 하소서 ② 일찍 지혜의 눈을 얻게 하소서 ③ 속히 모든 중생을 건지게 하소서 ④ 일찍 좋은 방편을 얻게 하소서 ⑤ 속히 반야의 배에 오르게 하소서 ⑥ 일찍 고통의 바다를 건너게 하소서 ⑦ 속히 계·정·혜의 길을 얻게 하소서 ⑧ 일찍 열반의 산에 오르게 하소서 ⑨ 속히 함이 없는 집에 모이게 하소서 ⑩ 일찍 법성의 몸과 같아지게 하소서.", "z": "\"나무(南無)\"는 \"귀의합니다, 온 마음으로 의지합니다\"라는 뜻입니다. 관세음보살께 올리는 열 가지 큰 소원입니다.", "e": "Homage to greatly compassionate Avalokiteshvara! May I (1) swiftly know all dharmas, (2) soon gain the eye of wisdom, (3) swiftly save all beings, (4) soon gain good skillful means, (5) swiftly board the ship of prajna, (6) soon cross the sea of suffering, (7) swiftly attain the path of precepts, concentration and wisdom, (8) soon climb the mountain of nirvana, (9) swiftly gather in the house of the unconditioned, (10) soon become one with the Dharma-nature body.", "w": ["나무", "관세음보살", "반야", "열반"], "ti": "관세음보살 십원 — 열 가지 바람"}, {"h": "我若向刀山 刀山自摧折 我若向火湯 火湯自消滅 我若向地獄 地獄自枯竭 我若向餓鬼 餓鬼自飽滿 我若向修羅 惡心自調伏 我若向畜生 自得大智慧", "r": "아약향도산 도산자최절 아약향화탕 화탕자소멸 아약향지옥 지옥자고갈 아약향아귀 아귀자포만 아  귀의하옵고, 거룩하신 관자재보살 마하살, 크게 자비로우신 분께 귀의합니다. … 모든 두려움에서 구해 주시는 분이여, 목이 푸른 분(니라간타)이여, 탐욕과 성냄과 어리석음의 독을 없애 주소서. 깨달음을 이루게 하소서, 이루어지이다(사바하).", "z": "천수경의 중심인 다라니입니다. 고대 인도말(산스크리트)을 소리대로 옮긴 것이라 전통적으로 번역하지 않고 그대로 외웁니다. 큰 뜻은 \"삼보와 관세음보살께 귀의하오니, 삼독을 없애고 모든 중생을 깨달음으로 이끌어 주소서\"입니다.", "e": "The Great Compassion Dharani — a Sanskrit invocation chanted in its original sound. Its essence: homage to the Three Jewels and to Avalokiteshvara, the greatly compassionate one; may the poisons of greed, hatred and delusion be removed and all beings be led to awakening. Svaha! (three times)", "w": ["다라니", "삼보", "삼독"], "ti": "신묘장구대다라니 — 신비롭고 묘한 큰 다라니"}, {"h": "一灑東方潔道場 二灑南方得淸涼 三灑西方俱淨土 四灑北方永安康", "r": "일쇄동방결도량 이쇄남방득청량 삼쇄서방구정토 사쇄북방영안강", "k": "첫째로 동쪽에 (감로수를) 뿌리니 도량이 깨끗해지고, 둘째로 남쪽에 뿌리니 시원함을 얻으며, 셋째로 서쪽에 뿌리니 모두 정토가 되고, 넷째로 북쪽에 뿌리니 길이 편안하여라.", "z": "", "e": "First sprinkling the east, the practice place is purified; second, the south becomes cool and fresh; third, the west becomes a pure land; fourth, the north is forever at peace.", "w": ["도량"], "ti": "사방찬 — 사방을 깨끗이 하는 노래"}, {"h": "道場淸淨無瑕穢 三寶天龍降此地 我今持誦妙眞言 願賜慈悲密加護", "r": "도량청정무하예 삼보천룡강차지 아금지송묘진언 원사자비밀가호", "k": "도량이 깨끗하여 티끌과 더러움이 없으니, 삼보와 하늘과 용이 이곳에 내려오십니다. 제가 이제 묘한 진언을 지니고 외우오니, 자비로 은밀히 보호해 주소서.", "z": "", "e": "The practice place is pure, without stain or blemish; the Three Jewels, gods and dragons descend here. Now I keep and recite the wondrous mantra — may you bestow compassion and secret protection.", "w": ["도량", "삼보"], "ti": "도량찬 — 도량을 찬탄하는 노래"}, {"h": "我昔所造諸惡業 皆由無始貪瞋癡 從身口意之所生 一切我今皆懺悔", "r": "아석소조제악업 개유무시탐진치 종신구의지소생 일체아금개참회", "k": "제가 옛날부터 지은 모든 나쁜 업은, 모두 시작 없는 탐욕과 성냄과 어리석음 때문이며, 몸과 입과 생각으로부터 생긴 것이니, 그 모든 것을 제가 이제 다 참회합니다.", "z": "불교 의식에서 가장 많이 외우는 참회 게송입니다. 나쁜 업의 뿌리는 삼독(탐·진·치)이고, 몸·입·생각(신구의 삼업)으로 짓습니다.", "e": "All the evil karma I have created in the past arose from beginningless greed, hatred and delusion, born of body, speech and mind. Now I repent of it all.", "w": ["참회", "삼독", "삼업"], "ti": "참회게 — 참회의 게송"}, {"h": "南無懺除業障寶勝藏佛 寶光王火焰照佛 一切香華自在力王佛 百億恒河沙決定佛 振威德佛 金剛堅强消伏壞散佛 普光月殿妙音尊王佛 歡喜藏摩尼寶積佛 無盡香勝王佛 獅子月佛 歡喜莊嚴珠王佛 帝寶幢摩尼勝光佛", "r": "나무참제업장 보승장불 보광왕화염조불 일체향화자재력왕불 백억항하사결정불 진위덕불 금강견강소복괴산불 보광월전묘음존왕불 환희장마니보적불 무진향승왕불 사자월불 환희장엄주왕불 제보당마니승광불", "k": "업장을 참회하여 없애 주시는 열두 부처님께 귀의합니다: 보승장불, 보광왕화염조불, 일체향화자재력왕불, 백억항하사결정불, 진위덕불, 금강견강소복괴산불, 보광월전묘음존왕불, 환희장마니보적불, 무진향승왕불, 사자월불, 환희장엄주왕불, 제보당마니승광불.", "z": "", "e": "Homage to the twelve Buddhas who remove karmic obstructions through repentance.", "w": ["업장"], "ti": "참제업장 십이존불 — 업장을 없애 주시는 열두 부처님"}, {"h": "殺生重罪今日懺悔 偸盜重罪今日懺悔 邪淫重罪今日懺悔 妄語重罪今日懺悔 綺語重罪今日懺悔 兩舌重罪今日懺悔 惡口重罪今日懺悔 貪愛重罪今日懺悔 瞋恚重罪今日懺悔 癡暗重罪今日懺悔", "r": "살생중죄금일참회 투도중죄금일참회 사음중죄금일참회 망어중죄금일참회 기어중죄금일참회 양설중죄금일참회 악구중죄금일참회 탐애중죄금일참회 진에중죄금일참회 치암중죄금일참회", "k": "생명을 죽인 무거운 죄, 도둑질한 죄, 삿된 음행의 죄, 거짓말한 죄, 꾸며 낸 말의 죄, 이간질한 죄, 험한 말을 한 죄, 탐욕의 죄, 성냄의 죄, 어리석음의 죄 — 오늘 모두 참회합니다.", "z": "몸으로 짓는 세 가지(살생·도둑질·사음), 입으로 짓는 네 가지(거짓말·꾸밈말·이간질·험한 말), 생각으로 짓는 세 가지(탐욕·성냄·어리석음)를 십악이라 합니다.", "e": "Today I repent the grave wrongs of killing, stealing, sexual misconduct, lying, frivolous speech, divisive speech, harsh speech, greed, anger and delusion.", "w": ["십악", "참회"], "ti": "십악참회 — 열 가지 악업을 참회함"}, {"h": "百劫積集罪 一念頓蕩除 如火焚枯草 滅盡無有餘", "r": "백겁적집죄 일념돈탕제 여화분고초 멸진무유여", "k": "백 겁 동안 쌓아 온 죄도 한 생각에 단번에 씻어 없어지니, 마치 불이 마른 풀을 태우듯 남김없이 사라집니다.", "z": "진심 어린 참회 한 번이 오랜 죄를 녹인다는 희망의 말씀입니다.", "e": "Wrongs accumulated over a hundred eons are washed away in a single thought, like fire burning dry grass, completely and without remainder.", "w": ["참회"]}, {"h": "罪無自性從心起 心若滅時罪亦亡 罪亡心滅兩俱空 是則名爲眞懺悔", "r": "죄무자성종심기 심약멸시죄역망 죄망심멸양구공 시즉명위진참회", "k": "죄는 본래 자성이 없이 마음에서 일어나니, 마음이 사라지면 죄도 또한 없어집니다. 죄도 없어지고 마음도 사라져 둘 다 공해지면, 이것을 참된 참회라 합니다.", "z": "초발심자경문의 \"이참(理懺)\", 곧 죄의 본성이 공함을 깨닫는 참회입니다.", "e": "Wrongdoing has no self-nature; it arises from the mind. When the mind ceases, wrongdoing vanishes too. When both wrong and mind are gone and both are empty — this is called true repentance.", "w": ["이참사참", "공"]}, {"h": "懺悔眞言", "r": "옴 살바 못자모지 사다야 사바하 (세 번)", "k": "참회의 진언.", "z": "", "e": "The repentance mantra. (three times)", "w": ["진언", "참회"], "ti": "참회진언"}, {"h": "准提功德聚 寂靜心常誦 一切諸大難 無能侵是人 天上及人間 受福如佛等 遇此如意珠 定獲無等等", "r": "준제공덕취 적정심상송 일체제대난 무능침시인 천상급인간 수복여불등 우차여의주 정획무등등", "k": "준제보살 공덕의 무더기를 고요한 마음으로 늘 외우면, 모든 큰 재난이 이 사람을 침범하지 못하고, 하늘과 인간에서 부처님과 같은 복을 받으리니, 이 여의주를 만나면 반드시 견줄 데 없는 깨달음을 얻으리라.", "z": "", "e": "Whoever, with a calm mind, constantly recites the heap of Cundi's merits, no great calamity can harm them; in heaven and among humans they receive blessings equal to a Buddha's. Meeting this wish-fulfilling jewel, they will surely attain the unequalled.", "w": ["준제보살"], "ti": "준제찬 — 준제보살 찬탄"}, {"h": "南無七俱胝佛母大准提菩薩", "r": "나무칠구지불모대준제보살 (세 번)", "k": "칠억 부처님의 어머니이신 대준제보살께 귀의합니다.", "z": "", "e": "Homage to the great bodhisattva Cundi, mother of seven koti Buddhas. (three times)", "w": ["나무", "준제보살"]}, {"h": "淨法界眞言 護身眞言 觀世音菩薩本心微妙六字大明王眞言", "r": "옴 남 (세 번) / 옴 치림 (세 번) / 옴 마니 반메 훔 (세 번)", "k": "법계를 깨끗이 하는 진언 \"옴 남\", 몸을 보호하는 진언 \"옴 치림\", 관세음보살 본마음의 미묘한 여섯 글자 진언 \"옴 마니 반메 훔\".", "z": "\"옴 마니 반메 훔\"은 \"연꽃 속의 보배여\"라는 뜻으로, 관세음보살님의 마음을 담은 가장 유명한 진언입니다. 티베트 불교에서도 가장 많이 외웁니다.", "e": "Mantra purifying the Dharma realm: \"Om ram.\" Body-protecting mantra: \"Om chirim.\" Avalokiteshvara's six-syllable mantra: \"Om mani padme hum\" — \"the jewel in the lotus.\" (each three times)", "w": ["진언", "관세음보살"], "ti": "정법계진언 · 호신진언 · 육자대명왕진언"}, {"h": "准提眞言", "r": "나무 사다남 삼먁삼못다 구치남 다냐타 옴 자례주례 준제 사바하 부림 (세 번)", "k": "준제보살의 진언.", "z": "", "e": "The Cundi mantra. (three times)", "w": ["진언", "준제보살"], "ti": "준제진언"}, {"h": "我今持誦大准提 卽發菩提廣大願 願我定慧速圓明 願我功德皆成就 願我勝福遍莊嚴 願共衆生成佛道", "r": "아금지송대준제 즉발보리광대원 원아정혜속원명 원아공덕개성취 원아승복변장엄 원공중생성불도", "k": "제가 이제 대준제 진언을 지니고 외우며 곧 깨달음의 넓고 큰 원을 세우오니, 원하옵건대 저의 선정과 지혜가 속히 원만히 밝아지고, 공덕이 모두 이루어지며, 뛰어난 복이 두루 장엄되어, 모든 중생과 함께 불도를 이루게 하소서.", "z": "", "e": "Now I keep and recite the great Cundi and make the vast vow of awakening: may my concentration and wisdom swiftly become perfectly bright, my merits all be fulfilled, my excellent blessings adorn everywhere, and may I attain Buddhahood together with all beings.", "w": ["정혜", "중생"], "ti": "준제발원"}, {"h": "願我永離三惡道 願我速斷貪瞋癡 願我常聞佛法僧 願我勤修戒定慧 願我恒隨諸佛學 願我不退菩提心 願我決定生安養 願我速見阿彌陀 願我分身遍塵刹 願我廣度諸衆生", "r": "원아영리삼악도 원아속단탐진치 원아상문불법승 원아근수계정혜 원아항수제불학 원아불퇴보리심 원아결정생안양 원아속견아미타 원아분신변진찰 원아광도제중생", "k": "원하옵건대 저는 ① 삼악도를 길이 떠나고 ② 탐·진·치를 속히 끊으며 ③ 불·법·승을 늘 듣고 ④ 계·정·혜를 부지런히 닦으며 ⑤ 모든 부처님을 늘 따라 배우고 ⑥ 깨달음의 마음에서 물러나지 않으며 ⑦ 반드시 극락에 태어나고 ⑧ 아미타불을 속히 뵈오며 ⑨ 몸을 나누어 온 세계에 두루 가서 ⑩ 모든 중생을 널리 건지게 하소서.", "z": "", "e": "May I (1) forever leave the three evil paths, (2) swiftly cut off greed, hatred and delusion, (3) always hear of the Buddha, Dharma and Sangha, (4) diligently cultivate precepts, concentration and wisdom, (5) always follow and learn from all Buddhas, (6) never retreat from the mind of awakening, (7) surely be born in the Land of Bliss, (8) swiftly see Amitabha, (9) manifest bodies throughout countless lands, (10) widely save all beings.", "w": ["삼악도", "삼독", "삼학", "아미타불"], "ti": "여래십대발원문 — 열 가지 큰 발원"}, {"h": "衆生無邊誓願度 煩惱無盡誓願斷 法門無量誓願學 佛道無上誓願成", "r": "중생무변서원도 번뇌무진서원단 법문무량서원학 불도무상서원성", "k": "중생이 끝없지만 다 건지기를 서원합니다. 번뇌가 다함없지만 다 끊기를 서원합니다. 법문이 한량없지만 다 배우기를 서원합니다. 불도가 위없지만 반드시 이루기를 서원합니다.", "z": "\"사홍서원\" — 모든 불자가 법회 끝에 함께 외우는 네 가지 큰 맹세입니다. 불교 신앙의 핵심 다짐입니다.", "e": "Beings are countless — I vow to save them all. Afflictions are endless — I vow to cut them all. Dharma gates are measureless — I vow to learn them all. The Buddha Way is unsurpassed — I vow to attain it.", "w": ["사홍서원", "중생", "번뇌"], "ti": "발사홍서원 — 네 가지 큰 서원"}, {"h": "自性衆生誓願度 自性煩惱誓願斷 自性法門誓願學 自性佛道誓願成", "r": "자성중생서원도 자성번뇌서원단 자성법문서원학 자성불도서원성", "k": "내 마음속(자성)의 중생을 건지기를 서원하고, 내 마음속의 번뇌를 끊기를 서원하며, 내 마음속의 법문을 배우기를 서원하고, 내 마음속의 불도를 이루기를 서원합니다.", "z": "밖의 중생만이 아니라 내 마음속의 어리석음·욕심이라는 \"중생\"부터 건지라는 뜻입니다. 육조 혜능 스님의 가르침입니다.", "e": "I vow to save the beings of my own nature, to cut the afflictions of my own nature, to learn the Dharma gates of my own nature, and to attain the Buddha Way of my own nature.", "w": ["자성"]}, {"h": "發願已 歸命禮三寶 南無常住十方佛 南無常住十方法 南無常住十方僧", "r": "발원이 귀명례삼보 나무상주시방불 나무상주시방법 나무상주시방승 (세 번)", "k": "발원을 마치고 삼보께 목숨 바쳐 귀의하옵니다. 시방에 늘 계신 부처님께 귀의합니다. 시방에 늘 계신 가르침에 귀의합니다. 시방에 늘 계신 스님들께 귀의합니다.", "z": "천수경은 삼보께 귀의하는 것으로 끝납니다.", "e": "Having made these vows, I take refuge with my life in the Three Jewels: homage to the Buddhas ever-abiding in the ten directions, to the Dharma ever-abiding in the ten directions, to the Sangha ever-abiding in the ten directions. (three times)", "w": ["삼보", "나무", "귀의"], "ti": "발원이 귀명례삼보 — 삼보께 귀의"}]};

SUTRAS.chobal.parts[1].items=MORE.balsim;delete SUTRAS.chobal.parts[1].soon;
SUTRAS.chobal.parts[1].about=[['원효대사(617~686)가 지은 글로, "마음을 일으켜 수행하라"는 간절한 권유입니다. 세상의 즐거움은 덧없고 인생은 짧으니 지금 당장 수행하라고 아름다운 4자 대구로 노래합니다. 재가 불자도 "자기 힘닿는 대로 선행을 버리지 말라"는 말씀으로 품어 줍니다.','Written by Great Master Wonhyo (617–686), this is an urgent call to arouse the mind and practice. In beautiful four-character couplets it reminds us that worldly pleasures are fleeting and life is short — practice now. It also embraces lay people: "Do not abandon good deeds, according to your own strength."']];
SUTRAS.chobal.parts[2].items=MORE.jagyeong;delete SUTRAS.chobal.parts[2].soon;
SUTRAS.chobal.parts[2].about=[['고려 말 야운 스님이 지은 글로, "스스로를 일깨우는 글"이라는 뜻입니다. 자기 자신을 "주인공"이라 부르며 열 가지 생활 지침(십문)을 하나하나 일러 주고, 각 문마다 시(게송)를 붙였습니다. "삼일수심 천재보, 백년탐물 일조진"처럼 오늘날에도 널리 인용되는 구절이 많습니다.','Written by Master Yaun of late Goryeo, the title means "self-admonitions." Addressing himself as "Master," he sets out ten rules for living, each followed by a verse. Many lines are still widely quoted, such as "A mind cultivated for three days is a treasure for a thousand years; goods craved for a hundred years are dust in a morning."']];
SUTRAS.chunsu={t:'천수경',te:'The Thousand Hands Sutra',h:'千手經',chant:true,about:[
['정식 이름은 「천수천안관자재보살 광대원만 무애대비심 대다라니경」입니다. 천 개의 손과 천 개의 눈으로 모든 중생을 돕는 관세음보살의 큰 자비를 노래하는 경전입니다. 한국 절에서는 거의 모든 법회와 아침저녁 예불 때 이 경을 독송합니다.','Its full name is the Great Compassion Dharani Sutra of the Thousand-Handed, Thousand-Eyed Avalokiteshvara. It praises the great compassion of Avalokiteshvara, who helps all beings with a thousand hands and eyes. It is chanted at almost every service in Korean temples.'],
['지금 한국에서 독송하는 천수경은 중국의 원래 경전에서 핵심인 다라니를 중심으로, 개경게·참회·발원 등 여러 의식문을 한국 불교가 엮어 만든 것입니다. 구성은 ① 입과 마음을 맑힘 → ② 관세음보살께 다라니를 청함 → ③ 신묘장구대다라니 → ④ 도량을 깨끗이 함 → ⑤ 참회 → ⑥ 준제진언과 발원 → ⑦ 사홍서원과 삼보 귀의 순서입니다.','The Korean liturgical version combines the core dharani with verses for opening the sutra, repentance and vows. Its order: purifying speech and mind → invoking Avalokiteshvara → the Great Compassion Dharani → purifying the practice place → repentance → the Cundi mantra and vows → the four great vows and refuge in the Three Jewels.'],
['진언과 다라니는 뜻을 번역하지 않고 소리 그대로 외우는 것이 전통입니다. 이 앱에서는 그 큰 뜻을 함께 풀어 두었습니다.','Mantras and dharanis are traditionally chanted in their original sound without translation; this app explains their general meaning.']],
parts:[{id:'chunsu',t:'천수경 본문',te:'Text',h:'千手經',by:'한국 불교 독송본',bye:'Korean liturgical version',d:'',de:'',items:MORE.chunsu}]};
SUTRAS.diamond={t:'금강경',te:'The Diamond Sutra',h:'金剛般若波羅蜜經',about:[
['정식 이름은 「금강반야바라밀경」으로, "금강석(다이아몬드)처럼 단단하여 모든 번뇌를 끊는 지혜로 저 언덕에 건너가는 경"이라는 뜻입니다. 부처님과 제자 수보리가 묻고 답하는 형식으로 되어 있으며, 한국 불교 조계종의 근본 경전입니다.','Its full name, Vajracchedika Prajna Paramita Sutra, means "the sutra of the wisdom that cuts like a diamond and crosses to the other shore." Written as a dialogue between the Buddha and his disciple Subhuti, it is the fundamental scripture of Korea\'s Jogye Order.'],
['핵심 가르침은 "모양에 집착하지 말라", "머무는 바 없이 마음을 내라(응무소주 이생기심)"입니다. 베풀어도 베풀었다는 생각 없이, 중생을 건져도 건졌다는 생각 없이 — "나"라는 생각(아상)을 비롯한 네 가지 생각(사상)을 내려놓는 것이 참된 보살의 길이라고 가르칩니다. 육조 혜능 스님이 이 경의 한 구절을 듣고 깨달은 것으로 유명합니다.','Its key teachings are "do not cling to forms" and "give rise to a mind that abides nowhere." Give without the thought of giving, save beings without the thought of saving — letting go of the notions of self, person, being and life-span is the true bodhisattva path. The Sixth Patriarch Huineng is said to have awakened on hearing a single line of it.'],
['원문은 구마라집(344~413)이 번역한 한문본이며, 32개의 단락(분)으로 나눈 것은 중국 양나라 소명태자가 붙인 것입니다. 긴 단락의 해석에서는 되풀이되는 부분을 "…"로 줄였습니다. 금강경에는 특히 중요한 네 구절의 게송(사구게)이 있으니, 제5분·제10분·제26분·제32분을 꼭 외워 보세요.','The text is Kumarajiva\'s Chinese translation; the 32-section division is attributed to Prince Zhaoming of Liang. Repetitive passages in long sections are abridged with "…" in the translation. Be sure to memorize the key four-line verses in sections 5, 10, 26 and 32.']],
parts:[{id:'diamond',t:'금강경 본문 (32분)',te:'Text (32 sections)',h:'金剛經',by:'구마라집 번역 (402년경, 요진)',bye:'Translated by Kumarajiva (c. 402)',d:'',de:'',items:MORE.diamond}]};

<script>
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem('sdbg_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('sdbg_'+k,JSON.stringify(v))}catch(e){}}};
let S=Object.assign({lang:'ko',fs:1,showH:true,showR:true,showZ:true,study:false,rate:.95,pitch:1,voiceKo:'',voiceEn:'',readR:true,readZ:false,inlineTerms:true},store.get('set',{}));
let favs=new Set(store.get('favs',[]));
const EN=()=>S.lang==='en',BOTH=()=>S.lang==='both',KO=()=>S.lang!=='en';
const L=(k,e)=>EN()?e:k;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function saveSet(){store.set('set',S);applySet()}
function applySet(){document.documentElement.style.setProperty('--fs',S.fs);document.documentElement.lang=EN()?'en':'ko';
  const b=document.body.classList;b.toggle('hide-h',!S.showH);b.toggle('hide-r',!S.showR);b.toggle('hide-z',!S.showZ);b.toggle('study',S.study)}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1500)}
function hl(t,q){const s=esc(t);if(!q)return s;const qq=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return s.replace(new RegExp(qq,'gi'),m=>'<mark>'+m+'</mark>')}
// 모든 구절 목록
const ALL=[];
for(const sid in SUTRAS){SUTRAS[sid].parts.forEach((p,pi)=>p.items.forEach((it,ii)=>ALL.push({sid,pi,ii,it,id:sid+'.'+pi+'.'+ii})))}
const byId=id=>ALL.find(x=>x.id===id);
function where(x){const s=SUTRAS[x.sid],p=s.parts[x.pi];if(x.it.n)return EN()?`Dhammapada v.${x.it.n}`:`법구경 ${x.it.n}번 게송`;const nm=s.parts.length>1?(EN()?p.te:p.t):(EN()?s.te:s.t);return EN()?`${nm}, No. ${x.ii+1}`:`${nm} ${x.ii+1}번째 구절`}
function termChips(w){if(!w||!w.length)return'';return `<div class="terms">${w.filter(k=>GLOSS[k]).map(k=>`<button class="term" data-term="${esc(k)}">📖 ${EN()?esc(GLOSS[k][2]):esc(k)}</button>`).join('')}</div>`}
// 문장 속 용어 밑줄
const HG=/[가-힣]/, PART='은는이가을를의에과와도로으함께만';
const TEX=new Set(['보시','나무','주','색']);
let TK=null,TH=null;
function buildTerms(){TK=[];TH=[];for(const k in GLOSS){if(!TEX.has(k))TK.push(k);const h=GLOSS[k][0];if(h&&h.length>=2&&/^[㐀-鿿]+$/.test(h))TH.push([h,k])}
 TK.sort((a,b)=>b.length-a.length);TH.sort((a,b)=>b[0].length-a[0].length)}
function linkify(t,used,mode){if(!S.inlineTerms)return esc(t);if(!TK)buildTerms();t=String(t||'');let out='',i=0,buf='';
 const flush=()=>{out+=esc(buf);buf=''};
 while(i<t.length){let hit=null,len=0;
  if(mode==='h'){for(const [h,k] of TH){if(t.startsWith(h,i)&&!used.has(k)){hit=k;len=h.length;break}}}
  else{const prev=i>0?t[i-1]:' ';for(const k of TK){if(!t.startsWith(k,i)||used.has(k))continue;
    if(k.length===1){const nx=t[i+1]||' ';if(HG.test(prev)||(HG.test(nx)&&!PART.includes(nx)))continue}
    else if(k.length===2&&HG.test(prev)&&!/[㐀-鿿]/.test(k))continue;
    hit=k;len=k.length;break}}
  if(hit){flush();used.add(hit);out+=`<span class="tl" data-term="${esc(hit)}">${esc(t.substr(i,len))}</span>`;i+=len}else{buf+=t[i];i++}}
 flush();return out}
function lk(t,q,used,mode){return q?hl(t,q):linkify(t,used,mode)}
function card(x,opt={}){const it=x.it,q=opt.q||'';const n=opt.today?'':`<span class="num">${x.it.n||x.ii+1}</span>`;const pali=SUTRAS[x.sid].pali;const used=new Set();
  return `<div class="card${opt.today?' today':''}" id="c${x.id.replace(/\./g,'_')}">
  ${opt.today?`<div class="lbl"><span>🪷 ${L('오늘의 한 구절','Verse of the Day')}</span><a href="#/p/${x.sid}/${x.pi}" style="color:var(--muted);font-weight:400">${esc(where(x))}</a></div>`:''}
  ${it.ti?`<div class="ti">${esc(it.ti)}${it.th?` <span class="thz">${it.th}</span>`:''}</div>`:''}
  ${pali?`<div class="plbl">${L('빠알리어 원문','Pali original')}</div><div class="h pali">${n}${hl(it.h,q)}</div>`:`<div class="h">${n}${lk(it.h,q,used,'h')}</div>`}
  ${it.r?`<div class="r">${hl(it.r,q)}</div>`:''}
  ${KO()?`<div class="k">${lk(it.k,q,used,'k')}</div>`:''}
  ${KO()&&it.z?`<div class="ez"><span class="el">💡 ${L('쉬운 풀이','Easy explanation')}</span>${lk(it.z,q,used,'k')}</div>`:''}
  ${(EN()||BOTH())?`<div class="en">${hl(it.e,q)}</div>`:''}
  ${termChips(it.w)}

let speakingId=null,Q=[],qi=0,curU=null,chain=null;
const TTS=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
function ttsStop(){try{speechSynthesis.cancel()}catch(e){}speakingId=null;chain=null;Q=[];curU=null;document.querySelectorAll('.say.on').forEach(b=>{b.classList.remove('on')});document.querySelectorAll('.card.speaking,.usec.speaking').forEach(c=>c.classList.remove('speaking'));const tb=$('#ttsbar');if(tb)tb.classList.remove('on')}
function voicesFor(lang){try{return speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith(lang))}catch(e){return[]}}
function score(v){const n=(v.name||'')+' '+(v.voiceURI||'');let s=0;
 if(/premium|enhanced|natural|neural|고품질|향상|wavenet|studio/i.test(n))s+=10;
 if(/google/i.test(n))s+=6; if(/siri/i.test(n))s+=5;
 if(/yuna|유나|sora|jinju|seoyeon|heami|ava|samantha|allison|zoe|evan/i.test(n))s+=3;
 if(/compact|eloquence|novelty|bad news|bells|bubbles|cellos|whisper|zarvox|jester|organ|superstar|trinoids|wobble/i.test(n))s-=20;
 if(v.localService)s+=1; return s}
function voice(lang){try{const want=lang=='ko'?S.voiceKo:S.voiceEn;const vs=voicesFor(lang);if(want){const m=vs.find(v=>v.voiceURI===want||v.name===want);if(m)return m}
 return vs.slice().sort((a,b)=>score(b)-score(a))[0]||null}catch(e){return null}}
function chunks(t,l){t=String(t||'').replace(/\((세 번|×3)\)/g,'').replace(/ \/ /g,', ').replace(/[“”"]/g,'').trim();if(!t)return[];
 const parts=t.split(/(?<=[.?!。])\s+|(?<=[,，])\s+(?=\S{6,})|\s+—\s+/).map(s=>s.trim()).filter(Boolean);return parts.map(s=>({t:s,l}))}
function itemQ(x){const P=[];if(KO()){if(x.it.r&&S.readR!==false)P.push(...chunks(x.it.r,'ko-KR'));P.push(...chunks(x.it.k,'ko-KR'));if(S.readZ&&x.it.z)P.push(...chunks(x.it.z,'ko-KR'))}
 if(EN()||BOTH())P.push(...chunks(x.it.e,'en-US'));return P.map(p=>Object.assign(p,{id:x.id}))}
function mark(id){document.querySelectorAll('.card.speaking').forEach(c=>c.classList.remove('speaking'));const c=document.getElementById('c'+id.replace(/\./g,'_'));
 if(c){c.classList.add('speaking');if(chain)c.scrollIntoView({block:'center',behavior:'smooth'});const b=c.querySelector('.say');if(b){document.querySelectorAll('.say.on').forEach(x=>x.classList.remove('on'));b.classList.add('on')}}
 const x=byId(id);if(x){$('#ttstxt').textContent='🔊 '+where(x);$('#ttsbar').classList.add('on')}}
let lastId=null;
function speakNext(){if(!Q.length||qi>=Q.length){if(chain&&chain.length){startItem(chain.shift(),true);return}ttsStop();return}
 const p=Q[qi++];if(p.id&&p.id!==lastId){lastId=p.id;mark(p.id)}if(p.uid!==undefined&&p.uid!==lastId){lastId=p.uid;markU(p.uid)}
 const u=new SpeechSynthesisUtterance(p.t);u.lang=p.l;const v=voice(p.l.slice(0,2));if(v)u.voice=v;u.rate=S.rate||.9;u.pitch=S.pitch||1;
 u.onend=()=>{if(curU===u)setTimeout(()=>{if(curU===u)speakNext()},p.l==='en-US'?250:350)};u.onerror=e=>{if(curU===u&&e.error!=='interrupted'&&e.error!=='canceled')speakNext()};curU=u;speechSynthesis.speak(u)}
function startItem(id,keep){if(!TTS){toast(L('이 기기는 읽기 기능을 지원하지 않습니다','Speech not supported'));return}const c=chain;try{speechSynthesis.cancel()}catch(e){}
 if(keep)chain=c;else chain=null;Q=itemQ(byId(id));qi=0;lastId=null;speakingId={};speakNext()}
function speakList(parts,btn,cardEl){ttsStop();if(!TTS){toast(L('이 기기는 읽기 기능을 지원하지 않습니다','Speech not supported'));return}
 btn&&btn.classList.add('on');Q=[];parts.forEach(([t,l])=>Q.push(...chunks(t,l)));qi=0;lastId=null;speakNext()}
function sayItem(id,btn){if(btn.classList.contains('on')){ttsStop();return}startItem(id)}
function markU(i){document.querySelectorAll('.usec.speaking').forEach(c=>c.classList.remove('speaking'));const c=document.getElementById('u_'+i);if(c){c.classList.add('speaking');c.scrollIntoView({block:'center',behavior:'smooth'})}const u=URIMAL.find(x=>location.hash.endsWith('/'+x.id));$('#ttstxt').textContent='🔊 '+(u?u.t:'우리말 경전');$('#ttsbar').classList.add('on')}
function playU(id){const u=URIMAL.find(x=>x.id===id);if(!u)return;ttsStop();if(!TTS){toast('이 기기는 읽기 기능을 지원하지 않습니다');return}Q=[];
 u.secs.forEach((s,i)=>{const add=t=>Q.push({t,l:'ko-KR',uid:i});if(s.pt)add(s.pt);if(s.ti)add(s.ti);if(s.l){const n=(s.rep&&s.l)?s.rep:1;for(let r=0;r<n;r++)s.l.forEach(add)}if(s.m){const n=s.m.length<60?(s.rep||1):1;for(let r=0;r<n;r++)add(s.m)}});
 qi=0;lastId=null;speakNext()}
function playAll(ids){if(!ids.length)return;ttsStop();chain=ids.slice(1);startItem(ids[0],true)}
function sample(lang){ttsStop();const txt=lang=='ko'?'모든 악을 짓지 말고, 모든 선을 받들어 행하며, 스스로 그 마음을 깨끗이 하라. 이것이 모든 부처님의 가르침이다.':'Do no evil, do good, and purify your own mind. This is the teaching of all the Buddhas.';speakList([[txt,lang=='ko'?'ko-KR':'en-US']])}
function voiceSel(lang){const vs=voicesFor(lang).slice().sort((a,b)=>score(b)-score(a));const cur=lang=='ko'?S.voiceKo:S.voiceEn;
 if(!vs.length)return `<small>${L('이 기기에서 찾은 목소리가 없습니다. 아래 안내대로 목소리를 내려받아 주세요.','No voices found. See the tips below.')}</small>`;
 return `<select data-voice="${lang}" style="font:inherit;font-size:1rem;padding:8px;border-radius:10px;border:1px solid var(--line);background:#fffdf6;max-width:100%">
 <option value="">${L('자동 (가장 자연스러운 목소리)','Auto (most natural)')}</option>${vs.map(v=>`<option value="${esc(v.voiceURI||v.name)}" ${cur===(v.voiceURI||v.name)?'selected':''}>${esc(v.name)}${score(v)>=10?' ★':''}${v.localService===false?L(' (인터넷 필요)',' (online)'):''}</option>`).join('')}</select>
 <button class="say" data-sample="${lang}">▶ ${L('들어 보기','Try')}</button>`}
document.addEventListener('click',e=>{const t=e.target.closest('.tl,button,.k,.en,#pop');if(!t)return;
 if(t.id==='pop'&&e.target===t){t.classList.remove('on');return}
 if(t.id==='popx'){$('#pop').classList.remove('on');return}
 if(t.dataset.go!==undefined){if(t.dataset.soon){toast(L('다음 단계에서 추가됩니다 🪷','Coming in the next stage 🪷'));return}if(t.dataset.go)location.hash=t.dataset.go;return}
 if(t.dataset.term){showTerm(t.dataset.term);return}
 if(t.dataset.fav){const id=t.dataset.fav;if(favs.has(id)){favs.delete(id);toast(L('즐겨찾기에서 뺐습니다','Removed'))}else{favs.add(id);toast(L('⭐ 즐겨찾기에 담았습니다','⭐ Saved'))}store.set('favs',[...favs]);document.querySelectorAll(`[data-fav="${id}"]`).forEach(b=>{b.classList.toggle('on',favs.has(id));b.textContent=favs.has(id)?'★':'☆'});return}
 if(t.dataset.say){sayItem(t.dataset.say,t);return}
 if(t.dataset.sample){sample(t.dataset.sample);return}
 if(t.dataset.uplay){playU(t.dataset.uplay);return}
 if(t.dataset.playall!==undefined){const [sid,pi]=t.dataset.playall.split('/');playAll(ALL.filter(x=>x.sid===sid&&x.pi===+pi).map(x=>x.id));return}
 if(t.id==='ttsstop'){ttsStop();return}
 if(t.dataset.pitch){S.pitch=+t.dataset.pitch;saveSet();route();return}
 if(t.dataset.tgr){S[t.dataset.tgr]=t.dataset.v==='1';saveSet();route();return}
 if(t.dataset.chant){if(t.classList.contains('on')){ttsStop();return}const its=SUTRAS[t.dataset.chant].parts[0].items;const P=its.map(it=>[it.r.replace(/\(세 번\)/g,'').replace(/ \/ /g,' '),'ko-KR']);if(t.dataset.chant==='heart'){const last=its[its.length-1].r;P.push([last,'ko-KR'],[last,'ko-KR'])}speakList(P,t);return}
 if(t.dataset.lang){S.lang=t.dataset.lang;saveSet();route();return}
 if(t.dataset.fs){S.fs=+t.dataset.fs;saveSet();route();return}
 if(t.dataset.rate){S.rate=+t.dataset.rate;saveSet();route();return}
 if(t.dataset.tg){S[t.dataset.tg]=t.dataset.v==='1';saveSet();route();return}
 if(t.classList.contains('k')||t.classList.contains('en')){if(S.study)t.classList.toggle('show');return}
});
$('#back').onclick=()=>{if(history.length>1)history.back();else location.hash='#/'};
$('#rnd').onclick=()=>{const x=ALL[Math.floor(Math.random()*ALL.length)];location.hash='#/p/'+x.sid+'/'+x.pi;setTimeout(()=>{const el=document.getElementById('c'+x.id.replace(/\./g,'_'));if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('speaking');setTimeout(()=>el.classList.remove('speaking'),1600)}},80)};
window.addEventListener('hashchange',route);
if(TTS){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{if((location.hash||'').startsWith('#/set')&&!(document.activeElement&&document.activeElement.matches('select')))route()}}catch(e){}}
document.addEventListener('change',e=>{const vl=e.target.dataset&&e.target.dataset.voice;if(vl){if(vl=='ko')S.voiceKo=e.target.value;else S.voiceEn=e.target.value;saveSet();sample(vl)}});
applySet();route();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude|anthropic/.test(location.host)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
