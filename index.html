 Punappunaṁ gabbhamupeti mando.", "r": "", "k": "게으르고 많이 먹으며 잠만 자고 뒹구는 사람은, 먹이로 살찐 큰 돼지처럼 어리석어서 거듭 태어난다.", "z": "", "e": "One who gets drowsy from overeating, fond of sleep, rolling round the bed like a great hog stuffed with grain: that dullard returns to the womb again and again.", "w": ["윤회"]}, {"n": 326, "h": "Idaṁ pure cittamacāri cārikaṁ, Yenicchakaṁ yatthakāmaṁ yathāsukhaṁ; Tadajjahaṁ niggahessāmi yoniso, Hatthippabhinnaṁ viya aṅkusaggaho.", "r": "", "k": "전에 이 마음은 원하는 대로, 좋아하는 대로, 즐기는 대로 떠돌았다. 이제 나는 코끼리 몰이꾼이 갈고리로 사나운 코끼리를 다루듯 마음을 바르게 다스리리라.", "z": "", "e": "In the past my mind wandered how it wished, where it liked, as it pleased. Now I’ll carefully guide it, as a trainer with a hook guides a rutting elephant.", "w": ["마음"]}, {"n": 327, "h": "Appamādaratā hotha, sacittamanurakkhatha; Duggā uddharathattānaṁ, paṅke sannova kuñjaro.", "r": "", "k": "깨어 있음을 즐기고 자기 마음을 잘 지켜라. 수렁에 빠진 코끼리가 빠져나오듯 나쁜 길에서 자신을 끌어내라.", "z": "", "e": "Delight in diligence! Take good care of your mind! Pull yourself out of this pit, like an elephant sunk in a bog.", "w": ["불방일"]}, {"n": 328, "h": "Sace labhetha nipakaṁ sahāyaṁ, Saddhiṁ caraṁ sādhuvihāridhīraṁ; Abhibhuyya sabbāni parissayāni, Careyya tenattamano satīmā.", "r": "", "k": "지혜롭고 바르게 사는 어진 벗을 만나면, 모든 어려움을 이겨 내고 기쁜 마음으로 마음챙기며 그와 함께 가라.", "z": "", "e": "If you find an alert companion, an attentive friend to live happily together, then, overcoming all adversities, wander with them, joyful and mindful.", "w": ["선우"]}, {"n": 329, "h": "No ce labhetha nipakaṁ sahāyaṁ, Saddhiṁ caraṁ sādhuvihāridhīraṁ; Rājāva raṭṭhaṁ vijitaṁ pahāya, Eko care mātaṅgaraññeva nāgo.", "r": "", "k": "지혜롭고 바르게 사는 어진 벗을 만나지 못하면, 정복한 나라를 버리고 떠나는 왕처럼, 숲속의 코끼리처럼 홀로 가라.", "z": "", "e": "If you find no alert companion, no attentive friend to live happily together, then, like a king who flees his conquered realm, wander alone like a tusker in the wilds.", "w": []}, {"n": 330, "h": "Ekassa caritaṁ seyyo, Natthi bāle sahāyatā; Eko care na ca pāpāni kayirā, Appossukko mātaṅgaraññeva nāgo.", "r": "", "k": "홀로 가는 것이 낫다. 어리석은 이와는 벗할 수 없다. 숲속의 코끼리처럼 욕심 없이 홀로 가며 악을 짓지 말라.", "z": "", "e": "It’s better to wander alone, there’s no fellowship with fools. Wander alone and do no wrong, at ease like a tusker in the wilds.", "w": []}, {"n": 331, "h": "Atthamhi jātamhi sukhā sahāyā, Tuṭṭhī sukhā yā itarītarena; Puññaṁ sukhaṁ jīvitasaṅkhayamhi, Sabbassa dukkhassa sukhaṁ pahānaṁ.", "r": "", "k": "일이 생겼을 때 도와주는 벗은 행복이고, 무엇이든 만족하는 것은 행복이며, 삶의 끝에 지은 공덕은 행복이고, 모든 괴로움을 버리는 것은 행복이다.", "z": "", "e": "A friend in need is a blessing; it’s a blessing to be content with whatever; good deeds are a blessing at the end of life, and giving up all suffering is a blessing.", "w": ["지족"]}, {"n": 332, "h": "Sukhā matteyyatā loke, atho petteyyatā sukhā; Sukhā sāmaññatā loke, atho brahmaññatā sukhā.", "r": "", "k": "세상에서 어머니를 공경하는 것은 행복이고, 아버지를 공경하는 것도 행복이다. 수행자를 공경하는 것은 행복이고, 성자를 공경하는 것도 행복이다.", "z": "부모님께 효도하는 것이 큰 행복이라는 말씀입니다.", "e": "In this world it’s a blessing to serve one’s mother and one’s father. And it’s a blessing also to serve ascetics and brahmins.", "w": []}, {"n": 333, "h": "Sukhaṁ yāva jarā sīlaṁ, sukhā saddhā patiṭṭhitā; Sukho paññāya paṭilābho, pāpānaṁ akaraṇaṁ sukhaṁ.", "r": "", "k": "늙을 때까지 계행을 지키는 것은 행복이고, 믿음이 굳건한 것은 행복이며, 지혜를 얻는 것은 행복이고, 악을 짓지 않는 것은 행복이다.", "z": "", "e": "It’s a blessing to keep precepts until you grow old; a blessing to be grounded in faith; the getting of wisdom’s a blessing; and it’s a blessing to avoid doing wrong.", "w": ["계행"]}], "soon": false}, {"id": "d24", "t": "제24품 애욕품", "te": "Ch. 24: Craving", "h": "愛欲品", "by": "334~359번 게송 (26구절)", "bye": "Verses 334–359", "d": "갈애와 욕망", "de": "Craving", "items": [{"n": 334, "h": "Manujassa pamattacārino, Taṇhā vaḍḍhati māluvā viya; So plavatī hurā huraṁ, Phalamicchaṁva vanasmi vānaro.", "r": "", "k": "방일하게 사는 사람에게는 갈애가 덩굴처럼 자란다. 숲에서 열매를 찾는 원숭이처럼 그는 이 생에서 저 생으로 떠돈다.", "z": "", "e": "When a man lives heedlessly, craving grows in them like a camel’s foot creeper. They jump from one thing to the next, like a langur greedy for fruit in a forest grove.", "w": ["갈애", "윤회"]}, {"n": 335, "h": "Yaṁ esā sahate jammī, taṇhā loke visattikā; Sokā tassa pavaḍḍhanti, abhivaṭṭhaṁva bīraṇaṁ.", "r": "", "k": "이 세상에서 비천하고 끈질긴 갈애에 정복된 사람은, 비 맞은 풀처럼 슬픔이 자란다.", "z": "", "e": "Whoever is beaten by this wretched craving, this attachment to the world, their sorrow grows, like grass in the rain.", "w": ["갈애"]}, {"n": 336, "h": "Yo cetaṁ sahate jammiṁ, taṇhaṁ loke duraccayaṁ; Sokā tamhā papatanti, udabinduva pokkharā.", "r": "", "k": "이 세상에서 극복하기 어려운 비천한 갈애를 이겨 낸 사람은, 연잎 위의 물방울처럼 슬픔이 떨어져 나간다.", "z": "", "e": "But whoever prevails over this wretched craving, so hard to get over in the world, their sorrows fall from them, like a drop from a lotus-leaf.", "w": ["갈애"]}, {"n": 337, "h": "Taṁ vo vadāmi bhaddaṁ vo, yāvantettha samāgatā; Taṇhāya mūlaṁ khaṇatha, usīratthova bīraṇaṁ; Mā vo naḷaṁva sotova, māro bhañji punappunaṁ.", "r": "", "k": "여기 모인 그대들에게 좋은 말을 하리라. 향기로운 뿌리를 찾는 이가 풀을 캐듯 갈애의 뿌리를 캐어라. 거센 물이 갈대를 꺾듯 마라가 그대들을 거듭 꺾지 못하게 하라.", "z": "", "e": "I say this to you, good people, all those who have gathered here: dig up the root of craving, as you’d dig up grass in search of roots. Don’t let Māra break you again and again, like a stream breaking a reed.", "w": ["갈애", "마라"]}, {"n": 338, "h": "Yathāpi mūle anupaddave daḷhe, Chinnopi rukkho punareva rūhati; Evampi taṇhānusaye anūhate, Nibbattatī dukkhamidaṁ punappunaṁ.", "r": "", "k": "뿌리가 다치지 않고 튼튼하면 나무는 베어도 다시 자란다. 그처럼 갈애의 뿌리를 뽑지 않으면 괴로움은 거듭 생겨난다.", "z": "", "e": "A tree grows back even when cut down, so long as its roots are strong and undamaged; suffering springs up again and again, so long as the tendency to craving is not pulled out.", "w": ["갈애"]}, {"n": 339, "h": "Yassa chattiṁsati sotā, manāpasavanā bhusā; Mahāvahanti duddiṭṭhiṁ, saṅkappā rāganissitā.", "r": "", "k": "즐거움으로 흐르는 서른여섯 가지 물줄기가 거센 사람은 그릇된 견해를 지녀 욕망의 생각에 휩쓸려 간다.", "z": "", "e": "A person of low views in whom the thirty-six streams that flow to pleasure are mighty, is swept away by lustful thoughts.", "w": ["탐욕"]}, {"n": 340, "h": "Savanti sabbadhi sotā, latā uppajja tiṭṭhati; Tañca disvā lataṁ jātaṁ, mūlaṁ paññāya chindatha.", "r": "", "k": "물줄기는 사방으로 흐르고 덩굴은 싹터서 자란다. 덩굴이 자라는 것을 보면 지혜로 그 뿌리를 잘라라.", "z": "", "e": "The streams flow everywhere; a weed springs up and remains. Seeing this weed that has been born, cut the root with wisdom.", "w": ["지혜"]}, {"n": 341, "h": "Saritāni sinehitāni ca, Somanassāni bhavanti jantuno; Te sātasitā sukhesino, Te ve jātijarūpagā narā.", "r": "", "k": "사람의 즐거움은 감각과 갈애로 흘러넘친다. 쾌락에 빠져 즐거움만 찾는 이들은 태어남과 늙음을 거듭한다.", "z": "", "e": "A personage’s joys flow from senses and cravings. Seekers of happiness, bent on pleasure, continue to be reborn and grow old.", "w": ["갈애"]}, {"n": 342, "h": "Tasiṇāya purakkhatā pajā, Parisappanti sasova bandhito; Saṁyojanasaṅgasattakā, Dukkhamupenti punappunaṁ cirāya.", "r": "", "k": "갈애에 쫓기는 사람들은 덫에 걸린 토끼처럼 허둥댄다. 속박과 집착에 묶여 오랫동안 거듭 괴로움을 겪는다.", "z": "", "e": "People governed by thirst, crawl about like a trapped rabbit. Bound and fettered, for a long time they return to pain time and again.", "w": ["갈애"]}, {"n": 343, "h": "Tasiṇāya purakkhatā pajā, Parisappanti sasova bandhito; Tasmā tasiṇaṁ vinodaye, Ākaṅkhanta virāgamattano.", "r": "", "k": "갈애에 쫓기는 사람들은 덫에 걸린 토끼처럼 허둥댄다. 그러므로 탐욕을 떠나기를 바라는 비구는 갈애를 버려야 한다.", "z": "", "e": "People governed by thirst, crawl about like a trapped rabbit. That’s why one who longs for dispassion should dispel thirst.", "w": ["갈애", "비구"]}, {"n": 344, "h": "Yo nibbanatho vanādhimutto, Vanamutto vanameva dhāvati; Taṁ puggalametha passatha, Mutto bandhanameva dhāvati.", "r": "", "k": "욕망의 숲에서 벗어나 수행의 숲으로 갔다가, 다시 욕망의 숲으로 달려가는 사람을 보라. 풀려났는데 다시 속박으로 달려간다.", "z": "", "e": "Unsnarled, they set out for the jungle, then they run right back to the jungle they left behind. Just look at this individual! Freed, they run to bondage.", "w": []}, {"n": 345, "h": "Na taṁ daḷhaṁ bandhanamāhu dhīrā, Yadāyasaṁ dārujapabbajañca; Sārattarattā maṇikuṇḍalesu, Puttesu dāresu ca yā apekkhā.", "r": "", "k": "지혜로운 이들은 쇠나 나무나 밧줄로 만든 족쇄는 단단하지 않다고 말한다. 보석과 장신구에 대한 탐착, 자식과 아내에 대한 애착,", "z": "345~346절은 이어지는 한 문장입니다.", "e": "The attentive say that shackle is not strong that’s made of iron, wood, or knots. But obsession with jeweled earrings, concern for your partners and children:", "w": []}, {"n": 346, "h": "Etaṁ daḷhaṁ bandhanamāhu dhīrā, Ohārinaṁ sithilaṁ duppamuñcaṁ; Etampi chetvāna paribbajanti, Anapekkhino kāmasukhaṁ pahāya.", "r": "", "k": "이것이야말로 단단한 족쇄라고 지혜로운 이들은 말한다. 끌어내리고 느슨해 보이지만 풀기 어렵다. 지혜로운 이는 이것마저 끊고, 미련 없이 감각적 즐거움을 버리고 떠난다.", "z": "", "e": "this, say the attentive, is a strong shackle dragging the indulgent down, hard to escape. Having cut this one too they go forth, unconcerned, having given up sensual pleasures.", "w": []}, {"n": 347, "h": "Ye rāgarattānupatanti sotaṁ, Sayaṅkataṁ makkaṭakova jālaṁ; Etampi chetvāna vajanti dhīrā, Anapekkhino sabbadukkhaṁ pahāya.", "r": "", "k": "욕망에 물든 이들은 거미가 스스로 친 거미줄에 걸리듯 흐름에 빠진다. 지혜로운 이는 이것마저 끊고, 미련 없이 모든 괴로움을 버리고 떠난다.", "z": "", "e": "Besotted by lust they fall into the stream, like a spider caught in the web she wove. The attentive proceed, having cut this one too, unconcerned, having given up all suffering.", "w": ["탐욕"]}, {"n": 348, "h": "Muñca pure muñca pacchato, Majjhe muñca bhavassa pāragū; Sabbattha vimuttamānaso, Na punaṁ jātijaraṁ upehisi.", "r": "", "k": "과거를 놓아라. 미래를 놓아라. 현재도 놓아라. 존재의 저 언덕에 건너가 마음이 모든 것에서 벗어나면 다시는 태어나고 늙지 않으리라.", "z": "", "e": "Let go of the past, let go of the future, let go of the present, having gone beyond rebirth. With your heart freed in every respect, you’ll not come again to rebirth and old age.", "w": ["해탈"]}, {"n": 349, "h": "Vitakkamathitassa jantuno, Tibbarāgassa subhānupassino; Bhiyyo taṇhā pavaḍḍhati, Esa kho daḷhaṁ karoti bandhanaṁ.", "r": "", "k": "생각에 휘둘리고 욕망이 강하며 아름다움만 보는 사람에게는 갈애가 점점 자라나 스스로 족쇄를 단단히 묶는다.", "z": "", "e": "For a personage churned by thoughts, very lustful, focusing on beauty, their craving grows and grows, tying them with a stout bond.", "w": ["갈애"]}, {"n": 350, "h": "Vitakkūpasame ca yo rato, Asubhaṁ bhāvayate sadā sato; Esa kho byanti kāhiti, Esa checchati mārabandhanaṁ.", "r": "", "k": "생각을 고요히 하기를 즐기고 몸의 부정함을 관하며 늘 마음챙기는 이는 갈애를 없애고 마라의 족쇄를 끊는다.", "z": "", "e": "But one who loves to calm their thoughts, developing perception of ugliness, ever mindful, will surely eliminate that craving, cutting off the bonds of Māra.", "w": ["갈애", "마라"]}, {"n": 351, "h": "Niṭṭhaṅgato asantāsī, vītataṇho anaṅgaṇo; Acchindi bhavasallāni, antimoyaṁ samussayo.", "r": "", "k": "목표에 이르러 두려움이 없고, 갈애와 허물을 떠나, 존재의 화살을 꺾은 이에게 이 몸이 마지막 몸이다.", "z": "", "e": "One who is confident, unafraid, rid of craving, free of blemish, having struck down the arrows flying to future lives, this bag of bones is their last.", "w": ["갈애"]}, {"n": 352, "h": "Vītataṇho anādāno, Niruttipadakovido; Akkharānaṁ sannipātaṁ, Jaññā pubbāparāni ca; Sa ve “antimasārīro, Mahāpañño mahāpuriso”ti vuccati.", "r": "", "k": "갈애와 집착을 떠나 언어와 그 뜻에 능통하고, 글자의 짜임과 순서를 아는 이 — 그를 마지막 몸을 지닌 이, 큰 지혜를 가진 위대한 사람이라 한다.", "z": "", "e": "Rid of craving, free of grasping, expert in the definition of terms, knowing the correct structure and sequence of syllables, they are said to be one who bears their final body, one of great wisdom, a great person.", "w": []}, {"n": 353, "h": "Sabbābhibhū sabbavidūhamasmi, Sabbesu dhammesu anūpalitto; Sabbañjaho taṇhakkhaye vimutto, Sayaṁ abhiññāya kamuddiseyyaṁ.", "r": "", "k": "나는 모든 것을 이겼고 모든 것을 알며 모든 것에 물들지 않는다. 모든 것을 버리고 갈애가 다하여 해탈했다. 스스로 깨달았으니 누구를 스승이라 하겠는가?", "z": "부처님께서 깨달음 직후 길에서 만난 수행자에게 하신 말씀으로 전해집니다.", "e": "I am the vanquisher of all, the knower of all, unsullied in the midst of all things. I’ve given up all, freed in the ending of craving. Since I know for myself, whose follower should I be?", "w": ["갈애", "해탈"]}, {"n": 354, "h": "Sabbadānaṁ dhammadānaṁ jināti, Sabbarasaṁ dhammaraso jināti; Sabbaratiṁ dhammarati jināti, Taṇhakkhayo sabbadukkhaṁ jināti.", "r": "", "k": "진리의 보시는 모든 보시를 이기고, 진리의 맛은 모든 맛을 이기며, 진리의 기쁨은 모든 기쁨을 이기고, 갈애의 소멸은 모든 괴로움을 이긴다.", "z": "가장 큰 선물은 좋은 가르침을 나누는 것(법보시)입니다.", "e": "The gift of the teaching surmounts all other gifts; the taste of the teaching surmounts all other tastes; the joy of the teaching surmounts all other joys; the ending of craving surmounts all suffering.", "w": ["갈애"]}, {"n": 355, "h": "Hananti bhogā dummedhaṁ, no ca pāragavesino; Bhogataṇhāya dummedho, hanti aññeva attanaṁ.", "r": "", "k": "재물은 어리석은 이를 망치지만 저 언덕을 찾는 이는 망치지 못한다. 어리석은 이는 재물에 대한 갈애로 남을 망치듯 자신을 망친다.", "z": "", "e": "Riches ruin a simpleton, but not a seeker of the far shore. From craving for wealth, a simpleton ruins themselves and others.", "w": ["갈애"]}, {"n": 356, "h": "Tiṇadosāni khettāni, rāgadosā ayaṁ pajā; Tasmā hi vītarāgesu, dinnaṁ hoti mahapphalaṁ.", "r": "", "k": "잡초는 밭을 망치고 탐욕은 사람을 망친다. 그러므로 탐욕을 떠난 이에게 베푼 보시는 큰 결실을 맺는다.", "z": "", "e": "Weeds are the bane of crops, but greed is these folk’s bane. That’s why a gift to one rid of greed is so very fruitful.", "w": ["탐욕"]}, {"n": 357, "h": "Tiṇadosāni khettāni, dosadosā ayaṁ pajā; Tasmā hi vītadosesu, dinnaṁ hoti mahapphalaṁ.", "r": "", "k": "잡초는 밭을 망치고 성냄은 사람을 망친다. 그러므로 성냄을 떠난 이에게 베푼 보시는 큰 결실을 맺는다.", "z": "", "e": "Weeds are the bane of crops, but hate is these folk’s bane. That’s why a gift to one rid of hate is so very fruitful.", "w": ["삼독"]}, {"n": 358, "h": "Tiṇadosāni khettāni, mohadosā ayaṁ pajā; Tasmā hi vītamohesu, dinnaṁ hoti mahapphalaṁ.", "r": "", "k": "잡초는 밭을 망치고 어리석음은 사람을 망친다. 그러므로 어리석음을 떠난 이에게 베푼 보시는 큰 결실을 맺는다.", "z": "", "e": "Weeds are the bane of crops, but delusion is these folk’s bane. That’s why a gift to one rid of delusion is so very fruitful.", "w": ["삼독"]}, {"n": 359, "h": "Tiṇadosāni khettāni, icchādosā ayaṁ pajā; Tasmā hi vigaticchesu, dinnaṁ hoti mahapphalaṁ.", "r": "", "k": "잡초는 밭을 망치고 욕망은 사람을 망친다. 그러므로 욕망을 떠난 이에게 베푼 보시는 큰 결실을 맺는다.", "z": "", "e": "Weeds are the bane of crops, but desire is these folk’s bane. That’s why a gift to one rid of desire is so very fruitful.", "w": ["탐욕"]}], "soon": false}, {"id": "d25", "t": "제25품 비구품", "te": "Ch. 25: Mendicants", "h": "比丘品", "by": "360~382번 게송 (23구절)", "bye": "Verses 360–382", "d": "수행자", "de": "Mendicants", "items": [{"n": 360, "h": "Cakkhunā saṁvaro sādhu, sādhu sotena saṁvaro; Ghānena saṁvaro sādhu, sādhu jivhāya saṁvaro.", "r": "", "k": "눈을 절제하는 것은 좋다. 귀를 절제하는 것도 좋다. 코를 절제하는 것은 좋다. 혀를 절제하는 것도 좋다.", "z": "", "e": "Restraint of the eye is good; good is restraint of the ear; restraint of the nose is good; good is restraint of the tongue.", "w": ["육근"]}, {"n": 361, "h": "Kāyena saṁvaro sādhu, sādhu vācāya saṁvaro; Manasā saṁvaro sādhu, sādhu sabbattha saṁvaro; Sabbattha saṁvuto bhikkhu, sabbadukkhā pamuccati.", "r": "", "k": "몸을 절제하는 것은 좋다. 말을 절제하는 것도 좋다. 마음을 절제하는 것은 좋다. 모든 것을 절제하는 것이 좋다. 모든 것을 절제하는 비구는 모든 괴로움에서 벗어난다.", "z": "", "e": "Restraint of the body is good; good is restraint of speech; restraint of mind is good; everywhere, restraint is good. The mendicant restrained everywhere is released from all suffering.", "w": ["비구", "삼업"]}, {"n": 362, "h": "Hatthasaṁyato pādasaṁyato, Vācāsaṁyato saṁyatuttamo; Ajjhattarato samāhito, Eko santusito tamāhu bhikkhuṁ.", "r": "", "k": "손과 발과 말을 절제하고 가장 잘 절제하며, 안으로 즐겁고 마음이 고요하며 홀로 만족하는 이를 나는 비구라 부른다.", "z": "", "e": "One restrained in hand and foot, and in speech, the supreme restraint; happy inside, serene, solitary, content, I call a mendicant.", "w": ["비구"]}, {"n": 363, "h": "Yo mukhasaṁyato bhikkhu, mantabhāṇī anuddhato; Atthaṁ dhammañca dīpeti, madhuraṁ tassa bhāsitaṁ.", "r": "", "k": "입을 절제하고 지혜롭게 말하며 들뜨지 않고, 가르침과 그 뜻을 밝히는 비구의 말은 달콤하다.", "z": "", "e": "When a mendicant of restrained mouth, thoughtful in counsel, not restless, explains the text and its meaning, their words are sweet.", "w": ["비구"]}, {"n": 364, "h": "Dhammārāmo dhammarato, dhammaṁ anuvicintayaṁ; Dhammaṁ anussaraṁ bhikkhu, saddhammā na parihāyati.", "r": "", "k": "진리에 머물고 진리를 즐기며 진리를 생각하고 진리를 기억하는 비구는 바른 진리에서 물러나지 않는다.", "z": "", "e": "Delighting in the teaching, enjoying the teaching, contemplating the teaching, a mendicant who recollects the teaching doesn’t fall away from the true teaching.", "w": ["비구"]}, {"n": 365, "h": "Salābhaṁ nātimaññeyya, nāññesaṁ pihayaṁ care; Aññesaṁ pihayaṁ bhikkhu, samādhiṁ nādhigacchati.", "r": "", "k": "자기가 얻은 것을 가볍게 여기지 말고 남이 얻은 것을 부러워하지 말라. 남을 부러워하는 비구는 선정에 들지 못한다.", "z": "", "e": "A well-off mendicant ought not look down on others, nor should they be envious. A mendicant who envies others does not achieve immersion.", "w": ["비구", "선정"]}, {"n": 366, "h": "Appalābhopi ce bhikkhu, salābhaṁ nātimaññati; Taṁ ve devā pasaṁsanti, suddhājīviṁ atanditaṁ.", "r": "", "k": "얻은 것이 적더라도 그것을 가볍게 여기지 않는 비구, 게으르지 않고 깨끗하게 사는 그를 신들도 칭찬한다.", "z": "", "e": "If a mendicant is poor in offerings, the well-to-do ought not look down on them. For the gods indeed praise them, who are tireless and pure of livelihood.", "w": ["비구"]}, {"n": 367, "h": "Sabbaso nāmarūpasmiṁ, yassa natthi mamāyitaṁ; Asatā ca na socati, sa ve “bhikkhū”ti vuccati.", "r": "", "k": "몸과 마음 어디에도 \"내 것\"이라는 생각이 없고, 없는 것을 슬퍼하지 않는 이를 비구라 한다.", "z": "", "e": "One who has no sense of ownership in the whole realm of name and form, who does not grieve for that which is not, is said to be a mendicant.", "w": ["무아", "비구"]}, {"n": 368, "h": "Mettāvihārī yo bhikkhu, pasanno buddhasāsane; Adhigacche padaṁ santaṁ, saṅkhārūpasamaṁ sukhaṁ.", "r": "", "k": "자애에 머물고 부처님의 가르침을 기뻐하는 비구는 모든 것이 고요해진 행복한 경지(열반)에 이른다.", "z": "", "e": "A mendicant who meditates on love, devoted to the Buddha’s teaching, would realize the peaceful state, the blissful stilling of conditions.", "w": ["자비", "열반"]}, {"n": 369, "h": "Siñca bhikkhu imaṁ nāvaṁ, sittā te lahumessati; Chetvā rāgañca dosañca, tato nibbānamehisi.", "r": "", "k": "비구여, 이 배(몸과 마음)의 물을 퍼내라. 물을 퍼내면 배는 가볍게 나아가리라. 탐욕과 성냄을 끊으면 열반에 이르리라.", "z": "", "e": "Bail out this boat, mendicant! When bailed out it will float lightly. Having cut off desire and hate, you shall reach extinguishment.", "w": ["비구", "열반"]}, {"n": 370, "h": "Pañca chinde pañca jahe, pañca cuttari bhāvaye; Pañca saṅgātigo bhikkhu, “oghatiṇṇo”ti vuccati.", "r": "", "k": "다섯을 끊고 다섯을 버리고 다섯을 더 닦아라. 다섯 가지 집착을 넘어선 비구를 \"거센 물을 건넌 이\"라 한다.", "z": "다섯 가지 낮은 속박을 끊고, 다섯 가지 높은 속박을 버리고, 믿음·노력·마음챙김·선정·지혜의 다섯 힘을 닦으라는 뜻입니다.", "e": "Five to cut, five to drop, and five more to develop. When a mendicant slips five chains they’re said to have crossed the flood.", "w": ["비구"]}, {"n": 371, "h": "Jhāya bhikkhu mā pamādo, Mā te kāmaguṇe ramessu cittaṁ; Mā lohaguḷaṁ gilī pamatto, Mā kandi “dukkhamidan”ti dayhamāno.", "r": "", "k": "비구여, 선정을 닦고 방일하지 말라. 마음이 감각적 즐거움에 빠져 헤매지 않게 하라. 방일하여 뜨거운 쇳덩이를 삼키고 \"아, 괴롭다\" 하고 울부짖지 말라.", "z": "", "e": "Practice absorption, don’t be negligent! Don’t let the mind delight in the senses! Don’t heedlessly swallow a hot iron ball! And when it burns, don’t cry, “Oh, the pain!”", "w": ["선정", "불방일"]}, {"n": 372, "h": "Natthi jhānaṁ apaññassa, paññā natthi ajhāyato; Yamhi jhānañca paññā ca, sa ve nibbānasantike.", "r": "", "k": "지혜 없는 이에게 선정이 없고, 선정 없는 이에게 지혜가 없다. 선정과 지혜를 갖춘 이는 열반에 가까이 있다.", "z": "지눌 스님의 \"정혜쌍수(선정과 지혜를 함께 닦음)\"와 같은 가르침입니다.", "e": "No absorption for one without wisdom, no wisdom for one without absorption. But one with absorption and wisdom— they have truly drawn near to extinguishment.", "w": ["정혜", "열반"]}, {"n": 373, "h": "Suññāgāraṁ paviṭṭhassa, santacittassa bhikkhuno; Amānusī rati hoti, sammā dhammaṁ vipassato.", "r": "", "k": "빈집에 들어가 마음이 고요해진 비구가 진리를 바르게 볼 때, 사람의 즐거움을 넘어선 기쁨을 누린다.", "z": "", "e": "A mendicant who enters an empty hut with mind at peace finds a superhuman delight as they rightly discern the Dhamma.", "w": ["비구"]}, {"n": 374, "h": "Yato yato sammasati, khandhānaṁ udayabbayaṁ; Labhatī pītipāmojjaṁ, amataṁ taṁ vijānataṁ.", "r": "", "k": "몸과 마음(오온)이 생겨나고 사라짐을 마음챙겨 볼 때마다 기쁨과 행복을 얻는다. 이것을 아는 이에게 이것이 죽음 없는 경지다.", "z": "", "e": "Whenever they are mindful of the rise and fall of the aggregates, they feel rapture and joy: that is freedom from death for one who knows.", "w": ["오온", "무상"]}, {"n": 375, "h": "Tatrāyamādi bhavati, idha paññassa bhikkhuno; Indriyagutti santuṭṭhi, pātimokkhe ca saṁvaro.", "r": "", "k": "지혜로운 비구에게 이것이 수행의 시작이다. 감각을 지키고, 만족할 줄 알고, 계율을 지켜 절제하는 것이다.", "z": "", "e": "This is the very start of the path for a wise mendicant here: guarding the senses, contentment, and restraint in the monastic code.", "w": ["지족", "비구"]}, {"n": 376, "h": "Mitte bhajassu kalyāṇe, suddhājīve atandite; Paṭisanthāravutyassa, ācārakusalo siyā; Tato pāmojjabahulo, dukkhassantaṁ karissati.", "r": "", "k": "게으르지 않고 깨끗하게 사는 좋은 벗을 사귀어라. 나누는 생활을 하고 행실이 바르면, 기쁨이 넘쳐 괴로움을 끝내리라.", "z": "", "e": "Mix with spiritual friends, who are tireless and pure of livelihood. Share what you have with others, being skillful in your conduct. And when you’re full of joy, you’ll make an end to suffering.", "w": ["선우"]}, {"n": 377, "h": "Vassikā viya pupphāni, maddavāni pamuñcati; Evaṁ rāgañca dosañca, vippamuñcetha bhikkhavo.", "r": "", "k": "재스민 덩굴이 시든 꽃을 떨어뜨리듯, 비구들이여, 탐욕과 성냄을 떨쳐 버려라.", "z": "", "e": "As a jasmine sheds its withered flowers, O mendicants, shed greed and hate.", "w": ["비구", "삼독"]}, {"n": 378, "h": "Santakāyo santavāco, santavā susamāhito; Vantalokāmiso bhikkhu, “upasanto”ti vuccati.", "r": "", "k": "몸이 고요하고 말이 고요하며 마음이 고요하고 잘 집중되어, 세상의 미끼를 뱉어 버린 비구를 \"고요한 이\"라 한다.", "z": "", "e": "Calm in body, calm in speech, peaceful and serene; a mendicant who’s spat out the world’s bait is said to be one at peace.", "w": ["비구"]}, {"n": 379, "h": "Attanā codayattānaṁ, paṭimaṁsetha attanā; So attagutto satimā, sukhaṁ bhikkhu vihāhisi.", "r": "", "k": "스스로 자신을 일깨우고 스스로 자신을 살펴라. 자신을 지키고 마음챙기는 비구는 행복하게 머문다.", "z": "", "e": "Urge yourself on, reflect on yourself. A mendicant self-controlled and mindful will always dwell in happiness.", "w": ["비구", "정념"]}, {"n": 380, "h": "Attā hi attano nātho, ko hi nātho paro siyā; Attā hi attano gati, tasmā saṁyamamattānaṁ; Assaṁ bhadraṁva vāṇijo.", "r": "", "k": "자기야말로 자기의 주인이고, 자기야말로 자기의 의지처다. 그러므로 상인이 좋은 말을 다루듯 자신을 다스려라.", "z": "", "e": "Self is indeed the lord of self, for who else would be one’s lord? Self is indeed the home of self, so restrain yourself, as a merchant his thoroughbred steed.", "w": []}, {"n": 381, "h": "Pāmojjabahulo bhikkhu, pasanno buddhasāsane; Adhigacche padaṁ santaṁ, saṅkhārūpasamaṁ sukhaṁ.", "r": "", "k": "기쁨이 넘치고 부처님의 가르침을 믿는 비구는 모든 것이 고요해진 행복한 경지(열반)에 이른다.", "z": "", "e": "A monk full of joy trusting in the Buddha’s teaching, would realize the peaceful state, the blissful stilling of conditions.", "w": ["비구", "열반"]}, {"n": 382, "h": "Yo have daharo bhikkhu, yuñjati buddhasāsane; Somaṁ lokaṁ pabhāseti, abbhā muttova candimā.", "r": "", "k": "나이 어린 비구라도 부처님의 가르침에 힘쓰면, 구름에서 벗어난 달처럼 이 세상을 비춘다.", "z": "", "e": "A young mendicant devoted to the Buddha’s teaching, shines upon this world, like the moon freed from clouds.", "w": ["비구"]}], "soon": false}, {"id": "d26", "t": "제26품 바라문품", "te": "Ch. 26: Brahmins", "h": "婆羅門品", "by": "383~423번 게송 (41구절)", "bye": "Verses 383–423", "d": "참된 성자", "de": "Brahmins", "items": [{"n": 383, "h": "Chinda sotaṁ parakkamma, kāme panuda brāhmaṇa; Saṅkhārānaṁ khayaṁ ñatvā, akataññūsi brāhmaṇa.", "r": "", "k": "바라문이여, 힘써 갈애의 흐름을 끊고 감각적 욕망을 버려라. 형성된 것들이 사라짐을 알아, 만들어지지 않은 것(열반)을 아는 이가 되어라.", "z": "383~423절: \"바라문\"은 원래 인도의 사제 계급이지만, 부처님은 태생이 아니라 행동과 깨달음으로 참된 바라문(성자)이 된다고 가르치셨습니다.", "e": "Cut the stream, striving! Cast aside sensual pleasures, brahmin. Knowing the ending of conditions, know the uncreated, brahmin.", "w": ["바라문", "갈애", "열반"]}, {"n": 384, "h": "Yadā dvayesu dhammesu, pāragū hoti brāhmaṇo; Athassa sabbe saṁyogā, atthaṁ gacchanti jānato.", "r": "", "k": "바라문이 두 가지 법(선정과 지혜)으로 저 언덕에 이르면, 그 아는 이의 모든 속박은 사라진다.", "z": "", "e": "When a brahmin has gone beyond dualistic phenomena, then they consciously make an end of all fetters.", "w": ["바라문", "정혜"]}, {"n": 385, "h": "Yassa pāraṁ apāraṁ vā, pārāpāraṁ na vijjati; Vītaddaraṁ visaṁyuttaṁ, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "저 언덕도 이 언덕도, 그 둘 다도 없고, 근심과 속박을 떠난 이 — 나는 그를 바라문이라 부른다.", "z": "", "e": "One for whom there is no crossing over or crossing back, or crossing over and back; stress-free, detached, that’s who I declare a brahmin.", "w": ["바라문"]}, {"n": 386, "h": "Jhāyiṁ virajamāsīnaṁ, katakiccamanāsavaṁ; Uttamatthamanuppattaṁ, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "선정을 닦고 티끌이 없으며 홀로 머물고, 할 일을 다 하여 번뇌가 없으며 최고의 목표에 이른 이 — 나는 그를 바라문이라 부른다.", "z": "", "e": "Absorbed, rid of hopes, their task completed, without defilements, arrived at the highest goal: that’s who I declare a brahmin.", "w": ["바라문", "번뇌"]}, {"n": 387, "h": "Divā tapati ādicco, rattimābhāti candimā; Sannaddho khattiyo tapati, jhāyī tapati brāhmaṇo; Atha sabbamahorattiṁ, buddho tapati tejasā.", "r": "", "k": "해는 낮에 빛나고 달은 밤에 빛나며, 무사는 갑옷을 입고 빛나고 바라문은 선정으로 빛난다. 그러나 부처님은 밤낮으로 위엄 있게 빛나신다.", "z": "", "e": "The sun blazes by day, the moon radiates at night, the aristocrat shines in armor, and the brahmin shines in absorption. But all day and all night, the Buddha blazes with glory.", "w": ["부처"]}, {"n": 388, "h": "Bāhitapāpoti brāhmaṇo, Samacariyā samaṇoti vuccati; Pabbājayamattano malaṁ, Tasmā “pabbajito”ti vuccati.", "r": "", "k": "악을 버렸기에 바라문이라 하고, 고요하게 살기에 사문이라 하며, 자기의 때를 버렸기에 출가자라 한다.", "z": "", "e": "A brahmin’s so-called since they’ve banished evil, an ascetic’s so-called since they live a serene life. One who has renounced all stains is said to be a “renunciant”.", "w": ["바라문", "출가"]}, {"n": 389, "h": "Na brāhmaṇassa pahareyya, nāssa muñcetha brāhmaṇo; Dhī brāhmaṇassa hantāraṁ, tato dhī yassa muñcati.", "r": "", "k": "바라문을 때리지 말라. 바라문은 맞더라도 성내지 말라. 바라문을 때리는 이는 부끄럽고, 그에게 성내는 이는 더 부끄럽다.", "z": "", "e": "One should never strike a brahmin, nor should a brahmin retaliate. Woe to the one who hurts a brahmin, and woe for the one who retaliates.", "w": ["바라문", "인욕"]}, {"n": 390, "h": "Na brāhmaṇassetadakiñci seyyo, Yadā nisedho manaso piyehi; Yato yato hiṁsamano nivattati, Tato tato sammatimeva dukkhaṁ.", "r": "", "k": "바라문에게는 좋아하는 것에서 마음을 거두는 것보다 더 좋은 것이 없다. 해치려는 마음이 그칠 때마다 괴로움도 그친다.", "z": "", "e": "Nothing is better for a brahmin than to hold their mind back from attachment. From wherever a cruel wish recoils, right there suffering subsides.", "w": ["바라문"]}, {"n": 391, "h": "Yassa kāyena vācāya, manasā natthi dukkaṭaṁ; Saṁvutaṁ tīhi ṭhānehi, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "몸으로도 말로도 마음으로도 악을 짓지 않고, 이 세 가지를 잘 지키는 이 — 나는 그를 바라문이라 부른다.", "z": "", "e": "Who does nothing wrong by body, speech or mind, restrained in these three respects, that’s who I declare a brahmin.", "w": ["바라문", "삼업"]}, {"n": 392, "h": "Yamhā dhammaṁ vijāneyya, sammāsambuddhadesitaṁ; Sakkaccaṁ taṁ namasseyya, aggihuttaṁva brāhmaṇo.", "r": "", "k": "바르게 깨달은 부처님의 가르침을 누구에게서 배웠다면, 바라문이 제사 불을 섬기듯 그분을 정성껏 공경하라.", "z": "", "e": "You should graciously honor the one from whom you learn the Dhamma taught by the awakened Buddha, as a brahmin honors the sacred flame.", "w": []}, {"n": 393, "h": "Na jaṭāhi na gottena, na jaccā hoti brāhmaṇo; Yamhi saccañca dhammo ca, so sucī so ca brāhmaṇo.", "r": "", "k": "땋은 머리나 가문이나 태생으로 바라문이 되는 것이 아니다. 진실과 바른 법을 지닌 이, 그가 깨끗한 이요 바라문이다.", "z": "사람의 가치는 태어남이 아니라 행동으로 정해집니다.", "e": "Not by matted hair or family, or birth is one a brahmin. Those who are truthful and principled: they are pure, they are brahmins.", "w": ["바라문"]}, {"n": 394, "h": "Kiṁ te jaṭāhi dummedha, kiṁ te ajinasāṭiyā; Abbhantaraṁ te gahanaṁ, bāhiraṁ parimajjasi.", "r": "", "k": "어리석은 이여, 땋은 머리가 무슨 소용이며 사슴 가죽옷이 무슨 소용인가? 너의 속은 덤불처럼 엉켜 있는데 겉만 닦는구나.", "z": "", "e": "Why the matted hair, you simpleton, and why the skin of deer? The tangle is inside you, yet you polish up your outsides.", "w": []}, {"n": 395, "h": "Paṁsukūladharaṁ jantuṁ, kisaṁ dhamanisanthataṁ; Ekaṁ vanasmiṁ jhāyantaṁ, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "누더기 옷을 입고 야위어 핏줄이 드러나며, 숲에서 홀로 선정을 닦는 이 — 나는 그를 바라문이라 부른다.", "z": "", "e": "A personage who wears robes of rags, lean, their limbs showing veins, meditating alone in the forest, that’s who I declare a brahmin.", "w": ["바라문", "선정"]}, {"n": 396, "h": "Na cāhaṁ brāhmaṇaṁ brūmi, yonijaṁ mattisambhavaṁ; Bhovādi nāma so hoti, sace hoti sakiñcano; Akiñcanaṁ anādānaṁ, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "바라문 어머니에게서 태어났다고 나는 그를 바라문이라 부르지 않는다. 집착이 남아 있으면 그는 \"존자여\" 하고 불리는 사람일 뿐이다. 아무것도 갖지 않고 집착하지 않는 이 — 나는 그를 바라문이라 부른다.", "z": "", "e": "I don’t call someone a brahmin after the mother’s womb they’re born from. If they still have attachments, they’re just someone who says “worthy”. Having nothing, taking nothing: that’s who I declare a brahmin.", "w": ["바라문"]}, {"n": 397, "h": "Sabbasaṁyojanaṁ chetvā, yo ve na paritassati; Saṅgātigaṁ visaṁyuttaṁ, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "모든 속박을 끊어 두려워하지 않고, 집착을 넘어 얽매임이 없는 이 — 나는 그를 바라문이라 부른다.", "z": "", "e": "Having cut off all fetters they have no anxiety. They’ve slipped their chains and are detached: that’s who I declare a brahmin.", "w": ["바라문"]}, {"n": 398, "h": "Chetvā naddhiṁ varattañca, sandānaṁ sahanukkamaṁ; Ukkhittapalighaṁ buddhaṁ, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "가죽끈과 고삐와 밧줄과 굴레를 끊고, 빗장을 벗겨 내어 깨달은 이 — 나는 그를 바라문이라 부른다.", "z": "가죽끈은 성냄, 고삐는 갈애, 밧줄은 잘못된 견해, 빗장은 무명을 비유합니다.", "e": "They’ve cut the strap and harness, the halter and bridle too, with cross-bar lifted, they’re awakened: that’s who I declare a brahmin.", "w": ["바라문"]}, {"n": 399, "h": "Akkosaṁ vadhabandhañca, aduṭṭho yo titikkhati; Khantībalaṁ balānīkaṁ, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "욕설과 매질과 속박을 성내지 않고 참아 내며, 인욕의 힘을 군대로 삼는 이 — 나는 그를 바라문이라 부른다.", "z": "", "e": "Abuse, killing, caging: they endure these without anger. Patience is their powerful army: that’s who I declare a brahmin.", "w": ["바라문", "인욕"]}, {"n": 400, "h": "Akkodhanaṁ vatavantaṁ, sīlavantaṁ anussadaṁ; Dantaṁ antimasārīraṁ, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "성내지 않고 계율을 지키며, 욕심이 없고 자신을 다스려 마지막 몸을 지닌 이 — 나는 그를 바라문이라 부른다.", "z": "", "e": "Not irritable or pretentious, dutiful in precepts and observances, tamed, bearing their final body: that’s who I declare a brahmin.", "w": ["바라문"]}, {"n": 401, "h": "Vāri pokkharapatteva, āraggeriva sāsapo; Yo na limpati kāmesu, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "연잎 위의 물방울처럼, 송곳 끝의 겨자씨처럼, 감각적 욕망에 물들지 않는 이 — 나는 그를 바라문이라 부른다.", "z": "", "e": "Like water from a lotus leaf, like a mustard seed off the point of a pin, sensual pleasures slip off them: that’s who I declare a brahmin.", "w": ["바라문"]}, {"n": 402, "h": "Yo dukkhassa pajānāti, idheva khayamattano; Pannabhāraṁ visaṁyuttaṁ, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "바로 이 세상에서 자기 괴로움의 소멸을 알고, 짐을 내려놓아 얽매임이 없는 이 — 나는 그를 바라문이라 부른다.", "z": "", "e": "They understand for themselves the end of suffering in this life; with burden put down, detached: that’s who I declare a brahmin.", "w": ["바라문"]}, {"n": 403, "h": "Gambhīrapaññaṁ medhāviṁ, maggāmaggassa kovidaṁ; Uttamatthamanuppattaṁ, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "지혜가 깊고 슬기로우며, 바른 길과 그릇된 길을 잘 알고 최고의 목표에 이른 이 — 나는 그를 바라문이라 부른다.", "z": "", "e": "Deep in wisdom, intelligent, expert in the path and what is not the path; arrived at the highest goal: that’s who I declare a brahmin.", "w": ["바라문"]}, {"n": 404, "h": "Asaṁsaṭṭhaṁ gahaṭṭhehi, anāgārehi cūbhayaṁ; Anokasārimappicchaṁ, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "재가자와도 출가자와도 어울리지 않고, 집 없이 떠돌며 욕심이 적은 이 — 나는 그를 바라문이라 부른다.", "z": "", "e": "Mixing with neither householders nor the homeless; a migrant with no bastion, few in wishes: that’s who I declare a brahmin.", "w": ["바라문"]}, {"n": 405, "h": "Nidhāya daṇḍaṁ bhūtesu, tasesu thāvaresu ca; Yo na hanti na ghāteti, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "약하거나 강한 모든 생명에게 폭력을 내려놓고, 죽이지도 않고 죽이게 하지도 않는 이 — 나는 그를 바라문이라 부른다.", "z": "", "e": "They’ve laid aside violence against creatures firm and frail; not killing or making others kill: that’s who I declare a brahmin.", "w": ["바라문", "오계"]}, {"n": 406, "h": "Aviruddhaṁ viruddhesu, attadaṇḍesu nibbutaṁ; Sādānesu anādānaṁ, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "적대하는 이들 속에서 적대하지 않고, 폭력을 쓰는 이들 속에서 고요하며, 집착하는 이들 속에서 집착하지 않는 이 — 나는 그를 바라문이라 부른다.", "z": "", "e": "Not fighting among those who fight, quenched among those who have taken up arms, not grasping among those who grasp: that’s who I declare a brahmin.", "w": ["바라문"]}, {"n": 407, "h": "Yassa rāgo ca doso ca, māno makkho ca pātito; Sāsaporiva āraggā, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "송곳 끝에서 겨자씨가 떨어지듯, 탐욕과 성냄과 교만과 위선이 떨어져 나간 이 — 나는 그를 바라문이라 부른다.", "z": "", "e": "They’ve discarded greed and hate, along with conceit and contempt, like a mustard seed off the point of a pin: that’s who I declare a brahmin.", "w": ["바라문", "아만"]}, {"n": 408, "h": "Akakkasaṁ viññāpaniṁ, giraṁ saccamudīraye; Yāya nābhisaje kañci, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "거칠지 않고 뜻이 분명하며 진실한 말을 하여, 아무도 불쾌하게 하지 않는 이 — 나는 그를 바라문이라 부른다.", "z": "", "e": "The words they utter are polished, informative, and true, and don’t offend anyone: that’s who I declare a brahmin.", "w": ["바라문"]}, {"n": 409, "h": "Yodha dīghaṁ va rassaṁ vā, aṇuṁ thūlaṁ subhāsubhaṁ; Loke adinnaṁ nādiyati, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "길거나 짧거나, 작거나 크거나, 좋거나 나쁘거나, 이 세상에서 주지 않은 것은 무엇도 갖지 않는 이 — 나는 그를 바라문이라 부른다.", "z": "", "e": "They don’t steal anything in the world, long or short, tiny or huge, beautiful or ugly: that’s who I declare a brahmin.", "w": ["바라문"]}, {"n": 410, "h": "Āsā yassa na vijjanti, asmiṁ loke paramhi ca; Nirāsāsaṁ visaṁyuttaṁ, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "이 세상에도 저 세상에도 바라는 것이 없고, 바람 없이 얽매임이 없는 이 — 나는 그를 바라문이라 부른다.", "z": "", "e": "They have no hope in this world or the next; with no need for hope, detached: that’s who I declare a brahmin.", "w": ["바라문"]}, {"n": 411, "h": "Yassālayā na vijjanti, aññāya akathaṅkathī; Amatogadhamanuppattaṁ, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "집착이 없고 바른 앎으로 의심이 사라져, 죽음 없는 경지에 들어간 이 — 나는 그를 바라문이라 부른다.", "z": "", "e": "They have no clinging, knowledge has freed them of indecision, they’ve arrived at the objective, freedom from death: that’s who I declare a brahmin.", "w": ["바라문", "열반"]}, {"n": 412, "h": "Yodha puññañca pāpañca, ubho saṅgamupaccagā; Asokaṁ virajaṁ suddhaṁ, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "이 세상에서 선과 악 두 가지 집착을 모두 넘어서고, 슬픔과 티끌이 없이 깨끗한 이 — 나는 그를 바라문이라 부른다.", "z": "", "e": "They’ve escaped the chain of both good and bad deeds; sorrowless, stainless, pure: that’s who I declare a brahmin.", "w": ["바라문"]}, {"n": 413, "h": "Candaṁva vimalaṁ suddhaṁ, vippasannamanāvilaṁ; Nandībhavaparikkhīṇaṁ, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "티 없는 달처럼 맑고 깨끗하며 고요하고, 존재에 대한 즐김이 다한 이 — 나는 그를 바라문이라 부른다.", "z": "", "e": "Pure as the spotless moon, clear and unclouded, they’ve ended relish for rebirth: that’s who I declare a brahmin.", "w": ["바라문"]}, {"n": 414, "h": "Yomaṁ palipathaṁ duggaṁ, saṁsāraṁ mohamaccagā; Tiṇṇo pāraṅgato jhāyī, anejo akathaṅkathī; Anupādāya nibbuto, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "이 험한 길, 어려운 길, 윤회와 어리석음을 넘어서 저 언덕에 건너가, 선정에 들어 흔들림 없고 의심 없이 집착하지 않아 열반에 든 이 — 나는 그를 바라문이라 부른다.", "z": "", "e": "They’ve got past this grueling swamp of delusion, transmigration. Meditating in stillness, free of indecision, they have crossed over to the far shore. They’re quenched by not grasping: that’s who I declare a brahmin.", "w": ["바라문", "윤회", "열반"]}, {"n": 415, "h": "Yodha kāme pahantvāna, anāgāro paribbaje; Kāmabhavaparikkhīṇaṁ, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "이 세상에서 감각적 욕망을 버리고 집 없이 떠나, 욕망과 존재가 다한 이 — 나는 그를 바라문이라 부른다.", "z": "", "e": "They’ve given up sensual pleasures, and have gone forth from lay life; they’ve ended rebirth in the sensual realm: that’s who I declare a brahmin.", "w": ["바라문"]}, {"n": 416, "h": "Yodha taṇhaṁ pahantvāna, anāgāro paribbaje; Taṇhābhavaparikkhīṇaṁ, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "이 세상에서 갈애를 버리고 집 없이 떠나, 갈애와 존재가 다한 이 — 나는 그를 바라문이라 부른다.", "z": "", "e": "They’ve given up craving, and have gone forth from lay life; they’ve ended craving to be reborn: that’s who I declare a brahmin.", "w": ["바라문", "갈애"]}, {"n": 417, "h": "Hitvā mānusakaṁ yogaṁ, dibbaṁ yogaṁ upaccagā; Sabbayogavisaṁyuttaṁ, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "사람의 멍에를 버리고 하늘의 멍에를 넘어서, 모든 멍에에서 벗어난 이 — 나는 그를 바라문이라 부른다.", "z": "", "e": "They’ve thrown off the human yoke, and slipped out of the heavenly yoke; unyoked from all yokes: that’s who I declare a brahmin.", "w": ["바라문"]}, {"n": 418, "h": "Hitvā ratiñca aratiñca, sītibhūtaṁ nirūpadhiṁ; Sabbalokābhibhuṁ vīraṁ, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "좋아함과 싫어함을 버리고 서늘해져 집착이 없으며, 온 세상을 이긴 영웅 — 나는 그를 바라문이라 부른다.", "z": "", "e": "Giving up desire and discontent, they’re cooled and free of attachments; a hero, master of the whole world: that’s who I declare a brahmin.", "w": ["바라문"]}, {"n": 419, "h": "Cutiṁ yo vedi sattānaṁ, upapattiñca sabbaso; Asattaṁ sugataṁ buddhaṁ, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "중생들이 죽고 태어나는 것을 모두 알며, 집착 없이 잘 가신 깨달은 이 — 나는 그를 바라문이라 부른다.", "z": "", "e": "They know the passing away and rebirth of all beings; unattached, holy, awakened: that’s who I declare a brahmin.", "w": ["바라문", "중생"]}, {"n": 420, "h": "Yassa gatiṁ na jānanti, devā gandhabbamānusā; Khīṇāsavaṁ arahantaṁ, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "신들도 건달바도 사람도 그가 간 곳을 알지 못하는, 번뇌가 다한 아라한 — 나는 그를 바라문이라 부른다.", "z": "", "e": "Gods, centaurs, and humans don’t know their destiny; the perfected ones with defilements ended: that’s who I declare a brahmin.", "w": ["바라문", "아라한"]}, {"n": 421, "h": "Yassa pure ca pacchā ca, majjhe ca natthi kiñcanaṁ; Akiñcanaṁ anādānaṁ, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "과거에도 미래에도 현재에도 아무것도 갖지 않고, 집착하지 않는 이 — 나는 그를 바라문이라 부른다.", "z": "", "e": "They have nothing before or after, or even in between. Having nothing, taking nothing: that’s who I declare a brahmin.", "w": ["바라문"]}, {"n": 422, "h": "Usabhaṁ pavaraṁ vīraṁ, mahesiṁ vijitāvinaṁ; Anejaṁ nhātakaṁ buddhaṁ, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "황소처럼 늠름하고 뛰어난 영웅, 큰 성자, 승리자, 흔들림 없고 깨끗이 씻긴 깨달은 이 — 나는 그를 바라문이라 부른다.", "z": "", "e": "Captain of the herd, excellent hero, great seer and victor; unstirred, washed, awakened: that’s who I declare a brahmin.", "w": ["바라문"]}, {"n": 423, "h": "Pubbenivāsaṁ yo vedi, saggāpāyañca passati; Atho jātikkhayaṁ patto, abhiññāvosito muni; Sabbavositavosānaṁ, tamahaṁ brūmi brāhmaṇaṁ.", "r": "", "k": "전생을 알고 하늘과 나쁜 곳을 보며, 태어남이 다한 경지에 이르러 완전한 지혜를 이룬 성자, 모든 것을 완성한 이 — 나는 그를 바라문이라 부른다.", "z": "법구경의 마지막 구절입니다. 423구절의 긴 여정을 마치신 것을 축하드립니다. 🪷", "e": "One who knows their past lives, sees heaven and places of loss, and has attained the end of rebirth; a sage of perfect insight at the summit of spiritual perfection: that’s who I declare a brahmin.", "w": ["바라문"]}], "soon": false}]};
