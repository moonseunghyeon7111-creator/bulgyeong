ccording to your own strength.", "w": []}, {"h": "自樂能捨 信敬如聖 難行能行 尊重如佛", "r": "자락능사 신경여성 난행능행 존중여불", "k": "자기의 즐거움을 버릴 줄 알면 성인처럼 믿고 공경받으며, 하기 어려운 일을 해낼 수 있으면 부처님처럼 존중받는다.", "z": "", "e": "If you can give up your own pleasures, you will be trusted and revered like a sage; if you can do what is hard to do, you will be honored like a Buddha.", "w": []}, {"h": "慳貪於物 是魔眷屬 慈悲布施 是法王子", "r": "간탐어물 시마권속 자비보시 시법왕자", "k": "재물을 아끼고 탐내는 것은 마구니의 무리요, 자비로 베푸는 것은 법왕(부처님)의 아들이다.", "z": "", "e": "To hoard and covet things is to belong to Mara's retinue; to give with compassion is to be a child of the Dharma King.", "w": ["마라", "자비"]}, {"h": "高嶽峨巖 智人所居 碧松深谷 行者所棲", "r": "고악아암 지인소거 벽송심곡 행자소서", "k": "높은 산 험한 바위는 지혜로운 이가 사는 곳이요, 푸른 소나무 깊은 골짜기는 수행자가 깃드는 곳이다.", "z": "", "e": "High peaks and towering crags are where the wise dwell; green pines and deep valleys are where practitioners make their home.", "w": []}, {"h": "飢餐木果 慰其飢腸 渴飮流水 息其渴情", "r": "기찬목과 위기기장 갈음류수 식기갈정", "k": "배고프면 나무 열매를 먹어 주린 배를 달래고, 목마르면 흐르는 물을 마셔 갈증을 달랜다.", "z": "", "e": "When hungry, eat the fruit of trees to soothe the empty stomach; when thirsty, drink flowing water to quench the thirst.", "w": []}, {"h": "喫甘愛養 此身定壞 著柔守護 命必有終", "r": "끽감애양 차신정괴 착유수호 명필유종", "k": "맛있는 것을 먹여 아끼고 길러도 이 몸은 반드시 무너지고, 부드러운 옷을 입혀 지키고 보호해도 목숨은 반드시 끝이 있다.", "z": "아무리 몸을 아껴도 언젠가는 떠납니다. 그러니 몸보다 마음을 가꾸라는 가르침입니다.", "e": "Feed it sweet food and care for it lovingly, this body will surely decay; dress it in soft clothes and protect it, life will surely end.", "w": ["무상"]}, {"h": "助響巖穴 爲念佛堂 哀鳴鴨鳥 爲歡心友", "r": "조향암혈 위념불당 애명압조 위환심우", "k": "메아리 울리는 바위굴을 염불당으로 삼고, 슬피 우는 산새들을 마음 기쁜 벗으로 삼으라.", "z": "", "e": "Make the echoing rock cave your hall for recollecting the Buddha; make the plaintive cries of the wild birds your heart's joyful companions.", "w": ["염불"]}, {"h": "拜膝如氷 無戀火心 餓腸如切 無求食念", "r": "배슬여빙 무련화심 아장여절 무구식념", "k": "절하는 무릎이 얼음처럼 차가워도 불을 그리워하는 마음이 없고, 주린 창자가 끊어지는 듯해도 밥을 구하는 생각이 없어야 한다.", "z": "", "e": "Though your bowing knees are cold as ice, have no longing for fire; though your hungry stomach feels torn apart, have no thought of seeking food.", "w": []}, {"h": "忽至百年 云何不學 一生幾何 不修放逸", "r": "홀지백년 운하불학 일생기하 불수방일", "k": "백 년도 순식간에 이르는데 어찌 배우지 않으며, 한평생이 얼마나 된다고 닦지 않고 게으름을 피우는가?", "z": "인생은 생각보다 짧습니다. 지금 시작하세요.", "e": "A hundred years arrive in a flash — why do you not learn? How long is one life — why do you not practice, but idle away?", "w": ["불방일"]}, {"h": "離心中愛 是名沙門 不戀世俗 是名出家", "r": "이심중애 시명사문 불련세속 시명출가", "k": "마음속의 애욕을 떠난 이를 사문이라 하고, 세속을 그리워하지 않는 것을 출가라 한다.", "z": "자경문에도 똑같이 인용되는 유명한 구절입니다.", "e": "One who has left behind the craving in the heart is called a shramana; not longing for the worldly life is called leaving home.", "w": ["사문", "출가"]}, {"h": "行者羅網 狗被象皮 道人戀懷 蝟入鼠宮", "r": "행자라망 구피상피 도인련회 위입서궁", "k": "수행자가 세상의 그물에 걸리는 것은 개가 코끼리 가죽을 뒤집어쓴 것과 같고, 도 닦는 이가 세상을 그리워하는 것은 고슴도치가 쥐구멍에 들어가는 것과 같다.", "z": "겉모습만 수행자이고 속은 그대로라면 어울리지 않는 옷을 입은 것과 같다는 비유입니다.", "e": "A practitioner caught in the world's net is like a dog wearing an elephant's hide; a person of the Way who clings to longing is like a hedgehog crawling into a mouse hole.", "w": []}, {"h": "雖有才智 居邑家者 諸佛是人 生悲憂心 設無道行 住山室者 衆聖是人 生歡喜心", "r": "수유재지 거읍가자 제불시인 생비우심 설무도행 주산실자 중성시인 생환희심", "k": "비록 재주와 지혜가 있어도 세속의 마을에 머무는 사람을 보면 모든 부처님이 슬퍼하고 걱정하시며, 설령 도행이 없더라도 산속 처소에 머무는 사람을 보면 모든 성인이 기뻐하신다.", "z": "", "e": "Even if one has talent and wisdom, if one lives in the town, all Buddhas feel sorrow and concern for that person; even if one lacks attainment, if one dwells in a mountain hermitage, all the sages rejoice.", "w": []}, {"h": "雖有才學 無戒行者 如寶所導 而不起行 雖有勤行 無智慧者 欲往東方 而向西行", "r": "수유재학 무계행자 여보소도 이불기행 수유근행 무지혜자 욕왕동방 이향서행", "k": "비록 재주와 학식이 있어도 계행이 없는 사람은 보배가 있는 곳으로 안내해도 일어나 가지 않는 것과 같고, 비록 부지런히 수행하더라도 지혜가 없는 사람은 동쪽으로 가려 하면서 서쪽으로 가는 것과 같다.", "z": "계율(실천)과 지혜(바른 앎), 둘 다 있어야 합니다.", "e": "One with talent and learning but no virtuous conduct is like someone led to a treasure who will not get up and go; one who practices diligently but lacks wisdom is like someone who wants to go east but walks west.", "w": ["계행", "지혜"]}, {"h": "有智人所行 蒸米作飯 無智人所行 蒸沙作飯", "r": "유지인소행 증미작반 무지인소행 증사작반", "k": "지혜로운 사람의 수행은 쌀을 쪄서 밥을 짓는 것과 같고, 지혜 없는 사람의 수행은 모래를 쪄서 밥을 지으려는 것과 같다.", "z": "모래를 아무리 쪄도 밥이 되지 않습니다. 방향이 바르지 않으면 노력도 헛됩니다.", "e": "The practice of the wise is like steaming rice to make a meal; the practice of the unwise is like steaming sand to make a meal.", "w": ["지혜"]}, {"h": "共知喫食 而慰飢腸 不知學法 而改癡心", "r": "공지끽식 이위기장 부지학법 이개치심", "k": "모두 밥을 먹어 주린 배를 달랠 줄은 알면서, 가르침을 배워 어리석은 마음을 고칠 줄은 모른다.", "z": "", "e": "Everyone knows to eat to soothe a hungry stomach, yet they do not know to study the Dharma to cure the deluded mind.", "w": []}, {"h": "行智俱備 如車二輪 自利利他 如鳥兩翼", "r": "행지구비 여차이륜 자리리타 여조량익", "k": "실천과 지혜를 함께 갖추는 것은 수레의 두 바퀴와 같고, 나를 이롭게 하고 남을 이롭게 하는 것은 새의 두 날개와 같다.", "z": "발심수행장에서 가장 유명한 구절입니다. 나만 잘되는 것도, 남만 돕는 것도 아닌 둘 다를 함께 — 이것이 보살의 길입니다.", "e": "Practice and wisdom both complete are like the two wheels of a cart; benefiting oneself and benefiting others are like the two wings of a bird.", "w": ["자리이타", "보살"]}, {"h": "得粥祝願 不解其意 亦不檀越 應羞恥乎 得食唱唄 不達其趣 亦不賢聖 應慚愧乎", "r": "득죽축원 불해기의 역부단월 응수치호 득식창패 부달기취 역불현성 응참괴호", "k": "죽을 받고 축원하면서도 그 뜻을 모른다면 시주한 이에게 부끄럽지 않겠는가? 밥을 받고 염불하면서도 그 이치를 모른다면 성현들께 부끄럽지 않겠는가?", "z": "소리만 내고 뜻을 모르면 부끄러운 일 — 이 앱으로 뜻을 공부하는 이유입니다.", "e": "If you receive gruel and chant blessings without understanding their meaning, should you not be ashamed before the donors? If you receive food and chant hymns without grasping their sense, should you not be ashamed before the sages?", "w": ["단월"]}, {"h": "人惡尾蟲 不辨淨穢 聖憎沙門 不辨淨穢", "r": "인오미충 불변정예 성증사문 불변정예", "k": "사람들이 깨끗함과 더러움을 가리지 못하는 벌레를 싫어하듯, 성인들은 깨끗함과 더러움을 가리지 못하는 수행자를 미워한다.", "z": "", "e": "Just as people loathe a maggot that cannot tell clean from filthy, the sages detest a monk who cannot tell pure from impure.", "w": ["사문"]}, {"h": "棄世間喧 乘空天上 戒爲善梯 是故破戒 爲他福田 如折翼鳥 負龜翔空", "r": "기세간훤 승공천상 계위선제 시고파계 위타복전 여절익조 부구상공", "k": "세상의 시끄러움을 버리고 하늘에 오르는 데는 계율이 좋은 사다리다. 그러므로 계를 깨뜨린 이가 남의 복밭이 되려는 것은, 날개 꺾인 새가 거북을 업고 하늘을 날려는 것과 같다.", "z": "", "e": "To leave the world's clamor and ascend to the heavens, the precepts are a good ladder. Thus one who breaks the precepts trying to be a field of merit for others is like a bird with broken wings trying to fly with a turtle on its back.", "w": ["복전", "계행"]}, {"h": "自罪未脫 他罪不贖 然豈無戒行 受他供給", "r": "자죄미탈 타죄불속 연기무계행 수타공급", "k": "자기의 죄도 벗지 못하고서는 남의 죄를 대신 갚아 줄 수 없으니, 어찌 계행도 없이 남의 공양을 받겠는가?", "z": "", "e": "If you have not freed yourself from your own wrongs, you cannot redeem the wrongs of others. How then can one without virtuous conduct accept others' offerings?", "w": ["공양"]}, {"h": "無行空身 養無利益 無常浮命 愛惜不保", "r": "무행공신 양무리익 무상부명 애석불보", "k": "수행 없는 헛된 몸은 길러도 이익이 없고, 덧없이 떠도는 목숨은 아끼고 아껴도 지킬 수 없다.", "z": "", "e": "An empty body without practice brings no benefit however well nourished; a fleeting, impermanent life cannot be preserved however much it is cherished.", "w": ["무상"]}, {"h": "望龍象德 能忍長苦 期獅子座 永背欲樂", "r": "망룡상덕 능인장고 기사자좌 영배욕락", "k": "용상(큰스님)의 덕을 바라거든 오랜 괴로움을 참아 내고, 사자좌(부처님 자리)를 기약하거든 욕망의 즐거움을 영원히 등져라.", "z": "\"용상\"은 덕 높은 큰스님, \"사자좌\"는 부처님이 앉으시는 자리를 말합니다.", "e": "If you aspire to the virtue of dragons and elephants, endure long hardship; if you aim for the lion's seat, turn your back forever on sensual pleasure.", "w": ["인욕"]}, {"h": "行者心淨 諸天共讚 道人戀色 善神捨離", "r": "행자심정 제천공찬 도인련색 선신사리", "k": "수행자의 마음이 깨끗하면 모든 하늘이 함께 찬탄하고, 도 닦는 이가 이성을 그리워하면 선신이 버리고 떠난다.", "z": "", "e": "When a practitioner's mind is pure, all the heavens praise them together; when a person of the Way longs for sensual beauty, the protective spirits abandon them.", "w": []}, {"h": "四大忽散 不保久住 今日夕矣 頗行朝哉", "r": "사대홀산 불보구주 금일석의 파행조재", "k": "사대(이 몸)는 홀연히 흩어져 오래 머물 수 없으니, 오늘도 벌써 저녁이라 서둘러 아침부터 수행하라.", "z": "", "e": "The four elements of the body suddenly scatter; they cannot be kept for long. Today has already turned to evening — practice from the very morning!", "w": ["무상"]}, {"h": "世樂後苦 何貪着哉 一忍長樂 何不修哉", "r": "세락후고 하탐착재 일인장락 하불수재", "k": "세상의 즐거움은 뒤에 괴로움이 되는데 어찌 탐내어 집착하며, 한 번 참으면 오래 즐거운데 어찌 닦지 않는가?", "z": "", "e": "Worldly pleasure becomes suffering later — why crave and cling to it? One moment of patience brings lasting joy — why not practice?", "w": ["인욕"]}, {"h": "道人貪 是行者羞恥 出家富 是君子所笑", "r": "도인탐 시행자수치 출가부 시군자소소", "k": "도 닦는 이가 탐욕을 부리는 것은 수행자의 부끄러움이요, 출가한 이가 부자인 것은 군자가 비웃을 일이다.", "z": "", "e": "Greed in a person of the Way is a shame to all practitioners; wealth in one who has left home is something the noble laugh at.", "w": ["출가"]}, {"h": "遮言不盡 貪着不已 第二無盡 不斷愛着 此事無限 世事不捨 彼謀無際 絶心不起", "r": "차언부진 탐착불이 제이무진 부단애착 차사무한 세사불사 피모무제 절심불기", "k": "막는 말이 끝없는데도 탐착을 그치지 않고, \"다음에 하지\" 하는 것이 끝없어 애착을 끊지 못한다. 이 일 저 일 한이 없어 세상일을 놓지 못하고, 이 궁리 저 궁리 끝이 없어 끊으려는 마음을 내지 못한다.", "z": "\"다음에\", \"이것만 하고\" 하다가 평생이 지나갑니다.", "e": "The warnings are endless, yet craving does not cease; there is always a 'next time,' so attachment is never cut. This affair is endless, so worldly matters are never dropped; that scheme is boundless, so the mind to cut them off never arises.", "w": []}, {"h": "今日不盡 造惡日多 明日無盡 作善日少 今年不盡 無限煩惱 來年無盡 不進菩提", "r": "금일부진 조악일다 명일무진 작선일소 금년부진 무한번뇌 내년무진 부진보리", "k": "오늘도 끝없이 미루니 악을 짓는 날은 많고, 내일도 끝없이 미루니 선을 짓는 날은 적다. 올해도 끝없이 미루니 번뇌가 한없고, 내년도 끝없이 미루니 깨달음으로 나아가지 못한다.", "z": "", "e": "Today is never done, so days of doing evil are many; tomorrow never ends, so days of doing good are few. This year is never done, so afflictions are endless; next year never ends, so there is no progress toward awakening.", "w": ["번뇌", "보리"]}, {"h": "時時移移 速經日夜 日日移移 速經月晦 月月移移 忽來年至 年年移移 暫到死門", "r": "시시이이 속경일야 일일이이 속경월회 월월이이 홀래년지 연년이이 잠도사문", "k": "시간 시간이 흘러 어느새 낮과 밤이 지나고, 하루하루가 흘러 어느새 그믐이 되며, 한 달 한 달이 흘러 어느덧 한 해가 오고, 한 해 한 해가 흘러 잠깐 사이에 죽음의 문에 이른다.", "z": "", "e": "Hour after hour passes, and day and night swiftly go by; day after day passes, and the month swiftly ends; month after month passes, and suddenly the year arrives; year after year passes, and in a moment we reach the gate of death.", "w": ["무상"]}, {"h": "破車不行 老人不修 臥生懈怠 坐起亂識", "r": "파차불행 노인불수 와생해태 좌기란식", "k": "부서진 수레는 굴러가지 못하고, 늙은 사람은 닦을 수 없다. 누우면 게으름이 생기고, 앉으면 어지러운 생각이 일어난다.", "z": "젊고 힘 있을 때 공부하라는 간절한 당부입니다.", "e": "A broken cart cannot move; an old person cannot practice. Lying down, laziness arises; sitting up, scattered thoughts arise.", "w": []}, {"h": "幾生不修 虛過日夜 幾活空身 一生不修 身必有終 後身何乎 莫速急乎 莫速急乎", "r": "기생불수 허과일야 기활공신 일생불수 신필유종 후신하호 막속급호 막속급호", "k": "몇 생이나 닦지 않고 밤낮을 헛되이 보냈으며, 헛된 몸으로 얼마나 산다고 한평생을 닦지 않는가? 이 몸은 반드시 끝이 있으니 다음 몸은 어찌하려는가? 급하지 않은가, 급하지 않은가!", "z": "\"막속급호(莫速急乎)\" — 어찌 급하지 않으랴! 원효대사의 간절한 외침으로 발심수행장이 끝납니다.", "e": "How many lives have you wasted days and nights without practicing? How long will you live in this empty body, spending a whole life without practice? This body must end — what then of the next? Is it not urgent? Is it not urgent!", "w": []}], "jagyeong": [{"h": "主人公 聽我言 幾人得道空門裏 汝何長輪苦趣中", "r": "주인공 청아언 기인득도공문리 여하장륜고취중", "k": "주인공이여, 내 말을 들어라. 얼마나 많은 사람이 불문에서 도를 얻었는데, 너는 어찌하여 괴로움의 세계에서 끝없이 돌고 있는가?", "z": "\"주인공\"은 바로 나 자신의 참마음입니다. 야운 스님이 자기 자신에게 하는 말이자, 읽는 우리 모두에게 하는 말입니다.", "e": "Master of this body, listen to my words! So many have attained the Way within the gate of emptiness — why do you keep circling in the realms of suffering?", "w": [], "ti": "시작하는 말"}, {"h": "汝自無始已來 至于今生 背覺合塵 墮落愚癡 恒造衆惡而入三途之苦輪 不修諸善而沈四生之業海", "r": "여자무시이래 지우금생 배각합진 타락우치 항조중악이입삼도지고륜 불수제선이침사생지업해", "k": "너는 시작을 알 수 없는 옛적부터 이번 생에 이르기까지, 깨달음을 등지고 번뇌의 티끌과 어울려 어리석음에 떨어졌다. 늘 온갖 악을 지어 삼악도의 괴로운 수레바퀴에 들어갔고, 온갖 선을 닦지 않아 사생(모든 생명)의 업의 바다에 잠겼다.", "z": "", "e": "From beginningless time until this life, you have turned your back on awakening and merged with the dust of the senses, falling into delusion. Always doing evil, you entered the painful wheel of the three evil paths; never cultivating good, you sank into the karmic sea of the four kinds of birth.", "w": ["무시", "삼악도", "업"]}, {"h": "身隨六賊故 或墮惡趣則極辛極苦 心背一乘故 或生人道則佛前佛後", "r": "신수륙적고 혹타악취즉극신극고 심배일승고 혹생인도즉불전불후", "k": "몸이 여섯 도둑(감각)을 따랐기에 나쁜 세계에 떨어지면 극심한 괴로움을 겪었고, 마음이 일승(부처님의 참 가르침)을 등졌기에 사람으로 태어나도 부처님이 오시기 전이나 가신 뒤였다.", "z": "\"육적(여섯 도둑)\"은 눈·귀·코·혀·몸·뜻의 감각이 마음의 보물을 훔쳐 간다는 비유입니다.", "e": "Because the body followed the six thieves, when you fell into the evil realms you suffered extremely; because the mind turned from the One Vehicle, even when born human it was before or after a Buddha's time.", "w": ["육근"]}, {"h": "今亦幸得人身 正是佛後末世 嗚呼痛哉 是誰過歟", "r": "금역행득인신 정시불후말세 오호통재 시수과여", "k": "이제 다행히 사람의 몸을 얻었으나 바로 부처님 가신 뒤의 말세이니, 아아, 애통하구나! 이것이 누구의 허물인가?", "z": "", "e": "Now you have fortunately obtained a human body, but it is the degenerate age after the Buddha. Alas, how painful! Whose fault is this?", "w": []}, {"h": "雖然汝能反省 割愛出家 受持應器 着大法服 履出塵之逕路 學無漏之妙法 如龍得水 似虎靠山 其殊妙之理 不可勝言", "r": "수연여능반성 할애출가 수지응기 착대법복 이출진지경로 학무루지묘법 여룡득수 사호고산 기수묘지리 불가승언", "k": "그러나 네가 능히 돌이켜 애욕을 끊고 출가하여, 발우를 받아 지니고 가사를 입고, 세속을 벗어나는 지름길을 밟아 번뇌 없는 묘한 법을 배운다면, 용이 물을 얻은 듯하고 범이 산을 의지한 듯하리니, 그 뛰어나고 묘한 이치는 말로 다할 수 없다.", "z": "", "e": "Yet if you can reflect, cut off craving, leave home, take up the alms bowl and put on the robe, tread the shortcut out of the dust and learn the wondrous Dharma free of outflows, you will be like a dragon finding water, like a tiger leaning on the mountain — its marvel cannot be told.", "w": ["출가", "가사"]}, {"h": "人有古今 法無遐邇 人有愚智 道無盛衰 雖在佛時 不順佛敎則何益 縱値末世 奉行佛敎則何傷", "r": "인유고금 법무하이 인유우지 도무성쇠 수재불시 불순불교즉하익 종치말세 봉행불교즉하상", "k": "사람에게는 옛날과 지금이 있으나 법에는 멀고 가까움이 없고, 사람에게는 어리석음과 지혜로움이 있으나 도에는 성하고 쇠함이 없다. 비록 부처님 계실 때라도 가르침을 따르지 않으면 무슨 이익이 있으며, 설령 말세를 만났더라도 가르침을 받들어 행하면 무슨 해가 있겠는가?", "z": "시대 탓을 하지 말라는 말씀입니다. 가르침은 지금도 그대로 살아 있습니다.", "e": "People have past and present, but the Dharma has no far or near; people are foolish or wise, but the Way neither rises nor declines. Even in the Buddha's time, what use if you do not follow his teaching? Even in the last age, what harm if you practice it?", "w": []}, {"h": "故世尊云 我如良醫 知病說藥 服與不服 非醫咎也 又如善導 導人善道 聞而不行 非導過也", "r": "고세존운 아여량의 지병설약 복여불복 비의구야 우여선도 도인선도 문이불행 비도과야", "k": "그래서 세존께서 말씀하셨다. \"나는 훌륭한 의사와 같아서 병을 알고 약을 일러 주지만, 먹고 안 먹는 것은 의사의 허물이 아니다. 또 좋은 길잡이와 같아서 사람을 좋은 길로 이끌지만, 듣고도 가지 않는 것은 길잡이의 잘못이 아니다.\"", "z": "부처님의 유언을 담은 「유교경」의 말씀입니다. 약은 내가 먹어야 낫습니다.", "e": "Thus the World-Honored One said: 'I am like a good physician who knows the illness and prescribes medicine; whether it is taken or not is not the doctor's fault. I am like a good guide who leads people on the good road; if they hear and do not go, it is not the guide's fault.'", "w": []}, {"h": "自利利人 法皆具足 若我久住 更無所益 自今而後 我諸弟子 展轉行之 則如來法身 常住而不滅也", "r": "자리리인 법개구족 약아구주 경무소익 자금이후 아제제자 전전행지 즉여래법신 상주이불멸야", "k": "\"나를 이롭게 하고 남을 이롭게 하는 법은 모두 갖추어져 있다. 내가 오래 머문다 해도 더 이익될 것이 없다. 지금부터 나의 모든 제자들이 이어 가며 이를 행한다면, 여래의 법신은 늘 머물러 사라지지 않으리라.\"", "z": "", "e": "'The teachings for benefiting oneself and others are all complete. Even if I remained long, there would be no further benefit. From now on, if my disciples practice them in turn, the Dharma body of the Tathagata will abide forever and never perish.'", "w": ["자리이타", "여래"]}, {"h": "若知如是理 則但恨自不修道 何患乎末世也", "r": "약지여시리 즉단한자불수도 하환호말세야", "k": "이런 이치를 안다면 다만 스스로 도를 닦지 않음을 한탄할 뿐, 어찌 말세임을 걱정하겠는가?", "z": "", "e": "If you know this principle, you will only regret not cultivating the Way yourself — why worry about the last age?", "w": []}, {"h": "伏望 汝須興決烈之志 開特達之懷 盡捨諸緣 除去顚倒 眞實爲生死大事 於祖師公案上 宜善參究 以大悟爲則 切莫自輕而退屈", "r": "복망 여수흥결렬지지 개특달지회 진사제연 제거전도 진실위생사대사 어조사공안상 의선참구 이대오위즉 절막자경이퇴굴", "k": "엎드려 바라노니, 너는 반드시 굳세고 뜨거운 뜻을 일으키고 남다른 마음을 열어, 모든 인연을 다 버리고 뒤바뀐 생각을 없애라. 참으로 생사의 큰일을 위해 조사의 공안을 잘 참구하여, 크게 깨닫는 것을 목표로 삼고, 결코 스스로를 가볍게 여겨 물러서지 말라.", "z": "\"공안(화두)\"은 선불교에서 깨달음을 위해 붙드는 질문입니다.", "e": "I humbly hope you will raise a fierce resolve and open an extraordinary heart, cast off all entanglements and remove inverted views. Truly for the great matter of birth and death, investigate the masters' koans well, take great awakening as your standard, and never belittle yourself and retreat.", "w": ["공안", "전도몽상"]}, {"h": "惟斯末運 去聖時遙 魔强法弱 人多邪侈 成人者少 敗人者多 智慧者寡 愚癡者衆 自不修道 亦惱他人 凡有障道之緣 言之不盡", "r": "유사말운 거성시요 마강법약 인다사치 성인자소 패인자다 지혜자과 우치자중 자불수도 역뇌타인 범유장도지연 언지부진", "k": "이 말세의 운수에는 성인 가신 지 오래되어, 마구니는 강하고 법은 약하며 사람들은 삿되고 사치스럽다. 사람을 이루어 주는 이는 적고 망치는 이는 많으며, 지혜로운 이는 적고 어리석은 이는 많다. 스스로 도를 닦지 않으면서 남까지 괴롭히니, 도를 가로막는 인연은 말로 다할 수 없다.", "z": "", "e": "In this declining age, the sages are long gone; Mara is strong and the Dharma weak, and people are crooked and extravagant. Those who build people up are few, those who ruin them many; the wise are few, the foolish many. Not practicing themselves, they trouble others too — the obstacles to the Way are beyond telling.", "w": ["마라"]}, {"h": "恐汝錯路故 我以管見 撰成十門 令汝警策 汝須信持 無一可違 至禱至禱", "r": "공여착로고 아이관견 찬성십문 영여경책 여수신지 무일가위 지도지도", "k": "네가 길을 잘못 들까 두려워, 내가 좁은 소견으로 열 가지 문을 지어 너를 일깨우니, 너는 반드시 믿고 지녀 하나도 어기지 말라. 간절히 빌고 또 비노라.", "z": "", "e": "Fearing you might take the wrong road, with my narrow view I have composed ten gates to admonish you. You must believe and keep them, violating not one. I pray earnestly, earnestly.", "w": []}, {"h": "愚心不學增憍慢 癡意無修長我人 空腹高心如餓虎 無知放逸似顚猿 邪言魔語肯受聽 聖敎賢章故不聞 善道無因誰汝度 長淪惡趣苦纏身", "r": "우심불학증교만 치의무수장아인 공복고심여아호 무지방일사전원 사언마어긍수청 성교현장고불문 선도무인수여도 장륜악취고전신", "k": "어리석은 마음으로 배우지 않으니 교만만 늘고, 미혹한 뜻으로 닦지 않으니 나와 남을 가르는 마음만 자란다. 속은 비고 마음만 높으니 굶주린 범 같고, 아는 것 없이 방일하니 날뛰는 원숭이 같다. 삿된 말 마구니 말은 즐겨 들으면서 성현의 가르침은 일부러 듣지 않는구나. 좋은 길에 인연 없으니 누가 너를 건져 주랴. 길이 악도에 빠져 괴로움이 몸을 얽으리라.", "z": "", "e": "A foolish mind that does not learn only grows in arrogance; a deluded will that does not practice only feeds 'self' and 'other.' Empty inside yet proud, like a starving tiger; ignorant and heedless, like a frantic monkey. You gladly heed wrong words and demonic talk, yet deliberately ignore the sages' teachings. With no link to the good path, who will save you? You will long sink in evil realms, bound by suffering.", "w": ["아만"], "ti": "게송"}, {"h": "其一 軟衣美食 切莫受用 自從耕種 至于口身 非徒人牛 功力多重 亦乃傍生 損害無窮 勞彼功而利我 尙不然也 況殺他命而活己 奚可忍乎", "r": "기일 연의미식 절막수용 자종경종 지우구신 비도인우 공력다중 역내방생 손해무궁 노피공이리아 상불연야 황살타명이활기 해가인호", "k": "첫째, 부드러운 옷과 맛있는 음식을 결코 받아 쓰지 말라. 밭 갈고 씨 뿌리는 데서부터 입에 들어가고 몸에 걸치기까지, 사람과 소의 수고가 많을 뿐 아니라 짐승과 벌레도 수없이 다치고 죽는다. 남을 수고롭게 하여 나를 이롭게 하는 것도 옳지 않은데, 하물며 다른 생명을 죽여 나를 살리는 것을 어찌 차마 하겠는가?", "z": "밥 한 그릇, 옷 한 벌에도 수많은 생명과 노고가 들어 있습니다. 감사하는 마음의 시작입니다.", "e": "First: Never indulge in soft clothes and fine food. From plowing and sowing until food reaches the mouth and clothes the body, not only do people and oxen labor greatly, but countless creatures are harmed. Even profiting from others' toil is wrong — how much more could you bear to kill other lives to sustain your own?", "w": ["공양"], "ti": "첫째. 고운 옷과 맛난 음식을 결코 받아 쓰지 말라"}, {"h": "農夫每有飢寒之苦 織女連無遮身之衣 況我長遊手 飢寒何厭心 軟衣美食 當恩重而損道 破衲蔬食 必施輕而積陰 今生未明心 滴水也難消", "r": "농부매유기한지고 직녀련무차신지의 황아장유수 기한하염심 연의미식 당은중이손도 파납소식 필시경이적음 금생미명심 적수야난소", "k": "농부도 늘 굶주리고 추운 괴로움이 있고, 베 짜는 여인도 몸 가릴 옷이 없는데, 하물며 늘 손 놓고 사는 내가 어찌 춥고 배고픔을 싫어하랴? 고운 옷과 맛난 음식은 시주의 은혜만 무겁게 하여 도를 해치고, 해진 옷과 나물밥은 시주의 은혜를 가볍게 하여 숨은 덕을 쌓게 한다. 이번 생에 마음을 밝히지 못하면 물 한 방울도 소화하기 어렵다.", "z": "", "e": "Farmers always suffer hunger and cold; weaving women have no clothes to cover themselves. How then can I, idle-handed, resent hunger and cold? Fine clothes and food make the debt to donors heavy and harm the Way; a patched robe and plain vegetables lighten the debt and build hidden virtue. If you do not illuminate the mind in this life, even a drop of water will be hard to digest.", "w": []}, {"h": "菜根木果慰飢腸 松落草衣遮色身 野鶴靑雲爲伴侶 高岑幽谷度殘年", "r": "채근목과위기장 송락초의차색신 야학청운위반려 고잠유곡도잔년", "k": "나물 뿌리 나무 열매로 주린 배를 달래고, 솔잎과 풀옷으로 이 몸을 가리며, 들의 학과 푸른 구름을 벗 삼아, 높은 봉우리 깊은 골에서 남은 해를 보내리라.", "z": "", "e": "With vegetable roots and tree fruit I soothe my hungry belly; with pine needles and grass I cover my body. With wild cranes and blue clouds as companions, I spend my remaining years on high peaks and in deep valleys.", "w": [], "ti": "게송"}, {"h": "其二 自財不吝 他物莫求 三途苦上 貪業在初 六度門中 行檀居首 慳貪能防善道 慈施必禦惡徑 如有貧人來求乞 雖在窮乏無吝惜", "r": "기이 자재불린 타물막구 삼도고상 탐업재초 육도문중 행단거수 간탐능방선도 자시필어악경 여유빈인래구걸 수재궁핍무린석", "k": "둘째, 자기 재물을 아끼지 말고 남의 물건을 구하지 말라. 삼악도의 괴로움 가운데 탐욕의 업이 첫째이고, 육바라밀 가운데 보시가 으뜸이다. 아끼고 탐내면 좋은 길을 막고, 자비로 베풀면 나쁜 길을 막는다. 가난한 사람이 와서 구걸하면 비록 궁핍하더라도 아까워하지 말라.", "z": "", "e": "Second: Do not hoard your own wealth or seek others' goods. Among the sufferings of the three evil paths, the karma of greed comes first; among the six perfections, giving stands at the head. Stinginess and greed block the good path; compassionate giving bars the evil road. If a poor person comes begging, though you are in want, do not begrudge them.", "w": ["삼악도", "육바라밀", "보시"], "ti": "둘째. 내 재물을 아끼지 말고 남의 것을 탐내지 말라"}, {"h": "來無一物來 去亦空手去 自財無戀志 他物有何心 萬般將不去 唯有業隨身 三日修心千載寶 百年貪物一朝塵", "r": "내무일물래 거역공수거 자재무련지 타물유하심 만반장불거 유유업수신 삼일수심천재보 백년탐물일조진", "k": "올 때 한 물건도 없이 왔고 갈 때도 빈손으로 간다. 내 재물에도 미련이 없어야 하거늘 남의 물건에 무슨 마음을 두랴? 온갖 것 다 가져가지 못하고 오직 업만 몸을 따른다. 사흘 닦은 마음은 천 년의 보배요, 백 년 탐낸 재물은 하루아침의 티끌이다.", "z": "\"공수래 공수거(빈손으로 왔다 빈손으로 간다)\", \"삼일수심 천재보\" — 자경문에서 가장 많이 인용되는 구절입니다.", "e": "We come with nothing and go with empty hands. Have no attachment even to your own wealth — why set your heart on others'? Nothing can be taken along; only karma follows the body. A mind cultivated for three days is a treasure for a thousand years; goods craved for a hundred years are dust in a single morning.", "w": ["업"]}, {"h": "三途苦本因何起 只是多生貪愛情 我佛衣盂生理足 如何蓄積長無明", "r": "삼도고본인하기 지시다생탐애정 아불의우생리족 여하축적장무명", "k": "삼악도 괴로움의 뿌리는 무엇으로 생기는가? 다만 여러 생 동안의 탐욕과 애착 때문이다. 우리 부처님의 가사와 발우면 살아가기에 넉넉한데, 어찌 재물을 쌓아 무명을 키우랴?", "z": "", "e": "From what does the root of suffering in the three evil paths arise? Only from greed and attachment through many lives. Our Buddha's robe and bowl are enough to live by — why hoard and feed ignorance?", "w": ["무명"], "ti": "게송"}, {"h": "其三 口無多言 身不輕動 身不輕動則息亂成定 口無多言則轉愚成慧 實相離言 眞理非動 口是禍門 必加嚴守 身乃災本 不應輕動", "r": "기삼 구무다언 신불경동 신불경동즉식란성정 구무다언즉전우성혜 실상리언 진리비동 구시화문 필가엄수 신내재본 불응경동", "k": "셋째, 입으로 말을 많이 하지 말고 몸을 가볍게 움직이지 말라. 몸을 가볍게 움직이지 않으면 산란함이 쉬어 선정을 이루고, 말을 많이 하지 않으면 어리석음이 바뀌어 지혜를 이룬다. 참모습은 말을 떠났고 참 이치는 움직임이 아니다. 입은 재앙의 문이니 반드시 엄하게 지키고, 몸은 재난의 근본이니 가볍게 움직이지 말라.", "z": "\"입은 화의 문\" — 말조심은 동서고금의 지혜입니다.", "e": "Third: Do not talk much or move about lightly. When the body does not move lightly, distraction ceases and concentration forms; when the mouth does not speak much, foolishness turns into wisdom. True reality is beyond words; true principle is not movement. The mouth is the gate of misfortune — guard it strictly; the body is the root of disaster — do not move it lightly.", "w": ["선정", "지혜"], "ti": "셋째. 말을 많이 하지 말고 몸을 가벼이 움직이지 말라"}, {"h": "數飛之鳥 忽有羅網之殃 輕步之獸 非無傷箭之禍 故世尊住雪山 六年坐不動 達磨居少林 九歲默無言 後來參禪者 何不依古蹤", "r": "삭비지조 홀유라망지앙 경보지수 비무상전지화 고세존주설산 육년좌부동 달마거소림 구세묵무언 후래참선자 하불의고종", "k": "자주 나는 새는 갑자기 그물에 걸리는 재앙을 만나고, 가볍게 쏘다니는 짐승은 화살에 다치는 화를 면치 못한다. 그래서 세존께서는 설산에서 6년을 앉아 움직이지 않으셨고, 달마 대사는 소림굴에서 9년을 말없이 앉아 계셨다. 뒤에 참선하는 이들이 어찌 옛 자취를 따르지 않겠는가?", "z": "", "e": "A bird that flies about often suddenly meets the misfortune of a net; a beast that roams lightly does not escape the arrow. Thus the World-Honored One sat unmoving for six years in the Snowy Mountains, and Bodhidharma sat silent for nine years at Shaolin. Why should later meditators not follow these ancient footsteps?", "w": ["참선"]}, {"h": "身心把定元無動 默坐茅庵絶往來 寂寂寥寥無一事 但看心佛自歸依", "r": "신심파정원무동 묵좌모암절왕래 적적요요무일사 단간심불자귀의", "k": "몸과 마음을 붙잡아 본래 움직임이 없게 하고, 띠집에 묵묵히 앉아 오고 감을 끊으라. 고요하고 고요하여 한 가지 일도 없으니, 다만 마음 부처를 보고 스스로 귀의할 뿐이다.", "z": "", "e": "Hold body and mind firmly, originally unmoving; sit silently in a thatched hut, cutting off comings and goings. Still and quiet, with not a single matter — just look at the Buddha of the mind and take refuge in it yourself.", "w": [], "ti": "게송"}, {"h": "其四 但親善友 莫結邪朋 鳥之將息 必擇其林 人之求學 乃選師友 擇林木則其止也安 選師友則其學也高 故承事善友如父母 遠離惡友似寃家", "r": "기사 단친선우 막결사붕 조지장식 필택기림 인지구학 내선사우 택림목즉기지야안 선사우즉기학야고 고승사선우여부모 원리악우사원가", "k": "넷째, 다만 착한 벗을 가까이하고 삿된 벗과 사귀지 말라. 새가 쉬려 할 때는 반드시 숲을 고르고, 사람이 배우려 할 때는 스승과 벗을 고른다. 숲을 잘 고르면 머무는 곳이 편안하고, 스승과 벗을 잘 고르면 배움이 높아진다. 그러므로 착한 벗은 부모처럼 섬기고, 나쁜 벗은 원수처럼 멀리하라.", "z": "초발심자경문의 첫 구절(\"나쁜 벗을 멀리하라\")과 법구경 78절이 모두 같은 말씀입니다.", "e": "Fourth: Associate only with good friends; do not bond with wicked companions. When a bird would rest, it chooses its grove; when a person would learn, they choose teachers and friends. Choose the grove well and your rest is peaceful; choose teachers and friends well and your learning grows lofty. So serve good friends as you would your parents, and avoid bad friends as you would enemies.", "w": ["선우", "악우"], "ti": "넷째. 착한 벗만 가까이하고 삿된 벗과 사귀지 말라"}, {"h": "鶴無烏朋之計 鵬豈鷦友之謀 松裏之葛 直聳千尋 茅中之木 未免三尺 無良小輩頻頻脫 得意高流數數親", "r": "학무오붕지계 붕기초우지모 송리지갈 직용천심 모중지목 미면삼척 무량소배빈빈탈 득의고류삭삭친", "k": "학은 까마귀와 벗할 생각이 없거늘 붕새가 어찌 뱁새와 벗하려 하겠는가? 소나무 사이의 칡은 곧게 천 길을 솟아오르지만, 띠풀 속의 나무는 석 자를 넘지 못한다. 어질지 못한 소인배는 자주자주 벗어나고, 뜻이 높은 이들과는 자주자주 가까이하라.", "z": "누구와 함께하느냐에 따라 나의 높이가 달라집니다.", "e": "The crane has no plan to befriend crows; how could the great roc seek friendship with wrens? A vine among pines climbs straight up a thousand fathoms; a tree among thatch grass never exceeds three feet. Shake off worthless petty people again and again; draw near to those of lofty aims again and again.", "w": []}, {"h": "住止經行須善友 身心決擇去荊塵 荊塵掃盡通前路 寸步不移透祖關", "r": "주지경행수선우 신심결택거형진 형진소진통전로 촌보불이투조관", "k": "머물 때나 다닐 때나 반드시 좋은 벗과 함께하여, 몸과 마음을 잘 가려 가시덤불 같은 번뇌를 없애라. 가시덤불을 다 쓸어 내어 앞길이 트이면, 한 걸음도 옮기지 않고 조사의 관문을 뚫으리라.", "z": "", "e": "Whether staying or walking, keep good friends; discern well in body and mind and clear away the thorny dust. When the thorns are swept away and the road ahead opens, without moving an inch you will pass through the masters' barrier.", "w": ["선우"], "ti": "게송"}, {"h": "其五 除三更外 不許睡眠 曠劫障道 睡魔莫大 二六時中 惺惺起疑而不昧 四威儀內 密密廻光而自看", "r": "기오 제삼경외 불허수면 광겁장도 수마막대 이륙시중 성성기의이불매 사위의내 밀밀회광이자간", "k": "다섯째, 삼경(한밤중) 외에는 잠자는 것을 허락하지 말라. 오랜 세월 도를 가로막는 데는 잠이라는 마구니보다 큰 것이 없다. 하루 열두 시간 내내 또렷또렷하게 의심을 일으켜 흐려지지 말고, 다니고 머물고 앉고 눕는 가운데 빈틈없이 빛을 돌이켜 스스로를 살펴라.", "z": "", "e": "Fifth: Do not allow yourself to sleep except in the third watch of the night. Through endless eons, nothing obstructs the Way more than the demon of sleep. Throughout the twelve hours, keep alert and raise the great doubt without dimming; in walking, standing, sitting and lying, closely turn the light around and look within.", "w": ["화두"], "ti": "다섯째. 삼경 외에는 잠자지 말라"}, {"h": "一生空過 萬劫追恨 無常刹那 乃日日而驚怖 人命須臾 實時時而不保 若未透祖關 如何安睡眠", "r": "일생공과 만겁추한 무상찰나 내일일이경포 인명수유 실시시이불보 약미투조관 여하안수면", "k": "한평생을 헛되이 보내면 만 겁 동안 한이 된다. 무상은 찰나에 닥치니 날마다 놀라고 두려워해야 하고, 사람의 목숨은 잠깐이니 실로 한 시도 보장할 수 없다. 조사의 관문을 뚫지 못했다면 어찌 편히 잠잘 수 있겠는가?", "z": "", "e": "Waste one life, and you will regret it for ten thousand eons. Impermanence strikes in an instant, so be startled and afraid every day; human life is but a moment, truly not secure from hour to hour. If you have not yet passed the masters' barrier, how can you sleep in peace?", "w": ["무상"]}, {"h": "睡蛇雲籠心月暗 行人到此盡迷程 箇中拈起吹毛利 雲自無形月自明", "r": "수사운롱심월암 행인도차진미정 개중염기취모리 운자무형월자명", "k": "잠이라는 뱀과 구름이 덮어 마음의 달이 어두우니, 수행자가 여기 이르러 모두 길을 잃는다. 이 가운데 취모검(날카로운 지혜의 칼)을 집어 들면, 구름은 저절로 사라지고 달은 저절로 밝으리라.", "z": "", "e": "The snake of sleep and the clouds cover the moon of the mind, and practitioners here all lose their way. If, right here, you take up the hair-splitting sword of wisdom, the clouds will vanish of themselves and the moon will shine of itself.", "w": [], "ti": "게송"}, {"h": "其六 切莫妄自尊大 輕慢他人 修仁得仁 謙讓爲本 親友和友 敬信爲宗 四相山漸高 三途海益深 外現威儀如尊貴 內無所得似朽舟", "r": "기륙 절막망자존대 경만타인 수인득인 겸양위본 친우화우 경신위종 사상산점고 삼도해익심 외현위의여존귀 내무소득사후주", "k": "여섯째, 결코 함부로 자신을 높이고 남을 업신여기지 말라. 어짊을 닦아 어짊을 얻는 데는 겸손과 사양이 근본이고, 벗과 친하고 화목하는 데는 공경과 믿음이 으뜸이다. 사상(나·남·중생·수명에 대한 집착)의 산이 높아질수록 삼악도의 바다는 깊어진다. 겉으로는 위엄 있는 모습이 존귀해 보여도 안으로 얻은 것이 없으면 썩은 배와 같다.", "z": "", "e": "Sixth: Never arrogantly exalt yourself and look down on others. To cultivate and attain humaneness, humility and yielding are the foundation; to be close and harmonious with friends, respect and trust come first. As the mountain of the four marks grows higher, the sea of the three evil paths grows deeper. Outwardly dignified as if noble, but inwardly empty — like a rotten boat.", "w": ["사상", "아만"], "ti": "여섯째. 함부로 자신을 높이고 남을 업신여기지 말라"}, {"h": "官益大者心益小 道益高者意益卑 人我山崩處 無爲道自成 凡有下心者 萬福自歸依", "r": "관익대자심익소 도익고자의익비 인아산붕처 무위도자성 범유하심자 만복자귀의", "k": "벼슬이 높아질수록 마음은 더욱 낮추고, 도가 높아질수록 뜻은 더욱 겸손해야 한다. 나와 남을 가르는 산이 무너지는 곳에 무위의 도가 저절로 이루어지니, 무릇 마음을 낮추는 이에게는 온갖 복이 저절로 돌아온다.", "z": "\"하심(下心)\" — 마음을 낮추는 것이 모든 복의 근원입니다.", "e": "The higher one's office, the humbler the heart; the loftier one's Way, the lowlier the mind. Where the mountain of self and other collapses, the unconditioned Way completes itself. Whoever lowers the mind, ten thousand blessings return to them of themselves.", "w": ["하심"]}, {"h": "憍慢塵中藏般若 我人山上長無明 輕他不學躘踵老 病臥辛吟恨不窮", "r": "교만진중장반야 아인산상장무명 경타불학룡종로 병와신음한불궁", "k": "교만의 티끌 속에 지혜가 묻히고, 나와 남을 가르는 산 위에 무명이 자란다. 남을 업신여겨 배우지 않다가 비틀비틀 늙어, 병들어 누워 신음하며 한이 끝없으리라.", "z": "", "e": "In the dust of arrogance, wisdom is buried; on the mountain of self and other, ignorance grows. Looking down on others and not learning, you totter into old age, lying sick and groaning with endless regret.", "w": ["반야", "무명"], "ti": "게송"}, {"h": "其七 見財色 必須正念對之 害身之機 無過女色 喪道之本 莫及貨財 是故佛垂戒律 嚴禁財色 眼覩女色 如見虎蛇 身臨金玉 等視木石", "r": "기칠 견재색 필수정념대지 해신지기 무과녀색 상도지본 막급화재 시고불수계율 엄금재색 안도녀색 여견호사 신림금옥 등시목석", "k": "일곱째, 재물과 이성을 보면 반드시 바른 생각으로 대하라. 몸을 해치는 계기로는 이성에 대한 욕망보다 더한 것이 없고, 도를 잃는 근본으로는 재물보다 더한 것이 없다. 그래서 부처님께서 계율을 내리시어 재물과 색을 엄하게 금하셨다. 눈으로 이성을 보거든 범이나 뱀을 본 듯이 하고, 몸이 금과 옥 가까이 있거든 나무나 돌처럼 보아라.", "z": "", "e": "Seventh: When you see wealth or sensual beauty, face them with right mindfulness. Nothing harms the body more than lust; nothing destroys the Way more than wealth. Thus the Buddha set down precepts strictly forbidding wealth and lust. When your eyes see the opposite sex, regard it as seeing a tiger or a snake; when near gold and jade, look on them as wood and stone.", "w": ["재색", "정념"], "ti": "일곱째. 재물과 이성을 보면 반드시 바른 생각으로 대하라"}, {"h": "雖居暗室 如對大賓 隱現同時 內外莫異 心淨則善神必護 戀色則諸天不容 神必護則雖難處而無難 天不容則乃安方而不安", "r": "수거암실 여대대빈 은현동시 내외막이 심정즉선신필호 연색즉제천불용 신필호즉수난처이무난 천불용즉내안방이불안", "k": "비록 어두운 방에 홀로 있어도 귀한 손님을 대하듯 하고, 남이 보든 안 보든 한결같이 하여 안팎이 다르지 않게 하라. 마음이 깨끗하면 선신이 반드시 보호하고, 이성을 그리워하면 모든 하늘이 받아들이지 않는다. 선신이 보호하면 어려운 곳에 있어도 어려움이 없고, 하늘이 받아들이지 않으면 편안한 곳에 있어도 편안하지 않다.", "z": "남이 보지 않을 때의 모습이 진짜 나입니다.", "e": "Even when alone in a dark room, behave as if facing an honored guest; be the same whether seen or unseen, with no difference within and without. When the mind is pure, good spirits surely protect you; when you long for lust, the heavens will not accept you. Protected by spirits, you meet no hardship even in hard places; rejected by heaven, you find no peace even in peaceful places.", "w": []}, {"h": "利慾閻王引獄鎖 淨行陀佛接蓮臺 鎖拘入獄苦千種 船上生蓮樂萬般", "r": "이욕염왕인옥쇄 정행타불접련대 쇄구입옥고천종 선상생련락만반", "k": "이익과 욕망을 좇으면 염라대왕이 지옥 쇠사슬로 끌고 가고, 깨끗하게 수행하면 아미타불이 연화대로 맞이하신다. 쇠사슬에 묶여 지옥에 들면 괴로움이 천 가지요, 배를 타고 연꽃에 태어나면 즐거움이 만 가지라.", "z": "", "e": "Chase profit and desire, and King Yama drags you to hell in chains; practice purely, and Amitabha Buddha receives you on a lotus throne. Chained and cast into hell, a thousand kinds of suffering; borne by boat to be born in a lotus, ten thousand kinds of joy.", "w": ["아미타불"], "ti": "게송"}, {"h": "其八 莫交世俗 令他憎嫉 離心中愛曰沙門 不戀世俗曰出家 旣能割愛揮人世 復何白衣結黨遊 愛戀世俗爲饕餮 饕餮由來非道心", "r": "기팔 막교세속 영타증질 이심중애왈사문 불련세속왈출가 기능할애휘인세 부하백의결당유 애련세속위도철 도철유래비도심", "k": "여덟째, 세속과 사귀어 남이 미워하고 시기하게 하지 말라. 마음속의 애욕을 떠난 이를 사문이라 하고, 세속을 그리워하지 않는 것을 출가라 한다. 이미 애욕을 끊고 세상을 떨쳤거늘, 어찌 다시 세속 사람들과 무리 지어 놀겠는가? 세속을 그리워하는 것은 탐욕스러운 짐승(도철)이 되는 것이니, 도철은 본래 도 닦는 마음이 아니다.", "z": "", "e": "Eighth: Do not mix with worldly people and arouse others' resentment. One who has left craving behind is called a shramana; one who does not long for the world is said to have left home. Having cut off craving and shaken off the world, why form cliques with laypeople again? Longing for the world makes you a glutton-beast, and a glutton-beast never had the mind of the Way.", "w": ["사문", "출가"], "ti": "여덟째. 세속과 사귀어 남의 미움을 사지 말라"}, {"h": "人情濃厚道心疎 若欲不負出家志 須向名山窮妙旨 一衣一鉢絶人情 飢飽無心道自高", "r": "인정농후도심소 약욕불부출가지 수향명산궁묘지 일의일발절인정 기포무심도자고", "k": "세상 인정이 두터우면 도 닦는 마음은 엷어진다. 출가한 뜻을 저버리지 않으려거든 반드시 이름난 산에 가서 묘한 뜻을 끝까지 탐구하라. 옷 한 벌 발우 하나로 세상 인정을 끊고, 배고픔과 배부름에 마음을 두지 않으면 도는 저절로 높아진다.", "z": "", "e": "When worldly sentiment is thick, the mind of the Way grows thin. If you would not betray your aspiration in leaving home, go to a famous mountain and fathom the wondrous meaning. With one robe and one bowl, cut off worldly ties; be indifferent to hunger and fullness, and the Way will rise of itself.", "w": []}, {"h": "爲他爲己雖微善 皆是輪廻生死因 願入松風蘿月下 長觀無漏祖師禪", "r": "위타위기수미선 개시륜회생사인 원입송풍라월하 장관무루조사선", "k": "남을 위하고 나를 위하는 작은 선행이라도 모두 윤회와 생사의 원인이 된다. 원하노니, 솔바람 불고 덩굴 사이로 달 비치는 곳에 들어가, 번뇌 없는 조사선을 길이 관하리라.", "z": "", "e": "Even small good deeds done for others or oneself all become causes of rebirth in birth and death. May I enter beneath the pine breeze and the moon through the vines, and long contemplate the masters' Zen, free of outflows.", "w": ["윤회"], "ti": "게송"}, {"h": "其九 勿說他人過失 雖聞善惡 心無動念 無德而被讚 實吾慚愧 有咎而蒙毁 誠我欣然 欣然則知過必改 慚愧則進道無怠", "r": "기구 물설타인과실 수문선악 심무동념 무덕이피찬 실오참괴 유구이몽훼 성아흔연 흔연즉지과필개 참괴즉진도무태", "k": "아홉째, 남의 허물을 말하지 말라. 비록 좋은 말 나쁜 말을 듣더라도 마음이 흔들리지 않게 하라. 덕이 없는데 칭찬을 받으면 참으로 부끄러운 일이요, 허물이 있어 비난을 받으면 참으로 기쁜 일이다. 기뻐하면 허물을 알아 반드시 고치게 되고, 부끄러워하면 도에 나아가는 데 게으르지 않게 된다.", "z": "비난을 들으면 \"고칠 기회가 생겼다\"고 기뻐하라는 놀라운 가르침입니다.", "e": "Ninth: Do not speak of others' faults. Though you hear praise or blame, let the mind not stir. To be praised without virtue — that is truly my shame; to be blamed for a fault — that is truly my joy. Joyful, I will surely correct the fault I know; ashamed, I will advance on the Way without slacking.", "w": ["참회"], "ti": "아홉째. 남의 허물을 말하지 말라"}, {"h": "勿說他人過 終歸必損身 若聞害人言 如毁父母聲 今朝雖說他人過 異日廻頭論我咎 雖然凡所有相 皆是虛妄 譏毁讚譽 何憂何喜", "r": "물설타인과 종귀필손신 약문해인언 여훼부모성 금조수설타인과 이일회두론아구 수연범소유상 개시허망 기훼찬예 하우하희", "k": "남의 허물을 말하지 말라. 끝내는 반드시 내 몸을 해치게 된다. 남을 해치는 말을 듣거든 내 부모를 헐뜯는 소리처럼 여겨라. 오늘 아침 남의 허물을 말하면 훗날 고개 돌려 내 허물을 따지게 된다. 그러나 무릇 모양 있는 것은 모두 허망하니, 헐뜯음과 칭찬에 무엇을 근심하고 무엇을 기뻐하랴?", "z": "\"범소유상 개시허망\"은 금강경의 구절입니다.", "e": "Do not speak of others' faults; in the end it will surely harm you. If you hear words that harm others, take them as slander against your own parents. Speak of others' faults this morning, and another day heads will turn to discuss yours. Yet all that has form is illusory — why grieve at slander or delight in praise?", "w": []}, {"h": "終朝亂說人長短 竟夜昏沈樂睡眠 如此出家徒受施 必於三界出頭難", "r": "종조란설인장단 경야혼침락수면 여차출가도수시 필어삼계출두난", "k": "아침 내내 남의 잘잘못을 어지러이 떠들다가, 밤새도록 혼미하게 잠만 즐긴다. 이런 출가는 헛되이 시주만 받을 뿐이니, 반드시 삼계를 벗어나기 어려우리라.", "z": "", "e": "Chattering all morning about others' strengths and faults, sinking all night in dull, pleasant sleep — leaving home like this only wastes donors' gifts, and surely it will be hard to escape the three realms.", "w": ["삼계"], "ti": "게송"}, {"h": "其十 居衆中 心常平等 割愛辭親 法界平等 若有親疎 心不平等 雖復出家 何德之有 心中若無憎愛之取捨 身上那有苦樂之盛衰", "r": "기십 거중중 심상평등 할애사친 법계평등 약유친소 심불평등 수부출가 하덕지유 심중약무증애지취사 신상나유고락지성쇠", "k": "열째, 대중 속에 살면서 마음을 늘 평등하게 하라. 애정을 끊고 부모를 떠난 것은 온 법계가 평등하기 때문이다. 만약 친하고 소원함이 있다면 마음이 평등하지 못한 것이니, 비록 출가했다 한들 무슨 덕이 있으랴? 마음속에 미워하고 사랑하여 취하고 버림이 없다면, 이 몸에 어찌 괴로움과 즐거움의 성쇠가 있겠는가?", "z": "", "e": "Tenth: Living among the assembly, always keep the mind impartial. You cut off affection and left your parents because the whole Dharma realm is equal. If you have favorites and outsiders, your mind is not impartial — though you have left home, what virtue is there? If the mind has no grasping or rejecting from love and hate, how can the body have the rise and fall of pain and pleasure?", "w": ["대중"], "ti": "열째. 대중 속에 살면서 마음을 늘 평등하게 하라"}, {"h": "平等性中無彼此 大圓鏡上絶親疎 三途出沒 憎愛所纏 六道昇降 親疎業縛 契心平等 本無取捨 若無取捨 生死何有", "r": "평등성중무피차 대원경상절친소 삼도출몰 증애소전 육도승강 친소업박 계심평등 본무취사 약무취사 생사하유", "k": "평등한 성품 가운데에는 너와 나가 없고, 크고 둥근 거울 위에는 친하고 소원함이 끊어졌다. 삼악도에 들고 나는 것은 미움과 사랑에 얽혔기 때문이요, 육도에 오르내리는 것은 친하고 소원한 업에 묶였기 때문이다. 마음이 평등에 계합하면 본래 취하고 버릴 것이 없으니, 취하고 버림이 없다면 생사가 어디 있겠는가?", "z": "", "e": "In the nature of equality there is no this or that; on the great round mirror, closeness and distance are cut off. Rising and sinking in the three evil paths come from being bound by love and hate; ascending and descending through the six realms come from the karmic bonds of favoritism. When the mind accords with equality, there is originally no grasping or rejecting; without grasping or rejecting, where is birth and death?", "w": ["육도", "삼악도"]}, {"h": "欲成無上菩提道 也要常懷平等心 若有親疎憎愛計 道加遠兮業加深", "r": "욕성무상보리도 야요상회평등심 약유친소증애계 도가원혜업가심", "k": "위없는 깨달음의 도를 이루려거든 늘 평등한 마음을 품어야 한다. 만약 친하고 소원하며 미워하고 사랑하는 분별이 있으면, 도는 더욱 멀어지고 업은 더욱 깊어지리라.", "z": "", "e": "If you wish to accomplish the unsurpassed Way of awakening, you must always hold an impartial mind. If you calculate closeness and distance, love and hate, the Way grows ever farther and karma ever deeper.", "w": ["보리"], "ti": "게송"}, {"h": "主人公 汝値人道 當如盲龜遇木 一生幾何 不修懈怠 人生難得 佛法難逢 此生失却 萬劫難遇 須持十門之戒法 日新勤修而不退 速成正覺 還度衆生", "r": "주인공 여치인도 당여맹구우목 일생기하 불수해태 인생난득 불법난봉 차생실각 만겁난우 수지십문지계법 일신근수이불퇴 속성정각 환도중생", "k": "주인공이여, 네가 사람으로 태어난 것은 눈먼 거북이 바다에 떠다니는 나무를 만난 것과 같은데, 한평생이 얼마나 된다고 닦지 않고 게으름을 피우는가? 사람 몸 받기 어렵고 불법 만나기 어려우니, 이번 생을 놓치면 만 겁이 지나도 다시 만나기 어렵다. 반드시 이 열 가지 문의 계법을 지녀 날마다 새롭게 부지런히 닦아 물러나지 말고, 속히 바른 깨달음을 이루어 다시 중생을 건져라.", "z": "\"맹구우목(盲龜遇木)\" — 백 년에 한 번 떠오르는 눈먼 거북이 바다 위 구멍 난 나무를 만나는 것만큼 사람으로 태어나 불법을 만나기가 어렵다는 비유입니다.", "e": "Master, your being born human is like a blind turtle meeting a floating log. How long is one life — why not practice instead of idling? Human birth is hard to obtain, the Buddha-dharma hard to meet; lose it in this life and you will hardly meet it again in ten thousand eons. Keep the precepts of these ten gates, practice diligently, renewed each day, without retreating; swiftly attain right awakening and return to save living beings.", "w": ["중생"], "ti": "맺는 말"}, {"h": "我之本願 非爲汝獨出生死大海 亦乃普爲衆生也 何以故 汝自無始以來 至于今生 恒値四生 數數往還 皆依父母而出沒也 故曠劫父母 無量無邊 由是觀之 六道衆生 無非是汝多生父母", "r": "아지본원 비위여독출생사대해 역내보위중생야 하이고 여자무시이래 지우금생 항치사생 삭삭왕환 개의부모이출몰야 고광겁부모 무량무변 유시관지 육도중생 무비시여다생부모", "k": "나의 본래 바람은 너 혼자만 생사의 큰 바다에서 벗어나는 것이 아니라 널리 모든 중생을 위함이다. 왜냐하면 너는 시작 없는 옛적부터 이번 생에 이르기까지 늘 사생으로 태어나 자주자주 오가며, 모두 부모에 의지하여 나고 죽었다. 그러므로 오랜 세월의 부모가 한량없고 끝없으니, 이로써 보건대 육도의 중생이 모두 너의 여러 생 부모 아닌 이가 없다.", "z": "모든 생명이 한때 나의 부모였다는 가르침 — 자비심의 근거입니다.", "e": "My original vow is not for you alone to escape the great sea of birth and death, but for all beings. Why? From beginningless time until now you have been born in the four modes again and again, always relying on parents to be born and die. Thus your parents through endless eons are countless; seen this way, there is no being in the six realms who has not been your parent in some life.", "w": ["육도", "중생"]}, {"h": "如是等類 咸沒惡趣 日夜受大苦惱 若不拯濟 何時出離 嗚呼哀哉 痛纏心腑 千萬望汝 早早發明大智 具足神通之力 自在方便之權 速爲洪濤之智楫 廣度欲岸之迷倫", "r": "여시등류 함몰악취 일야수대고뇌 약부증제 하시출리 오호애재 통전심부 천만망여 조조발명대지 구족신통지력 자재방편지권 속위홍도지지즙 광도욕안지미륜", "k": "이러한 이들이 모두 나쁜 세계에 빠져 밤낮으로 큰 고통을 받고 있으니, 건져 주지 않으면 언제 벗어나겠는가? 아아, 슬프도다. 아픔이 가슴을 에는구나. 천만번 바라노니, 너는 하루빨리 큰 지혜를 밝히고 신통의 힘과 자재한 방편을 갖추어, 거센 파도를 건너는 지혜의 노가 되어, 욕망의 언덕에서 헤매는 중생들을 널리 건너게 하라.", "z": "", "e": "All these have sunk into evil realms, suffering great torment day and night. If not rescued, when will they escape? Alas, how sad — the pain wrings my heart! I beg you a thousand times: quickly awaken great wisdom, perfect spiritual powers and free, skillful means, and become the oar of wisdom on the raging waves, ferrying across all the lost beings on the shore of desire.", "w": ["방편", "지혜"]}, {"h": "君不見 從上諸佛諸祖 盡是昔日同我凡夫 彼旣丈夫 汝亦爾 但不爲也 非不能也 古曰 道不遠人 人自遠矣 又云 我欲仁 斯仁至矣 誠哉是言也", "r": "군불견 종상제불제조 진시석일동아범부 피기장부 여역이 단불위야 비불능야 고왈 도불원인 인자원의 우운 아욕인 사인지의 성재시언야", "k": "그대는 보지 못하는가? 예로부터 모든 부처님과 조사들도 옛날에는 다 우리와 같은 범부였다. 그들도 장부였고 너도 그러하니, 다만 하지 않을 뿐 못 하는 것이 아니다. 옛말에 \"도가 사람을 멀리하는 것이 아니라 사람이 스스로 도를 멀리한다\" 하였고, 또 \"내가 어질고자 하면 어짊이 곧 이른다\" 하였으니, 참으로 옳은 말이다.", "z": "\"못 하는 것이 아니라 안 하는 것\" — 자경문에서 가장 힘이 되는 구절입니다.", "e": "Do you not see? All the Buddhas and patriarchs of old were once ordinary people like us. They were people of resolve, and so are you — you simply do not do it; it is not that you cannot. The ancients said, 'The Way is not far from people; people distance themselves,' and 'If I desire humaneness, humaneness arrives.' How true these words are!", "w": []}, {"h": "若能信心不退 則誰不見性成佛 我今證明三寶 一一戒汝 知非故犯 則生陷地獄 可不愼歟 可不愼歟", "r": "약능신심불퇴 즉수불견성성불 아금증명삼보 일일계여 지비고범 즉생함지옥 가불신여 가불신여", "k": "만약 믿는 마음이 물러서지 않는다면 누가 성품을 보아 부처를 이루지 못하겠는가? 내가 이제 삼보를 증명으로 모시고 하나하나 너를 경계하니, 잘못인 줄 알면서도 일부러 범한다면 산 채로 지옥에 떨어지리라. 어찌 삼가지 않으랴, 어찌 삼가지 않으랴!", "z": "", "e": "If your faith does not retreat, who would not see their nature and become a Buddha? Now, with the Three Jewels as witness, I admonish you point by point. If you knowingly break these, you will fall alive into hell. How can you not be careful? How can you not be careful!", "w": ["견성", "삼보"]}, {"h": "玉兎昇沈催老像 金烏出沒促年光 求名求利如朝露 或苦或榮似夕煙 勸汝慇懃修善道 速成佛果濟迷倫 今生若不從斯語 後世當然恨萬端", "r": "옥토승침최로상 금오출몰촉년광 구명구리여조로 혹고혹영사석연 권여은근수선도 속성불과제미륜 금생약부종사어 후세당연한만단", "k": "옥토끼(달)가 뜨고 지며 늙음을 재촉하고, 금까마귀(해)가 뜨고 지며 세월을 재촉한다. 이름과 이익을 구하는 것은 아침 이슬 같고, 괴로움과 영화는 저녁 연기 같다. 너에게 간곡히 권하노니 좋은 도를 닦아, 속히 부처의 열매를 이루어 헤매는 중생을 건져라. 이번 생에 이 말을 따르지 않으면, 다음 생에 반드시 한이 만 갈래가 되리라.", "z": "", "e": "The jade rabbit (moon) rises and sets, hastening old age; the golden crow (sun) comes and goes, hurrying the years. Seeking fame and profit is like morning dew; suffering and glory are like evening smoke. I earnestly urge you to cultivate the good Way, swiftly attain Buddhahood and save the lost. If in this life you do not follow these words, in lives to come your regrets will surely be countless.", "w": ["무상"], "ti": "게송"}], "diamond": [{"h": "如是我聞 一時 佛在舍衛國祇樹給孤獨園 與大比丘衆千二百五十人俱 爾時 世尊食時 著衣持鉢 入舍衛大城乞食 於其城中 次第乞已 還至本處 飯食訖 收衣鉢 洗足已 敷座而坐", "r": "여시아문 일시 불재사위국기수급고독원 여대비구중천이백오십인구 이시 세존식시 착의지발 입사위대성걸식 어기성중 차제걸이 환지본처 반식흘 수의발 세족이 부좌이좌", "k": "이와 같이 나는 들었다. 한때 부처님께서 사위국의 기수급고독원에서 큰 비구 1,250명과 함께 계셨다. 그때 세존께서는 공양 때가 되자 가사를 입고 발우를 들고 사위성에 들어가 밥을 비셨다. 성 안에서 차례로 밥을 빌고 나서 본래 계시던 곳으로 돌아와 공양을 마치시고, 가사와 발우를 거두고 발을 씻으신 뒤 자리를 펴고 앉으셨다.", "z": "금강경은 특별한 기적이 아니라 밥을 빌고, 먹고, 발 씻고, 앉는 평범한 일상으로 시작합니다. 깨달음은 일상 속에 있다는 뜻입니다.", "e": "Thus have I heard. Once the Buddha was at Jetavana in Shravasti with 1,250 great monks. At mealtime the World-Honored One put on his robe, took his bowl, and entered the city to beg. Having begged from house to house in order, he returned, ate, put away robe and bowl, washed his feet, arranged his seat and sat down.", "w": ["여시아문", "비구", "가사"], "ti": "제1분 법회인유분 — 법회가 열린 인연", "th": "法會因由分"}, {"h": "時 長老須菩提在大衆中即從座起 偏袒右肩 右膝著地 合掌恭敬而白佛言 希有世尊 如來善護念諸菩薩 善付囑諸菩薩 世尊 善男子 善女人 發阿耨多羅三藐三菩提心 應云何住 云何降伏其心 佛言 善哉 善哉 須菩提 如汝所說 如來善護念諸菩薩 善付囑諸菩薩 汝今諦聽 當爲汝說 善男子 善女人 發阿耨多羅三藐三菩提心 應如是住 如是降伏其心 唯然 世尊 願樂欲聞", "r": "시 장로수보리재대중중즉종좌기 편단우견 우슬착지 합장공경이백불언 희유세존 여래선호념제보살 선부촉제보살 세존 선남자 선녀인 발아뇩다라삼먁삼보리심 응운하주 운하항복기심 불언 선재 선재 수보리 여여소설 여래선호념제보살 선부촉제보살 여금체청 당위여설 선남자 선녀인 발아뇩다라삼먁삼보리심 응여시주 여시항복기심 유연 세존 원요욕문", "k": "그때 장로 수보리가 대중 가운데서 일어나 오른쪽 어깨를 드러내고 오른쪽 무릎을 땅에 대고 합장하여 공경히 부처님께 여쭈었다. \"희유하십니다, 세존이시여! 여래께서는 모든 보살을 잘 보살피시고 잘 당부하십니다. 세존이시여, 선남자 선여인이 위없는 깨달음을 구하는 마음(아뇩다라삼먁삼보리심)을 내었으면, 어떻게 머물러야 하며 어떻게 그 마음을 다스려야 합니까?\" 부처님께서 말씀하셨다. \"좋다, 좋다. 수보리여, 네 말과 같다. 이제 자세히 들어라. 너를 위해 말하리라. 위없는 깨달음의 마음을 낸 이는 이와 같이 머물고 이와 같이 그 마음을 다스려야 한다.\" \"예, 세존이시여. 즐거이 듣고자 합니다.\"", "z": "\"마음을 어떻게 머물고, 어떻게 다스릴까?\" — 금강경 전체가 이 질문에 대한 대답입니다.", "e": "Then the elder Subhuti rose from the assembly, bared his right shoulder, knelt on his right knee, joined his palms and said: \"How rare, World-Honored One! The Tathagata protects and entrusts all bodhisattvas well. When good men and women give rise to the mind of supreme awakening, how should they abide, and how should they subdue their minds?\" The Buddha said: \"Good, good, Subhuti! Listen carefully; I will tell you. They should abide thus and subdue their minds thus.\" \"Yes, World-Honored One. I wish to hear.\"", "w": ["희유", "수보리", "아뇩다라삼먁삼보리", "보살"], "ti": "제2분 선현기청분 — 수보리가 일어나 법을 청함", "th": "善現起請分"}, {"h": "佛告須菩提 諸菩薩摩訶薩應如是降伏其心 所有一切衆生之類 若卵生 若胎生 若濕生 若化生 若有色 若無色 若有想 若無想 若非有想非無想 我皆令入無餘涅槃而滅度之 如是滅度無量 無數 無邊衆生 實無衆生得滅度者 何以故 須菩提 若菩薩有我相 人相 衆生相 壽者相 即非菩薩", "r": "불고수보리 제보살마하살응여시항복기심 소유일체중생지류 약란생 약태생 약습생 약화생 약유색 약무색 약유상 약무상 약비유상비무상 아개령입무여열반이멸도지 여시멸도무량 무수 무변중생 실무중생득멸도자 하이고 수보리 약보살유아상 인상 중생상 수자상 즉비보살", "k": "부처님께서 수보리에게 말씀하셨다. \"모든 보살마하살은 이와 같이 그 마음을 다스려야 한다. 알에서 나는 것, 태에서 나는 것, 습기에서 나는 것, 변화하여 나는 것, 형체가 있는 것, 형체가 없는 것, 생각이 있는 것, 생각이 없는 것, 생각이 있는 것도 없는 것도 아닌 것 — 이 모든 중생을 내가 다 남김없는 열반에 들게 하여 건지리라. 이와 같이 한량없고 셀 수 없고 끝없는 중생을 건졌으나, 실제로는 건져진 중생이 하나도 없다. 왜냐하면 수보리여, 만약 보살에게 나라는 생각(아상), 남이라는 생각(인상), 중생이라는 생각(중생상), 오래 산다는 생각(수자상)이 있으면 보살이 아니기 때문이다.\"", "z": "모든 생명을 구하되 \"내가 구했다\"는 생각이 없어야 참 보살입니다. 금강경의 핵심인 \"사상(四相)\"이 처음 나옵니다.", "e": "The Buddha told Subhuti: \"Bodhisattvas should subdue their minds thus: 'All beings — born of eggs, wombs, moisture or transformation, with form or without, with perception, without, or neither — I will lead them all into nirvana without remainder.' Yet though immeasurable beings are liberated, in truth no being is liberated. Why? If a bodhisattva holds the notion of a self, a person, a being, or a life-span, he is not a bodhisattva.\"", "w": ["보살", "중생", "열반", "사상"], "ti": "제3분 대승정종분 — 대승의 바른 근본", "th": "大乘正宗分"}, {"h": "復次 須菩提 菩薩於法應無所住行於布施 所謂不住色布施 不住聲 香 味 觸 法布施 須菩提 菩薩應如是布施 不住於相 何以故 若菩薩不住相布施 其福德不可思量 須菩提 於意云何 東方虛空可思量不 不也 世尊 須菩提 南 西 北方 四維 上 下虛空可思量不 不也 世尊 須菩提 菩薩無住相布施 福德亦復如是不可思量 須菩提 菩薩但應如所教住", "r": "부차 수보리 보살어법응무소주행어보시 소위부주색보시 부주성 향 미 촉 법보시 수보리 보살응여시보시 부주어상 하이고 약보살부주상보시 기복덕불가사량 수보리 어의운하 동방허공가사량부 불야 세존 수보리 남 서 북방 사유 상 하허공가사량부 불야 세존 수보리 보살무주상보시 복덕역부여시불가사량 수보리 보살단응여소교주", "k": "\"또 수보리여, 보살은 법에 머무는 바 없이 보시해야 한다. 이른바 형색에 머물지 않고 보시하며, 소리·냄새·맛·감촉·생각의 대상에 머물지 않고 보시해야 한다. 수보리여, 보살은 이와 같이 보시하되 모습(상)에 머물지 말아야 한다. 왜냐하면 보살이 모습에 머물지 않고 보시하면 그 복덕은 헤아릴 수 없기 때문이다. 수보리여, 동쪽 허공을 헤아릴 수 있겠느냐?\" \"없습니다, 세존이시여.\" \"남쪽·서쪽·북쪽과 네 간방과 위아래의 허공을 헤아릴 수 있겠느냐?\" \"없습니다, 세존이시여.\" \"수보리여, 보살이 모습에 머물지 않고 보시하는 복덕도 이와 같이 헤아릴 수 없다. 수보리여, 보살은 다만 가르친 대로 머물러야 한다.\"", "z": "\"무주상보시\" — 베풀었다는 생각조차 없이 베푸는 것. 그 복은 허공처럼 끝이 없습니다.", "e": "\"Moreover, Subhuti, a bodhisattva should give without abiding in anything — not abiding in form, sound, smell, taste, touch or mental objects. Why? If a bodhisattva gives without abiding in appearances, the merit is beyond measure. Subhuti, can the space to the east be measured?\" \"No, World-Honored One.\" \"Or the space to the south, west, north, the intermediate directions, above and below?\" \"No.\" \"Just so, the merit of giving without abiding in appearances cannot be measured. Bodhisattvas should abide only as taught.\"", "w": ["무주상보시", "보시"], "ti": "제4분 묘행무주분 — 머묾 없는 묘한 실천", "th": "妙行無住分"}, {"h": "須菩提 於意云何 可以身相見如來不 不也 世尊 不可以身相得見如來 何以故 如來所說身相 即非身相 佛告須菩提 凡所有相 皆是虛妄 若見諸相非相 則見如來", "r": "수보리 어의운하 가이신상견여래부 불야 세존 불가이신상득견여래 하이고 여래소설신상 즉비신상 불고수보리 범소유상 개시허망 약견제상비상 즉견여래", "k": "\"수보리여, 어떻게 생각하느냐? 몸의 모습으로 여래를 볼 수 있겠느냐?\" \"없습니다, 세존이시여. 몸의 모습으로는 여래를 볼 수 없습니다. 왜냐하면 여래께서 말씀하신 몸의 모습은 곧 몸의 모습이 아니기 때문입니다.\" 부처님께서 수보리에게 말씀하셨다. \"무릇 모양 있는 것은 모두 허망하니, 만약 모든 모양이 모양 아님을 보면 곧 여래를 보리라.\"", "z": "\"범소유상 개시허망 약견제상비상 즉견여래\" — 금강경 사구게 가운데 첫째, 가장 유명한 구절입니다.", "e": "\"Subhuti, what do you think? Can the Tathagata be seen by his bodily marks?\" \"No, World-Honored One. Why? The bodily marks the Tathagata speaks of are not bodily marks.\" The Buddha told Subhuti: \"All that has form is illusory. If you see all forms as no-form, you see the Tathagata.\"", "w": ["사구게", "여래"], "ti": "제5분 여리실견분 — 이치대로 참되게 봄", "th": "如理實見分"}, {"h": "須菩提白佛言 世尊 頗有衆生 得聞如是言說章句 生實信不 佛告須菩提 莫作是說 如來滅後後五百歲 有持戒修福者 於此章句能生信心 以此爲實 當知是人不於一佛二佛 三 四 五佛而種善根 已於無量千萬佛所種諸善根 聞是章句 乃至一念生淨信者 須菩提 如來悉知悉見是諸衆生得如是無量福德 何以故 是諸衆生無復我相 人相 衆生相 壽者相 無法相 亦無非法相 何以故 是諸衆生若心取相 則爲著我 人 衆生 壽者 若取法相 即著我 人 衆生 壽者 何以故 若取非法相 即著我 人 衆生 壽者 是故不應取法 不應取非法 以是義故 如來常說 汝等比丘 知我說法 如筏喻者 法尚應捨 何況非法", "r": "수보리백불언 세존 파유중생 득문여시언설장구 생실신부 불고수보리 막작시설 여래멸후후오백세 유지계수복자 어차장구능생신심 이차위실 당지시인불어일불이불 삼 사 오불이종선근 이어무량천만불소종제선근 문시장구 내지일념생정신자 수보리 여래실지실견시제중생득여시무량복덕 하이고 시제중생무부아상 인상 중생상 수자상 무법상 역무비법상 하이고 시제중생약심취상 즉위착아 인 중생 수자 약취법상 즉착아 인 중생 수자 하이고 약취비법상 즉착아 인 중생 수자 시고불응취법 불응취비법 이시의고 여래상설 여등비구 지아설법 여벌유자 법상응사 하황비법", "k": "수보리가 부처님께 여쭈었다. \"세존이시여, 어떤 중생이 이와 같은 말씀을 듣고 참된 믿음을 낼 수 있겠습니까?\" 부처님께서 말씀하셨다. \"그런 말 하지 말라. 여래가 열반한 뒤 오백 년이 지나도 계를 지키고 복을 닦는 이가 있어, 이 말씀에 믿는 마음을 내고 이것을 진실로 여길 것이다. 이 사람은 한두 부처님께만 선근을 심은 것이 아니라 이미 한량없는 부처님 처소에서 온갖 선근을 심었다. 이 말씀을 듣고 한 생각이라도 깨끗한 믿음을 내는 이는, 여래가 다 알고 다 보니 한량없는 복덕을 얻는다. 왜냐하면 이 중생들은 다시는 사상이 없고, 법이라는 생각도 없으며, 법 아니라는 생각도 없기 때문이다. … 그러므로 법을 취하지도 말고 법 아닌 것을 취하지도 말라. 그래서 여래는 늘 말했다. '너희 비구들아, 내 설법은 뗏목과 같은 줄 알라. 법도 버려야 하거늘 하물며 법 아닌 것이랴.'\"", "z": "\"뗏목의 비유\" — 강을 건넜으면 뗏목은 내려놓아야 합니다. 가르침마저도 집착의 대상이 되어서는 안 됩니다.", "e": "Subhuti asked: \"Will there be beings who, hearing these words, give rise to true faith?\" The Buddha said: \"Do not say so. Five hundred years after my passing there will be those who keep the precepts and cultivate merit, who will have faith in these words and take them as true. They will have planted good roots not with one, two or five Buddhas, but with countless Buddhas. Whoever gives rise to pure faith for even one thought, the Tathagata fully knows and sees them gaining immeasurable merit. Why? They no longer hold notions of self, person, being or life-span, nor of dharma or non-dharma… Therefore do not grasp dharma, nor non-dharma. As I always say: 'Monks, know that my teaching is like a raft. Even the Dharma must be let go of, how much more what is not Dharma.'\"", "w": ["희유", "사상", "뗏목"], "ti": "제6분 정신희유분 — 바른 믿음은 드물다", "th": "正信希有分"}, {"h": "須菩提 於意云何 如來得阿耨多羅三藐三菩提耶 如來有所說法耶 須菩提言 如我解佛所說義 無有定法名阿耨多羅三藐三菩提 亦無有定法如來可說 何以故 如來所說法 皆不可取 不可說 非法 非非法 所以者何 一切賢聖皆以無爲法而有差別", "r": "수보리 어의운하 여래득아뇩다라삼먁삼보리야 여래유소설법야 수보리언 여아해불소설의 무유정법명아뇩다라삼먁삼보리 역무유정법여래가설 하이고 여래소설법 개불가취 불가설 비법 비비법 소이자하 일체현성개이무위법이유차별", "k": "\"수보리여, 어떻게 생각하느냐? 여래가 위없는 깨달음을 얻었느냐? 여래가 설한 법이 있느냐?\" 수보리가 말씀드렸다. \"제가 부처님 말씀의 뜻을 이해하기로는, 위없는 깨달음이라고 이름할 정해진 법이 없고, 여래께서 설하실 정해진 법도 없습니다. 왜냐하면 여래께서 설하신 법은 모두 취할 수도 없고 말할 수도 없으며, 법도 아니고 법 아닌 것도 아니기 때문입니다. 그 까닭은 모든 성현이 다 무위법으로 차별을 보이기 때문입니다.\"", "z": "", "e": "\"Subhuti, what do you think? Has the Tathagata attained supreme awakening? Has he taught any Dharma?\" Subhuti said: \"As I understand the Buddha's meaning, there is no fixed Dharma called supreme awakening, and no fixed Dharma the Tathagata can teach. Why? The Dharma he teaches cannot be grasped or spoken; it is neither Dharma nor non-Dharma. Why? All sages are distinguished by the unconditioned.\"", "w": ["아뇩다라삼먁삼보리", "무위"], "ti": "제7분 무득무설분 — 얻을 것도 설할 것도 없음", "th": "無得無說分"}, {"h": "須菩提 於意云何 若人滿三千大千世界七寶以用布施 是人所得福德 寧爲多不 須菩提言 甚多 世尊 何以故 是福德即非福德性 是故如來說福德多 若復有人 於此經中受持乃至四句偈等 爲他人說 其福勝彼 何以故 須菩提 一切諸佛及諸佛阿耨多羅三藐三菩提法 皆從此經出 須菩提 所謂佛法者 即非佛法", "r": "수보리 어의운하 약인만삼천대천세계칠보이용보시 시인소득복덕 영위다부 수보리언 심다 세존 하이고 시복덕즉비복덕성 시고여래설복덕다 약부유인 어차경중수지내지사구게등 위타인설 기복승피 하이고 수보리 일체제불급제불아뇩다라삼먁삼보리법 개종차경출 수보리 소위불법자 즉비불법", "k": "\"수보리여, 어떻게 생각하느냐? 어떤 사람이 삼천대천세계에 가득 찬 칠보로 보시한다면 이 사람이 얻는 복덕이 많겠느냐?\" \"매우 많습니다, 세존이시여. 왜냐하면 이 복덕은 복덕의 성품이 아니기 때문에 여래께서 복덕이 많다고 말씀하셨습니다.\" \"만약 또 어떤 사람이 이 경 가운데서 사구게 하나만이라도 받아 지녀 남을 위해 말해 준다면 그 복이 저보다 뛰어나다. 왜냐하면 수보리여, 모든 부처님과 모든 부처님의 위없는 깨달음의 법이 다 이 경에서 나왔기 때문이다. 수보리여, 이른바 불법이라는 것은 곧 불법이 아니다.\"", "z": "온 우주를 채운 보물보다 이 경의 네 구절을 나누는 것이 더 큰 복입니다.", "e": "\"Subhuti, if someone filled the billion-world universe with the seven treasures and gave them away, would the merit be great?\" \"Very great, World-Honored One. Why? This merit has no nature of merit, so the Tathagata calls it great.\" \"But if someone receives and keeps even a four-line verse of this sutra and explains it to others, that merit surpasses it. Why? All Buddhas and their supreme awakening come forth from this sutra. Subhuti, what is called the Buddha-dharma is not the Buddha-dharma.\"", "w": ["삼천대천세계", "칠보", "사구게"], "ti": "제8분 의법출생분 — 모든 것이 이 법에서 나옴", "th": "依法出生分"}, {"h": "須菩提 於意云何 須陀洹能作是念 我得須陀洹果不 須菩提言 不也 世尊 何以故 須陀洹名爲入流 而無所入 不入色 聲 香 味 觸 法 是名須陀洹 須菩提 於意云何 斯陀含能作是念 我得斯陀含果不 須菩提言 不也 世尊 何以故 斯陀含名一往來 而實無往來 是名斯陀含 須菩提 於意云何 阿那含能作是念 我得阿那含果不 須菩提言 不也 世尊 何以故 阿那含名爲不來 而實無來 是故名阿那含 須菩提 於意云何 阿羅漢能作是念 我得阿羅漢道不 須菩提言 不也 世尊 何以故 實無有法名阿羅漢 世尊 若阿羅漢作是念我得阿羅漢道 即爲著我 人 衆生 壽者 世尊 佛說我得無諍三昧人中最爲第一 是第一離欲阿羅漢 我不作是念 我是離欲阿羅漢 世尊 我若作是念我得阿羅漢道 世尊則不說須菩提是樂阿蘭那行者 以須菩提實無所行 而名須菩提是樂阿蘭那行", "r": "수보리 어의운하 수다원능작시념 아득수다원과부 수보리언 불야 세존 하이고 수다원명위입류 이무소입 불입색 성 향 미 촉 법 시명수다원 수보리 어의운하 사다함능작시념 아득사다함과부 수보리언 불야 세존 하이고 사다함명일왕래 이실무왕래 시명사다함 수보리 어의운하 아나함능작시념 아득아나함과부 수보리언 불야 세존 하이고 아나함명위불래 이실무래 시고명아나함 수보리 어의운하 아라한능작시념 아득아라한도부 수보리언 불야 세존 하이고 실무유법명아라한 세존 약아라한작시념아득아라한도 즉위착아 인 중생 수자 세존 불설아득무쟁삼매인중최위제일 시제일리욕아라한 아부작시념 아시리욕아라한 세존 아약작시념아득아라한도 세존즉불설수보리시요아란나행자 이수보리실무소행 이명수보리시요아란나행", "k": "\"수보리여, 어떻게 생각하느냐? 수다원이 '내가 수다원의 결과를 얻었다'고 생각하겠느냐?\" \"아닙니다, 세존이시여. 수다원은 '흐름에 들어섰다'는 뜻이지만 실제로 들어선 곳이 없어서, 형색·소리·냄새·맛·감촉·생각에 들지 않으니 수다원이라 합니다.\" (사다함·아나함도 마찬가지로 문답한다.) \"아라한이 '내가 아라한의 도를 얻었다'고 생각하겠느냐?\" \"아닙니다, 세존이시여. 실제로 아라한이라 이름할 법이 없습니다. 만약 아라한이 '내가 아라한의 도를 얻었다'고 생각한다면 곧 나·남·중생·수명에 집착하는 것입니다. 세존께서는 제가 다툼 없는 삼매를 얻은 사람 가운데 으뜸이요, 욕심을 떠난 첫째 아라한이라 하셨지만, 저는 '내가 욕심을 떠난 아라한이다'라고 생각하지 않습니다. 제가 만약 그렇게 생각했다면 세존께서 저를 고요한 수행을 즐기는 이라고 말씀하지 않으셨을 것입니다. 수보리가 실제로 행한 바가 없기에, 수보리를 고요한 수행을 즐기는 이라 하신 것입니다.\"", "z": "성자의 네 단계(수다원·사다함·아나함·아라한)도 \"내가 얻었다\"는 생각이 있으면 참 성자가 아닙니다.", "e": "\"Subhuti, does a stream-enterer think, 'I have attained stream-entry'?\" \"No. Stream-enterer means 'entering the stream,' yet he enters nothing — not form, sound, smell, taste, touch or mental objects.\" (Likewise for once-returner and non-returner.) \"Does an arahant think, 'I have attained arahantship'?\" \"No. There is in truth no dharma called arahant. If he thought so, he would be attached to self, person, being and life-span. The World-Honored One says I am foremost in the samadhi of non-contention, the foremost arahant free of desire — yet I do not think 'I am an arahant free of desire.' If I did, the World-Honored One would not call me one who delights in peaceful practice. Because Subhuti in truth practices nothing, he is called one who delights in peaceful practice.\"", "w": ["수다원", "아라한", "삼매"], "ti": "제9분 일상무상분 — 하나의 모습은 모습이 없음", "th": "一相無相分"}, {"h": "佛告須菩提 於意云何 如來昔在然燈佛所 於法有所得不 世尊 如來在然燈佛所 於法實無所得 須菩提 於意云何 菩薩莊嚴佛土不 不也 世尊 何以故 莊嚴佛土者 則非莊嚴 是名莊嚴 是故須菩提 諸菩薩摩訶薩應如是生清淨心 不應住色生心 不應住聲 香 味 觸 法生心 應無所住而生其心 須菩提 譬如有人 身如須彌山王 於意云何 是身爲大不 須菩提言 甚大 世尊 何以故 佛說非身 是名大身", "r": "불고수보리 어의운하 여래석재연등불소 어법유소득부 세존 여래재연등불소 어법실무소득 수보리 어의운하 보살장엄불토부 불야 세존 하이고 장엄불토자 즉비장엄 시명장엄 시고수보리 제보살마하살응여시생청정심 불응주색생심 불응주성 향 미 촉 법생심 응무소주이생기심 수보리 비여유인 신여수미산왕 어의운하 시신위대부 수보리언 심대 세존 하이고 불설비신 시명대신", "k": "부처님께서 수보리에게 말씀하셨다. \"어떻게 생각하느냐? 여래가 옛날 연등부처님 처소에서 법을 얻은 것이 있느냐?\" \"없습니다, 세존이시여. 여래께서 연등부처님 처소에 계실 때 법을 실제로 얻은 것이 없습니다.\" \"수보리여, 보살이 불국토를 장엄하느냐?\" \"아닙니다, 세존이시여. 불국토를 장엄한다는 것은 장엄이 아니라 그 이름이 장엄일 뿐입니다.\" \"그러므로 수보리여, 모든 보살마하살은 이와 같이 깨끗한 마음을 내야 한다. 형색에 머물러 마음을 내지 말고, 소리·냄새·맛·감촉·생각에 머물러 마음을 내지 말고, 마땅히 머무는 바 없이 그 마음을 내야 한다. 수보리여, 어떤 사람의 몸이 수미산만 하다면 그 몸이 크겠느냐?\" \"매우 큽니다, 세존이시여. 부처님께서는 몸 아닌 것을 큰 몸이라 하셨습니다.\"", "z": "\"응무소주 이생기심(應無所住 而生其心)\" — 머무는 바 없이 마음을 내라. 육조 혜능 스님이 이 구절을 듣고 깨달았다는 금강경 최고의 구절입니다.", "e": "\"Subhuti, when the Tathagata was with Dipankara Buddha long ago, did he attain any Dharma?\" \"No, World-Honored One.\" \"Does a bodhisattva adorn a Buddha-land?\" \"No. Adorning a Buddha-land is not adorning; it is merely called adorning.\" \"Therefore, Subhuti, bodhisattvas should give rise to a pure mind thus: not abiding in form, sound, smell, taste, touch or mental objects — they should give rise to a mind that abides nowhere. Subhuti, if someone's body were as large as Mount Sumeru, would it be large?\" \"Very large. The Buddha calls no-body a great body.\"", "w": ["응무소주", "연등불", "수미산"], "ti": "제10분 장엄정토분 — 정토를 장엄함", "th": "莊嚴淨土分"}, {"h": "須菩提 如恒河中所有沙數 如是沙等恒河 於意云何 是諸恒河沙寧爲多不 須菩提言 甚多 世尊 但諸恒河尚多無數 何況其沙 須菩提 我今實言告汝 若有善男子 善女人 以七寶滿爾所恒河沙數三千大千世界以用布施 得福多不 須菩提言 甚多 世尊 佛告須菩提 若善男子 善女人於此經中 乃至受持四句偈等 爲他人說 而此福德勝前福德", "r": "수보리 여항하중소유사수 여시사등항하 어의운하 시제항하사령위다부 수보리언 심다 세존 단제항하상다무수 하황기사 수보리 아금실언고여 약유선남자 선녀인 이칠보만이소항하사수삼천대천세계이용보시 득복다부 수보리언 심다 세존 불고수보리 약선남자 선녀인어차경중 내지수지사구게등 위타인설 이차복덕승전복덕", "k": "\"수보리여, 항하(갠지스강)에 있는 모래 수만큼 많은 항하가 있다면, 그 모든 항하의 모래가 많겠느냐?\" \"매우 많습니다, 세존이시여. 항하만 해도 셀 수 없이 많은데 하물며 그 모래이겠습니까.\" \"수보리여, 내가 이제 진실한 말로 너에게 이르노니, 어떤 선남자 선여인이 그 모든 항하의 모래 수만큼의 삼천대천세계를 칠보로 가득 채워 보시한다면 복이 많겠느냐?\" \"매우 많습니다, 세존이시여.\" \"만약 선남자 선여인이 이 경 가운데 사구게 하나만이라도 받아 지녀 남에게 말해 준다면, 이 복덕이 앞의 복덕보다 뛰어나다.\"", "z": "", "e": "\"Subhuti, if there were as many Ganges Rivers as grains of sand in the Ganges, would their sands be many?\" \"Very many — the rivers alone are countless, how much more their sands.\" \"Truly I tell you: if good men or women filled as many billion-world universes as those sands with the seven treasures and gave them away, would the merit be great?\" \"Very great.\" \"Yet if one keeps even a four-line verse of this sutra and explains it to others, this merit surpasses that.\"", "w": ["항하사", "사구게"], "ti": "제11분 무위복승분 — 무위의 복이 가장 뛰어남", "th": "無爲福勝分"}, {"h": "復次 須菩提 隨說是經 乃至四句偈等 當知此處 一切世間天 人 阿修羅皆應供養 如佛塔廟 何況有人盡能受持讀誦 須菩提 當知是人成就最上 第一 希有之法 若是經典所在之處 則爲有佛 若尊重弟子", "r": "부차 수보리 수설시경 내지사구게등 당지차처 일체세간천 인 아수라개응공양 여불탑묘 하황유인진능수지독송 수보리 당지시인성취최상 제일 희유지법 약시경전소재지처 즉위유불 약존중제자", "k": "\"또 수보리여, 이 경을 설하되 사구게 하나만이라도 설하는 곳이 있다면, 그곳은 온 세상의 하늘·사람·아수라가 모두 부처님 탑묘처럼 공양해야 함을 알라. 하물며 이 경을 다 받아 지니고 읽고 외우는 사람이겠느냐. 수보리여, 이 사람은 가장 높고 으뜸가며 희유한 법을 성취함을 알라. 이 경전이 있는 곳에는 부처님과 존경받는 제자들이 계신 것과 같다.\"", "z": "", "e": "\"Moreover, Subhuti, wherever this sutra — even one four-line verse — is taught, that place should be honored by gods, humans and asuras as a Buddha's shrine. How much more one who can fully receive, keep, read and recite it! Such a person achieves the highest, foremost, rarest Dharma. Wherever this sutra is, there the Buddha and his revered disciples are.\"", "w": ["아수라", "공양"], "ti": "제12분 존중정교분 — 바른 가르침을 존중함", "th": "尊重正敎分"}, {"h": "爾時 須菩提白佛言 世尊 當何名此經 我等云何奉持 佛告須菩提 是經名爲金剛般若波羅蜜 以是名字 汝當奉持 所以者何 須菩提 佛說般若波羅蜜 則非般若波羅蜜 須菩提 於意云何 如來有所說法不 須菩提白佛言 世尊 如來無所說 須菩提 於意云何 三千大千世界所有微塵是爲多不 須菩提言 甚多 世尊 須菩提 諸微塵 如來說非微塵 是名微塵 如來說世界 非世界 是名世界 須菩提 於意云何 可以三十二相見如來不 不也 世尊 不可以三十二相得見如來 何以故 如來說三十二相 即是非相 是名三十二相 須菩提 若有善男子 善女人 以恒河沙等身命布施 若復有人 於此經中 乃至受持四句偈等 爲他人說 其福甚多", "r": "이시 수보리백불언 세존 당하명차경 아등운하봉지 불고수보리 시경명위금강반야바라밀 이시명자 여당봉지 소이자하 수보리 불설반야바라밀 즉비반야바라밀 수보리 어의운하 여래유소설법부 수보리백불언 세존 여래무소설 수보리 어의운하 삼천대천세계소유미진시위다부 수보리언 심다 세존 수보리 제미진 여래설비미진 시명미진 여래설세계 비세계 시명세계 수보리 어의운하 가이삼십이상견여래부 불야 세존 불가이삼십이상득견여래 하이고 여래설삼십이상 즉시비상 시명삼십이상 수보리 약유선남자 선녀인 이항하사등신명보시 약부유인 어차경중 내지수지사구게등 위타인설 기복심다", "k": "그때 수보리가 부처님께 여쭈었다. \"세존이시여, 이 경을 무엇이라 이름하며 저희가 어떻게 받들어 지녀야 합니까?\" 부처님께서 말씀하셨다. \"이 경의 이름은 금강반야바라밀이니, 이 이름으로 받들어 지녀라. 왜냐하면 수보리여, 부처님이 말한 반야바라밀은 곧 반야바라밀이 아니기 때문이다. … 수보리여, 삼천대천세계의 티끌이 많겠느냐?\" \"매우 많습니다.\" \"모든 티끌을 여래는 티끌이 아니라 하니 그 이름이 티끌이요, 여래가 말한 세계도 세계가 아니라 그 이름이 세계다. 수보리여, 32가지 거룩한 모습으로 여래를 볼 수 있겠느냐?\" \"없습니다. 여래께서 말씀하신 32상은 곧 모습이 아니라 그 이름이 32상입니다.\" \"수보리여, 어떤 선남자 선여인이 항하의 모래 수만큼 목숨을 바쳐 보시하더라도, 이 경의 사구게 하나라도 지녀 남에게 말해 주는 복이 훨씬 많다.\"", "z": "\"금강\"은 다이아몬드처럼 모든 번뇌를 끊는 단단한 지혜를 뜻합니다. \"A는 A가 아니라 그 이름이 A다\" — 금강경 특유의 말투로, 이름과 모습에 집착하지 말라는 뜻입니다.", "e": "Then Subhuti asked: \"What should this sutra be called, and how should we keep it?\" The Buddha said: \"It is called the Diamond Prajna Paramita. Keep it by this name. Why? The prajna paramita the Buddha speaks of is not prajna paramita… Subhuti, are the dust motes of the billion-world universe many?\" \"Very many.\" \"The Tathagata says dust motes are not dust motes; they are called dust motes. The world is not a world; it is called a world. Can the Tathagata be seen by the thirty-two marks?\" \"No. The thirty-two marks are no-marks; they are called the thirty-two marks.\" \"Subhuti, even if someone gave up lives as many as the Ganges sands, one who keeps even a four-line verse of this sutra and explains it to others gains far greater merit.\"", "w": ["금강", "반야", "삼십이상"], "ti": "제13분 여법수지분 — 법답게 받아 지님", "th": "如法受持分"}, {"h": "爾時 須菩提聞說是經 深解義趣 涕淚悲泣 而白佛言 希有世尊 佛說如是甚深經典 我從昔來所得慧眼 未曾得聞如是之經 世尊 若復有人得聞是經 信心清淨 則生實相 當知是人 成就第一希有功德 世尊 是實相者 則是非相 是故如來說名實相 世尊 我今得聞如是經典 信解 受持不足爲難 若當來世後五百歲 其有衆生得聞是經 信解 受持 是人則爲第一希有 何以故 此人無我相 人相 衆生相 壽者相 所以者何 我相即是非相 人相 衆生相 壽者相即是非相 何以故 離一切諸相 則名諸佛 佛告須菩提 如是 如是 若復有人得聞是經 不驚 不怖 不畏 當知是人甚爲希有 何以故 須菩提 如來說第一波羅蜜 非第一波羅蜜 是名第一波羅蜜 須菩提 忍辱波羅蜜 如來說非忍辱波羅蜜 何以故 須菩提 如我昔爲歌利王割截身體 我於爾時 無我相 無人相 無衆生相 無壽者相 何以故 我於往昔節節支解時 若有我相 人相 衆生相 壽者相 應生瞋恨 須菩提 又念過去於五百世作忍辱仙人 於爾所世 無我相 無人相 無衆生相 無壽者相 是故 須菩提 菩薩應離一切相 發阿耨多羅三藐三菩提心 不應住色生心 不應住聲 香 味 觸 法生心 應生無所住心 若心有住 則爲非住 是故 佛說菩薩心不應住色布施 須菩提 菩薩爲利益一切衆生 應如是布施 如來說 一切諸相 即是非相 又說 一切衆生 則非衆生 須菩提 如來是真語者 實語者 如語者 不誑語者 不異語者 須菩提 如來所得法 此法無實無虛 須菩提 若菩薩心住於法而行布施 如人入闇 則無所見 若菩薩心不住法而行布施 如人有目 日光明照 見種種色 須菩提 當來之世 若有善男子 善女人 能於此經受持 讀誦 則爲如來以佛智慧悉知是人 悉見是人 皆得成就無量無邊功德", "r": "이시 수보리문설시경 심해의취 체루비읍 이백불언 희유세존 불설여시심심경전 아종석래소득혜안 미증득문여시지경 세존 약부유인득문시경 신심청정 즉생실상 당지시인 성취제일희유공덕 세존 시실상자 즉시비상 시고여래설명실상 세존 아금득문여시경전 신해 수지부족위난 약당래세후오백세 기유중생득문시경 신해 수지 시인즉위제일희유 하이고 차인무아상 인상 중생상 수자상 소이자하 아상즉시비상 인상 중생상 수자상즉시비상 하이고 이일체제상 즉명제불 불고수보리 여시 여시 약부유인득문시경 불경 불포 불외 당지시인심위희유 하이고 수보리 여래설제일바라밀 비제일바라밀 시명제일바라밀 수보리 인욕바라밀 여래설비인욕바라밀 하이고 수보리 여아석위가리왕할절신체 아어 hem, anger and hatred would have arisen… Therefore a bodhisattva should leave all forms and give rise to the mind of supreme awakening, not abiding in form, sound, smell, taste, touch or mental objects — a mind that abides nowhere. If the mind abides somewhere, that is not true abiding… The Tathagata speaks what is true, what is real, what is so, not deceiving, not otherwise… A bodhisattva who gives while abiding in dharmas is like one who enters darkness and sees nothing; one who gives without abiding is like one with eyes in bright sunlight seeing all colors. Those who keep, read and recite this sutra in the future, the Tathagata fully knows and sees, will all achieve boundless merit.\"", "w": ["희유", "실상", "사상", "인욕", "응무소주"], "ti": "제14분 이상적멸분 — 모습을 떠나 고요함", "th": "離相寂滅分"}, {"h": "須菩提 若有善男子 善女人 初日分以恒河沙等身布施 中日分復以恒河沙等身布施 後日分亦以恒河沙等身布施 如是無量百千萬億劫以身布施 若復有人 聞此經典 信心不逆 其福勝彼 何況書寫 受持 讀誦 爲人解說 須菩提 以要言之 是經有不可思議 不可稱量 無邊功德 如來爲發大乘者說 爲發最上乘者說 若有人能受持 讀誦 廣爲人說 如來悉知是人 悉見是人 皆得成就不可量 不可稱 無有邊 不可思議功德 如是人等 則爲荷擔如來阿耨多羅三藐三菩提 何以故 須菩提 若樂小法者 著我見 人見 衆生見 壽者見 則於此經 不能聽受 讀誦 爲人解說 須菩提 在在處處若有此經 一切世間天 人 阿修羅所應供養 當知此處則爲是塔 皆應恭敬 作禮 圍繞 以諸華香而散其處", "r": "수보리 약유선남자 선녀인 초일분이항하사등신보시 중일분부이항하사등신보시 후일분역이항하사등신보시 여시무량백천만억겁이신보시 약부유인 문차경전 신심불역 기복승피 하황서사 수지 독송 위인해설 수보리 이요언지 시경유불가사의 불가칭량 무변공덕 여래위발대승자설 위발최상승자설 약유인능수지 독송 광위인설 여래실지시인 실견시인 개득성취불가량 불가칭 무유변 불가사의공덕 여시인등 즉위하담여래아뇩다라삼먁삼보리 하이고 수보리 약요소법자 착아견 인견 중생견 수자견 즉어차경 불능청수 독송 위인해설 수보리 재재처처약유차경 일체세간천 인 아수라소응공양 당지차처즉위시탑 개응공경 작례 위요 이제화향이산기처", "k": "\"수보리여, 어떤 선남자 선여인이 아침·낮·저녁으로 항하의 모래 수만큼 몸을 바쳐 보시하기를 한량없는 겁 동안 한다 해도, 어떤 사람이 이 경전을 듣고 믿는 마음으로 거스르지 않는다면 그 복이 저보다 뛰어나다. 하물며 쓰고 받아 지니고 읽고 외우고 남을 위해 풀어 말해 주는 것이겠느냐. 수보리여, 요약하면 이 경에는 생각할 수 없고 헤아릴 수 없는 끝없는 공덕이 있다. 여래는 대승의 마음을 낸 이와 최상승의 마음을 낸 이를 위해 이 경을 설한다. … 작은 법을 좋아하는 이는 나·남·중생·수명이라는 견해에 집착하여 이 경을 듣고 받아 읽고 외우고 남을 위해 풀어 주지 못한다. 수보리여, 어디든 이 경이 있는 곳은 온 세상의 하늘·사람·아수라가 공양할 곳이니, 그곳은 곧 탑이라, 모두 공경하고 절하며 돌면서 온갖 꽃과 향을 그곳에 뿌려야 한다.\"", "z": "", "e": "\"Subhuti, if good men or women gave up bodies as many as the Ganges sands in the morning, at noon and in the evening, for countless eons, yet another hears this sutra with faith and without resistance — that merit surpasses theirs, how much more copying, keeping, reading, reciting and explaining it. In short, this sutra has inconceivable, immeasurable, boundless merit. The Tathagata teaches it for those who set out on the Great Vehicle, the Supreme Vehicle… Those who delight in lesser teachings, attached to views of self, person, being and life-span, cannot hear, keep, read, recite or explain it. Wherever this sutra is, gods, humans and asuras should make offerings; that place is a stupa, to be revered, bowed to, circled, and strewn with flowers and incense.\"", "w": ["대승"], "ti": "제15분 지경공덕분 — 경을 지니는 공덕", "th": "持經功德分"}, {"h": "復次 須菩提 善男子 善女人受持 讀誦此經 若爲人輕賤 是人先世罪業應墮惡道 以今世人輕賤故 先世罪業則爲消滅 當得阿耨多羅三藐三菩提 須菩提 我念過去無量阿僧祇劫 於然燈佛前 得值八百四千萬億那由他諸佛 悉皆供養承事 無空過者 若復有人 於後末世 能受持 讀誦此經 所得功德 於我所供養諸佛功德 百分不及一 千萬億分乃至算數 譬喻所不能及 須菩提 若善男子 善女人於後末世 有受持 讀誦此經所得功德 我若具說者 或有人聞 心則狂亂 狐疑不信 須菩提 當知是經義不可思議 果報亦不可思議", "r": "부차 수보리 선남자 선녀인수지 독송차경 약위인경천 시인선세죄업응타악도 이금세인경천고 선세죄업즉위소멸 당득아뇩다라삼먁삼보리 수보리 아념과거무량아승기겁 어연등불전 득치팔백사천만억나유타제불 실개공양승사 무공과자 약부유인 어후말세 능수지 독송차경 소득공덕 어아소공양제불공덕 백분불급일 천만억분내지산수 비유소불능급 수보리 약선남자 선녀인어후말세 유수지 독송차경소득공덕 아약구설자 혹유인문 심즉광란 호의불신 수보리 당지시경의불가사의 과보역불가사의", "k": "\"또 수보리여, 선남자 선여인이 이 경을 받아 지니고 읽고 외우는데도 남에게 업신여김을 당한다면, 이 사람은 전생의 죄업으로 마땅히 악도에 떨어질 것이었으나, 이번 생에 남의 업신여김을 받음으로써 전생의 죄업이 소멸되고 위없는 깨달음을 얻으리라. 수보리여, 내가 지난 한량없는 아승기겁을 생각하니, 연등부처님을 뵙기 전에 8백4천만억 나유타의 부처님을 만나 모두 공양하고 섬기어 헛되이 지나친 적이 없었다. 그러나 어떤 사람이 말세에 이 경을 받아 지니고 읽고 외워 얻는 공덕에 비하면, 내가 부처님들께 공양한 공덕은 백분의 일, 천만억분의 일에도 미치지 못하며, 어떤 숫자나 비유로도 미칠 수 없다. … 이 경의 뜻은 생각할 수 없고, 그 과보도 생각할 수 없다.\"", "z": "억울하게 업신여김을 받는 것도 전생의 업을 녹이는 기회라는 위로의 말씀입니다.", "e": "\"Moreover, Subhuti, if good men or women who keep, read and recite this sutra are despised by others, it is because their past karma should have sent them to evil realms; by being despised in this life, that past karma is extinguished and they will attain supreme awakening. Subhuti, I recall countless eons ago, before Di
