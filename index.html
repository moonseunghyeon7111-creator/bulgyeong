채 백 년을 사는 것보다, 지혜를 갖추고 선정에 든 채 하루를 사는 것이 낫다.", "z": "", "e": "Better to live a single day wise and absorbed in meditation than to live a hundred years witless and lacking immersion.", "w": ["지혜", "선정"]}, {"n": 112, "h": "Yo ca vassasataṁ jīve, kusīto hīnavīriyo; Ekāhaṁ jīvitaṁ seyyo, vīriyamārabhato daḷhaṁ.", "r": "", "k": "게으르고 노력 없이 백 년을 사는 것보다, 굳세게 노력하며 하루를 사는 것이 낫다.", "z": "", "e": "Better to live a single day energetic and strong, than to live a hundred years lazy and lacking energy.", "w": []}, {"n": 113, "h": "Yo ca vassasataṁ jīve, apassaṁ udayabbayaṁ; Ekāhaṁ jīvitaṁ seyyo, passato udayabbayaṁ.", "r": "", "k": "모든 것이 생겨나고 사라짐을 보지 못하고 백 년을 사는 것보다, 생겨나고 사라짐을 보며 하루를 사는 것이 낫다.", "z": "", "e": "Better to live a single day seeing rise and fall than to live a hundred years blind to rise and fall.", "w": ["무상"]}, {"n": 114, "h": "Yo ca vassasataṁ jīve, apassaṁ amataṁ padaṁ; Ekāhaṁ jīvitaṁ seyyo, passato amataṁ padaṁ.", "r": "", "k": "죽음 없는 경지를 보지 못하고 백 년을 사는 것보다, 죽음 없는 경지를 보며 하루를 사는 것이 낫다.", "z": "", "e": "Better to live a single day seeing the state free of death than to live a hundred years blind to the state free of death.", "w": ["열반"]}, {"n": 115, "h": "Yo ca vassasataṁ jīve, apassaṁ dhammamuttamaṁ; Ekāhaṁ jīvitaṁ seyyo, passato dhammamuttamaṁ.", "r": "", "k": "가장 높은 진리를 보지 못하고 백 년을 사는 것보다, 가장 높은 진리를 보며 하루를 사는 것이 낫다.", "z": "", "e": "Better to live a single day seeing the supreme teaching than to live a hundred years blind to the supreme teaching.", "w": []}], "soon": false}, {"id": "d9", "t": "제9품 악행품", "te": "Ch. 9: Wickedness", "h": "惡行品", "by": "116~128번 게송 (13구절)", "bye": "Verses 116–128", "d": "악을 짓지 말라", "de": "Wickedness", "items": [{"n": 116, "h": "Abhittharetha kalyāṇe, pāpā cittaṁ nivāraye; Dandhañhi karoto puññaṁ, pāpasmiṁ ramatī mano.", "r": "", "k": "선한 일은 서둘러 하고, 악으로부터 마음을 지켜라. 선을 느리게 하면 마음은 악을 즐기게 된다.", "z": "좋은 일은 미루지 마세요.", "e": "Rush to do good, shield your mind from evil; for when you’re slow to do good, your thoughts delight in wickedness.", "w": []}, {"n": 117, "h": "Pāpañce puriso kayirā, Na naṁ kayirā punappunaṁ; Na tamhi chandaṁ kayirātha, Dukkho pāpassa uccayo.", "r": "", "k": "악을 저질렀다면 되풀이하지 말고, 거기에 마음을 두지 말라. 악이 쌓이면 괴로움이 된다.", "z": "", "e": "If you do something bad, don’t do it again and again, don’t set your heart on it, for piling up evil is suffering.", "w": []}, {"n": 118, "h": "Puññañce puriso kayirā, kayirā naṁ punappunaṁ; Tamhi chandaṁ kayirātha, sukho puññassa uccayo.", "r": "", "k": "선을 행했다면 되풀이하고, 거기에 마음을 두어라. 선이 쌓이면 즐거움이 된다.", "z": "", "e": "If you do something good, do it again and again, set your heart on it, for piling up goodness is joyful.", "w": []}, {"n": 119, "h": "Pāpopi passati bhadraṁ, Yāva pāpaṁ na paccati; Yadā ca paccati pāpaṁ, Atha pāpo pāpāni passati.", "r": "", "k": "악이 아직 익지 않았을 때는 악한 사람도 좋은 일을 본다. 그러나 악이 익으면 그때 악한 사람은 나쁜 일을 겪는다.", "z": "", "e": "Even the wicked see good things, so long as their wickedness has not ripened. But as soon as that wickedness ripens, then the wicked see wicked things.", "w": ["업"]}, {"n": 120, "h": "Bhadropi passati pāpaṁ, Yāva bhadraṁ na paccati; Yadā ca paccati bhadraṁ, Atha bhadro bhadrāni passati.", "r": "", "k": "선이 아직 익지 않았을 때는 착한 사람도 나쁜 일을 겪는다. 그러나 선이 익으면 그때 착한 사람은 좋은 일을 본다.", "z": "착하게 사는데 왜 힘든가? — 아직 열매가 익지 않았을 뿐입니다.", "e": "Even the good see wicked things, so long as their goodness has not ripened. But as soon as that goodness ripens, then the good see good things.", "w": ["업"]}, {"n": 121, "h": "Māvamaññetha pāpassa, na mantaṁ āgamissati; Udabindunipātena, udakumbhopi pūrati; Bālo pūrati pāpassa, thokaṁ thokampi ācinaṁ.", "r": "", "k": "\"그것쯤이야 나에게 돌아오지 않겠지\" 하며 작은 악을 가볍게 여기지 말라. 물방울이 떨어져 항아리를 채우듯, 어리석은 이는 조금씩 쌓은 악으로 가득 찬다.", "z": "", "e": "Think not lightly of evil, that it won’t come back to you. The pot is filled with water falling drop by drop; the fool is filled with wickedness piled up bit by bit.", "w": ["업"]}, {"n": 122, "h": "Māvamaññetha puññassa, na mandaṁ āgamissati; Udabindunipātena, udakumbhopi pūrati; Dhīro pūrati puññassa, thokaṁ thokampi ācinaṁ.", "r": "", "k": "\"그것쯤이야 나에게 돌아오지 않겠지\" 하며 작은 선을 가볍게 여기지 말라. 물방울이 떨어져 항아리를 채우듯, 지혜로운 이는 조금씩 쌓은 선으로 가득 찬다.", "z": "작은 선행도 쌓이면 큰 복이 됩니다.", "e": "Think not lightly of goodness, that it won’t come back to you. The pot is filled with water falling drop by drop; the attentive one is filled with goodness piled up bit by bit.", "w": ["업"]}, {"n": 123, "h": "Vāṇijova bhayaṁ maggaṁ, appasattho mahaddhano; Visaṁ jīvitukāmova, pāpāni parivajjaye.", "r": "", "k": "귀한 짐을 가졌으나 동행이 적은 상인이 위험한 길을 피하듯, 살고 싶은 이가 독을 피하듯, 악을 피하라.", "z": "", "e": "Avoid wickedness, as a merchant with rich cargo and small escort would avoid a dangerous road, or one who loves life would avoid drinking poison.", "w": []}, {"n": 124, "h": "Pāṇimhi ce vaṇo nāssa, hareyya pāṇinā visaṁ; Nābbaṇaṁ visamanveti, natthi pāpaṁ akubbato.", "r": "", "k": "손에 상처가 없으면 독을 손에 들어도 된다. 상처 없는 곳에 독은 스며들지 못한다. 악을 짓지 않는 이에게는 악이 미치지 않는다.", "z": "", "e": "You can carry poison in your hand if it has no wound, for poison does not infect without a wound; nothing bad happens unless you do bad.", "w": []}, {"n": 125, "h": "Yo appaduṭṭhassa narassa dussati, Suddhassa posassa anaṅgaṇassa; Tameva bālaṁ pacceti pāpaṁ, Sukhumo rajo paṭivātaṁva khitto.", "r": "", "k": "허물 없고 깨끗하며 티 없는 사람을 해치면, 그 악은 바람을 거슬러 던진 먼지처럼 어리석은 그 자신에게 돌아온다.", "z": "", "e": "Whoever wrongs a man who has done no wrong, a pure man who has not a blemish, the evil backfires on the fool, like fine dust thrown upwind.", "w": []}, {"n": 126, "h": "Gabbhameke uppajjanti, nirayaṁ pāpakammino; Saggaṁ sugatino yanti, parinibbanti anāsavā.", "r": "", "k": "어떤 이는 다시 태에 들어 태어나고, 악을 지은 이는 지옥에 가며, 선을 행한 이는 하늘에 가고, 번뇌 없는 이는 열반에 든다.", "z": "", "e": "Some are born in a womb; evildoers go to hell; the virtuous go to heaven; the undefiled are fully extinguished.", "w": ["윤회", "열반"]}, {"n": 127, "h": "Na antalikkhe na samuddamajjhe, Na pabbatānaṁ vivaraṁ pavissa; Na vijjatī so jagatippadeso, Yatthaṭṭhito mucceyya pāpakammā.", "r": "", "k": "하늘에도 바다 한가운데에도 산속 동굴에도, 악업에서 벗어날 수 있는 곳은 이 세상 어디에도 없다.", "z": "", "e": "Not in midair, nor mid-ocean, nor hiding in a mountain cleft; you’ll find no place on the planet to escape your wicked deeds.", "w": ["업"]}, {"n": 128, "h": "Na antalikkhe na samuddamajjhe, Na pabbatānaṁ vivaraṁ pavissa; Na vijjatī so jagatippadeso, Yatthaṭṭhitaṁ nappasaheyya maccu.", "r": "", "k": "하늘에도 바다 한가운데에도 산속 동굴에도, 죽음에 정복되지 않을 곳은 이 세상 어디에도 없다.", "z": "", "e": "Not in midair, nor mid-ocean, nor hiding in a mountain cleft; you’ll find no place on the planet where you won’t be vanquished by death.", "w": ["무상"]}], "soon": false}, {"id": "d10", "t": "제10품 도장품", "te": "Ch. 10: The Rod", "h": "刀杖品", "by": "129~145번 게송 (17구절)", "bye": "Verses 129–145", "d": "폭력을 쓰지 말라", "de": "The Rod", "items": [{"n": 129, "h": "Sabbe tasanti daṇḍassa, sabbe bhāyanti maccuno; Attānaṁ upamaṁ katvā, na haneyya na ghātaye.", "r": "", "k": "모든 존재는 몽둥이를 두려워하고 모두가 죽음을 무서워한다. 자기를 견주어 남을 헤아려, 죽이지도 말고 죽이게 하지도 말라.", "z": "\"내가 싫은 것은 남도 싫다\" — 불살생(죽이지 않음)의 근본 이유입니다.", "e": "All tremble at the rod, all fear death. Treating others like oneself, neither kill nor incite to kill.", "w": ["오계"]}, {"n": 130, "h": "Sabbe tasanti daṇḍassa, sabbesaṁ jīvitaṁ piyaṁ; Attānaṁ upamaṁ katvā, na haneyya na ghātaye.", "r": "", "k": "모든 존재는 몽둥이를 두려워하고 모두가 삶을 사랑한다. 자기를 견주어 남을 헤아려, 죽이지도 말고 죽이게 하지도 말라.", "z": "", "e": "All tremble at the rod, all love life. Treating others like oneself, neither kill nor incite to kill.", "w": ["오계"]}, {"n": 131, "h": "Sukhakāmāni bhūtāni, yo daṇḍena vihiṁsati; Attano sukhamesāno, pecca so na labhate sukhaṁ.", "r": "", "k": "행복을 바라는 생명들을 자기 행복을 위해 몽둥이로 해치는 이는 죽은 뒤에 행복을 얻지 못한다.", "z": "", "e": "Creatures love happiness, so if you harm them with a stick in search of your own happiness, after death you won’t find happiness.", "w": []}, {"n": 132, "h": "Sukhakāmāni bhūtāni, yo daṇḍena na hiṁsati; Attano sukhamesāno, pecca so labhate sukhaṁ.", "r": "", "k": "행복을 바라는 생명들을 자기 행복을 위해 해치지 않는 이는 죽은 뒤에 행복을 얻는다.", "z": "", "e": "Creatures love happiness, so if you don’t harm them with a stick in search of your own happiness, after death you will find happiness.", "w": []}, {"n": 133, "h": "Māvoca pharusaṁ kañci, vuttā paṭivadeyyu taṁ; Dukkhā hi sārambhakathā, paṭidaṇḍā phuseyyu taṁ.", "r": "", "k": "누구에게도 거친 말을 하지 말라. 그 말은 너에게 되돌아온다. 성난 말은 괴로움을 낳고, 보복이 너에게 닿으리라.", "z": "", "e": "Don’t speak harshly, they may speak harshly back. For aggressive speech is painful, and the rod may spring back on you.", "w": []}, {"n": 134, "h": "Sace neresi attānaṁ, kaṁso upahato yathā; Esa pattosi nibbānaṁ, sārambho te na vijjati.", "r": "", "k": "깨진 징처럼 소리 내지 않고 고요히 있으면, 너는 이미 열반에 이른 것이다. 너에게는 다툼이 없다.", "z": "욕을 들어도 깨진 징처럼 울리지 않으면 다툼이 생기지 않습니다.", "e": "If you still yourself like a broken gong, you reach extinguishment and know no conflict.", "w": ["열반"]}, {"n": 135, "h": "Yathā daṇḍena gopālo, gāvo pājeti gocaraṁ; Evaṁ jarā ca maccu ca, āyuṁ pājenti pāṇinaṁ.", "r": "", "k": "목동이 막대기로 소들을 목장으로 몰고 가듯, 늙음과 죽음이 생명들의 목숨을 몰고 간다.", "z": "", "e": "As a cowherd drives the cows to pasture with the rod, so too old age and death drive life from living beings.", "w": ["무상"]}, {"n": 136, "h": "Atha pāpāni kammāni, karaṁ bālo na bujjhati; Sehi kammehi dummedho, aggidaḍḍhova tappati.", "r": "", "k": "어리석은 이는 악을 저지르면서도 그것을 모른다. 그 어리석은 이는 자기가 지은 업 때문에 불에 덴 듯 괴로워한다.", "z": "", "e": "The fool does not understand the evil that they do. But because of those deeds, that simpleton is tormented as if burnt by fire.", "w": ["업"]}, {"n": 137, "h": "Yo daṇḍena adaṇḍesu, appaduṭṭhesu dussati; Dasannamaññataraṁ ṭhānaṁ, khippameva nigacchati.", "r": "", "k": "해치지 않는 순한 이들을 몽둥이로 해치는 이는, 곧 열 가지 불행 가운데 하나를 만난다.", "z": "137~140절은 한 문장으로 이어집니다.", "e": "One who violently attacks the peaceful and the innocent swiftly falls to one of ten bad states:", "w": []}, {"n": 138, "h": "Vedanaṁ pharusaṁ jāniṁ, sarīrassa va bhedanaṁ; Garukaṁ vāpi ābādhaṁ, cittakkhepaṁ va pāpuṇe.", "r": "", "k": "혹독한 고통, 재산의 손실, 몸의 상해, 무거운 병, 또는 마음의 혼란,", "z": "", "e": "harsh pain; loss; the breakup of the body; serious illness; mental distress;", "w": []}, {"n": 139, "h": "Rājato vā upasaggaṁ, Abbhakkhānaṁ va dāruṇaṁ; Parikkhayaṁ va ñātīnaṁ, Bhogānaṁ va pabhaṅguraṁ.", "r": "", "k": "왕으로부터의 재앙, 무서운 모함, 친척을 잃음, 재산이 사라짐,", "z": "", "e": "hazards from rulers; vicious slander; loss of kin; destruction of wealth;", "w": []}, {"n": 140, "h": "Atha vāssa agārāni, aggi ḍahati pāvako; Kāyassa bhedā duppañño, nirayaṁ sopapajjati.", "r": "", "k": "또는 그의 집이 불에 타 버린다. 그리고 몸이 무너진 뒤 그 어리석은 이는 지옥에 태어난다.", "z": "", "e": "or else their home is consumed by fire. When their body breaks up, that witless person is reborn in hell.", "w": []}, {"n": 141, "h": "Na naggacariyā na jaṭā na paṅkā, Nānāsakā thaṇḍilasāyikā vā; Rajojallaṁ ukkuṭikappadhānaṁ, Sodhenti maccaṁ avitiṇṇakaṅkhaṁ.", "r": "", "k": "벌거벗거나 머리를 땋거나 몸에 진흙을 바르거나 굶거나 맨땅에 눕거나 먼지를 뒤집어쓰거나 쭈그려 앉는 고행도, 의심을 넘어서지 못한 사람을 깨끗하게 하지 못한다.", "z": "겉으로 하는 고행보다 마음을 닦는 것이 중요합니다.", "e": "Not nudity, nor matted hair, nor mud, nor fasting, nor lying on bare ground, nor wearing dust and dirt, or squatting on the heels, will cleanse a mortal not free of doubt.", "w": []}, {"n": 142, "h": "Alaṅkato cepi samaṁ careyya, Santo danto niyato brahmacārī; Sabbesu bhūtesu nidhāya daṇḍaṁ, So brāhmaṇo so samaṇo sa bhikkhu.", "r": "", "k": "비록 잘 차려입었더라도 고요하고 길들여지고 절제하며 청정한 삶을 살고, 모든 생명에게 폭력을 내려놓은 사람 — 그가 바라문이요, 사문이요, 비구다.", "z": "", "e": "Dressed up they may be, but if they live well— peaceful, tamed, committed to the spiritual path, having laid aside violence toward all creatures— they are a brahmin, an ascetic, a mendicant.", "w": ["비구", "바라문"]}, {"n": 143, "h": "Hirīnisedho puriso, koci lokasmi vijjati; Yo niddaṁ apabodheti, asso bhadro kasāmiva.", "r": "", "k": "좋은 말이 채찍을 피하듯, 스스로 부끄러워할 줄 알아 비난을 피하는 사람이 이 세상에 있는가?", "z": "", "e": "Can a person constrained by conscience be found in the world? Who shies away from blame, like a fine horse from the whip?", "w": []}, {"n": 144, "h": "Asso yathā bhadro kasāniviṭṭho, Ātāpino saṁvegino bhavātha; Saddhāya sīlena ca vīriyena ca, Samādhinā dhammavinicchayena ca; Sampannavijjācaraṇā patissatā, Jahissatha dukkhamidaṁ anappakaṁ.", "r": "", "k": "채찍을 맞은 좋은 말처럼 열심히 정진하라. 믿음과 계행과 노력과 선정과 진리의 탐구로, 지혜와 실천을 갖추고 마음챙겨 이 큰 괴로움을 버려라.", "z": "", "e": "Like a fine horse under the whip, be keen and full of urgency. With faith, ethics, and energy, immersion, and investigation of principles, accomplished in knowledge and conduct, mindful, give up this vast suffering.", "w": ["계행", "선정"]}, {"n": 145, "h": "Udakañhi nayanti nettikā, Usukārā namayanti tejanaṁ; Dāruṁ namayanti tacchakā, Attānaṁ damayanti subbatā.", "r": "", "k": "물 대는 이는 물길을 내고, 화살 만드는 이는 화살을 곧게 하며, 목수는 나무를 다듬고, 계행을 지키는 이는 자신을 다스린다.", "z": "", "e": "While irrigators guide water, fletchers bend arrows straight, and carpenters bend timber straight, those true to their vows tame themselves.", "w": []}], "soon": false}, {"id": "d11", "t": "제11품 노모품", "te": "Ch. 11: Old Age", "h": "老耗品", "by": "146~156번 게송 (11구절)", "bye": "Verses 146–156", "d": "늙음과 덧없음", "de": "Old Age", "items": [{"n": 146, "h": "Ko nu hāso kimānando, niccaṁ pajjalite sati; Andhakārena onaddhā, padīpaṁ na gavesatha.", "r": "", "k": "세상이 늘 불타고 있는데 무엇이 즐겁고 무엇이 우스운가? 어둠에 싸여 있으면서 왜 등불을 찾지 않는가?", "z": "", "e": "What is joy, what is laughter, when the flames are ever burning? Swathed in darkness, would you not seek a light?", "w": ["무명"]}, {"n": 147, "h": "Passa cittakataṁ bimbaṁ, arukāyaṁ samussitaṁ; Āturaṁ bahusaṅkappaṁ, yassa natthi dhuvaṁ ṭhiti.", "r": "", "k": "보라, 이 꾸며진 몸을. 상처투성이로 이루어지고, 병들고, 온갖 생각이 들끓으며, 영원하거나 굳건한 것이 하나도 없다.", "z": "", "e": "See this fancy puppet, a body built of sores, diseased, obsessed over, in which nothing lasts at all.", "w": ["무상"]}, {"n": 148, "h": "Parijiṇṇamidaṁ rūpaṁ, roganīḷaṁ pabhaṅguraṁ; Bhijjati pūtisandeho, maraṇantañhi jīvitaṁ.", "r": "", "k": "이 몸은 늙고 쇠약하며 병의 둥지이고 부서지기 쉽다. 썩은 몸은 무너지니, 삶은 죽음으로 끝나기 때문이다.", "z": "", "e": "This body is decrepit and frail, a nest of disease. This foul carcass falls apart, for life ends in death.", "w": ["무상"]}, {"n": 149, "h": "Yānimāni apatthāni, alābūneva sārade; Kāpotakāni aṭṭhīni, tāni disvāna kā rati.", "r": "", "k": "가을에 버려진 박처럼, 잿빛 뼈들이 흩어져 있다. 이것을 보고 무엇을 즐거워하랴.", "z": "", "e": "These dove-grey bones are tossed away like dried gourds in the autumn— what joy is there in such a sight?", "w": []}, {"n": 150, "h": "Aṭṭhīnaṁ nagaraṁ kataṁ, maṁsalohitalepanaṁ; Yattha jarā ca maccu ca, māno makkho ca ohito.", "r": "", "k": "뼈로 성을 쌓고 살과 피를 바른 이 몸 안에, 늙음과 죽음, 교만과 위선이 숨어 있다.", "z": "", "e": "In this city built of bones, plastered with flesh and blood, old age and death are stashed away, along with conceit and contempt.", "w": ["아만"]}, {"n": 151, "h": "Jīranti ve rājarathā sucittā, Atho sarīrampi jaraṁ upeti; Satañca dhammo na jaraṁ upeti, Santo have sabbhi pavedayanti.", "r": "", "k": "화려하게 꾸민 왕의 수레도 낡고, 이 몸 또한 늙는다. 그러나 선한 이들의 진리는 늙지 않으니, 선한 이들이 선한 이들에게 전한다.", "z": "", "e": "Fancy chariots of kings wear out, and even this body gets old. But the truth of the good never gets old— so the good proclaim to the good.", "w": []}, {"n": 152, "h": "Appassutāyaṁ puriso, balībaddhova jīrati; Maṁsāni tassa vaḍḍhanti, paññā tassa na vaḍḍhati.", "r": "", "k": "배움이 적은 사람은 황소처럼 늙는다. 그의 살은 늘어나지만 지혜는 늘지 않는다.", "z": "나이를 먹는 것보다 지혜가 자라는 것이 중요합니다.", "e": "A person of little learning ages like an ox— their flesh grows, but not their wisdom.", "w": []}, {"n": 153, "h": "Anekajātisaṁsāraṁ, sandhāvissaṁ anibbisaṁ; Gahakāraṁ gavesanto, dukkhā jāti punappunaṁ.", "r": "", "k": "수많은 생을 윤회하며 집 짓는 이를 찾아 헤맸으나 찾지 못했다. 거듭 태어남은 괴로움이다.", "z": "153~154절은 부처님께서 깨달음을 이루신 순간 읊으신 노래로 전해집니다.", "e": "Transmigrating through countless rebirths, I’ve journeyed without reward, searching for the house-builder; painful is birth again and again.", "w": ["윤회"]}, {"n": 154, "h": "Gahakāraka diṭṭhosi, puna gehaṁ na kāhasi; Sabbā te phāsukā bhaggā, gahakūṭaṁ visaṅkhataṁ; Visaṅkhāragataṁ cittaṁ, taṇhānaṁ khayamajjhagā.", "r": "", "k": "집 짓는 이여, 이제 너를 보았다! 너는 다시 집을 짓지 못하리라. 서까래는 모두 부러지고 대들보는 무너졌다. 마음은 열반에 이르렀고, 갈애는 다했다.", "z": "\"집 짓는 이\"는 갈애(욕망)이고 \"집\"은 이 몸과 윤회입니다.", "e": "I’ve seen you, house-builder! You won’t build a house again! Your rafters are all broken, your roof-peak demolished. The mind, set on demolition, has reached the end of cravings.", "w": ["갈애", "열반"]}, {"n": 155, "h": "Acaritvā brahmacariyaṁ, aladdhā yobbane dhanaṁ; Jiṇṇakoñcāva jhāyanti, khīṇamaccheva pallale.", "r": "", "k": "젊어서 청정한 삶을 살지 않고 재산도 모으지 못한 이들은, 고기 없는 연못가의 늙은 백로처럼 시들어 간다.", "z": "", "e": "When young they spurned the spiritual path and failed to earn any wealth. Now they brood like old cranes in a pond bereft of fish.", "w": []}, {"n": 156, "h": "Acaritvā brahmacariyaṁ, aladdhā yobbane dhanaṁ; Senti cāpātikhīṇāva, purāṇāni anutthunaṁ.", "r": "", "k": "젊어서 청정한 삶을 살지 않고 재산도 모으지 못한 이들은, 다 쏘아 버린 화살처럼 누워 지난날을 한탄한다.", "z": "젊을 때 공부하고 바르게 살라는 말씀입니다.", "e": "When young they spurned the spiritual path and failed to earn any wealth. Now they lie like spent arrows, bemoaning over things past.", "w": []}], "soon": false}, {"id": "d12", "t": "제12품 기신품", "te": "Ch. 12: The Self", "h": "己身品", "by": "157~166번 게송 (10구절)", "bye": "Verses 157–166", "d": "자기 자신", "de": "The Self", "items": [{"n": 157, "h": "Attānañce piyaṁ jaññā, rakkheyya naṁ surakkhitaṁ; Tiṇṇaṁ aññataraṁ yāmaṁ, paṭijaggeyya paṇḍito.", "r": "", "k": "자기를 사랑한다면 자기를 잘 지켜야 한다. 지혜로운 이는 인생의 세 시기 가운데 한 번은 깨어 있어야 한다.", "z": "", "e": "If you knew your self as beloved, you’d look after it so well. In one of the night’s three watches, an astute person would remain alert.", "w": []}, {"n": 158, "h": "Attānameva paṭhamaṁ, patirūpe nivesaye; Athaññamanusāseyya, na kilisseyya paṇḍito.", "r": "", "k": "먼저 자신을 바르게 세우고 그다음에 남을 가르쳐라. 그러면 지혜로운 이는 허물을 입지 않는다.", "z": "", "e": "The astute would avoid being corrupted by first grounding themselves in what is suitable, and then instructing others.", "w": []}, {"n": 159, "h": "Attānañce tathā kayirā, yathāññamanusāsati; Sudanto vata dametha, attā hi kira duddamo.", "r": "", "k": "남에게 가르치는 대로 자신도 그렇게 행하라. 자신을 잘 다스리는 이가 남도 다스릴 수 있다. 자기를 다스리기가 참으로 어렵다.", "z": "", "e": "If one were to treat oneself as one instructs another, the well-tamed indeed would tame: for the self, it seems, is hard to tame.", "w": []}, {"n": 160, "h": "Attā hi attano nātho, ko hi nātho paro siyā; Attanā hi sudantena, nāthaṁ labhati dullabhaṁ.", "r": "", "k": "자기야말로 자기의 주인이다. 누가 달리 주인이 되겠는가? 자기를 잘 다스리면 얻기 어려운 주인을 얻는다.", "z": "내 삶의 주인은 바로 나 자신입니다.", "e": "One is indeed the lord of oneself, for who else would be one’s lord? By means of a well-tamed self, one gains a lord that’s rare indeed.", "w": []}, {"n": 161, "h": "Attanā hi kataṁ pāpaṁ, Attajaṁ attasambhavaṁ; Abhimatthati dummedhaṁ, Vajiraṁvasmamayaṁ maṇiṁ.", "r": "", "k": "자기가 짓고 자기에게서 생겨나고 자기에게서 자란 악이, 금강석이 보석을 부수듯 어리석은 이를 부순다.", "z": "", "e": "For the evil that is done by oneself, born and produced in oneself, grinds down a simpleton, as diamond grinds a lesser gem.", "w": ["업"]}, {"n": 162, "h": "Yassa accantadussilyaṁ, māluvā sālamivotthataṁ; Karoti so tathattānaṁ, yathā naṁ icchatī diso.", "r": "", "k": "덩굴이 살라나무를 휘감아 말려 죽이듯, 계행이 없는 이는 원수가 바라는 대로 자기 자신을 망친다.", "z": "", "e": "One choked by immorality, as a sal tree by a creeper, does to themselves what a foe only wishes.", "w": ["계행"]}, {"n": 163, "h": "Sukarāni asādhūni, attano ahitāni ca; Yaṁ ve hitañca sādhuñca, taṁ ve paramadukkaraṁ.", "r": "", "k": "자기에게 해롭고 나쁜 일은 하기 쉽고, 이롭고 좋은 일은 참으로 하기 어렵다.", "z": "", "e": "It’s easy to do bad things harmful to oneself, but good things that are helpful are the hardest things to do.", "w": []}, {"n": 164, "h": "Yo sāsanaṁ arahataṁ, ariyānaṁ dhammajīvinaṁ; Paṭikkosati dummedho, diṭṭhiṁ nissāya pāpikaṁ; Phalāni kaṭṭhakasseva, attaghātāya phallati.", "r": "", "k": "그릇된 견해 때문에 바르게 사는 아라한과 성자들의 가르침을 비웃는 어리석은 이는, 열매를 맺고 죽는 대나무처럼 스스로 파멸을 부른다.", "z": "", "e": "On account of wicked views— scorning the guidance of the perfected ones, the noble ones living righteously— the idiot begets their own self’s demise, like the bamboo bearing fruit.", "w": ["아라한"]}, {"n": 165, "h": "Attanā hi kataṁ pāpaṁ, attanā saṅkilissati; Attanā akataṁ pāpaṁ, attanāva visujjhati; Suddhī asuddhi paccattaṁ, nāñño aññaṁ visodhaye.", "r": "", "k": "자기가 악을 지어 자기가 더럽혀지고, 자기가 악을 짓지 않아 자기가 깨끗해진다. 깨끗함과 더러움은 각자에게 달린 것이니, 누구도 남을 깨끗하게 할 수 없다.", "z": "나를 깨끗하게 할 수 있는 사람은 오직 나뿐입니다.", "e": "For it is by oneself that evil’s done, one is corrupted by oneself. It’s by oneself that evil’s not done, one is purified by oneself. Purity and impurity are personal matters, no one can purify another.", "w": []}, {"n": 166, "h": "Attadatthaṁ paratthena, bahunāpi na hāpaye; Attadatthamabhiññāya, sadatthapasuto siyā.", "r": "", "k": "남의 일이 아무리 크더라도 그 때문에 자신의 참된 이익(수행)을 버리지 말라. 자신의 참된 이익을 잘 알아 그것에 전념하라.", "z": "", "e": "Never neglect what is good for yourself for the sake of another, however great. Knowing well what is good for yourself, be intent upon your heart’s goal.", "w": []}], "soon": false}, {"id": "d13", "t": "제13품 세속품", "te": "Ch. 13: The World", "h": "世俗品", "by": "167~178번 게송 (12구절)", "bye": "Verses 167–178", "d": "세상", "de": "The World", "items": [{"n": 167, "h": "Hīnaṁ dhammaṁ na seveyya, pamādena na saṁvase; Micchādiṭṭhiṁ na seveyya, na siyā lokavaḍḍhano.", "r": "", "k": "저열한 것을 따르지 말고, 게으르게 살지 말며, 그릇된 견해를 따르지 말고, 윤회를 늘리지 말라.", "z": "", "e": "Don’t resort to lowly things, don’t abide in negligence, don’t resort to wrong views, don’t perpetuate the world.", "w": ["윤회"]}, {"n": 168, "h": "Uttiṭṭhe nappamajjeyya, dhammaṁ sucaritaṁ care; Dhammacārī sukhaṁ seti, asmiṁ loke paramhi ca.", "r": "", "k": "일어나라! 게으르지 말라. 바른 법을 따라 살아라. 바르게 사는 이는 이 세상에서도 저 세상에서도 편히 잠든다.", "z": "", "e": "Get up, don’t be heedless, live by principle, with good conduct. For one of good conduct sleeps at ease, in this world and the next.", "w": ["불방일"]}, {"n": 169, "h": "Dhammaṁ care sucaritaṁ, na naṁ duccaritaṁ care; Dhammacārī sukhaṁ seti, asmiṁ loke paramhi ca.", "r": "", "k": "바른 법을 따라 살고 그릇되게 살지 말라. 바르게 사는 이는 이 세상에서도 저 세상에서도 편히 잠든다.", "z": "", "e": "Live by principle, with good conduct, don’t conduct yourself badly. For one of good conduct sleeps at ease, in this world and the next.", "w": []}, {"n": 170, "h": "Yathā pubbuḷakaṁ passe, yathā passe marīcikaṁ; Evaṁ lokaṁ avekkhantaṁ, maccurājā na passati.", "r": "", "k": "세상을 물거품처럼 보고 아지랑이처럼 보라. 그렇게 보는 이를 죽음의 왕은 보지 못한다.", "z": "", "e": "Look upon the world as a bubble or a mirage, then the King of Death won’t see you.", "w": ["무상"]}, {"n": 171, "h": "Etha passathimaṁ lokaṁ, cittaṁ rājarathūpamaṁ; Yattha bālā visīdanti, natthi saṅgo vijānataṁ.", "r": "", "k": "와서 보라, 왕의 수레처럼 화려하게 꾸민 이 세상을. 어리석은 이들은 거기에 빠지지만, 아는 이들은 집착하지 않는다.", "z": "", "e": "Come, see this world decked out like a fancy royal chariot. Here fools founder, but the discerning are not chained.", "w": []}, {"n": 172, "h": "Yo ca pubbe pamajjitvā, pacchā so nappamajjati; Somaṁ lokaṁ pabhāseti, abbhā muttova candimā.", "r": "", "k": "전에는 게을렀어도 뒤에 게으르지 않은 이는, 구름에서 벗어난 달처럼 이 세상을 비춘다.", "z": "늦었다고 생각할 때가 가장 빠를 때입니다.", "e": "He who once was heedless, but turned to heedfulness, shines upon this world like the moon freed from clouds.", "w": ["불방일"]}, {"n": 173, "h": "Yassa pāpaṁ kataṁ kammaṁ, kusalena pidhīyati; Somaṁ lokaṁ pabhāseti, abbhā muttova candimā.", "r": "", "k": "지난날 지은 악을 선으로 덮는 이는, 구름에서 벗어난 달처럼 이 세상을 비춘다.", "z": "", "e": "Someone whose bad deed is supplanted by the good, shines upon this world, like the moon freed from clouds.", "w": []}, {"n": 174, "h": "Andhabhūto ayaṁ loko, tanukettha vipassati; Sakuṇo jālamuttova, appo saggāya gacchati.", "r": "", "k": "이 세상은 눈이 멀어 바르게 보는 이가 드물다. 그물에서 벗어난 새처럼 하늘에 이르는 이는 적다.", "z": "", "e": "Blind is the world, few are those who clearly see. Only a handful go to heaven, like a bird freed from a net.", "w": []}, {"n": 175, "h": "Haṁsādiccapathe yanti, ākāse yanti iddhiyā; Nīyanti dhīrā lokamhā, jetvā māraṁ savāhiniṁ.", "r": "", "k": "백조는 해의 길로 날고, 신통력 있는 이는 허공을 날며, 지혜로운 이는 마라와 그 군대를 이기고 세상을 벗어난다.", "z": "", "e": "Swans fly by the sun’s path, psychic sages fly through space. The attentive leave the world, having vanquished Māra with his legions.", "w": ["마라"]}, {"n": 176, "h": "Ekaṁ dhammaṁ atītassa, musāvādissa jantuno; Vitiṇṇaparalokassa, natthi pāpaṁ akāriyaṁ.", "r": "", "k": "단 하나의 법, 진실을 어기고 거짓말을 하며 저 세상을 무시하는 사람이 짓지 못할 악은 없다.", "z": "거짓말은 모든 악의 문을 엽니다.", "e": "When a personage, spurning the hereafter, transgresses in just one thing— lying— there is no evil they would not do.", "w": ["오계"]}, {"n": 177, "h": "Na ve kadariyā devalokaṁ vajanti, Bālā have nappasaṁsanti dānaṁ; Dhīro ca dānaṁ anumodamāno, Teneva so hoti sukhī parattha.", "r": "", "k": "인색한 이는 하늘나라에 가지 못하고, 어리석은 이는 베풂을 칭찬하지 않는다. 지혜로운 이는 베풂을 기뻐하여 저 세상에서 행복해진다.", "z": "", "e": "The miserly don’t ascend to heaven, it takes a fool to not praise giving. The attentive celebrate giving, and so find happiness in the hereafter.", "w": []}, {"n": 178, "h": "Pathabyā ekarajjena, saggassa gamanena vā; Sabbalokādhipaccena, sotāpattiphalaṁ varaṁ.", "r": "", "k": "온 땅의 유일한 왕이 되는 것보다, 하늘나라에 가는 것보다, 온 세상을 다스리는 것보다, 깨달음의 흐름에 들어선 결실(수다원과)이 더 낫다.", "z": "", "e": "The fruit of stream-entry is better than being the one king of the earth, than going to heaven, than lordship over all the world.", "w": ["수다원"]}], "soon": false}, {"id": "d14", "t": "제14품 불타품", "te": "Ch. 14: The Buddhas", "h": "佛陀品", "by": "179~196번 게송 (18구절)", "bye": "Verses 179–196", "d": "부처님", "de": "The Buddhas", "items": [{"n": 179, "h": "Yassa jitaṁ nāvajīyati, Jitaṁ yassa noyāti koci loke; Taṁ buddhamanantagocaraṁ, Apadaṁ kena padena nessatha.", "r": "", "k": "그의 승리는 아무도 되돌릴 수 없고, 이 세상 누구도 그 승리에 미치지 못한다. 끝없는 경지에 이르러 자취가 없는 부처님을 어떤 길로 이끌 수 있겠는가?", "z": "", "e": "He whose victory may not be undone, a victory unrivaled in all the world; by what track would you trace that Buddha, who leaves no track in his infinite range?", "w": ["부처"]}, {"n": 180, "h": "Yassa jālinī visattikā, Taṇhā natthi kuhiñci netave; Taṁ buddhamanantagocaraṁ, Apadaṁ kena padena nessatha.", "r": "", "k": "얽어매고 끌고 다니는 갈애가 조금도 남아 있지 않은 이, 끝없는 경지에 이르러 자취가 없는 부처님을 어떤 길로 이끌 수 있겠는가?", "z": "", "e": "Of craving, the weaver, the clinger, he has none: so where can he be traced? By what track would you trace that Buddha, who leaves no track in his infinite range?", "w": ["갈애", "부처"]}, {"n": 181, "h": "Ye jhānapasutā dhīrā, nekkhammūpasame ratā; Devāpi tesaṁ pihayanti, sambuddhānaṁ satīmataṁ.", "r": "", "k": "선정에 힘쓰고 출가의 고요함을 즐기며 늘 마음챙기는 지혜로운 깨달은 이들은 신들조차 부러워한다.", "z": "", "e": "The attentive intent on absorption, who love the peace of renunciation, the Buddhas, ever mindful, are envied by even the gods.", "w": ["선정"]}, {"n": 182, "h": "Kiccho manussapaṭilābho, kicchaṁ maccāna jīvitaṁ; Kicchaṁ saddhammassavanaṁ, kiccho buddhānamuppādo.", "r": "", "k": "사람으로 태어나기 어렵고, 사람으로 살아가기 어렵고, 바른 진리를 듣기 어렵고, 부처님이 세상에 오시기는 더욱 어렵다.", "z": "지금 사람으로 태어나 가르침을 만난 것이 얼마나 귀한 인연인지 일깨워 주는 말씀입니다.", "e": "It’s hard to gain a human birth; the life of mortals is hard; it’s hard to hear the true teaching; the arising of Buddhas is hard.", "w": ["부처"]}, {"n": 183, "h": "Sabbapāpassa akaraṇaṁ, kusalassa upasampadā; Sacittapariyodapanaṁ, etaṁ buddhāna sāsanaṁ.", "r": "", "k": "모든 악을 짓지 말고, 모든 선을 받들어 행하며, 스스로 그 마음을 깨끗이 하라. 이것이 모든 부처님의 가르침이다.", "z": "\"제악막작 중선봉행 자정기의 시제불교(諸惡莫作 衆善奉行 自淨其意 是諸佛敎)\" — 불교 전체를 한 구절로 요약한 칠불통계게입니다.", "e": "Not to do any evil; to embrace the good; to purify one’s mind: this is the instruction of the Buddhas.", "w": ["칠불통계게"]}, {"n": 184, "h": "Khantī paramaṁ tapo titikkhā, Nibbānaṁ paramaṁ vadanti buddhā; Na hi pabbajito parūpaghātī, Na samaṇo hoti paraṁ viheṭhayanto.", "r": "", "k": "참고 견디는 것이 가장 높은 수행이고, 열반이 가장 높은 것이라고 부처님들은 말씀하신다. 남을 해치는 이는 출가자가 아니며, 남을 괴롭히는 이는 사문이 아니다.", "z": "", "e": "Patient acceptance is the ultimate fervor. Extinguishment is the ultimate, say the Buddhas. No true renunciate injures another, nor does an ascetic hurt another.", "w": ["인욕", "열반"]}, {"n": 185, "h": "Anūpavādo anūpaghāto, Pātimokkhe ca saṁvaro; Mattaññutā ca bhattasmiṁ, Pantañca sayanāsanaṁ; Adhicitte ca āyogo, Etaṁ buddhāna sāsanaṁ.", "r": "", "k": "헐뜯지 않고 해치지 않으며, 계율을 지켜 절제하고, 음식을 알맞게 먹고, 고요한 곳에 홀로 머물며, 높은 마음(선정)에 힘쓰는 것 — 이것이 모든 부처님의 가르침이다.", "z": "", "e": "Not speaking ill nor doing harm; restraint in the monastic code; moderation in eating; staying in remote lodgings; commitment to the higher mind— this is the instruction of the Buddhas.", "w": ["선정"]}, {"n": 186, "h": "Na kahāpaṇavassena, titti kāmesu vijjati; Appassādā dukhā kāmā, iti viññāya paṇḍito.", "r": "", "k": "하늘에서 금화가 비처럼 쏟아져도 욕망은 채워지지 않는다. 지혜로운 이는 욕망의 즐거움은 적고 괴로움은 크다는 것을 안다.", "z": "욕심은 아무리 채워도 바닥이 없는 항아리와 같습니다.", "e": "Even if it were raining money, you’d not be sated in sensual pleasures. An astute person understands that sensual pleasures offer little gratification and much suffering.", "w": ["탐욕"]}, {"n": 187, "h": "Api dibbesu kāmesu, ratiṁ so nādhigacchati; Taṇhakkhayarato hoti, sammāsambuddhasāvako.", "r": "", "k": "그래서 그는 하늘의 즐거움조차 즐기지 않는다. 바르게 깨달은 부처님의 제자는 갈애가 다함을 기뻐한다.", "z": "", "e": "Thus they find no delight even in celestial pleasures. A disciple of the fully awakened Buddha delights in the ending of craving.", "w": ["갈애"]}, {"n": 188, "h": "Bahuṁ ve saraṇaṁ yanti, pabbatāni vanāni ca; Ārāmarukkhacetyāni, manussā bhayatajjitā.", "r": "", "k": "두려움에 쫓긴 많은 사람들이 산과 숲, 동산과 나무와 사당을 의지처로 삼는다.", "z": "", "e": "So many go for refuge to mountains and forest groves, to shrines in tended parks; those people are driven by fear.", "w": []}, {"n": 189, "h": "Netaṁ kho saraṇaṁ khemaṁ, netaṁ saraṇamuttamaṁ; Netaṁ saraṇamāgamma, sabbadukkhā pamuccati.", "r": "", "k": "그러나 그것은 안전한 의지처가 아니며 가장 높은 의지처도 아니다. 그런 곳에 의지해서는 모든 괴로움에서 벗어나지 못한다.", "z": "", "e": "But such refuge is no sanctuary, it is no supreme refuge. By going to that refuge, you’re not released from all suffering.", "w": []}, {"n": 190, "h": "Yo ca buddhañca dhammañca, saṅghañca saraṇaṁ gato; Cattāri ariyasaccāni, sammappaññāya passati.", "r": "", "k": "부처님과 가르침과 승가에 귀의한 이는 바른 지혜로 네 가지 거룩한 진리를 본다.", "z": "190~192절: 참된 의지처는 삼보라는 가르침입니다.", "e": "One gone for refuge to the Buddha, to his teaching and to the Saṅgha, sees the four noble truths with right understanding:", "w": ["삼보", "사성제"]}, {"n": 191, "h": "Dukkhaṁ dukkhasamuppādaṁ, dukkhassa ca atikkamaṁ; Ariyaṁ caṭṭhaṅgikaṁ maggaṁ, dukkhūpasamagāminaṁ.", "r": "", "k": "괴로움과 괴로움의 원인과 괴로움의 소멸, 그리고 괴로움의 소멸로 이끄는 여덟 가지 거룩한 길이다.", "z": "", "e": "suffering, suffering’s origin, suffering’s transcendence, and the noble eightfold path that leads to the stilling of suffering.", "w": ["사성제", "팔정도"]}, {"n": 192, "h": "Etaṁ kho saraṇaṁ khemaṁ, etaṁ saraṇamuttamaṁ; Etaṁ saraṇamāgamma, sabbadukkhā pamuccati.", "r": "", "k": "이것이야말로 안전한 의지처요 가장 높은 의지처다. 이 의지처에 의지하면 모든 괴로움에서 벗어난다.", "z": "", "e": "Such refuge is a sanctuary, it is the supreme refuge. By going to that refuge, you’re released from all suffering.", "w": ["삼보"]}, {"n": 193, "h": "Dullabho purisājañño, na so sabbattha jāyati; Yattha so jāyati dhīro, taṁ kulaṁ sukhamedhati.", "r": "", "k": "훌륭한 사람(부처님)은 만나기 어렵고 아무 데서나 태어나지 않는다. 그 지혜로운 이가 태어나는 가문은 행복하게 번영한다.", "z": "", "e": "It’s hard to find a thoroughbred man: they’re not born just anywhere. A family where that attentive one is born prospers in happiness.", "w": ["부처"]}, {"n": 194, "h": "Sukho buddhānamuppādo, sukhā saddhammadesanā; Sukhā saṅghassa sāmaggī, samaggānaṁ tapo sukho.", "r": "", "k": "부처님이 오심은 행복이고, 바른 가르침을 설함은 행복이다. 승가의 화합은 행복이고, 화합한 이들의 수행은 행복이다.", "z": "", "e": "Happy, the arising of Buddhas! Happy, the teaching of Dhamma! Happy is the harmony of the Saṅgha, and the striving of the harmonious is happy.", "w": ["삼보"]}, {"n": 195, "h": "Pūjārahe pūjayato, buddhe yadi va sāvake; Papañcasamatikkante, tiṇṇasokapariddave.", "r": "", "k": "공경받을 만한 이 — 부처님이나 그 제자들, 헛된 생각을 넘어서고 슬픔과 탄식을 건넌 이들,", "z": "195~196절은 이어지는 한 문장입니다.", "e": "When a person venerates the worthy— the Buddha or his disciple, who have transcended proliferation, and have left behind grief and lamentation,", "w": []}, {"n": 196, "h": "Te tādise pūjayato, nibbute akutobhaye; Na sakkā puññaṁ saṅkhātuṁ, imettamapi kenaci.", "r": "", "k": "열반에 들어 아무것도 두려워하지 않는 그런 이들을 공경하는 공덕은, 누구도 \"이만큼이다\"라고 헤아릴 수 없다.", "z": "", "e": "quenched, fearing nothing from any quarter— the merit of one venerating such as these, cannot be calculated by anyone, saying it is just this much.", "w": ["열반"]}], "soon": false}, {"id": "d15", "t": "제15품 안락품", "te": "Ch. 15: Happiness", "h": "安樂品", "by": "197~208번 게송 (12구절)", "bye": "Verses 197–208", "d": "참된 행복", "de": "Happiness", "items": [{"n": 197, "h": "Susukhaṁ vata jīvāma, verinesu averino; Verinesu manussesu, viharāma averino.", "r": "", "k": "원망하는 이들 속에서 원망 없이, 우리는 참으로 행복하게 살자. 원망하는 사람들 속에서 원망 없이 지내자.", "z": "197~200절은 \"참된 행복\"을 노래하는 아름다운 시입니다.", "e": "Let us live so very happily, loving among the hostile. Among hostile humans, let us live with love.", "w": []}, {"n": 198, "h": "Susukhaṁ vata jīvāma, āturesu anāturā; Āturesu manussesu, viharāma anāturā.", "r": "", "k": "병든 이들 속에서 병 없이, 우리는 참으로 행복하게 살자. 병든 사람들 속에서 병 없이 지내자.", "z": "여기서 \"병\"은 번뇌라는 마음의 병을 말합니다.", "e": "Let us live so very happily, healthy among the ailing. Among ailing humans let us live healthily.", "w": ["번뇌"]}, {"n": 199, "h": "Susukhaṁ vata jīvāma, ussukesu anussukā; Ussukesu manussesu, viharāma anussukā.", "r": "", "k": "탐욕스러운 이들 속에서 탐욕 없이, 우리는 참으로 행복하게 살자. 탐욕스러운 사람들 속에서 탐욕 없이 지내자.", "z": "", "e": "Let us live so very happily, content among the greedy. Among greedy humans, let us live content.", "w": ["탐욕"]}, {"n": 200, "h": "Susukhaṁ vata jīvāma, yesaṁ no natthi kiñcanaṁ; Pītibhakkhā bhavissāma, devā ābhassarā yathā.", "r": "", "k": "가진 것 없는 우리는 참으로 행복하게 살자. 빛나는 신들처럼 기쁨을 음식으로 삼으며 지내자.", "z": "", "e": "Let us live so very happily, we who have nothing. We shall feed on rapture, like the gods of sublime luminosity.", "w": []}, {"n": 201, "h": "Jayaṁ veraṁ pasavati, dukkhaṁ seti parājito; Upasanto sukhaṁ seti, hitvā jayaparājayaṁ.", "r": "", "k": "승리는 원한을 낳고, 패한 이는 괴로워 잠 못 이룬다. 이기고 지는 것을 모두 버린 고요한 이는 편히 잠든다.", "z": "", "e": "Victory breeds enmity; the defeated sleep badly. The peaceful sleep at ease, having left victory and defeat behind.", "w": []}, {"n": 202, "h": "Natthi rāgasamo aggi, Natthi dosasamo kali; Natthi khandhasamā dukkhā, Natthi santiparaṁ sukhaṁ.", "r": "", "k": "탐욕 같은 불이 없고, 성냄 같은 죄가 없으며, 오온(몸과 마음) 같은 괴로움이 없고, 고요함보다 더 큰 행복은 없다.", "z": "", "e": "There is no fire like greed, no crime like hate, no suffering like the aggregates, no bliss beyond peace.", "w": ["탐욕", "오온"]}, {"n": 203, "h": "Jighacchāparamā rogā, saṅkhāraparamā dukhā; Etaṁ ñatvā yathābhūtaṁ, nibbānaṁ paramaṁ sukhaṁ.", "r": "", "k": "배고픔은 가장 큰 병이고, 형성된 모든 것은 가장 큰 괴로움이다. 이것을 있는 그대로 알면 열반이 가장 큰 행복이다.", "z": "", "e": "Hunger is the worst illness, conditions are the worst suffering. When one has known this as it is, extinguishment is the ultimate happiness.", "w": ["열반"]}, {"n": 204, "h": "Ārogyaparamā lābhā, Santuṭṭhiparamaṁ dhanaṁ; Vissāsaparamā ñāti, Nibbānaṁ paramaṁ sukhaṁ.", "r": "", "k": "건강은 가장 큰 이익이고, 만족은 가장 큰 재산이며, 믿음은 가장 좋은 친척이고, 열반은 가장 큰 행복이다.", "z": "\"건강이 최고의 재산, 만족이 최고의 부\" — 오늘날에도 그대로 통하는 말씀입니다.", "e": "Health is the ultimate blessing; contentment, the ultimate wealth; trust is the ultimate family; extinguishment, the ultimate happiness.", "w": ["지족", "열반"]}, {"n": 205, "h": "Pavivekarasaṁ pitvā, rasaṁ upasamassa ca; Niddaro hoti nippāpo, dhammapītirasaṁ pivaṁ.", "r": "", "k": "홀로 머무는 맛과 고요함의 맛을 맛본 이는, 두려움과 악에서 벗어나 진리의 기쁨이라는 맛을 마신다.", "z": "", "e": "Having drunk the nectar of seclusion and the nectar of peace— free of stress, free of evil, drink the joyous nectar of truth.", "w": []}, {"n": 206, "h": "Sāhu dassanamariyānaṁ, sannivāso sadā sukho; Adassanena bālānaṁ, niccameva sukhī siyā.", "r": "", "k": "성자를 만나는 것은 좋고, 함께 사는 것은 늘 행복하다. 어리석은 이를 만나지 않으면 늘 행복하리라.", "z": "", "e": "It’s good to see the noble ones, staying with them is always good. Were you not to see fools, you’d always be happy.", "w": []}, {"n": 207, "h": "Bālasaṅgatacārī hi, dīghamaddhāna socati; Dukkho bālehi saṁvāso, amitteneva sabbadā; Dhīro ca sukhasaṁvāso, ñātīnaṁva samāgamo.", "r": "", "k": "어리석은 이와 함께 다니는 이는 오래도록 슬퍼한다. 어리석은 이와 함께 사는 것은 원수와 함께 사는 것처럼 괴롭고, 지혜로운 이와 함께 사는 것은 친척을 만난 것처럼 즐겁다.", "z": "", "e": "For one who consorts with fools grieves long. Painful is living with fools, like being stuck with your enemy. Happy is living with an attentive one, like meeting with your kin.", "w": ["선우"]}, {"n": 208, "h": "Tasmā hi— Dhīrañca paññañca bahussutañca, Dhorayhasīlaṁ vatavantamariyaṁ; Taṁ tādisaṁ sappurisaṁ sumedhaṁ, Bhajetha nakkhattapathaṁva candimā.", "r": "", "k": "그러므로 지혜롭고 많이 배우고 인내하며 계행을 지키는 거룩한 이, 그런 훌륭하고 지혜로운 이를 따르라. 달이 별들의 길을 따르듯.", "z": "", "e": "Therefore: An attentive one, wise and learned, a behemoth of virtue, true to their vows, noble: follow a true and intelligent person such as this, as the moon tracks the path of the stars.", "w": ["계행"]}], "soon": false}, {"id": "d16", "t": "제16품 희애품", "te": "Ch. 16: The Beloved", "h": "喜愛品", "by": "209~220번 게송 (12구절)", "bye": "Verses 209–220", "d": "사랑과 집착", "de": "The Beloved", "items": [{"n": 209, "h": "Ayoge yuñjamattānaṁ, yogasmiñca ayojayaṁ; Atthaṁ hitvā piyaggāhī, pihetattānuyoginaṁ.", "r": "", "k": "해서는 안 될 일에 몰두하고 해야 할 일에 힘쓰지 않으며, 참된 목적을 버리고 좋아하는 것만 붙잡는 사람은 수행에 힘쓰는 이를 부러워하게 된다.", "z": "", "e": "Applying yourself where you ought not, neglecting what you should be doing, forgetting your goal, you cling to what you hold dear, jealous of those devoted to their heart’s goal.", "w": []}, {"n": 210, "h": "Mā piyehi samāgañchi, appiyehi kudācanaṁ; Piyānaṁ adassanaṁ dukkhaṁ, appiyānañca dassanaṁ.", "r": "", "k": "좋아하는 사람과도 싫어하는 사람과도 지나치게 엮이지 말라. 좋아하는 이를 만나지 못하는 것도 괴롭고, 싫어하는 이를 만나는 것도 괴롭다.", "z": "애별리고(사랑하는 이와 헤어지는 괴로움)와 원증회고(싫은 이와 만나는 괴로움)를 말합니다.", "e": "Don’t ever get too close to those you like or dislike. For not seeing the liked is suffering, and so is seeing the disliked.", "w": []}, {"n": 211, "h": "Tasmā piyaṁ na kayirātha, piyāpāyo hi pāpako; Ganthā tesaṁ na vijjanti, yesaṁ natthi piyāppiyaṁ.", "r": "", "k": "그러므로 무엇이든 지나치게 사랑하지 말라. 사랑하는 것을 잃는 것은 괴로움이다. 사랑하는 것도 미워하는 것도 없는 이에게는 속박이 없다.", "z": "", "e": "Therefore don’t hold anything dear, for it’s bad to lose those you love. No ties are found in they who hold nothing loved or loathed.", "w": []}, {"n": 212, "h": "Piyato jāyatī soko, piyato jāyatī bhayaṁ; Piyato vippamuttassa, natthi soko kuto bhayaṁ.", "r": "", "k": "사랑에서 슬픔이 생기고 사랑에서 두려움이 생긴다. 사랑에서 벗어난 이에게는 슬픔이 없는데 어찌 두려움이 있으랴.", "z": "212~216절: 슬픔과 두려움의 뿌리는 집착이라는 가르침입니다.", "e": "Sorrow springs from what we hold dear, fear springs from what we hold dear; one free from holding anything dear has no sorrow, let alone fear.", "w": []}, {"n": 213, "h": "Pemato jāyatī soko, pemato jāyatī bhayaṁ; Pemato vippamuttassa, natthi soko kuto bhayaṁ.", "r": "", "k": "애착에서 슬픔이 생기고 애착에서 두려움이 생긴다. 애착에서 벗어난 이에게는 슬픔이 없는데 어찌 두려움이 있으랴.", "z": "", "e": "Sorrow springs from attachment, fear springs from attachment; one free from attachment has no sorrow, let alone fear.", "w": []}, {"n": 214, "h": "Ratiyā jāyatī soko, ratiyā jāyatī bhayaṁ; Ratiyā vippamuttassa, natthi soko kuto bhayaṁ.", "r": "", "k": "쾌락에서 슬픔이 생기고 쾌락에서 두려움이 생긴다. 쾌락에서 벗어난 이에게는 슬픔이 없는데 어찌 두려움이 있으랴.", "z": "", "e": "Sorrow springs from relishing, fear springs from relishing; one free from relishing has no sorrow, let alone fear.", "w": []}, {"n": 215, "h": "Kāmato jāyatī soko, kāmato jāyatī bhayaṁ; Kāmato vippamuttassa, natthi soko kuto bhayaṁ.", "r": "", "k": "욕망에서 슬픔이 생기고 욕망에서 두려움이 생긴다. 욕망에서 벗어난 이에게는 슬픔이 없는데 어찌 두려움이 있으랴.", "z": "", "e": "Sorrow springs from desire, fear springs from desire; one free from desire has no sorrow, let alone fear.", "w": ["탐욕"]}, {"n": 216, "h": "Taṇhāya jāyatī soko, taṇhāya jāyatī bhayaṁ; Taṇhāya vippamuttassa, natthi soko kuto bhayaṁ.", "r": "", "k": "갈애에서 슬픔이 생기고 갈애에서 두려움이 생긴다. 갈애에서 벗어난 이에게는 슬픔이 없는데 어찌 두려움이 있으랴.", "z": "", "e": "Sorrow springs from craving, fear springs from craving; one free from craving has no sorrow, let alone fear.", "w": ["갈애"]}, {"n": 217, "h": "Sīladassanasampannaṁ, dhammaṭṭhaṁ saccavedinaṁ; Attano kamma kubbānaṁ, taṁ jano kurute piyaṁ.", "r": "", "k": "계행과 바른 견해를 갖추고, 진리에 굳게 서서 진실을 말하며, 자기가 할 일을 하는 사람을 세상 사람들은 사랑한다.", "z": "", "e": "One accomplished in virtue and vision, firmly principled, and truthful, doing oneself what ought be done: that’s who the people love.", "w": ["계행"]}, {"n": 218, "h": "Chandajāto anakkhāte, Manasā ca phuṭo siyā; Kāmesu ca appaṭibaddhacitto, Uddhaṁsototi vuccati.", "r": "", "k": "말로 표현할 수 없는 경지(열반)를 간절히 바라고, 마음이 그것으로 가득 차며, 감각적 욕망에 묶이지 않은 이를 \"흐름을 거슬러 오르는 이\"라 한다.", "z": "", "e": "One eager to realize the ineffable would be filled with awareness. Their mind not bound to pleasures of sense, they’re said to be heading upstream.", "w": ["열반"]}, {"n": 219, "h": "Cirappavāsiṁ purisaṁ, dūrato sotthimāgataṁ; Ñātimittā suhajjā ca, abhinandanti āgataṁ.", "r": "", "k": "오랫동안 먼 길을 떠났던 사람이 무사히 돌아오면, 친척과 벗과 이웃들이 그를 반갑게 맞이한다.", "z": "", "e": "When a man returns safely after a long time spent abroad, family, friends, and loved ones celebrate his return.", "w": []}, {"n": 220, "h": "Tatheva katapuññampi, asmā lokā paraṁ gataṁ; Puññāni paṭigaṇhanti, piyaṁ ñātīva āgataṁ.", "r": "", "k": "그처럼 선을 행한 사람이 이 세상에서 저 세상으로 가면, 그가 지은 선업이 그를 맞이한다. 친척이 사랑하는 이를 맞이하듯.", "z": "저 세상에 가져갈 수 있는 것은 오직 내가 지은 선업뿐입니다.", "e": "Just so, when one who has done good goes from this world to the next, their good deeds receive them there, as family welcomes home one they love.", "w": ["업"]}], "soon": false}, {"id": "d17", "t": "제17품 분노품", "te": "Ch. 17: Anger", "h": "忿怒品", "by": "221~234번 게송 (14구절)", "bye": "Verses 221–234", "d": "분노", "de": "Anger", "items": [{"n": 221, "h": "Kodhaṁ jahe vippajaheyya mānaṁ, Saṁyojanaṁ sabbamatikkameyya; Taṁ nāmarūpasmimasajjamānaṁ, Akiñcanaṁ nānupatanti dukkhā.", "r": "", "k": "분노를 버리고 교만을 버리고 모든 속박을 넘어서라. 몸과 마음에 집착하지 않고 아무것도 갖지 않은 이에게는 괴로움이 닥치지 않는다.", "z": "", "e": "Give up anger, get rid of conceit, and escape every fetter. Sufferings don’t befall one who has nothing, not clinging to name and form.", "w": ["아만"]}, {"n": 222, "h": "Yo ve uppatitaṁ kodhaṁ, rathaṁ bhantaṁva vāraye; Tamahaṁ sārathiṁ brūmi, rasmiggāho itaro jano.", "r": "", "k": "달리는 수레를 멈추듯 치밀어 오르는 분노를 다스리는 이, 나는 그를 참된 마부라 부른다. 다른 이들은 고삐만 쥐고 있을 뿐이다.", "z": "", "e": "When anger surges like a lurching chariot, keep it in check. That’s what I call a charioteer; others just hold the reins.", "w": ["인욕"]}, {"n": 223, "h": "Akkodhena jine kodhaṁ, asādhuṁ sādhunā jine; Jine kadariyaṁ dānena, saccenālikavādinaṁ.", "r": "", "k": "분노는 자애로 이기고, 악은 선으로 이기며, 인색함은 베풂으로 이기고, 거짓은 진실로 이겨라.", "z": "", "e": "Defeat anger with kindness, villainy with virtue, stinginess with giving, and lies with truth.", "w": ["자비"]}, {"n": 224, "h": "Saccaṁ bhaṇe na kujjheyya, dajjā appampi yācito; Etehi tīhi ṭhānehi, gacche devāna santike.", "r": "", "k": "진실을 말하고, 화내지 말고, 조금이라도 청하면 베풀어라. 이 세 가지로 신들 곁에 갈 수 있다.", "z": "", "e": "Speak the truth, do not be angry, and give when asked, if only a little. By these three means, you may enter the presence of the gods.", "w": []}, {"n": 225, "h": "Ahiṁsakā ye munayo, niccaṁ kāyena saṁvutā; Te yanti accutaṁ ṭhānaṁ, yattha gantvā na socare.", "r": "", "k": "남을 해치지 않고 늘 몸을 절제하는 성자들은, 슬픔이 없는 영원한 경지(열반)에 이른다.", "z": "", "e": "Those harmless sages, always restrained in body, go to the state that does not pass, where there is no sorrow.", "w": ["열반"]}, {"n": 226, "h": "Sadā jāgaramānānaṁ, ahorattānusikkhinaṁ; Nibbānaṁ adhimuttānaṁ, atthaṁ gacchanti āsavā.", "r": "", "k": "늘 깨어 있고 밤낮으로 공부하며 열반에 마음을 기울이는 이들은 번뇌가 사라진다.", "z": "", "e": "Always wakeful, practicing night and day, focused only on extinguishment, their defilements come to an end.", "w": ["번뇌", "열반"]}, {"n": 227, "h": "Porāṇametaṁ atula, netaṁ ajjatanāmiva; Nindanti tuṇhimāsīnaṁ, nindanti bahubhāṇinaṁ; Mitabhāṇimpi nindanti, natthi loke anindito.", "r": "", "k": "아뚤라여, 이것은 오늘만의 일이 아니라 예부터 있던 일이다. 사람들은 침묵하는 이도 비난하고, 말을 많이 하는 이도 비난하며, 알맞게 말하는 이도 비난한다. 이 세상에 비난받지 않는 이는 없다.", "z": "누구에게나 비난은 따릅니다. 남의 평가에 너무 매이지 마세요.", "e": "It’s always been this way, Atula, it’s not just today. They blame you when you’re silent, they blame you when you speak a lot, and even when you speak just right: no one in the world escapes blame.", "w": []}, {"n": 228, "h": "Na cāhu na ca bhavissati, na cetarahi vijjati; Ekantaṁ nindito poso, ekantaṁ vā pasaṁsito.", "r": "", "k": "오로지 비난만 받는 사람이나 오로지 칭찬만 받는 사람은 과거에도 없었고 미래에도 없으며 지금도 없다.", "z": "", "e": "There never was, nor will be, nor is there today, someone who is wholly praised or wholly blamed.", "w": []}, {"n": 229, "h": "Yañce viññū pasaṁsanti, anuvicca suve suve; Acchiddavuttiṁ medhāviṁ, paññāsīlasamāhitaṁ.", "r": "", "k": "지혜로운 이들이 날마다 살펴보고서, 허물없이 살며 지혜와 계행을 갖춘 현명한 이를 칭찬한다면,", "z": "229~230절은 이어지는 한 문장입니다.", "e": "If, after watching them day in day out, discerning people praise that sage of impeccable conduct, endowed with ethics and wisdom;", "w": ["계행"]}, {"n": 230, "h": "Nikkhaṁ jambonadasseva, ko taṁ ninditumarahati; Devāpi naṁ pasaṁsanti, brahmunāpi pasaṁsito.", "r": "", "k": "잠부강의 순금으로 만든 장신구 같은 그를 누가 비난할 수 있겠는가? 신들도 그를 칭찬하고 범천도 그를 칭찬한다.", "z": "", "e": "like a pendant of Black Plum River gold, who is worthy to criticize them? Even the gods praise them, and by the Divinity, too, they’re praised.", "w": []}, {"n": 231, "h": "Kāyappakopaṁ rakkheyya, kāyena saṁvuto siyā; Kāyaduccaritaṁ hitvā, kāyena sucaritaṁ care.", "r": "", "k": "몸으로 짓는 성냄을 지키고 몸을 절제하라. 몸으로 짓는 나쁜 행동을 버리고 몸으로 바르게 행동하라.", "z": "231~233절: 몸·말·생각, 세 가지를 다스리라(신구의 삼업).", "e": "Guard against ill-tempered deeds, be restrained in body. Giving up bad bodily conduct, conduct yourself well in body.", "w": ["삼업"]}, {"n": 232, "h": "Vacīpakopaṁ rakkheyya, vācāya saṁvuto siyā; Vacīduccaritaṁ hitvā, vācāya sucaritaṁ care.", "r": "", "k": "말로 짓는 성냄을 지키고 말을 절제하라. 말로 짓는 나쁜 행동을 버리고 말로 바르게 행동하라.", "z": "", "e": "Guard against ill-tempered words, be restrained in speech. Giving up bad verbal conduct, conduct yourself well in speech.", "w": ["삼업"]}, {"n": 233, "h": "Manopakopaṁ rakkheyya, manasā saṁvuto siyā; Manoduccaritaṁ hitvā, manasā sucaritaṁ care.", "r": "", "k": "마음으로 짓는 성냄을 지키고 마음을 절제하라. 마음으로 짓는 나쁜 행동을 버리고 마음으로 바르게 행동하라.", "z": "", "e": "Guard against ill-tempered thoughts, be restrained in mind. Giving up bad mental conduct, conduct yourself well in mind.", "w": ["삼업"]}, {"n": 234, "h": "Kāyena saṁvutā dhīrā, atho vācāya saṁvutā; Manasā saṁvutā dhīrā, te ve suparisaṁvutā.", "r": "", "k": "지혜로운 이는 몸을 절제하고 말을 절제하며 마음을 절제한다. 그들은 참으로 모든 것을 잘 절제한다.", "z": "", "e": "An attentive one is restrained in body restrained also in speech, in thought, too, they are restrained: they are restrained in every way.", "w": ["삼업"]}], "soon": false}, {"id": "d18", "t": "제18품 진구품", "te": "Ch. 18: Stains", "h": "塵垢品", "by": "235~255번 게송 (21구절)", "bye": "Verses 235–255", "d": "마음의 때", "de": "Stains", "items": [{"n": 235, "h": "Paṇḍupalāsova dānisi, Yamapurisāpi ca te upaṭṭhitā; Uyyogamukhe ca tiṭṭhasi, Pātheyyampi ca te na vijjati.", "r": "", "k": "너는 이제 시든 잎과 같다. 염라대왕의 사자들이 너를 기다린다. 너는 떠남의 문 앞에 서 있는데, 길 떠날 양식이 없구나.", "z": "", "e": "Today you’re like a withered leaf, Yama’s men await you. You stand at the departure gates, yet you have no supplies for the road.", "w": []}, {"n": 236, "h": "So karohi dīpamattano, Khippaṁ vāyama paṇḍito bhava; Niddhantamalo anaṅgaṇo, Dibbaṁ ariyabhūmiṁ upehisi.", "r": "", "k": "자신을 섬으로 삼아라! 어서 힘써 지혜로운 이가 되어라. 마음의 때를 씻고 허물이 없어지면 성자들의 하늘나라에 이르리라.", "z": "부처님의 유언 \"자등명 법등명(自燈明 法燈明, 자신과 진리를 등불이자 섬으로 삼아라)\"과 통하는 말씀입니다.", "e": "Make an island of yourself! Swiftly strive, learn to be wise! Purged of stains, flawless, you’ll go to the heavenly realm of the noble ones.", "w": []}, {"n": 237, "h": "Upanītavayo ca dānisi, Sampayātosi yamassa santikaṁ; Vāso te natthi antarā, Pātheyyampi ca te na vijjati.", "r": "", "k": "너는 이제 인생의 끝에 이르러 염라대왕 앞으로 가고 있다. 가는 길에는 쉴 곳도 없는데, 길 떠날 양식이 없구나.", "z": "", "e": "You’ve journeyed the stages of life, and now you set out to meet Yama. Along the way there’s nowhere to stay, yet you have no supplies for the road.", "w": []}, {"n": 238, "h": "So karohi dīpamattano, Khippaṁ vāyama paṇḍito bhava; Niddhantamalo anaṅgaṇo, Na punaṁ jātijaraṁ upehisi.", "r": "", "k": "자신을 섬으로 삼아라! 어서 힘써 지혜로운 이가 되어라. 마음의 때를 씻고 허물이 없어지면 다시는 태어나고 늙지 않으리라.", "z": "", "e": "Make an island of yourself! Swiftly strive, learn to be wise! Purged of stains, flawless, you’ll not come again to rebirth and old age.", "w": ["윤회"]}, {"n": 239, "h": "Anupubbena medhāvī, thokaṁ thokaṁ khaṇe khaṇe; Kammāro rajatasseva, niddhame malamattano.", "r": "", "k": "지혜로운 이는 대장장이가 은의 불순물을 걸러 내듯, 자기 마음의 때를 조금씩, 순간순간, 차례차례 씻어 낸다.", "z": "수행은 한 번에 되는 것이 아니라 조금씩 꾸준히 하는 것입니다.", "e": "A smart person would purge their own stains gradually, bit by bit, moment by moment, like a smith smelting silver.", "w": []}, {"n": 240, "h": "Ayasāva malaṁ samuṭṭhitaṁ, Tatuṭṭhāya tameva khādati; Evaṁ atidhonacārinaṁ, Sāni kammāni nayanti duggatiṁ.", "r": "", "k": "쇠에서 생긴 녹이 쇠를 갉아먹듯, 계율을 어긴 이는 자기가 지은 업이 자신을 나쁜 곳으로 이끈다.", "z": "", "e": "It is the rust born on the iron that eats away the place it arose. And so it is their own deeds that lead the overly-ascetic to a bad place.", "w": ["업"]}, {"n": 241, "h": "Asajjhāyamalā mantā, anuṭṭhānamalā gharā; Malaṁ vaṇṇassa kosajjaṁ, pamādo rakkhato malaṁ.", "r": "", "k": "외우지 않음은 경전의 때요, 돌보지 않음은 집의 때이며, 게으름은 아름다움의 때요, 방심은 지키는 이의 때다.", "z": "", "e": "Not rehearsing is the stain of hymns. The stain of houses is neglect. Laziness is the stain of beauty. A guard’s stain is negligence.", "w": []}, {"n": 242, "h": "Malitthiyā duccaritaṁ, maccheraṁ dadato malaṁ; Malā ve pāpakā dhammā, asmiṁ loke paramhi ca.", "r": "", "k": "나쁜 행실은 사람의 때요, 인색함은 베푸는 이의 때이며, 악한 법은 이 세상과 저 세상의 때다.", "z": "", "e": "Misconduct is a woman’s stain. A giver’s stain is stinginess. Bad qualities are a stain in this world and the next.", "w": []}, {"n": 243, "h": "Tato malā malataraṁ, avijjā paramaṁ malaṁ; Etaṁ malaṁ pahantvāna, nimmalā hotha bhikkhavo.", "r": "", "k": "그러나 이보다 더한 때가 있으니, 무명(어리석음)이 가장 큰 때다. 비구들이여, 이 때를 버리고 때 없는 이가 되어라.", "z": "", "e": "But a worse stain than these is ignorance, the worst stain of all. Having given up that stain, be without stains, mendicants!", "w": ["무명", "비구"]}, {"n": 244, "h": "Sujīvaṁ ahirikena, kākasūrena dhaṁsinā; Pakkhandinā pagabbhena, saṅkiliṭṭhena jīvitaṁ.", "r": "", "k": "부끄러움을 모르고 까마귀처럼 뻔뻔하며, 남을 헐뜯고 무례하고 거만하며 타락한 사람에게 삶은 쉽다.", "z": "", "e": "Life is easy for the shameless. With all the rude courage of a crow, they live pushy, rude, and corrupt.", "w": []}, {"n": 245, "h": "Hirīmatā ca dujjīvaṁ, niccaṁ sucigavesinā; Alīnenāppagabbhena, suddhājīvena passatā.", "r": "", "k": "부끄러움을 알고 늘 깨끗함을 구하며, 집착하지 않고 겸손하며 바르게 살고 지혜로운 이에게 삶은 어렵다.", "z": "바르게 사는 길은 쉽지 않지만, 그 길이 참된 길입니다.", "e": "Life is hard for the conscientious, always seeking purity, neither clinging nor rude, pure of livelihood and discerning.", "w": []}, {"n": 246, "h": "Yo pāṇamatipāteti, musāvādañca bhāsati; Loke adinnamādiyati, paradārañca gacchati.", "r": "", "k": "이 세상에서 생명을 죽이고, 거짓말을 하고, 주지 않은 것을 빼앗고, 남의 아내를 범하며,", "z": "246~247절: 오계를 어기는 것은 스스로 뿌리를 캐내는 일입니다.", "e": "Take anyone in this world who kills living creatures, speaks falsely, steals, commits adultery,", "w": ["오계"]}, {"n": 247, "h": "Surāmerayapānañca, yo naro anuyuñjati; Idheva meso lokasmiṁ, mūlaṁ khaṇati attano.", "r": "", "k": "술에 빠지는 사람은 바로 이 세상에서 자기 뿌리를 캐낸다.", "z": "", "e": "and indulges in drinking beer and wine. Right here they dig up the root of their own self.", "w": ["오계"]}, {"n": 248, "h": "Evaṁ bho purisa jānāhi, pāpadhammā asaññatā; Mā taṁ lobho adhammo ca, ciraṁ dukkhāya randhayuṁ.", "r": "", "k": "사람이여, 이것을 알라. 절제하지 않는 것은 악한 일이다. 탐욕과 그릇됨이 너를 오랫동안 괴로움에 빠뜨리지 않게 하라.", "z": "", "e": "Know this, my man: they are unrestrained and wicked. Don’t let that greed and unrighteousness inflict pain on you for long.", "w": ["탐욕"]}, {"n": 249, "h": "Dadāti ve yathāsaddhaṁ, yathāpasādanaṁ jano; Tattha yo ca maṅku bhavati, paresaṁ pānabhojane; Na so divā vā rattiṁ vā, samādhimadhigacchati.", "r": "", "k": "사람들은 저마다의 믿음과 마음에 따라 베푼다. 남이 받은 음식과 마실 것을 보고 불평하는 이는 밤에도 낮에도 선정에 들지 못한다.", "z": "", "e": "The people give according to their faith, according to their confidence. If you get upset over that, over others’ food and drink, you’ll not, by day or by night, become immersed in samādhi.", "w": ["선정"]}, {"n": 250, "h": "Yassa cetaṁ samucchinnaṁ, mūlaghaccaṁ samūhataṁ; Sa ve divā vā rattiṁ vā, samādhimadhigacchati.", "r": "", "k": "그런 마음을 끊고 뿌리째 뽑아 버린 이는 밤에도 낮에도 선정에 든다.", "z": "", "e": "Those who have cut that out, dug it up at the root, eradicated it, they will, by day or by night, become immersed in samādhi.", "w": ["선정"]}, {"n": 251, "h": "Natthi rāgasamo aggi, natthi dosasamo gaho; Natthi mohasamaṁ jālaṁ, natthi taṇhāsamā nadī.", "r": "", "k": "탐욕 같은 불이 없고, 성냄 같은 집착이 없으며, 어리석음 같은 그물이 없고, 갈애 같은 강물이 없다.", "z": "", "e": "There is no fire like greed, no crime like hate, no net like delusion, no river like craving.", "w": ["삼독", "갈애"]}, {"n": 252, "h": "Sudassaṁ vajjamaññesaṁ, attano pana duddasaṁ; Paresaṁ hi so vajjāni, opunāti yathā bhusaṁ; Attano pana chādeti, kaliṁva kitavā saṭho.", "r": "", "k": "남의 허물은 보기 쉽고 자기 허물은 보기 어렵다. 남의 허물은 쭉정이처럼 까불어 드러내고, 자기 허물은 노름꾼이 나쁜 패를 숨기듯 감춘다.", "z": "", "e": "It’s easy to see the faults of others, hard to see one’s own. For the faults of others are tossed high like hay, while one’s own are hidden, as a cheat hides a bad hand.", "w": []}, {"n": 253, "h": "Paravajjānupassissa, niccaṁ ujjhānasaññino; Āsavā tassa vaḍḍhanti, ārā so āsavakkhayā.", "r": "", "k": "남의 허물만 찾아내고 늘 남을 탓하는 이는 번뇌만 늘어나서 번뇌의 소멸에서 멀어진다.", "z": "", "e": "When you look for the flaws of others, always finding fault, your defilements only grow, you’re far from ending defilements.", "w": ["번뇌"]}, {"n": 254, "h": "Ākāseva padaṁ natthi, samaṇo natthi bāhire; Papañcābhiratā pajā, nippapañcā tathāgatā.", "r": "", "k": "허공에는 발자국이 없고, 이 가르침 밖에는 참된 사문이 없다. 사람들은 헛된 생각을 즐기지만, 여래들은 헛된 생각이 없다.", "z": "", "e": "In the atmosphere there is no track, there’s no true ascetic outside here. People enjoy proliferation, the Realized Ones are free of proliferation.", "w": ["여래"]}, {"n": 255, "h": "Ākāseva padaṁ natthi, samaṇo natthi bāhire; Saṅkhārā sassatā natthi, natthi buddhānamiñjitaṁ.", "r": "", "k": "허공에는 발자국이 없고, 이 가르침 밖에는 참된 사문이 없다. 형성된 것은 영원하지 않으나, 깨달은 이들은 흔들림이 없다.", "z": "", "e": "In the atmosphere there is no track, there’s no true ascetic outside here. No conditions last forever, the Awakened Ones are not shaken.", "w": ["무상"]}], "soon": false}, {"id": "d19", "t": "제19품 법주품", "te": "Ch. 19: The Just", "h": "法住品", "by": "256~272번 게송 (17구절)", "bye": "Verses 256–272", "d": "진리에 머무는 사람", "de": "The Just", "items": [{"n": 256, "h": "Na tena hoti dhammaṭṭho, yenatthaṁ sāhasā naye; Yo ca atthaṁ anatthañca, ubho niccheyya paṇḍito.", "r": "", "k": "성급하게 판단한다고 정의로운 사람이 되는 것은 아니다. 지혜로운 이는 옳고 그름을 모두 살핀다.", "z": "", "e": "You don’t become just by passing hasty judgment. An astute person evaluates both what is pertinent and what is irrelevant.", "w": []}, {"n": 257, "h": "Asāhasena dhammena, samena nayatī pare; Dhammassa gutto medhāvī, “dhammaṭṭho”ti pavuccati.", "r": "", "k": "성급하지 않고 바르고 공평하게 남을 이끄는 지혜로운 이, 진리를 지키는 그를 정의로운 사람이라 한다.", "z": "", "e": "A wise one judges others without haste, justly and impartially; that guardian of the law is said to be just.", "w": []}, {"n": 258, "h": "Na tena paṇḍito hoti, yāvatā bahu bhāsati; Khemī averī abhayo, “paṇḍito”ti pavuccati.", "r": "", "k": "말을 많이 한다고 지혜로운 사람이 되는 것은 아니다. 평온하고 원한과 두려움이 없는 이를 지혜로운 사람이라 한다.", "z": "", "e": "You’re not an astute scholar just because you speak a lot. One who is secure, free of enmity and fear, is said to be astute.", "w": []}, {"n": 259, "h": "Na tāvatā dhammadharo, yāvatā bahu bhāsati; Yo ca appampi sutvāna, dhammaṁ kāyena passati; Sa ve dhammadharo hoti, yo dhammaṁ nappamajjati.", "r": "", "k": "많이 외운다고 진리를 지니는 사람이 되는 것은 아니다. 조금 들었어도 몸으로 진리를 보는 이, 진리를 결코 잊지 않는 이가 참으로 진리를 지니는 사람이다.", "z": "", "e": "You’re not one who has memorized the teaching just because you recite a lot. Someone who directly sees the teaching after hearing only a little is truly one who has memorized the teaching, for they can never forget it.", "w": []}, {"n": 260, "h": "Na tena thero so hoti, yenassa palitaṁ siro; Paripakko vayo tassa, “moghajiṇṇo”ti vuccati.", "r": "", "k": "머리카락이 희어졌다고 장로가 되는 것은 아니다. 나이만 먹은 사람은 \"헛되이 늙은이\"라 한다.", "z": "", "e": "You don’t become a senior by getting some grey hairs; for one ripe only in age, is said to have aged in vain.", "w": []}, {"n": 261, "h": "Yamhi saccañca dhammo ca, ahiṁsā saṁyamo damo; Sa ve vantamalo dhīro, “thero” iti pavuccati.", "r": "", "k": "진실하고 바르며, 해치지 않고 절제하며 자신을 다스리고, 마음의 때를 벗은 지혜로운 이를 장로라 한다.", "z": "", "e": "One who is truthful and principled, harmless, restrained, and self-controlled, attentive, purged of stains, is said to be a senior.", "w": []}, {"n": 262, "h": "Na vākkaraṇamattena, vaṇṇapokkharatāya vā; Sādhurūpo naro hoti, issukī maccharī saṭho.", "r": "", "k": "시기하고 인색하고 교활한 사람은 말을 잘하거나 얼굴이 잘생겼다고 훌륭한 사람이 되지 않는다.", "z": "", "e": "Not by mere enunciation, or a beautiful complexion does a person become holy, if they’re jealous, stingy, and devious.", "w": []}, {"n": 263, "h": "Yassa cetaṁ samucchinnaṁ, mūlaghaccaṁ samūhataṁ; Sa vantadoso medhāvī, “sādhurūpo”ti vuccati.", "r": "", "k": "그런 마음을 끊고 뿌리째 뽑아 버리고 허물을 벗은 지혜로운 이를 훌륭한 사람이라 한다.", "z": "", "e": "But if they’ve cut that out, dug it up at the root, eradicated it, that intelligent one, purged of vice, is said to be holy.", "w": []}, {"n": 264, "h": "Na muṇḍakena samaṇo, abbato alikaṁ bhaṇaṁ; Icchālobhasamāpanno, samaṇo kiṁ bhavissati.", "r": "", "k": "계를 어기고 거짓말을 하는 사람은 머리를 깎았다고 사문이 되는 것이 아니다. 욕심과 탐욕에 가득 찬 이가 어찌 사문이겠는가?", "z": "", "e": "A liar and breaker of vows is no ascetic just because they shave their head. How on earth can one be an ascetic who’s full of desire and greed?", "w": []}, {"n": 265, "h": "Yo ca sameti pāpāni, aṇuṁthūlāni sabbaso; Samitattā hi pāpānaṁ, “samaṇo”ti pavuccati.", "r": "", "k": "크고 작은 모든 악을 그친 이, 악을 그쳤기에 그를 사문이라 한다.", "z": "", "e": "One who stops all wicked deeds, great and small, because of stopping wicked deeds is said to be an ascetic.", "w": []}, {"n": 266, "h": "Na tena bhikkhu so hoti, yāvatā bhikkhate pare; Vissaṁ dhammaṁ samādāya, bhikkhu hoti na tāvatā.", "r": "", "k": "남에게 밥을 빈다고 비구가 되는 것은 아니다. 세속의 법을 그대로 따르는 이는 비구가 아니다.", "z": "", "e": "You don’t become a mendicant just by begging from others. One who has undertaken domestic duties has not yet become a mendicant.", "w": ["비구"]}, {"n": 267, "h": "Yodha puññañca pāpañca, bāhetvā brahmacariyavā; Saṅkhāya loke carati, sa ve “bhikkhū”ti vuccati.", "r": "", "k": "복과 죄를 모두 넘어서 청정한 삶을 살며 세상을 바르게 알고 사는 이를 비구라 한다.", "z": "", "e": "But one living a spiritual life, who has banished both merit and evil, who wanders having appraised the world, is said to be a mendicant.", "w": ["비구"]}, {"n": 268, "h": "Na monena munī hoti, mūḷharūpo aviddasu; Yo ca tulaṁva paggayha, varamādāya paṇḍito.", "r": "", "k": "어리석고 무지한 이가 침묵한다고 성자가 되는 것은 아니다. 저울을 들고 좋은 것만 고르듯 지혜로운 이는,", "z": "268~269절은 이어지는 한 문장입니다.", "e": "You don’t become a sage by being sagelike, while still confused and ignorant. The astute one who holds the scales, taking only the best,", "w": []}, {"n": 269, "h": "Pāpāni parivajjeti, sa munī tena so muni; Yo munāti ubho loke, “muni” tena pavuccati.", "r": "", "k": "악을 피하나니, 그가 성자이고 그래서 성자가 된다. 이 세상의 두 가지(선과 악)를 바르게 헤아리는 이를 성자라 한다.", "z": "", "e": "and shunning the bad— that is a sage, and that is how one becomes a sage. One who sagely weighs both in the world, is thereby said to be a sage.", "w": []}, {"n": 270, "h": "Na tena ariyo hoti, yena pāṇāni hiṁsati; Ahiṁsā sabbapāṇānaṁ, “ariyo”ti pavuccati.", "r": "", "k": "생명을 해치는 이는 거룩한 이가 아니다. 모든 생명을 해치지 않는 이를 거룩한 이라 한다.", "z": "", "e": "You don’t become a noble one by harming living beings. One harmless toward all living beings is said to be a noble one.", "w": []}, {"n": 271, "h": "Na sīlabbatamattena, bāhusaccena vā pana; Atha vā samādhilābhena, vivittasayanena vā.", "r": "", "k": "계율과 의식만으로, 많이 배운 것만으로, 선정을 얻은 것만으로, 홀로 머무는 것만으로,", "z": "271~272절은 이어지는 한 문장입니다.", "e": "Not by precepts and observances, nor by much learning, nor by meditative immersion, nor by living in seclusion,", "w": ["선정"]}, {"n": 272, "h": "Phusāmi nekkhammasukhaṁ, aputhujjanasevitaṁ; Bhikkhu vissāsamāpādi, appatto āsavakkhayaṁ.", "r": "", "k": "\"범부가 맛보지 못한 출가의 행복을 나는 누린다\"고 여기지 말라. 비구여, 번뇌가 다하기 전에는 방심하지 말라.", "z": "", "e": "do I experience the bliss of renunciation not frequented by ordinary people. A mendicant cannot rest confident without attaining the end of defilements.", "w": ["비구", "번뇌"]}], "soon": false}, {"id": "d20", "t": "제20품 도행품", "te": "Ch. 20: The Path", "h": "道行品", "by": "273~289번 게송 (17구절)", "bye": "Verses 273–289", "d": "깨달음의 길", "de": "The Path", "items": [{"n": 273, "h": "Maggānaṭṭhaṅgiko seṭṭho, saccānaṁ caturo padā; Virāgo seṭṭho dhammānaṁ, dvipadānañca cakkhumā.", "r": "", "k": "길 가운데는 팔정도가 으뜸이고, 진리 가운데는 사성제가 으뜸이며, 법 가운데는 탐욕을 떠남이 으뜸이고, 사람 가운데는 눈을 갖춘 이(부처님)가 으뜸이다.", "z": "", "e": "Of paths, the eightfold is the best; of truths, the four statements; dispassion is the best of things, and the Clear-eyed One is the best of humans.", "w": ["팔정도", "사성제"]}, {"n": 274, "h": "Eseva maggo natthañño, Dassanassa visuddhiyā; Etañhi tumhe paṭipajjatha, Mārassetaṁ pamohanaṁ.", "r": "", "k": "이것이 바로 그 길이다. 바른 앎을 깨끗이 하는 다른 길은 없다. 너희는 이 길을 가라. 이것이 마라를 당황하게 하는 길이다.", "z": "", "e": "This is the path, there is no other for the purification of vision. You all must practice this, it is the way to baffle Māra.", "w": ["팔정도", "마라"]}, {"n": 275, "h": "Etañhi tumhe paṭipannā, dukkhassantaṁ karissatha; Akkhāto vo mayā maggo, aññāya sallakantanaṁ.", "r": "", "k": "이 길을 가면 너희는 괴로움을 끝내리라. 나는 지혜로 가시를 뽑는 이 길을 알고 너희에게 가르쳤다.", "z": "", "e": "When you all are practicing this, you’ll make an end of suffering. I have explained the path to you for extracting the thorn with wisdom.", "w": []}, {"n": 276, "h": "Tumhehi kiccamātappaṁ, akkhātāro tathāgatā; Paṭipannā pamokkhanti, jhāyino mārabandhanā.", "r": "", "k": "너희 스스로 힘써야 한다. 여래는 길을 가리켜 줄 뿐이다. 이 길을 따라 선정을 닦는 이는 마라의 속박에서 벗어난다.", "z": "부처님도 대신 걸어 주실 수 없습니다. 길은 내가 걸어야 합니다.", "e": "You yourselves must do the work, the Realized Ones just show the way. Meditators practicing absorption are released from Māra’s bonds.", "w": ["여래", "마라"]}, {"n": 277, "h": "“Sabbe saṅkhārā aniccā”ti, yadā paññāya passati; Atha nibbindati dukkhe, esa maggo visuddhiyā.", "r": "", "k": "\"형성된 모든 것은 무상하다(제행무상)\"고 지혜로 볼 때, 괴로움에서 벗어나게 된다. 이것이 청정에 이르는 길이다.", "z": "277~279절은 삼법인(무상·고·무아)입니다.", "e": "All conditions are impermanent— when this is seen with wisdom, one grows disillusioned with suffering: this is the path to purity.", "w": ["무상", "삼법인"]}, {"n": 278, "h": "“Sabbe saṅkhārā dukkhā”ti, yadā paññāya passati; Atha nibbindati dukkhe, esa maggo visuddhiyā.", "r": "", "k": "\"형성된 모든 것은 괴로움이다(일체개고)\"라고 지혜로 볼 때, 괴로움에서 벗어나게 된다. 이것이 청정에 이르는 길이다.", "z": "", "e": "All conditions are suffering— when this is seen with wisdom, one grows disillusioned with suffering: this is the path to purity.", "w": ["삼법인"]}, {"n": 279, "h": "“Sabbe dhammā anattā”ti, yadā paññāya passati; Atha nibbindati dukkhe, esa maggo visuddhiyā.", "r": "", "k": "\"모든 법에는 고정된 나가 없다(제법무아)\"고 지혜로 볼 때, 괴로움에서 벗어나게 된다. 이것이 청정에 이르는 길이다.", "z": "", "e": "All things are not-self— when this is seen with wisdom, one grows disillusioned with suffering: this is the path to purity.", "w": ["무아", "삼법인"]}, {"n": 280, "h": "Uṭṭhānakālamhi anuṭṭhahāno, Yuvā balī ālasiyaṁ upeto; Saṁsannasaṅkappamano kusīto, Paññāya maggaṁ alaso na vindati.", "r": "", "k": "일어나야 할 때 일어나지 않고, 젊고 힘이 있으면서도 게으르며, 생각이 가라앉고 나태한 이는 지혜로 길을 찾지 못한다.", "z": "", "e": "They don’t get going when it’s time to start; they’re young and strong, but given to sloth. Their mind depressed in sunken thought, lazy and slothful, they can’t discern the path.", "w": ["불방일"]}, {"n": 281, "h": "Vācānurakkhī manasā susaṁvuto, Kāyena ca nākusalaṁ kayirā; Ete tayo kammapathe visodhaye, Ārādhaye maggamisippaveditaṁ.", "r": "", "k": "말을 조심하고 마음을 절제하며 몸으로 악을 짓지 말라. 이 세 가지 업의 길을 깨끗이 하면 성자가 가르친 길을 얻으리라.", "z": "", "e": "Guarded in speech, restrained in mind, doing no unskillful bodily deed. Purify these three ways of performing deeds, and win the path known to seers.", "w": ["삼업"]}, {"n": 282, "h": "Yogā ve jāyatī bhūri, ayogā bhūrisaṅkhayo; Etaṁ dvedhāpathaṁ ñatvā, bhavāya vibhavāya ca; Tathāttānaṁ niveseyya, yathā bhūri pavaḍḍhati.", "r": "", "k": "수행에서 지혜가 생기고, 수행하지 않으면 지혜가 사라진다. 얻음과 잃음의 이 두 길을 알아 지혜가 자라도록 스스로를 이끌어라.", "z": "", "e": "From meditation springs wisdom, without meditation, wisdom ends. Knowing these two paths— of progress and decline— you should conduct yourself so that wisdom grows.", "w": ["지혜"]}, {"n": 283, "h": "Vanaṁ chindatha mā rukkhaṁ, vanato jāyate bhayaṁ; Chetvā vanañca vanathañca, nibbanā hotha bhikkhavo.", "r": "", "k": "나무 한 그루가 아니라 숲(욕망) 전체를 베어라. 숲에서 두려움이 생긴다. 비구들이여, 숲과 덤불을 베어 숲에서 벗어나라.", "z": "", "e": "Cut down the jungle, not just a tree; from the jungle springs fear. Having cut down jungle and snarl, be free of jungles, mendicants!", "w": ["비구"]}, {"n": 284, "h": "Yāva hi vanatho na chijjati, Aṇumattopi narassa nārisu; Paṭibaddhamanova tāva so, Vaccho khīrapakova mātari.", "r": "", "k": "이성에 대한 욕망이 조금이라도 끊어지지 않는 한, 그의 마음은 젖을 먹는 송아지가 어미 소에 매여 있듯 묶여 있다.", "z": "", "e": "So long as the vine, no matter how small, that ties a man to women is not cut, his mind remains trapped, like a calf suckling its mother.", "w": ["탐욕"]}, {"n": 285, "h": "Ucchinda sinehamattano, Kumudaṁ sāradikaṁva pāṇinā; Santimaggameva brūhaya, Nibbānaṁ sugatena desitaṁ.", "r": "", "k": "가을 연꽃을 손으로 꺾듯 자신에 대한 애착을 끊어라. 부처님께서 가르치신 열반, 고요함의 길을 닦아라.", "z": "", "e": "Cut out affection for oneself, like plucking an autumn lotus. Foster only the path to peace, the extinguishment the Holy One taught.", "w": ["열반"]}, {"n": 286, "h": "Idha vassaṁ vasissāmi, idha hemantagimhisu; Iti bālo vicinteti, antarāyaṁ na bujjhati.", "r": "", "k": "\"우기에는 여기 살고, 겨울과 여름에는 여기 살리라.\" 어리석은 이는 이렇게 생각하며 다가오는 위험(죽음)을 알지 못한다.", "z": "", "e": "“Here I will stay for the rains; here for winter, here the summer”; thus the fool thinks, not realizing the danger.", "w": ["무상"]}, {"n": 287, "h": "Taṁ puttapasusammattaṁ, byāsattamanasaṁ naraṁ; Suttaṁ gāmaṁ mahoghova, maccu ādāya gacchati.", "r": "", "k": "자식과 가축에 마음이 빠져 집착하는 사람을, 잠든 마을을 큰물이 휩쓸어 가듯 죽음이 데려간다.", "z": "", "e": "As a mighty flood sweeps away a sleeping village, death steals away a man who dotes on children and cattle, his mind caught up in them.", "w": []}, {"n": 288, "h": "Na santi puttā tāṇāya, na pitā nāpi bandhavā; Antakenādhipannassa, natthi ñātīsu tāṇatā.", "r": "", "k": "자식도 아버지도 친척도 지켜 주지 못한다. 죽음에 붙잡힌 이를 친척들은 지켜 줄 수 없다.", "z": "", "e": "Children provide you no shelter, nor does father, nor relatives. When you’re seized by the terminator, there’s no shelter in family.", "w": []}, {"n": 289, "h": "Etamatthavasaṁ ñatvā, paṇḍito sīlasaṁvuto; Nibbānagamanaṁ maggaṁ, khippameva visodhaye.", "r": "", "k": "이 이치를 알아 지혜롭고 계행을 지키는 이는, 열반에 이르는 길을 서둘러 닦아야 한다.", "z": "", "e": "Knowing the reason for this, astute, and ethically restrained, one would quickly clear the path that leads to extinguishment.", "w": ["계행", "열반"]}], "soon": false}, {"id": "d21", "t": "제21품 광연품", "te": "Ch. 21: Miscellaneous", "h": "廣衍品", "by": "290~305번 게송 (16구절)", "bye": "Verses 290–305", "d": "여러 가르침", "de": "Miscellaneous", "items": [{"n": 290, "h": "Mattāsukhapariccāgā, passe ce vipulaṁ sukhaṁ; Caje mattāsukhaṁ dhīro, sampassaṁ vipulaṁ sukhaṁ.", "r": "", "k": "작은 즐거움을 버려서 큰 행복을 볼 수 있다면, 지혜로운 이는 큰 행복을 보고 작은 즐거움을 버린다.", "z": "", "e": "If by giving up material happiness one sees abundant happiness, the attentive would give up material happiness, seeing the abundant happiness.", "w": []}, {"n": 291, "h": "Paradukkhūpadhānena, attano sukhamicchati; Verasaṁsaggasaṁsaṭṭho, verā so na parimuccati.", "r": "", "k": "남에게 괴로움을 주어 자기 행복을 구하는 이는 원한에 얽혀 원한에서 벗어나지 못한다.", "z": "", "e": "Seeking their own happiness by imposing suffering on others, intimate with enmity, they’re not freed from enmity.", "w": []}, {"n": 292, "h": "Yañhi kiccaṁ apaviddhaṁ, akiccaṁ pana karīyati; Unnaḷānaṁ pamattānaṁ, tesaṁ vaḍḍhanti āsavā.", "r": "", "k": "해야 할 일은 버려두고 해서는 안 될 일을 하는 거만하고 방일한 이에게는 번뇌가 늘어난다.", "z": "", "e": "They dump what should be done, and do what should not be done. For the insolent and the negligent, their defilements only grow.", "w": ["번뇌"]}, {"n": 293, "h": "Yesañca susamāraddhā, niccaṁ kāyagatā sati; Akiccaṁ te na sevanti, kicce sātaccakārino; Satānaṁ sampajānānaṁ, atthaṁ gacchanti āsavā.", "r": "", "k": "늘 몸을 살피는 마음챙김을 잘 닦는 이는 해서는 안 될 일을 하지 않고 해야 할 일을 늘 한다. 마음챙기고 바르게 아는 이에게는 번뇌가 다한다.", "z": "", "e": "Those that have properly undertaken constant mindfulness of the body, don’t cultivate what should not be done, but always do what should be done. Mindful and aware, their defilements come to an end.", "w": ["정념", "번뇌"]}, {"n": 294, "h": "Mātaraṁ pitaraṁ hantvā, rājāno dve ca khattiye; Raṭṭhaṁ sānucaraṁ hantvā, anīgho yāti brāhmaṇo.", "r": "", "k": "어머니(갈애)와 아버지(교만)를 죽이고, 두 왕(잘못된 두 견해)을 죽이고, 나라와 그 신하(감각과 집착)를 없앤 바라문은 괴로움 없이 나아간다.", "z": "294~295절은 비유입니다. 실제 사람이 아니라 마음속 번뇌를 없앤다는 뜻입니다.", "e": "Having slain mother and father, and two aristocratic kings, and having wiped out the kingdom with its tax collector, the brahmin walks on untroubled.", "w": ["바라문", "갈애"]}, {"n": 295, "h": "Mātaraṁ pitaraṁ hantvā, rājāno dve ca sotthiye; Veyagghapañcamaṁ hantvā, anīgho yāti brāhmaṇo.", "r": "", "k": "어머니와 아버지를 죽이고, 두 바라문 왕을 죽이고, 다섯째로 호랑이(다섯 가지 장애)를 죽인 바라문은 괴로움 없이 나아간다.", "z": "", "e": "Having slain mother and father, and two prosperous kings, and a tiger as the fifth, the brahmin walks on untroubled.", "w": ["바라문"]}, {"n": 296, "h": "Suppabuddhaṁ pabujjhanti, sadā gotamasāvakā; Yesaṁ divā ca ratto ca, niccaṁ buddhagatā sati.", "r": "", "k": "밤낮으로 늘 부처님을 생각하는 고따마(부처님)의 제자들은 늘 상쾌하게 깨어난다.", "z": "296~301절: 무엇을 생각하며 사느냐가 그 사람을 만듭니다.", "e": "The disciples of Gotama always wake up refreshed, who day and night constantly recollect the Buddha.", "w": ["부처"]}, {"n": 297, "h": "Suppabuddhaṁ pabujjhanti, sadā gotamasāvakā; Yesaṁ divā ca ratto ca, niccaṁ dhammagatā sati.", "r": "", "k": "밤낮으로 늘 가르침을 생각하는 고따마의 제자들은 늘 상쾌하게 깨어난다.", "z": "", "e": "The disciples of Gotama always wake up refreshed, who day and night constantly recollect the teaching.", "w": []}, {"n": 298, "h": "Suppabuddhaṁ pabujjhanti, sadā gotamasāvakā; Yesaṁ divā ca ratto ca, niccaṁ saṅghagatā sati.", "r": "", "k": "밤낮으로 늘 승가를 생각하는 고따마의 제자들은 늘 상쾌하게 깨어난다.", "z": "", "e": "The disciples of Gotama always wake up refreshed, who day and night constantly recollect the Saṅgha.", "w": ["삼보"]}, {"n": 299, "h": "Suppabuddhaṁ pabujjhanti, sadā gotamasāvakā; Yesaṁ divā ca ratto ca, niccaṁ kāyagatā sati.", "r": "", "k": "밤낮으로 늘 몸을 살피며 마음챙기는 고따마의 제자들은 늘 상쾌하게 깨어난다.", "z": "", "e": "The disciples of Gotama always wake up refreshed, who day and night are constantly mindful of the body.", "w": ["정념"]}, {"n": 300, "h": "Suppabuddhaṁ pabujjhanti, sadā gotamasāvakā; Yesaṁ divā ca ratto ca, ahiṁsāya rato mano.", "r": "", "k": "밤낮으로 늘 해치지 않음을 기뻐하는 고따마의 제자들은 늘 상쾌하게 깨어난다.", "z": "", "e": "The disciples of Gotama always wake up refreshed, whose minds day and night delight in harmlessness.", "w": []}, {"n": 301, "h": "Suppabuddhaṁ pabujjhanti, sadā gotamasāvakā; Yesaṁ divā ca ratto ca, bhāvanāya rato mano.", "r": "", "k": "밤낮으로 늘 마음 닦음을 기뻐하는 고따마의 제자들은 늘 상쾌하게 깨어난다.", "z": "", "e": "The disciples of Gotama always wake up refreshed, whose minds day and night delight in meditation.", "w": []}, {"n": 302, "h": "Duppabbajjaṁ durabhiramaṁ, Durāvāsā gharā dukhā; Dukkhosamānasaṁvāso, Dukkhānupatitaddhagū; Tasmā na caddhagū siyā, Na ca dukkhānupatito siyā.", "r": "", "k": "출가하기도 어렵고 그 안에서 즐겁기도 어렵다. 집에서 사는 것도 어렵고 괴롭다. 마음 맞지 않는 이와 사는 것도 괴롭고, 윤회의 나그네가 되는 것도 괴롭다. 그러니 나그네가 되지 말고 괴로움에 빠지지 말라.", "z": "", "e": "Going forth is hard, it’s hard to be happy; life at home is hard too, and painful, it’s painful to stay when you’ve nothing in common. A traveler is a prey to pain, so don’t be a traveler, don’t be prey to pain.", "w": ["출가", "윤회"]}, {"n": 303, "h": "Saddho sīlena sampanno, yasobhogasamappito; Yaṁ yaṁ padesaṁ bhajati, tattha tattheva pūjito.", "r": "", "k": "믿음과 계행을 갖추고 명성과 재산을 지닌 이는 어느 곳에 가든 그곳에서 존경받는다.", "z": "", "e": "One who is faithful, accomplished in ethics, blessed with fame and wealth, is honored in whatever place they frequent.", "w": ["계행"]}, {"n": 304, "h": "Dūre santo pakāsenti, himavantova pabbato; Asantettha na dissanti, rattiṁ khittā yathā sarā.", "r": "", "k": "착한 이는 히말라야처럼 멀리서도 빛나고, 악한 이는 밤에 쏜 화살처럼 가까이 있어도 보이지 않는다.", "z": "", "e": "The good shine from afar, like the Himalayan peaks, but the wicked are not seen, like arrows scattered in the night.", "w": []}, {"n": 305, "h": "Ekāsanaṁ ekaseyyaṁ, eko caramatandito; Eko damayamattānaṁ, vanante ramito siyā.", "r": "", "k": "홀로 앉고 홀로 눕고 홀로 다니며 게으르지 않고, 홀로 자신을 다스리는 이는 숲속에서 즐거움을 누린다.", "z": "", "e": "Sitting alone, sleeping alone, tirelessly wandering alone; one who tames themselves alone would delight within a forest.", "w": []}], "soon": false}, {"id": "d22", "t": "제22품 지옥품", "te": "Ch. 22: Hell", "h": "地獄品", "by": "306~319번 게송 (14구절)", "bye": "Verses 306–319", "d": "지옥", "de": "Hell", "items": [{"n": 306, "h": "Abhūtavādī nirayaṁ upeti, Yo vāpi katvā na karomi cāha; Ubhopi te pecca samā bhavanti, Nihīnakammā manujā parattha.", "r": "", "k": "거짓말하는 이는 지옥에 간다. 하고도 안 했다고 하는 이도 그렇다. 이 둘은 저 세상에서 똑같이 비천한 업을 받는다.", "z": "", "e": "A liar goes to hell, as does one who denies what they did. Both are equal in the hereafter, those men of base deeds.", "w": ["오계"]}, {"n": 307, "h": "Kāsāvakaṇṭhā bahavo, pāpadhammā asaññatā; Pāpā pāpehi kammehi, nirayaṁ te upapajjare.", "r": "", "k": "가사를 목에 걸고도 악하고 절제하지 않는 이가 많다. 그 악한 이들은 악업 때문에 지옥에 태어난다.", "z": "", "e": "Many who wear a scrap of ocher cloth are unrestrained and wicked. Being wicked, they are reborn in hell due to their bad deeds.", "w": ["가사"]}, {"n": 308, "h": "Seyyo ayoguḷo bhutto, tatto aggisikhūpamo; Yañce bhuñjeyya dussīlo, raṭṭhapiṇḍamasaññato.", "r": "", "k": "계행 없이 절제하지 않는 이가 나라의 공양을 받아먹는 것보다, 불꽃처럼 뜨거운 쇳덩이를 삼키는 것이 차라리 낫다.", "z": "", "e": "It’d be better for the immoral and unrestrained to eat an iron ball, scorching, like a burning flame, than to eat the nation’s alms.", "w": ["계행", "공양"]}, {"n": 309, "h": "Cattāri ṭhānāni naro pamatto, Āpajjati paradārūpasevī; Apuññalābhaṁ na nikāmaseyyaṁ, Nindaṁ tatīyaṁ nirayaṁ catutthaṁ.", "r": "", "k": "방일하여 남의 아내를 가까이하는 사람에게는 네 가지가 닥친다. 악업, 편히 못 자는 잠, 나쁜 평판, 그리고 지옥이다.", "z": "", "e": "Four things befall a heedless man who sleeps with another’s wife: wickedness, poor sleep, ill-repute, and rebirth in hell.", "w": ["오계"]}, {"n": 310, "h": "Apuññalābho ca gatī ca pāpikā, Bhītassa bhītāya ratī ca thokikā; Rājā ca daṇḍaṁ garukaṁ paṇeti, Tasmā naro paradāraṁ na seve.", "r": "", "k": "악업을 짓고 나쁜 곳에 태어나며, 두려움 속의 즐거움은 짧고 왕은 무거운 벌을 내린다. 그러므로 남의 아내를 가까이하지 말라.", "z": "", "e": "He accrues wickedness and is reborn in a bad place, all so a frightened couple may snatch a moment’s pleasure, for which rulers impose a heavy punishment. That’s why a man should not sleep with another’s wife.", "w": []}, {"n": 311, "h": "Kuso yathā duggahito, hatthamevānukantati; Sāmaññaṁ dupparāmaṭṭhaṁ, nirayāyupakaḍḍhati.", "r": "", "k": "꾸사 풀을 잘못 잡으면 손을 베이듯, 출가 생활을 잘못하면 지옥으로 끌려간다.", "z": "", "e": "When kusa grass is wrongly grasped it only cuts the hand. So too, the ascetic life, when wrongly taken, drags you to hell.", "w": ["출가"]}, {"n": 312, "h": "Yaṁ kiñci sithilaṁ kammaṁ, saṅkiliṭṭhañca yaṁ vataṁ; Saṅkassaraṁ brahmacariyaṁ, na taṁ hoti mahapphalaṁ.", "r": "", "k": "느슨한 행동, 더럽혀진 계율, 의심스러운 수행은 큰 결실을 맺지 못한다.", "z": "", "e": "Any lax act, any corrupt observance, or suspicious spiritual life, is not very fruitful.", "w": []}, {"n": 313, "h": "Kayirā ce kayirāthenaṁ, daḷhamenaṁ parakkame; Sithilo hi paribbājo, bhiyyo ākirate rajaṁ.", "r": "", "k": "해야 할 일이라면 굳건히 힘써서 하라. 느슨한 출가 생활은 먼지만 더 일으킬 뿐이다.", "z": "", "e": "If one is to do what should be done, one should staunchly strive. For the life gone forth when laxly led just stirs up dust all the more.", "w": []}, {"n": 314, "h": "Akataṁ dukkaṭaṁ seyyo, pacchā tappati dukkaṭaṁ; Katañca sukataṁ seyyo, yaṁ katvā nānutappati.", "r": "", "k": "나쁜 일은 하지 않는 것이 낫다. 나쁜 일은 나중에 괴로움을 준다. 좋은 일은 하는 것이 낫다. 하고 나서 괴로움이 없다.", "z": "", "e": "A bad deed is better left undone, for it will plague you later on. A good deed is better done, one that does not plague you.", "w": []}, {"n": 315, "h": "Nagaraṁ yathā paccantaṁ, guttaṁ santarabāhiraṁ; Evaṁ gopetha attānaṁ, khaṇo vo mā upaccagā; Khaṇātītā hi socanti, nirayamhi samappitā.", "r": "", "k": "국경의 성을 안팎으로 지키듯 자신을 지켜라. 이 순간을 놓치지 말라. 순간을 놓친 이는 지옥에 떨어져 슬퍼한다.", "z": "", "e": "As a frontier city is guarded inside and out, so you should ward yourselves— don’t let the moment pass you by. For if you miss your moment you’ll grieve when sent to hell.", "w": ["불방일"]}, {"n": 316, "h": "Alajjitāye lajjanti, lajjitāye na lajjare; Micchādiṭṭhisamādānā, sattā gacchanti duggatiṁ.", "r": "", "k": "부끄러워할 것을 부끄러워하지 않고, 부끄러워하지 않을 것을 부끄러워하는 사람, 그릇된 견해를 지닌 이는 나쁜 곳에 간다.", "z": "", "e": "Unashamed of what is shameful, ashamed of what is not shameful; beings who uphold wrong view go to a bad place.", "w": []}, {"n": 317, "h": "Abhaye bhayadassino, bhaye cābhayadassino; Micchādiṭṭhisamādānā, sattā gacchanti duggatiṁ.", "r": "", "k": "두렵지 않은 것을 두려워하고 두려워해야 할 것을 두려워하지 않는 사람, 그릇된 견해를 지닌 이는 나쁜 곳에 간다.", "z": "", "e": "Seeing danger where there is none, and blind to the actual danger, beings who uphold wrong view go to a bad place.", "w": []}, {"n": 318, "h": "Avajje vajjamatino, vajje cāvajjadassino; Micchādiṭṭhisamādānā, sattā gacchanti duggatiṁ.", "r": "", "k": "허물 아닌 것을 허물로 보고 허물을 허물로 보지 않는 사람, 그릇된 견해를 지닌 이는 나쁜 곳에 간다.", "z": "", "e": "Seeing fault where there is none, and blind to the actual fault, beings who uphold wrong view go to a bad place.", "w": []}, {"n": 319, "h": "Vajjañca vajjato ñatvā, avajjañca avajjato; Sammādiṭṭhisamādānā, sattā gacchanti suggatiṁ.", "r": "", "k": "허물을 허물로, 허물 아닌 것을 허물 아닌 것으로 아는 사람, 바른 견해를 지닌 이는 좋은 곳에 간다.", "z": "", "e": "Knowing a fault as a fault and the faultless as faultless, beings who uphold right view go to a good place.", "w": []}], "soon": false}, {"id": "d23", "t": "제23품 상유품", "te": "Ch. 23: Elephants", "h": "象喩品", "by": "320~333번 게송 (14구절)", "bye": "Verses 320–333", "d": "코끼리에 빗댄 가르침", "de": "Elephants", "items": [{"n": 320, "h": "Ahaṁ nāgova saṅgāme, cāpato patitaṁ saraṁ; Ativākyaṁ titikkhissaṁ, dussīlo hi bahujjano.", "r": "", "k": "싸움터의 코끼리가 화살을 견디듯 나는 비난을 참으리라. 세상에는 나쁜 행실을 가진 이가 많기 때문이다.", "z": "부처님께서 모욕을 받으셨을 때 하신 말씀으로 전해집니다.", "e": "Like an elephant struck with arrows in battle, I shall endure abuse, for so many folk are badly behaved.", "w": ["인욕"]}, {"n": 321, "h": "Dantaṁ nayanti samitiṁ, dantaṁ rājābhirūhati; Danto seṭṭho manussesu, yotivākyaṁ titikkhati.", "r": "", "k": "길들인 코끼리를 사람들 앞에 내세우고, 길들인 코끼리에 왕이 오른다. 비난을 참아 내는 길들여진 사람이 사람 가운데 으뜸이다.", "z": "", "e": "The well-tamed beast is the one led to the crowd; the tamed elephant’s the one the king mounts; the tamed person who endures abuse is the best of human beings.", "w": ["인욕"]}, {"n": 322, "h": "Varamassatarā dantā, ājānīyā ca sindhavā; Kuñjarā ca mahānāgā, attadanto tato varaṁ.", "r": "", "k": "잘 길들인 노새도 훌륭하고, 신두 지방의 명마도 훌륭하며, 큰 코끼리도 훌륭하다. 그러나 자신을 길들인 사람은 그보다 더 훌륭하다.", "z": "", "e": "Those who have tamed themselves are better than fine tamed mules, thoroughbreds from Sindh, or giant tuskers.", "w": []}, {"n": 323, "h": "Na hi etehi yānehi, gaccheyya agataṁ disaṁ; Yathāttanā sudantena, danto dantena gacchati.", "r": "", "k": "그런 탈것으로는 아무도 가 보지 못한 곳(열반)에 갈 수 없다. 자신을 잘 길들인 사람만이 그 길들여진 자신으로 그곳에 간다.", "z": "", "e": "For not on those mounts would you go to the untrodden place, whereas, with the help of one whose self is well tamed, you go there, tamed by the tamed.", "w": ["열반"]}, {"n": 324, "h": "Dhanapālo nāma kuñjaro, Kaṭukabhedano dunnivārayo; Baddho kabaḷaṁ na bhuñjati, Sumarati nāgavanassa kuñjaro.", "r": "", "k": "다나빨라라는 코끼리는 발정기에 사나워 다루기 어렵다. 묶여 있으면 한 입도 먹지 않고 코끼리 숲만 그리워한다.", "z": "", "e": "The tusker named Dhanapāla is musky in rut, hard to control. Bound, he eats not a morsel, for he misses the elephant forest.", "w": []}, {"n": 325, "h": "Middhī yadā hoti mahagghaso ca, Niddāyitā samparivattasāyī; Mahāvarāhova nivāpapuṭṭho,
