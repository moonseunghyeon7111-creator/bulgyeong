<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>소도불경공부</title>
<meta name="theme-color" content="#5a1e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="불경공부">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--paper:#f5eedd;--paper2:#ece1c6;--card:#fcf8ee;--ink:#2b1d16;--ink2:#5d4a3c;--muted:#8c7762;
  --red:#8e2a1c;--gold:#c08a2e;--line:#dccba6;--head:#5a1e14;--green:#5f7f4a;--fs:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:"Noto Serif KR","Nanum Myeongjo","Batang","AppleMyungjo",serif;line-height:1.7;min-height:100vh;
  background-image:radial-gradient(rgba(150,110,60,.06) 1px,transparent 1px);background-size:6px 6px}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--head);color:#f6e7c6;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
header h1{flex:1;margin:0;font-size:1.12rem;letter-spacing:.06em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{background:none;border:0;width:42px;height:42px;border-radius:10px;font-size:1.35rem;color:#f6e7c6;cursor:pointer}
.hbtn:active{background:rgba(255,255,255,.12)}
main{max-width:720px;margin:0 auto;padding:14px 14px calc(92px + env(safe-area-inset-bottom))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--head);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;min-width:0;background:none;border:0;color:#d6bf9a;padding:6px 0;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs .i{font-size:1.3rem;line-height:1}
nav.tabs button.on{color:#ffe0a0}
.hero{text-align:center;padding:16px 8px 4px}
.lotus{font-size:2.4rem;line-height:1}
.hero h2{margin:6px 0 2px;font-size:1.65rem;letter-spacing:.12em}
.hero p{margin:0;color:var(--muted);font-size:.92rem}
.sec{margin:22px 4px 8px;font-size:1rem;color:var(--ink2);display:flex;align-items:center;gap:8px}
.sec:before{content:"";width:4px;height:1.1em;background:var(--red);border-radius:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px;margin:10px 0;box-shadow:0 1px 3px rgba(80,50,20,.08)}
.today{border:2px solid var(--gold);background:linear-gradient(#fdf8ec,#f7eed8)}
.lbl{color:var(--red);font-weight:700;font-size:.85rem;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
.h{font-size:calc(1.22rem * var(--fs));line-height:1.75;font-weight:700;word-break:keep-all;letter-spacing:.03em}
.r{font-size:calc(.95rem * var(--fs));color:var(--ink2);margin-top:4px;word-break:keep-all}
.k{font-size:calc(1.04rem * var(--fs));margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);word-break:keep-all}
.ez{margin-top:10px;background:#eef2e4;border-left:4px solid var(--green);border-radius:8px;padding:8px 10px;font-size:calc(.95rem * var(--fs));word-break:keep-all}
.ez .el{display:block;font-size:.78rem;color:#4b6a37;font-weight:700}
.en{font-family:Georgia,"Times New Roman",serif;font-size:calc(1.02rem * var(--fs));line-height:1.6;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);color:#33465e}
.terms{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.term{background:#f6e6c2;border:1px solid #e2c98f;color:#6b3f12;border-radius:14px;padding:2px 10px;font-size:.85rem;cursor:pointer}
.h.pali{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-style:italic;font-size:calc(1.05rem * var(--fs));letter-spacing:0;color:#4a3528}
.hide-h .h,.hide-r .r,.hide-z .ez{display:none}
.study .k,.study .en{filter:blur(6px);cursor:pointer;transition:filter .2s}
.study .k.show,.study .en.show{filter:none}
.meta{display:flex;align-items:center;justify-content:space-between;margin-top:10px;color:var(--muted);font-size:.8rem;gap:6px}
.meta a{color:var(--muted)}
.star{background:none;border:0;font-size:1.45rem;cursor:pointer;color:#c9b48d;padding:0 4px;line-height:1}
.star.on{color:#d18f12}
.say{background:none;border:1px solid var(--line);border-radius:16px;padding:2px 10px;font-size:.85rem;color:var(--ink2);cursor:pointer;margin-left:auto}
.say.on{background:var(--red);color:#fff;border-color:var(--red)}
.card.speaking{outline:3px solid var(--green)}
.num{display:inline-block;min-width:1.8em;color:var(--red);font-weight:700}
.step{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;cursor:pointer;position:relative}
.step:active{background:var(--paper2)}
.step .no{flex:none;width:38px;height:38px;border-radius:50%;background:var(--head);color:#f6e7c6;display:flex;align-items:center;justify-content:center;font-size:.95rem;font-weight:700}
.step .tt{flex:1;min-width:0}
.step .tt b{font-size:1.08rem}
.step .tt .hz{color:var(--muted);font-size:.85rem;margin-left:6px}
.step .tt small{display:block;color:var(--ink2);font-size:.84rem;word-break:keep-all}
.badge{display:inline-block;font-size:.7rem;border-radius:8px;padding:1px 7px;margin-right:6px;color:#fff;vertical-align:2px}
.lv0{background:#8c7762}.lv1{background:#5f7f4a}.lv2{background:#b07a1e}.lv3{background:#8e2a1c}
.step.soon{opacity:.62}
.step .go{color:var(--muted);font-size:1.2rem}
.soontag{font-size:.72rem;color:var(--red);border:1px solid var(--red);border-radius:8px;padding:0 6px;margin-left:6px;vertical-align:2px}
.chhead{text-align:center;margin:6px 0 12px}
.chhead .hz{font-size:1.5rem;letter-spacing:.18em;font-weight:700}
.chhead .d{color:var(--ink2);font-size:.92rem}
.chhead .by{color:var(--muted);font-size:.85rem}
.about{background:#f8f0dc;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.about p{margin:6px 0;font-size:calc(.97rem * var(--fs));word-break:keep-all}
.about p.en2{font-family:Georgia,serif;color:#33465e}
.about h3{margin:0 0 4px;font-size:1rem;color:var(--red)}
.pager{display:flex;gap:8px;margin-top:18px}
.pager button,.btn{flex:1;background:var(--head);color:#f6e7c6;border:0;border-radius:12px;padding:12px;cursor:pointer;font-size:.95rem}
.pager button:disabled{opacity:.3}
.btn.alt{background:var(--gold);color:#2b1d16}
.search{display:flex;gap:8px;margin:4px 0 12px}
.search input{flex:1;font:inherit;font-size:1.05rem;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fffdf6;color:var(--ink)}
mark{background:#f6d77e;color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--muted);padding:36px 10px}
.opt{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.opt .t b{display:block}.opt .t small{color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:#fffdf6;padding:8px 12px;cursor:pointer;font-size:.92rem}
.seg button.on{background:var(--head);color:#f6e7c6}
.gl{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.gl b{font-size:calc(1.06rem * var(--fs))}
.gl .kk{color:var(--red);font-size:.95rem;margin-left:6px}
.gl p{margin:5px 0 0;font-size:calc(.95rem * var(--fs));word-break:keep-all}
.gl p.en2{font-family:Georgia,serif;color:#33465e}
.chant{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin:10px 0;text-align:center}
.chant .ln{margin:12px 0}
.chant .ln .h{font-size:calc(1.15rem * var(--fs))}
.chant .ln .r{font-size:calc(1.15rem * var(--fs));color:var(--ink);font-weight:700}
#pop{position:fixed;inset:0;background:rgba(30,15,8,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
#pop.on{display:flex}
#pop .box{background:var(--card);width:100%;max-width:720px;border-radius:18px 18px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.25)}
#pop .box b{font-size:1.3rem}
#pop .box .kk{color:var(--red);margin-left:8px;font-size:1.1rem}
#pop .box p{margin:8px 0 0;word-break:keep-all}
#pop .box p.en2{font-family:Georgia,serif;color:#33465e}
#pop .box button{margin-top:14px;width:100%}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(40,25,15,.92);color:#fff;padding:8px 16px;border-radius:20px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
.toast.on{opacity:1}
.foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:26px}
.langbar{display:flex;justify-content:center;margin:6px 0 2px}
</style>
</head>
<body>
<header>
  <button class="hbtn" id="back" aria-label="Back" style="visibility:hidden">‹</button>
  <h1 id="ttl">소도불경공부</h1>
  <button class="hbtn" id="rnd" aria-label="Random">🎲</button>
</header>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>
<div id="pop"><div class="box" id="popbox"></div></div>
<div class="toast" id="toast"></div>
<script>
// 소도불경공부 — 내용 데이터
// h: 원문(한문)  r: 한글 음  k: 해석  z: 쉬운 풀이  e: 영어  w: 용어(GLOSS 키)

const INTRO = [
  {id:'what', t:'불경이란 무엇인가요?', te:'What Are Buddhist Scriptures?', p:[
    ['불경(佛經)은 부처님의 가르침을 기록한 책입니다. "경(經)"은 본래 베를 짤 때 길게 걸어 두는 \'날실\'을 뜻하는 글자로, 세상을 꿰뚫는 변하지 않는 진리라는 뜻을 담고 있습니다.',
     'Buddhist scriptures (sutras) are records of the Buddha\'s teachings. The character 經 originally meant the long "warp threads" on a loom — a sign of truth that runs through everything and does not change.'],
    ['부처님은 글을 남기지 않으셨습니다. 열반(돌아가심) 후 제자들이 모여 "나는 이렇게 들었습니다(如是我聞 여시아문)"로 시작하며 들은 말씀을 함께 외워 확인했고, 이것이 오랜 세월 입으로 전해지다가 뒷날 글로 적혀 불경이 되었습니다.',
     'The Buddha himself wrote nothing. After his passing, his disciples gathered and recited together what they had heard, beginning with "Thus have I heard." These teachings were passed down by memory for centuries before being written down.'],
  ]},
  {id:'buddha', t:'부처님은 누구신가요?', te:'Who Was the Buddha?', p:[
    ['부처님의 본래 이름은 고타마 싯다르타로, 약 2,600년 전 지금의 네팔 지역 카필라국의 왕자로 태어나셨습니다. 늙음·병듦·죽음의 괴로움을 보고 29세에 궁궐을 떠나 수행하셨고, 35세에 보리수 아래에서 깨달음을 얻으셨습니다.',
     'The Buddha was born about 2,600 years ago as Prince Siddhartha Gautama of the Shakya clan, in what is now Nepal. Moved by the suffering of old age, sickness and death, he left the palace at 29 and attained awakening under the Bodhi tree at 35.'],
    ['"부처(佛, Buddha)"는 이름이 아니라 "깨달은 사람"이라는 뜻입니다. 그래서 불교는 "누구나 깨달으면 부처가 될 수 있다"고 가르칩니다. 석가모니(釋迦牟尼)는 "석가족의 성자"라는 뜻의 존칭입니다.',
     '"Buddha" is not a name but a title meaning "the Awakened One." Buddhism teaches that anyone can become a Buddha by awakening. "Shakyamuni" means "the sage of the Shakya clan."'],
  ]},
  {id:'tripitaka', t:'경·율·논 — 삼장(三藏)', te:'Sutra, Vinaya, Abhidharma — the Three Baskets', p:[
    ['불교의 책은 크게 세 바구니(삼장)로 나눕니다. ① 경(經) — 부처님의 말씀, ② 율(律) — 스님과 불자가 지킬 생활 규칙(계율), ③ 논(論) — 뒤의 큰스님들이 경전의 뜻을 풀어 정리한 해설서입니다.',
     'Buddhist texts are divided into "Three Baskets": (1) Sutra — the Buddha\'s words, (2) Vinaya — rules of conduct (precepts), and (3) Abhidharma/Shastra — commentaries by later masters explaining the meaning.'],
    ['이 세 가지를 모두 모은 것을 "대장경(大藏經)"이라 합니다. 우리나라 해인사에 보관된 고려 팔만대장경은 목판 8만 장이 넘는 세계적인 보물로, 유네스코 세계기록유산입니다.',
     'The complete collection is called the "Great Canon" (Daejanggyeong). The Goryeo Tripitaka Koreana at Haeinsa Temple, carved on more than 80,000 woodblocks, is a UNESCO Memory of the World treasure.'],
  ]},
  {id:'core', t:'꼭 알아야 할 핵심 가르침', te:'Core Teachings to Know', p:[
    ['삼보(三寶) — 불교의 세 가지 보배: 부처님(佛), 가르침(法), 함께 수행하는 스님과 대중(僧). 불자가 된다는 것은 이 삼보에 귀의(돌아가 의지함)하는 것입니다.',
     'The Three Jewels: the Buddha, the Dharma (teaching) and the Sangha (community). To become a Buddhist is to "take refuge" in these three.'],
    ['사성제(四聖諦) — 네 가지 거룩한 진리: 삶에는 괴로움이 있다(苦), 괴로움에는 원인(욕심·집착)이 있다(集), 괴로움은 사라질 수 있다(滅), 괴로움을 없애는 길이 있다(道).',
     'The Four Noble Truths: there is suffering; suffering has a cause (craving and clinging); suffering can end; and there is a path to end it.'],
    ['팔정도(八正道) — 괴로움을 없애는 여덟 가지 바른 길: 바르게 보기·생각하기·말하기·행동하기·생활하기·노력하기·마음 챙기기·집중하기.',
     'The Noble Eightfold Path: right view, intention, speech, action, livelihood, effort, mindfulness and concentration.'],
    ['오계(五戒) — 불자가 지키는 다섯 가지 약속: 생명을 죽이지 않기, 훔치지 않기, 그릇된 음행을 하지 않기, 거짓말하지 않기, 술 취하지 않기.',
     'The Five Precepts: not killing, not stealing, no sexual misconduct, not lying, and not becoming intoxicated.'],
  ]},
  {id:'korea', t:'한국 불교에서는 어떻게 공부하나요?', te:'How Is Buddhism Studied in Korea?', p:[
    ['한국 절의 스님 학교(강원)에서는 수백 년 동안 정해진 순서로 공부해 왔습니다. 가장 먼저 배우는 책이 바로 초발심자경문이고, 그 다음 서장·도서·선요·절요(사집), 이어서 능엄경·기신론·금강경·원각경(사교), 마지막으로 화엄경 등(대교)을 배웁니다.',
     'Korean monastic seminaries have followed a set curriculum for centuries. The very first text is the Chobalsim Jagyeongmun, followed by the "Four Collections," then the "Four Teachings" (including the Diamond Sutra), and finally the Avatamsaka (Flower Garland) Sutra.'],
    ['이 앱도 그 전통을 따라 초급(초발심자경문·반야심경) → 중급(법구경·천수경) → 고급(금강경) 순서로 차근차근 올라가도록 만들었습니다.',
     'This app follows that tradition, moving step by step from beginner (Chobalsim, Heart Sutra) to intermediate (Dhammapada, Thousand Hands Sutra) to advanced (Diamond Sutra).'],
  ]},
  {id:'how', t:'이 앱으로 공부하는 방법', te:'How to Study with This App', p:[
    ['① 공부 길의 순서대로 한 경전씩 읽으세요. ② 각 구절은 원문(한문) → 한글 음 → 해석 → 쉬운 풀이 순서로 보입니다. ③ 밑줄 친 낱말을 누르면 불교 용어의 뜻이 바로 나옵니다. ④ 🔊 듣기를 누르면 소리 내어 읽어 줍니다. ⑤ 마음에 닿는 구절은 ⭐로 모아 두세요.',
     '(1) Follow the study path one text at a time. (2) Each verse shows the original (Classical Chinese), Korean reading, translation and easy explanation. (3) Tap an underlined word to see its meaning. (4) Tap 🔊 to listen. (5) Save verses that move you with ⭐.'],
    ['초발심자경문에서는 "글을 외우며 그 뜻을 살펴야 하고, 소리만 따라가지 말라"고 가르칩니다. 뜻을 알고 읽는 것 — 그것이 이 앱의 목적입니다.',
     'The Chobalsim teaches: "Recite the text while contemplating its meaning; do not merely follow the sound." Reading with understanding — that is the purpose of this app.'],
  ]},
];

// 공부 길 (홈 메뉴 순서)
const PATH = [
  {id:'intro', lv:0, t:'불경이란?', te:'What Are the Sutras?', h:'入門', d:'불경·부처님·핵심 가르침 입문 안내', de:'Introduction to the sutras, the Buddha and core teachings', ready:true},
  {id:'chobal', lv:1, t:'초발심자경문', te:'Admonitions for Beginners', h:'初發心自警文', d:'처음 마음을 낸 사람을 위한 생활 가르침', de:'Guidance for those who have just set their hearts on the path', ready:true},
  {id:'heart', lv:1, t:'반야심경', te:'The Heart Sutra', h:'般若心經', d:'가장 짧고 많이 외우는 지혜의 핵심 경전', de:'The shortest and most recited sutra — the heart of wisdom', ready:true},
  {id:'dhamma', lv:2, t:'법구경', te:'The Dhammapada', h:'法句經', d:'부처님의 짧은 지혜 말씀 423구절 모음', de:'423 short verses of the Buddha\'s wisdom', ready:true},
  {id:'chunsu', lv:2, t:'천수경', te:'The Thousand Hands Sutra', h:'千手經', d:'한국 절에서 매일 독송하는 참회·발원의 경전', de:'Recited daily in Korean temples — repentance and vows', ready:false},
  {id:'diamond', lv:3, t:'금강경', te:'The Diamond Sutra', h:'金剛經', d:'"집착하지 말라" — 공(空) 사상의 대표 경전', de:'"Do not cling" — the great sutra of emptiness', ready:false},
];
const LEVELS = [['입문','Start'],['초급','Beginner'],['중급','Intermediate'],['고급','Advanced']];

// 경전 본문
const SUTRAS = {
chobal: {
  t:'초발심자경문', te:'Admonitions for Beginners (Chobalsim Jagyeongmun)', h:'初發心自警文',
  about:[
    ['"처음 발심한 사람이 스스로 경계하는 글"이라는 뜻입니다. 고려의 보조국사 지눌 스님의 「계초심학인문」, 신라의 원효 스님의 「발심수행장」, 고려의 야운 스님의 「자경문」 세 편을 한 권으로 묶은 책입니다.',
     'The title means "writings for beginners to admonish themselves." It combines three works: Jinul\'s "Admonitions to Beginning Students," Wonhyo\'s "Arouse Your Mind and Practice," and Yaun\'s "Self-Admonitions."'],
    ['조선 시대부터 600년 넘게 한국의 모든 스님이 출가해서 가장 먼저 배우는 교과서입니다. 어려운 철학보다 "어떻게 생활하고, 어떤 마음으로 공부할 것인가"를 가르치므로 처음 불교를 접하는 사람에게 가장 좋은 첫 책입니다.',
     'For over 600 years it has been the very first textbook for every Korean monk and nun. Rather than difficult philosophy, it teaches how to live and with what attitude to study — the ideal first book for anyone new to Buddhism.'],
  ],

  {id:'chosim', t:'계초심학인문', te:'Admonitions to Beginning Students', h:'誡初心學人文',

   about:[['지눌 스님이 순천 송광사(조계산)에서 수행 공동체(정혜결사)를 이끌며, 새로 들어온 수행자들에게 일러 준 생활 규칙과 마음가짐입니다. 친구 사귀기, 식사 예절, 말조심, 법문 듣는 자세까지 아주 구체적이어서 오늘날 우리 생활에도 그대로 적용됩니다.',

 '죄업':['罪業','잘못된 행동으로 지은 업과 그로 인한 장애.','Karmic obstruction','Hindrances created by wrongful deeds.'],
 '참회':['懺悔','지난 잘못을 뉘우치고(懺) 다시 짓지 않겠다고 다짐함(悔).','Repentance','Regretting past wrongs and resolving not to repeat them.'],
 '이참사참':['理懺事懺','이참: 죄의 본성이 공함을 깨닫는 참회. 사참: 절·염불 등 몸과 입으로 하는 참회.','Repentance in principle & practice','Realizing the empty nature of wrongdoing (principle); repenting through bows and chanting (practice).'],
 '진성':['眞性','변하지 않는 참된 성품. 불성(佛性).','True nature','The unchanging true nature; Buddha-nature.'],
 '연기':['緣起','모든 것은 원인과 조건(인연)이 모여 생겨나고, 흩어지면 사라진다는 불교의 근본 진리.','Dependent origination','All things arise from causes and conditions and cease when they disperse.'],
 '감응':['感應','정성에 부처님이 응답하심.','Response','The Buddha\'s response to sincere practice.'],
 '불사':['佛事','절을 짓거나 법회를 여는 등 부처님을 위한 좋은 일.','Buddhist works','Meritorious activities such as building temples or holding services.'],
 '주지':['住持','절을 책임지고 운영하는 스님.','Abbot','The monk in charge of a temple.'],
 '정념':['正念','바른 생각. 지금 이 순간을 놓치지 않고 깨어 있는 마음. 팔정도의 하나.','Right mindfulness','Awareness of the present moment; one of the Eightfold Path.'],
 '무애행':['無礙行','걸림 없는 행동. 깨달은 이의 자유로운 행동이지만, 흉내만 내며 계율을 어기는 것을 경계함.','Unhindered conduct','Free action of the awakened — warned against when imitated as an excuse to break precepts.'],
 '사미':['沙彌','십계를 받은 예비 스님.','Novice','A novice monk who has received the Ten Precepts.'],
 '종사':['宗師','가르침의 으뜸이 되는 큰스님.','Master','A great teacher of the tradition.'],
 '법문':['法門','부처님의 가르침. 또는 스님이 설하는 가르침.','Dharma talk','The Buddha\'s teaching, or a talk given by a teacher.'],
 '보리':['菩提','깨달음. 산스크리트어 "보디(bodhi)"의 소리 번역. 한국 진언에서는 "모지"로 읽음.','Bodhi','Awakening, enlightenment.'],
 '생사':['生死','태어나고 죽는 괴로움이 끝없이 되풀이되는 것(윤회).','Birth and death','The endless cycle of rebirth (samsara).'],
 '선각':['先覺','먼저 깨달은 사람. 스승.','Those awakened before','Teachers who awakened earlier.'],
 '정신':['正信','바른 믿음.','Right faith','Correct, well-founded faith.'],
 '무시':['無始','시작을 알 수 없는 아득한 옛날부터.','Beginningless','Since time without beginning.'],
 '삼독':['三毒','마음을 해치는 세 가지 독: 탐욕(貪)·성냄(瞋)·어리석음(癡).','Three poisons','Greed, anger and delusion.'],
 '방편':['方便','깨달음으로 이끌기 위한 여러 가지 지혜로운 수단.','Skillful means','Wise methods used to lead beings to awakening.'],
 '지혜':['智慧','사물의 참모습을 바르게 보는 힘. 반야(般若).','Wisdom','Seeing things as they truly are (prajna).'],
 '불퇴전':['不退轉','수행에서 물러서지 않음.','Non-retrogression','Never turning back from the path.'],
 '정혜':['定慧','선정(定, 고요히 집중된 마음)과 지혜(慧). 지눌 스님은 이 둘을 함께 닦으라고 가르침(정혜쌍수).','Concentration and wisdom','Meditative calm and insight, cultivated together.'],
 '견성':['見性','자기 마음의 참된 성품을 봄. 곧 깨달음.','Seeing one\'s nature','Seeing the true nature of one\'s own mind — awakening.'],
 '중생':['衆生','깨닫지 못하고 괴로움 속에 사는 모든 생명.','Sentient beings','All living beings not yet awakened.'],
 '복전':['福田','복을 심는 밭. 공경하고 베풀면 복이 자라는 대상.','Field of blessings','Those to whom offerings bring great merit.'],
 '지눌':['知訥','고려의 큰스님(1158~1210). 보조국사. 송광사에서 정혜결사를 이끌고 한국 선불교의 기틀을 세움.','Jinul','Great Korean Seon master of Goryeo; founder of the Jogye tradition at Songgwangsa.'],
 '마하':['摩訶','"크다, 위대하다"는 뜻의 산스크리트어 소리 번역.','Maha','"Great" in Sanskrit.'],
 '반야':['般若','지혜. 산스크리트어 "프라즈냐(prajna)"의 소리 번역. 사물의 참모습을 꿰뚫어 보는 지혜.','Prajna','Wisdom that sees the true nature of things.'],
 '바라밀다':['波羅蜜多','"저 언덕(깨달음)으로 건너감", 또는 "완성"이라는 뜻. 줄여서 바라밀.','Paramita','"Crossing to the other shore"; perfection.'],
 '관자재보살':['觀自在菩薩','관세음보살의 다른 이름. 세상을 자유자재로 살펴 중생을 구하는 자비의 보살.','Avalokiteshvara','The bodhisattva of compassion (Gwanseeum).'],
 '보살':['菩薩','보리살타(菩提薩埵)의 줄임말. 깨달음을 구하면서 동시에 중생을 돕는 수행자.','Bodhisattva','One who seeks awakening while helping all beings.'],
 '오온':['五蘊','나를 이루는 다섯 가지 무더기: 색(몸·물질)·수(느낌)·상(생각·이미지)·행(의지·작용)·식(의식).','Five aggregates','Form, feeling, perception, mental formations, consciousness.'],
 '공':['空','모든 것은 인연 따라 생겨나 고정된 실체가 없다는 뜻. "아무것도 없다"가 아니라 "고정된 것이 없다".','Emptiness (shunyata)','Things lack fixed, independent existence — not nothingness, but no fixed self.'],
 '사리자':['舍利子','사리불(舍利弗). 부처님의 십대제자 가운데 지혜가 가장 뛰어난 제자.','Shariputra','The Buddha\'s disciple foremost in wisdom.'],
 '색':['色','눈에 보이고 만질 수 있는 물질과 몸. (색깔이라는 뜻이 아님)','Form (rupa)','Matter and the physical body (not "color").'],
 '색즉시공':['色卽是空','"물질이 곧 공이다". 반야심경의 가장 유명한 구절.','Form is emptiness','The most famous line of the Heart Sutra.'],
 '법':['法','① 부처님의 가르침 ② 세상의 모든 존재와 현상. 반야심경의 "제법"은 ②의 뜻.','Dharma','(1) The teaching; (2) all phenomena.'],
 '육근':['六根','여섯 감각 기관: 눈·귀·코·혀·몸·뜻.','Six sense organs','Eye, ear, nose, tongue, body, mind.'],
 '육경':['六境','여섯 감각 대상: 모양·소리·냄새·맛·감촉·생각의 대상.','Six sense objects','Sight, sound, smell, taste, touch, mental objects.'],
 '십팔계':['十八界','육근 + 육경 + 육식(여섯 가지 인식) = 18가지 세계. 우리가 경험하는 모든 것.','Eighteen realms','Six organs, six objects and six consciousnesses.'],
 '무명':['無明','밝지 못함. 진리를 모르는 근본 어리석음. 모든 괴로움의 뿌리.','Ignorance','Fundamental not-knowing; the root of all suffering.'],
 '십이연기':['十二緣起','무명에서 시작해 늙음·죽음에 이르기까지 괴로움이 생겨나는 12단계.','Twelve links','The twelve links of dependent origination, from ignorance to old age and death.'],
 '사성제':['四聖諦','네 가지 거룩한 진리: 고(괴로움)·집(원인)·멸(소멸)·도(길).','Four Noble Truths','Suffering, its origin, its cessation and the path.'],
 '가애':['罣礙','걸림. 마음이 무엇에 걸려 막히는 것.','Hindrance','Obstruction of the mind.'],
 '전도몽상':['顚倒夢想','거꾸로 뒤바뀐 꿈같은 생각. 무상한 것을 영원하다고, 내가 아닌 것을 나라고 여기는 착각.','Upside-down dream thinking','Deluded views, like taking the impermanent as permanent.'],
 '열반':['涅槃','번뇌의 불이 꺼진 완전한 평화. 깨달음의 경지.','Nirvana','Perfect peace when the fire of afflictions is extinguished.'],
 '삼세':['三世','과거·현재·미래.','Three times','Past, present and future.'],
 '아뇩다라삼먁삼보리':['阿耨多羅三藐三菩提','"위없이 바르고 완전한 깨달음". 부처님의 깨달음.','Anuttara samyak sambodhi','Supreme, perfect awakening.'],
 '주':['呪','주문. 진언.','Mantra','A sacred phrase.'],
 '진언':['眞言','참된 말. 뜻을 번역하지 않고 소리 그대로 외우는 신비한 말씀(만트라).','Mantra','"True words" recited in their original sound.'],
 '삼보':['三寶','불교의 세 보배: 불(부처님)·법(가르침)·승(스님과 대중).','Three Jewels','Buddha, Dharma, Sangha.'],
 '팔정도':['八正道','괴로움을 없애는 여덟 가지 바른 길.','Eightfold Path','Right view, intention, speech, action, livelihood, effort, mindfulness, concentration.'],
 '삼장':['三藏','경장·율장·논장. 불교 경전 전체.','Tripitaka','The three baskets: sutra, vinaya, abhidharma.'],
 '마음':['心','불교에서 모든 것의 근본. 행복과 괴로움이 모두 마음에서 생긴다고 가르침.','Mind','The root of all experience; happiness and suffering both arise from the mind.'],
 '마라':['魔羅','수행을 방해하는 악마. 유혹·번뇌·죽음을 상징함.','Mara','The tempter; a symbol of temptation, defilements and death.'],
 '가사':['袈裟','스님이 입는 법복. 화려한 색을 피해 탁하게 물들인 옷.','Monastic robe','The dyed robe worn by monks and nuns.'],
 '탐욕':['貪欲','더 가지려는 욕심. 삼독의 하나.','Greed','Craving for more; one of the three poisons.'],
 '해탈':['解脫','번뇌의 속박에서 풀려나 자유로워짐.','Liberation','Freedom from the bonds of defilement.'],
 '불방일':['不放逸','게으르지 않고 늘 깨어 있음. 부처님의 마지막 유언이 "방일하지 말고 정진하라"였음.','Heedfulness','Diligent wakefulness; the Buddha\'s last words urged it.'],
 '선정':['禪定','마음을 한곳에 모아 고요히 집중한 상태.','Meditation (jhana)','A deeply calm, concentrated state of mind.'],
 '번뇌':['煩惱','마음을 괴롭히고 어지럽히는 모든 것: 욕심·화·어리석음 등.','Defilements','Afflictions that trouble the mind: greed, anger, delusion.'],
 '비구':['比丘','출가하여 구족계를 받은 남자 스님. 여자 스님은 비구니.','Bhikkhu','A fully ordained monk (a nun is a bhikkhuni).'],
 '무상':['無常','모든 것은 변하고 영원한 것은 없음. 삼법인의 하나.','Impermanence','Everything changes; nothing lasts forever.'],
 '무아':['無我','고정된 "나"라는 실체는 없음. 삼법인의 하나.','Not-self','There is no fixed, permanent self.'],
 '계행':['戒行','계율을 지키는 바른 행동.','Virtue','Ethical conduct; keeping the precepts.'],
 '윤회':['輪廻','수레바퀴가 돌듯 태어나고 죽기를 끝없이 되풀이함.','Samsara','The endless round of birth and death.'],
 '업':['業','몸·말·생각으로 짓는 행위. 반드시 그 결과(과보)가 따름.','Karma','Intentional action of body, speech and mind, which bears results.'],
 '갈애':['渴愛','목마른 사람이 물을 찾듯 끝없이 바라는 욕망. 괴로움의 원인.','Craving (tanha)','Thirst-like desire; the cause of suffering.'],
 '인욕':['忍辱','욕됨과 어려움을 참고 견딤. 육바라밀의 하나.','Patience','Patient endurance of insult and hardship.'],
 '칠불통계게':['七佛通戒偈','과거 일곱 부처님이 공통으로 가르친 게송. "모든 악을 짓지 말고, 모든 선을 행하며, 마음을 깨끗이 하라."','Verse common to all Buddhas','"Do no evil, do good, purify the mind."'],
 '수다원':['須陀洹','깨달음의 흐름에 처음 들어선 성자. 성자의 네 단계 중 첫째.','Stream-enterer','The first of the four stages of awakening.'],
 '부처':['佛','깨달은 이. 석가모니 부처님을 비롯해 진리를 깨달은 분.','Buddha','"The Awakened One."'],
 '여래':['如來','"진리에서 오신 분". 부처님을 부르는 열 가지 이름 중 하나.','Tathagata','"Thus-come one" — a title of the Buddha.'],
 '삼업':['三業','몸(身)·말(口)·생각(意)으로 짓는 세 가지 업.','Three kinds of karma','Actions of body, speech and mind.'],
 '삼법인':['三法印','불교의 세 가지 진리 표시: 제행무상·일체개고·제법무아.','Three marks','Impermanence, suffering and not-self.'],
 '바라문':['婆羅門','원래 인도의 사제 계급. 법구경에서는 깨달음을 이룬 참된 성자를 뜻함.','Brahmin','Originally the priestly caste; in the Dhammapada, a truly holy person.'],
 '아라한':['阿羅漢','번뇌를 모두 끊고 깨달음을 완성한 성자. "공양받을 만한 분".','Arahant','A perfected one who has ended all defilements.'],
};

SUTRAS.dhamma={"t": "법구경", "te": "The Dhammapada", "h": "法句經", "pali": true, "about": [["법구경은 부처님께서 45년 동안 여러 곳에서 하신 말씀 가운데 핵심이 되는 시(게송) 423편을 26장(품)으로 모은 경전입니다. 원래 인도 고대어인 빨리어로 전해졌으며, 동남아시아 불교에서는 가장 많이 읽히는 경전입니다. 쉽고 짧은 생활의 지혜가 가득하여 명심보감처럼 읽을 수 있습니다.", "The Dhammapada collects 423 verses of the Buddha's teaching in 26 chapters. Preserved in the ancient Pali language, it is the most widely read scripture in Southeast Asian Buddhism — short, practical wisdom for daily life."], ["이 앱에서는 원문으로 빨리어를 싣고(한문 번역본은 구성이 달라서), 한국어 해석과 쉬운 풀이는 새로 썼습니다. 영어는 비구 수자토(Bhikkhu Sujato)의 번역으로, 누구나 쓸 수 있도록 공개(퍼블릭 도메인)된 것입니다.", "The original Pali text is shown (the Chinese version is arranged differently). Korean translations were newly written; the English is Bhikkhu Sujato's translation, dedicated to the public domain (CC0)."]], "parts": [{"id": "d1", "t": "제1품 쌍요품", "te": "Ch. 1: Pairs", "h": "雙要品", "by": "1~20번 게송 (20구절)", "bye": "Verses 1–20", "d": "짝을 이루는 가르침 — 마음, 원한, 선과 악", "de": "Pairs", "items": [{"n": 1, "h": "Manopubbaṅgamā dhammā, manoseṭṭhā manomayā; Manasā ce paduṭṭhena, bhāsati vā karoti vā; Tato naṁ dukkhamanveti, cakkaṁva vahato padaṁ.", "r": "", "k": "마음이 모든 일에 앞서고, 마음이 주인이며, 모든 것은 마음이 만든다. 더러운 마음으로 말하거나 행동하면, 수레바퀴가 소의 발자국을 따르듯 괴로움이 그를 따른다.", "z": "모든 행복과 불행은 마음에서 시작됩니다. 법구경의 첫 구절이자 불교 전체를 꿰뚫는 말씀입니다.", "e": "Intention is the leader of things; intention is first, they’re made by intention. If with corrupt intent you speak or act, suffering follows you, like a wheel, the ox’s foot.", "w": ["마음"]}, {"n": 2, "h": "Manopubbaṅgamā dhammā, manoseṭṭhā manomayā; Manasā ce pasannena, bhāsati vā karoti vā; Tato naṁ sukhamanveti, chāyāva anapāyinī.", "r": "", "k": "마음이 모든 일에 앞서고, 마음이 주인이며, 모든 것은 마음이 만든다. 깨끗한 마음으로 말하거나 행동하면, 그림자가 몸을 떠나지 않듯 즐거움이 그를 따른다.", "z": "좋은 마음으로 한 말과 행동은 그림자처럼 늘 행복으로 돌아옵니다.", "e": "Intention is the leader of things; intention is first, they’re made by intention. If with pure intent you speak or act, happiness follows you like a shadow that never leaves.", "w": ["마음"]}, {"n": 3, "h": "Akkocchi maṁ avadhi maṁ, ajini maṁ ahāsi me; Ye ca taṁ upanayhanti, veraṁ tesaṁ na sammati.", "r": "", "k": "\"그가 나를 욕했다, 나를 때렸다, 나를 이겼다, 내 것을 빼앗았다.\" 이런 생각을 품는 사람에게 원한은 가라앉지 않는다.", "z": "지난 일을 곱씹을수록 미움은 더 커집니다.", "e": "“They abused me, they hit me! They beat me, they robbed me!” For those who bear such a grudge, hatred is never laid to rest.", "w": []}, {"n": 4, "h": "Akkocchi maṁ avadhi maṁ, ajini maṁ ahāsi me; Ye ca taṁ nupanayhanti, veraṁ tesūpasammati.", "r": "", "k": "\"그가 나를 욕했다, 나를 때렸다, 나를 이겼다, 내 것을 빼앗았다.\" 이런 생각을 품지 않는 사람에게 원한은 가라앉는다.", "z": "내려놓을 때 비로소 마음이 편해집니다.", "e": "“They abused me, they hit me! They beat me, they robbed me!” For those who bear no such grudge, hatred is laid to rest.", "w": []}, {"n": 5, "h": "Na hi verena verāni, sammantīdha kudācanaṁ; Averena ca sammanti, esa dhammo sanantano.", "r": "", "k": "이 세상에서 원한은 원한으로 결코 그치지 않는다. 원한을 버릴 때에만 그친다. 이것은 영원한 진리다.", "z": "미움을 미움으로 갚으면 끝이 없습니다. 법구경에서 가장 유명한 구절입니다.", "e": "For never is hatred laid to rest by hate, it’s laid to rest by love: this is an ancient teaching.", "w": []}, {"n": 6, "h": "Pare ca na vijānanti, mayamettha yamāmase; Ye ca tattha vijānanti, tato sammanti medhagā.", "r": "", "k": "\"우리는 언젠가 이 세상에서 죽는다\"는 것을 다른 이들은 알지 못한다. 이것을 아는 사람들은 그로써 다툼이 그친다.", "z": "누구나 결국 떠난다는 것을 알면 다툴 일이 줄어듭니다.", "e": "When others do not understand, let us, who do understand this, restrain ourselves in this regard; for that is how conflicts are laid to rest.", "w": []}, {"n": 7, "h": "Subhānupassiṁ viharantaṁ, indriyesu asaṁvutaṁ; Bhojanamhi cāmattaññuṁ, kusītaṁ hīnavīriyaṁ; Taṁ ve pasahati māro, vāto rukkhaṁva dubbalaṁ.", "r": "", "k": "즐거움만 좇고 감각을 다스리지 않으며, 먹는 데 절제가 없고 게으르며 노력이 없는 사람 — 바람이 약한 나무를 쓰러뜨리듯 마라가 그를 쓰러뜨린다.", "z": "절제 없는 생활은 유혹에 쉽게 무너집니다.", "e": "Those who contemplate the beautiful, their faculties unrestrained, immoderate in eating, lazy, lacking energy: Māra strikes them down like the wind, a feeble tree.", "w": ["마라"]}, {"n": 8, "h": "Asubhānupassiṁ viharantaṁ, Indriyesu susaṁvutaṁ; Bhojanamhi ca mattaññuṁ, Saddhaṁ āraddhavīriyaṁ; Taṁ ve nappasahati māro, Vāto selaṁva pabbataṁ.", "r": "", "k": "즐거움을 좇지 않고 감각을 잘 다스리며, 먹는 데 절제하고 믿음과 노력이 있는 사람 — 바람이 바위산을 흔들지 못하듯 마라도 그를 흔들지 못한다.", "z": "절제와 믿음이 있으면 바위산처럼 흔들리지 않습니다.", "e": "Those who contemplate the ugly, their faculties well-restrained, eating in moderation, faithful and energetic: Māra cannot strike them down, like the wind, a rocky mountain.", "w": ["마라"]}, {"n": 9, "h": "Anikkasāvo kāsāvaṁ, yo vatthaṁ paridahissati; Apeto damasaccena, na so kāsāvamarahati.", "r": "", "k": "마음의 때를 벗지 못한 채 가사를 입는 사람, 절제와 진실이 없는 사람은 가사를 입을 자격이 없다.", "z": "겉모습(옷)보다 마음이 수행자를 만듭니다.", "e": "One who, not free of stains themselves, would wear the robe stained in ocher, bereft of self-control and truth: they are not worthy of the ocher robe.", "w": ["가사"]}, {"n": 10, "h": "Yo ca vantakasāvassa, sīlesu susamāhito; Upeto damasaccena, sa ve kāsāvamarahati.", "r": "", "k": "마음의 때를 벗고 계율을 잘 지키며 절제와 진실을 갖춘 사람은 가사를 입을 자격이 있다.", "z": "", "e": "One who’s purged all their stains, steady in ethics, possessed of self-control and of truth, they are truly worthy of the ocher robe.", "w": ["가사"]}, {"n": 11, "h": "Asāre sāramatino, sāre cāsāradassino; Te sāraṁ nādhigacchanti, micchāsaṅkappagocarā.", "r": "", "k": "본질이 아닌 것을 본질로 여기고 본질을 본질이 아닌 것으로 보는 사람은, 그릇된 생각에 머물러 본질에 이르지 못한다.", "z": "무엇이 정말 중요한지 바르게 보는 것이 첫걸음입니다.", "e": "Thinking the inessential is essential, seeing the essential as inessential; they don’t realize the essential, for wrong thoughts are their habitat.", "w": []}, {"n": 12, "h": "Sārañca sārato ñatvā, asārañca asārato; Te sāraṁ adhigacchanti, sammāsaṅkappagocarā.", "r": "", "k": "본질을 본질로, 본질 아닌 것을 본질 아닌 것으로 아는 사람은, 바른 생각에 머물러 본질에 이른다.", "z": "", "e": "Having known the essential as essential, and the inessential as inessential; they realize the essential, for right thoughts are their habitat.", "w": []}, {"n": 13, "h": "Yathā agāraṁ ducchannaṁ, vuṭṭhī samativijjhati; Evaṁ abhāvitaṁ cittaṁ, rāgo samativijjhati.", "r": "", "k": "지붕을 엉성하게 이은 집에 비가 새듯, 닦지 않은 마음에는 탐욕이 스며든다.", "z": "마음도 집처럼 잘 손질해야 욕심이 새어 들지 않습니다.", "e": "Just as rain seeps into a poorly roofed house, lust seeps into an undeveloped mind.", "w": ["탐욕"]}, {"n": 14, "h": "Yathā agāraṁ suchannaṁ, vuṭṭhī na samativijjhati; Evaṁ subhāvitaṁ cittaṁ, rāgo na samativijjhati.", "r": "", "k": "지붕을 잘 이은 집에 비가 새지 않듯, 잘 닦은 마음에는 탐욕이 스며들지 못한다.", "z": "", "e": "Just as rain doesn’t seep into a well roofed house, lust doesn’t seep into a well developed mind.", "w": ["탐욕"]}, {"n": 15, "h": "Idha socati pecca socati, Pāpakārī ubhayattha socati; So socati so vihaññati, Disvā kammakiliṭṭhamattano.", "r": "", "k": "악을 행한 사람은 이 세상에서 슬퍼하고 저 세상에서도 슬퍼하며, 두 곳에서 모두 슬퍼한다. 자기 행동의 더러움을 보고 괴로워하며 슬퍼한다.", "z": "", "e": "Here they grieve, hereafter they grieve, an evildoer grieves in both places. They grieve and fret, seeing their own corrupt deeds.", "w": []}, {"n": 16, "h": "Idha modati pecca modati, Katapuñño ubhayattha modati; So modati so pamodati, Disvā kammavisuddhimattano.", "r": "", "k": "선을 행한 사람은 이 세상에서 기뻐하고 저 세상에서도 기뻐하며, 두 곳에서 모두 기뻐한다. 자기 행동의 깨끗함을 보고 기뻐하고 즐거워한다.", "z": "", "e": "Here they rejoice, hereafter they rejoice, one who does good rejoices in both places. They rejoice and celebrate, seeing their own pure deeds.", "w": []}, {"n": 17, "h": "Idha tappati pecca tappati, Pāpakārī ubhayattha tappati; “Pāpaṁ me katan”ti tappati, Bhiyyo tappati duggatiṁ gato.", "r": "", "k": "악을 행한 사람은 이 세상에서도 저 세상에서도 괴로워한다. \"내가 악을 지었구나\" 하며 괴로워하고, 나쁜 곳에 가서 더욱 괴로워한다.", "z": "", "e": "Here they’re tormented, hereafter they’re tormented, an evildoer is tormented in both places. They’re tormented thinking of bad things they’ve done; when gone to a bad place, they’re tormented all the more.", "w": []}, {"n": 18, "h": "Idha nandati pecca nandati, Katapuñño ubhayattha nandati; “Puññaṁ me katan”ti nandati, Bhiyyo nandati suggatiṁ gato.", "r": "", "k": "선을 행한 사람은 이 세상에서도 저 세상에서도 즐거워한다. \"내가 선을 지었구나\" 하며 즐거워하고, 좋은 곳에 가서 더욱 즐거워한다.", "z": "15~18절은 선과 악의 결과가 지금 이 삶에서부터 나타난다는 것을 짝지어 보여 줍니다.", "e": "Here they delight, hereafter they delight, one who does good delights in both places. They delight thinking of good things they’ve done; when gone to a good place, they delight all the more.", "w": []}, {"n": 19, "h": "Bahumpi ce saṁhita bhāsamāno, Na takkaro hoti naro pamatto; Gopova gāvo gaṇayaṁ paresaṁ, Na bhāgavā sāmaññassa hoti.", "r": "", "k": "경전을 아무리 많이 외워도 게을러서 실천하지 않는 사람은, 남의 소를 세는 목동과 같아 수행의 결실을 얻지 못한다.", "z": "아는 것보다 실천이 중요합니다. 남의 소를 아무리 세어도 내 소가 되지 않습니다.", "e": "Much though they may recite scripture, if a negligent person does not apply them, then, like a cowherd who counts the cattle of others, they miss out on the blessings of the ascetic life.", "w": []}, {"n": 20, "h": "Appampi ce saṁhita bhāsamāno, Dhammassa hoti anudhammacārī; Rāgañca dosañca pahāya mohaṁ, Sammappajāno suvimuttacitto; Anupādiyāno idha vā huraṁ vā, Sa bhāgavā sāmaññassa hoti.", "r": "", "k": "경전을 조금밖에 외우지 못해도 가르침대로 실천하여 탐욕과 성냄과 어리석음을 버리고, 바르게 알고 마음이 해탈하여 이 세상과 저 세상에 집착하지 않는 사람은 수행의 결실을 얻는다.", "z": "조금 알아도 실천하는 사람이 많이 알고 실천하지 않는 사람보다 낫습니다.", "e": "Little though they may recite scripture, if they live in line with the teaching, having given up greed, hate, and delusion, with deep understanding and heart well freed, not grasping to this life or the next, they share in the blessings of the ascetic life.", "w": ["삼독", "해탈"]}], "soon": false}, {"id": "d2", "t": "제2품 방일품", "te": "Ch. 2: Diligence", "h": "放逸品", "by": "21~32번 게송 (12구절)", "bye": "Verses 21–32", "d": "게으름과 깨어 있음", "de": "Diligence", "items": [{"n": 21, "h": "Appamādo amatapadaṁ, pamādo maccuno padaṁ; Appamattā na mīyanti, ye pamattā yathā matā.", "r": "", "k": "깨어 있음은 죽음 없는 길이고, 게으름은 죽음의 길이다. 깨어 있는 사람은 죽지 않고, 게으른 사람은 이미 죽은 사람과 같다.", "z": "\"방일(放逸)\"은 게으르고 마음이 풀어진 것, \"불방일\"은 늘 깨어서 부지런한 것입니다. 부처님의 마지막 유언도 \"게으르지 말고 정진하라\"였습니다.", "e": "Heedfulness is the state free of death; heedlessness is the state of death. The heedful do not die, while the heedless are like the dead.", "w": ["불방일", "열반"]}, {"n": 22, "h": "Evaṁ visesato ñatvā, appamādamhi paṇḍitā; Appamāde pamodanti, ariyānaṁ gocare ratā.", "r": "", "k": "이것을 분명히 아는 지혜로운 이는 깨어 있음을 기뻐하고, 성자들의 경지를 즐긴다.", "z": "", "e": "Understanding this distinction when it comes to heedfulness, the astute rejoice in heedfulness, happy in the noble ones’ domain.", "w": ["불방일"]}, {"n": 23, "h": "Te jhāyino sātatikā, niccaṁ daḷhaparakkamā; Phusanti dhīrā nibbānaṁ, yogakkhemaṁ anuttaraṁ.", "r": "", "k": "끊임없이 선정을 닦고 늘 굳세게 노력하는 지혜로운 이는 최고의 평안인 열반에 이른다.", "z": "", "e": "They who regularly meditate, always staunchly vigorous; the attentive realize extinguishment, the supreme sanctuary from the yoke.", "w": ["선정", "열반"]}, {"n": 24, "h": "Uṭṭhānavato satīmato, Sucikammassa nisammakārino; Saññatassa dhammajīvino, Appamattassa yasobhivaḍḍhati.", "r": "", "k": "부지런하고 마음챙김이 있으며, 행동이 깨끗하고 신중하며, 자신을 다스리고 법답게 사는 깨어 있는 사람의 명성은 날로 높아진다.", "z": "", "e": "For the hard-working and mindful, pure of deed and attentive, restrained, living righteously, and diligent, their reputation only grows.", "w": ["정념"]}, {"n": 25, "h": "Uṭṭhānenappamādena, saṁyamena damena ca; Dīpaṁ kayirātha medhāvī, yaṁ ogho nābhikīrati.", "r": "", "k": "부지런함과 깨어 있음과 절제와 자기 다스림으로, 지혜로운 이는 홍수도 휩쓸지 못할 섬을 만든다.", "z": "세상의 거센 물결(번뇌) 속에서도 흔들리지 않는 나만의 섬을 만들라는 뜻입니다.", "e": "By hard work and diligence, by restraint and by self-control, a smart person would build an island that the floods cannot overflow.", "w": ["번뇌"]}, {"n": 26, "h": "Pamādamanuyuñjanti, bālā dummedhino janā; Appamādañca medhāvī, dhanaṁ seṭṭhaṁva rakkhati.", "r": "", "k": "어리석은 이들은 게으름에 빠지고, 지혜로운 이는 깨어 있음을 가장 귀한 보물처럼 지킨다.", "z": "", "e": "Fools and simpletons devote themselves to negligence. But the wise protect diligence as their best treasure.", "w": ["불방일"]}, {"n": 27, "h": "Mā pamādamanuyuñjetha, mā kāmaratisanthavaṁ; Appamatto hi jhāyanto, pappoti vipulaṁ sukhaṁ.", "r": "", "k": "게으름에 빠지지 말고 감각적 쾌락을 가까이하지 말라. 깨어서 선정을 닦는 이는 큰 행복을 얻는다.", "z": "", "e": "Don’t devote yourself to negligence, or delight in erotic intimacy. For if you’re diligent and meditate, you’ll attain abundant happiness.", "w": ["선정"]}, {"n": 28, "h": "Pamādaṁ appamādena, yadā nudati paṇḍito; Paññāpāsādamāruyha, asoko sokiniṁ pajaṁ; Pabbataṭṭhova bhūmaṭṭhe, dhīro bāle avekkhati.", "r": "", "k": "지혜로운 이가 깨어 있음으로 게으름을 몰아내면, 지혜의 누각에 올라 근심 없이 근심하는 사람들을 내려다본다. 산 위에 선 이가 땅 위의 사람들을 보듯.", "z": "", "e": "When the astute dispel negligence by means of diligence, ascending the palace of wisdom, sorrowless, they behold this generation of sorrow, as an attentive one on a mountain top beholds the fools below.", "w": []}, {"n": 29, "h": "Appamatto pamattesu, suttesu bahujāgaro; Abalassaṁva sīghasso, hitvā yāti sumedhaso.", "r": "", "k": "게으른 이들 속에서 깨어 있고 잠든 이들 속에서 깨어 있는 지혜로운 이는, 빠른 말이 느린 말을 앞지르듯 앞으로 나아간다.", "z": "", "e": "Heedful among the heedless, wide awake while others sleep— a true sage leaves them behind, like a swift horse passing a feeble.", "w": []}, {"n": 30, "h": "Appamādena maghavā, devānaṁ seṭṭhataṁ gato; Appamādaṁ pasaṁsanti, pamādo garahito sadā.", "r": "", "k": "깨어 있음으로 인드라는 신들의 왕이 되었다. 사람들은 깨어 있음을 칭찬하고, 게으름은 늘 비난받는다.", "z": "인드라(제석천)는 인도 신화의 신들의 왕입니다. 부지런함 덕분에 그 자리에 올랐다는 이야기입니다.", "e": "Maghavā became chief of the gods by means of diligence. People praise diligence, while negligence is always deplored.", "w": []}, {"n": 31, "h": "Appamādarato bhikkhu, pamāde bhayadassi vā; Saṁyojanaṁ aṇuṁ thūlaṁ, ḍahaṁ aggīva gacchati.", "r": "", "k": "깨어 있음을 기뻐하고 게으름에서 두려움을 보는 비구는, 크고 작은 모든 속박을 불처럼 태우며 나아간다.", "z": "", "e": "A mendicant who loves diligence, seeing fear in negligence— advances like fire, burning up fetters big and small.", "w": ["비구"]}, {"n": 32, "h": "Appamādarato bhikkhu, pamāde bhayadassi vā; Abhabbo parihānāya, nibbānasseva santike.", "r": "", "k": "깨어 있음을 기뻐하고 게으름에서 두려움을 보는 비구는 결코 물러나지 않으며 열반 가까이에 있다.", "z": "", "e": "A mendicant who loves diligence, seeing fear in negligence— such a one can’t decline, and has drawn near to extinguishment.", "w": ["비구", "열반"]}], "soon": false}, {"id": "d3", "t": "제3품 심의품", "te": "Ch. 3: The Mind", "h": "心意品", "by": "33~43번 게송 (11구절)", "bye": "Verses 33–43", "d": "마음을 다스리는 법", "de": "The Mind", "items": [{"n": 33, "h": "Phandanaṁ capalaṁ cittaṁ, dūrakkhaṁ dunnivārayaṁ; Ujuṁ karoti medhāvī, usukārova tejanaṁ.", "r": "", "k": "흔들리고 들뜨며 지키기 어렵고 다스리기 어려운 마음을, 지혜로운 이는 곧게 한다. 화살 만드는 이가 화살대를 곧게 펴듯.", "z": "", "e": "The mind quivers and quakes, hard to guard, hard to curb. The discerning straighten it out, like a fletcher an arrow.", "w": ["마음"]}, {"n": 34, "h": "Vārijova thale khitto, okamokataubbhato; Pariphandatidaṁ cittaṁ, māradheyyaṁ pahātave.", "r": "", "k": "물에서 끌려 나와 땅 위에 던져진 물고기가 몸부림치듯, 이 마음은 마라의 영역을 벗어나려고 몸부림친다.", "z": "", "e": "Like a fish pulled from the sea and cast upon the shore, this mind flounders about, trying to throw off Māra’s dominion.", "w": ["마라"]}, {"n": 35, "h": "Dunniggahassa lahuno, yatthakāmanipātino; Cittassa damatho sādhu, cittaṁ dantaṁ sukhāvahaṁ.", "r": "", "k": "붙잡기 어렵고 가볍게 움직이며 원하는 곳 어디로나 내려앉는 마음을 다스리는 것은 훌륭한 일이다. 다스려진 마음은 행복을 가져온다.", "z": "마음은 원숭이처럼 이리저리 뛰어다닙니다. 그 마음을 길들이는 것이 행복의 열쇠입니다.", "e": "Hard to hold back, flighty, alighting where it will; it’s good to tame the mind; a tamed mind leads to bliss.", "w": ["마음"]}, {"n": 36, "h": "Sududdasaṁ sunipuṇaṁ, yatthakāmanipātinaṁ; Cittaṁ rakkhetha medhāvī, cittaṁ guttaṁ sukhāvahaṁ.", "r": "", "k": "보기 어렵고 아주 미묘하며 원하는 곳 어디로나 내려앉는 마음을 지혜로운 이는 지켜야 한다. 잘 지켜진 마음은 행복을 가져온다.", "z": "", "e": "So hard to see, so subtle, alighting where it will; the discerning protect the mind, a guarded mind leads to bliss.", "w": ["마음"]}, {"n": 37, "h": "Dūraṅgamaṁ ekacaraṁ, asarīraṁ guhāsayaṁ; Ye cittaṁ saṁyamissanti, mokkhanti mārabandhanā.", "r": "", "k": "멀리 떠돌고 홀로 다니며 형체 없이 몸이라는 동굴에 사는 이 마음을 다스리는 이는 마라의 속박에서 벗어난다.", "z": "", "e": "The mind travels far, wandering alone; incorporeal, it lies hidden in the heart. Those who will restrain the mind are freed from Māra’s bonds.", "w": ["마라"]}, {"n": 38, "h": "Anavaṭṭhitacittassa, saddhammaṁ avijānato; Pariplavapasādassa, paññā na paripūrati.", "r": "", "k": "마음이 안정되지 않고 바른 가르침을 모르며 믿음이 흔들리는 사람은 지혜가 완성되지 못한다.", "z": "", "e": "Those of unsteady mind, who don’t understand the true teaching, and whose confidence wavers, do not perfect their wisdom.", "w": []}, {"n": 39, "h": "Anavassutacittassa, ananvāhatacetaso; Puññapāpapahīnassa, natthi jāgarato bhayaṁ.", "r": "", "k": "마음이 탐욕에 젖지 않고 성냄에 흔들리지 않으며, 선악을 모두 넘어선 깨어 있는 사람에게는 두려움이 없다.", "z": "", "e": "One whose mind is not festering, whose heart is undamaged, who’s given up right and wrong, alert, has nothing to fear.", "w": []}, {"n": 40, "h": "Kumbhūpamaṁ kāyamimaṁ viditvā, Nagarūpamaṁ cittamidaṁ ṭhapetvā; Yodhetha māraṁ paññāvudhena, Jitañca rakkhe anivesano siyā.", "r": "", "k": "이 몸이 질그릇처럼 깨지기 쉬움을 알고 이 마음을 성처럼 굳게 지켜, 지혜의 무기로 마라와 싸우라. 얻은 것을 지키되 거기에 집착하지 말라.", "z": "", "e": "Knowing this body breaks like a pot, and fortifying the mind like a citadel, attack Māra with the sword of wisdom, guard your conquest, and never settle.", "w": ["마라", "지혜"]}, {"n": 41, "h": "Aciraṁ vatayaṁ kāyo, pathaviṁ adhisessati; Chuddho apetaviññāṇo, niratthaṁva kaliṅgaraṁ.", "r": "", "k": "머지않아 이 몸은 의식이 떠난 채 쓸모없는 나무토막처럼 버려져 땅 위에 누우리라.", "z": "몸의 덧없음을 깊이 생각하라는 가르침입니다.", "e": "All too soon this body will lie upon the earth, bereft of consciousness, tossed aside like a worthless log.", "w": ["무상"]}, {"n": 42, "h": "Diso disaṁ yaṁ taṁ kayirā, verī vā pana verinaṁ; Micchāpaṇihitaṁ cittaṁ, pāpiyo naṁ tato kare.", "r": "", "k": "원수가 원수에게, 미워하는 이가 미워하는 이에게 끼치는 해악보다, 잘못 이끌린 마음이 자신에게 더 큰 해를 끼친다.", "z": "나를 가장 크게 해치는 것은 남이 아니라 잘못된 내 마음입니다.", "e": "A wrongly directed mind would do you more harm than a hater to the hated, or an enemy to their foe.", "w": ["마음"]}, {"n": 43, "h": "Na taṁ mātā pitā kayirā, aññe vāpi ca ñātakā; Sammāpaṇihitaṁ cittaṁ, seyyaso naṁ tato kare.", "r": "", "k": "어머니도 아버지도 다른 친척도 해 줄 수 없는 더 큰 이로움을, 바르게 이끌린 마음은 자신에게 가져다준다.", "z": "", "e": "A rightly directed mind would do you more good than your mother or father or any other relative.", "w": ["마음"]}], "soon": false}, {"id": "d4", "t": "제4품 화향품", "te": "Ch. 4: Flowers", "h": "華香品", "by": "44~59번 게송 (16구절)", "bye": "Verses 44–59", "d": "꽃과 향기에 빗댄 가르침", "de": "Flowers", "items": [{"n": 44, "h": "Ko imaṁ pathaviṁ vicessati, Yamalokañca imaṁ sadevakaṁ; Ko dhammapadaṁ sudesitaṁ, Kusalo pupphamiva pacessati.", "r": "", "k": "누가 이 땅과 염라의 세계와 신들의 세계를 이겨 낼 것인가? 누가 잘 설해진 진리의 말씀을 찾아낼 것인가? 솜씨 좋은 이가 꽃을 골라 따듯이.", "z": "", "e": "Who bestirs this earth, and the Yama realm with its gods? Who sets out the well-taught word of truth, as an expert a flower?", "w": []}, {"n": 45, "h": "Sekho pathaviṁ vicessati, Yamalokañca imaṁ sadevakaṁ; Sekho dhammapadaṁ sudesitaṁ, Kusalo pupphamiva pacessati.", "r": "", "k": "배우는 이가 이 땅과 염라의 세계와 신들의 세계를 이겨 내리라. 배우는 이가 잘 설해진 진리의 말씀을 찾아내리라. 솜씨 좋은 이가 꽃을 골라 따듯이.", "z": "", "e": "A trainee bestirs this earth, and the Yama realm with its gods. A trainee sets out the well-taught word of truth, as an expert a flower.", "w": []}, {"n": 46, "h": "Pheṇūpamaṁ kāyamimaṁ viditvā, Marīcidhammaṁ abhisambudhāno; Chetvāna mārassa papupphakāni, Adassanaṁ maccurājassa gacche.", "r": "", "k": "이 몸이 물거품 같음을 알고 아지랑이 같음을 깨달아, 마라의 꽃 화살을 꺾고 죽음의 왕이 보지 못하는 곳으로 가라.", "z": "", "e": "Knowing this body’s like foam, realizing it’s all just a mirage, and cutting off Māra’s blossoming, vanish from the King of Death.", "w": ["마라", "무상"]}, {"n": 47, "h": "Pupphāni heva pacinantaṁ, byāsattamanasaṁ naraṁ; Suttaṁ gāmaṁ mahoghova, maccu ādāya gacchati.", "r": "", "k": "꽃을 따는 데만 마음이 팔린 사람을, 잠든 마을을 큰물이 휩쓸어 가듯 죽음이 데려간다.", "z": "\"꽃 따기\"는 세상의 즐거움만 좇는 것을 말합니다.", "e": "As a mighty flood sweeps off a sleeping village, death steals away a man even as he gathers flowers, his mind caught up in them.", "w": []}, {"n": 48, "h": "Pupphāni heva pacinantaṁ, byāsattamanasaṁ naraṁ; Atittaññeva kāmesu, antako kurute vasaṁ.", "r": "", "k": "꽃을 따는 데만 마음이 팔려 욕망을 채우지 못한 채 사는 사람을 죽음이 지배한다.", "z": "", "e": "The terminator gains control of the man who has not had his fill of pleasures, even as he gathers flowers, his mind caught up in them.", "w": []}, {"n": 49, "h": "Yathāpi bhamaro pupphaṁ, vaṇṇagandhamaheṭhayaṁ; Paleti rasamādāya, evaṁ gāme munī care.", "r": "", "k": "벌이 꽃의 빛깔과 향기를 해치지 않고 꿀만 가져가듯, 수행자는 마을에서 그렇게 다녀야 한다.", "z": "남에게 부담을 주지 않고 필요한 만큼만 받으라는 가르침입니다.", "e": "A bee takes the nectar and moves on, doing no damage to the flower’s beauty and fragrance; and that’s how a sage should walk in the village.", "w": []}, {"n": 50, "h": "Na paresaṁ vilomāni, na paresaṁ katākataṁ; Attanova avekkheyya, katāni akatāni ca.", "r": "", "k": "남의 잘못이나 남이 한 일과 하지 않은 일을 살피지 말고, 오직 자신이 한 일과 하지 않은 일을 살펴라.", "z": "남 탓보다 내 탓을 먼저 살피세요.", "e": "Don’t find fault with others, with what they’ve done or left undone. You should only watch yourself, what you’ve done or left undone.", "w": []}, {"n": 51, "h": "Yathāpi ruciraṁ pupphaṁ, vaṇṇavantaṁ agandhakaṁ; Evaṁ subhāsitā vācā, aphalā hoti akubbato.", "r": "", "k": "빛깔은 아름다우나 향기가 없는 꽃처럼, 잘 설해진 말도 실천하지 않는 사람에게는 열매가 없다.", "z": "", "e": "Just like a glorious flower that’s colorful but lacks fragrance; eloquent speech is fruitless for one who does not act on it.", "w": []}, {"n": 52, "h": "Yathāpi ruciraṁ pupphaṁ, Vaṇṇavantaṁ sagandhakaṁ; Evaṁ subhāsitā vācā, Saphalā hoti kubbato.", "r": "", "k": "빛깔도 아름답고 향기도 있는 꽃처럼, 잘 설해진 말을 실천하는 사람에게는 열매가 있다.", "z": "좋은 말은 실천할 때 비로소 향기가 납니다.", "e": "Just like a glorious flower that’s both colorful and fragrant, eloquent speech is fruitful for one who acts on it.", "w": []}, {"n": 53, "h": "Yathāpi puppharāsimhā, kayirā mālāguṇe bahū; Evaṁ jātena maccena, kattabbaṁ kusalaṁ bahuṁ.", "r": "", "k": "꽃 무더기로 많은 꽃다발을 엮듯이, 사람으로 태어났으면 많은 선행을 해야 한다.", "z": "", "e": "Just as one would create many garlands from a heap of flowers, when a person has come to be born, they should do many skillful things.", "w": []}, {"n": 54, "h": "Na pupphagandho paṭivātameti, Na candanaṁ tagaramallikā vā; Satañca gandho paṭivātameti, Sabbā disā sappuriso pavāyati.", "r": "", "k": "꽃의 향기는 바람을 거슬러 가지 못한다. 전단향도 타가라도 재스민도 그렇다. 그러나 착한 사람의 향기는 바람을 거슬러 가니, 착한 사람의 향기는 온 사방에 퍼진다.", "z": "덕의 향기는 바람을 거슬러서도 퍼집니다. 좋은 사람의 이름은 멀리까지 전해집니다.", "e": "The fragrance of flowers doesn’t spread upwind, nor sandalwood, pinwheel, or jasmine; but the fragrance of the good spreads upwind; a true person’s virtue spreads in every direction.", "w": []}, {"n": 55, "h": "Candanaṁ tagaraṁ vāpi, uppalaṁ atha vassikī; Etesaṁ gandhajātānaṁ, sīlagandho anuttaro.", "r": "", "k": "전단향, 타가라, 연꽃, 재스민 — 이 모든 향기 가운데 계행의 향기가 으뜸이다.", "z": "", "e": "Among all the fragrances— sandalwood or pinwheel or lotus or jasmine— the fragrance of virtue is supreme.", "w": ["계행"]}, {"n": 56, "h": "Appamatto ayaṁ gandho, yāyaṁ tagaracandanī; Yo ca sīlavataṁ gandho, vāti devesu uttamo.", "r": "", "k": "타가라와 전단향의 향기는 미미하다. 계행을 갖춘 이의 향기는 신들 사이에까지 퍼지는 최고의 향기다.", "z": "", "e": "Faint is the fragrance of sandal or pinwheel; but the fragrance of the virtuous floats to the highest gods.", "w": ["계행"]}, {"n": 57, "h": "Tesaṁ sampannasīlānaṁ, appamādavihārinaṁ; Sammadaññāvimuttānaṁ, māro maggaṁ na vindati.", "r": "", "k": "계행을 갖추고 깨어 있으며 바른 지혜로 해탈한 이들이 가는 길은 마라도 찾지 못한다.", "z": "", "e": "For those accomplished in ethics, meditating diligently, freed through the highest knowledge, Māra cannot find their path.", "w": ["계행", "해탈", "마라"]}, {"n": 58, "h": "Yathā saṅkāradhānasmiṁ, ujjhitasmiṁ mahāpathe; Padumaṁ tattha jāyetha, sucigandhaṁ manoramaṁ.", "r": "", "k": "큰길가에 버려진 쓰레기 더미에서도 향기롭고 마음을 기쁘게 하는 연꽃이 피어나듯,", "z": "연꽃은 진흙 속에서 피지만 진흙에 물들지 않습니다. 불교에서 연꽃을 귀하게 여기는 이유입니다.", "e": "From a heap of trash discarded on the highway, a lotus might blossom, fragrant and delightful.", "w": []}, {"n": 59, "h": "Evaṁ saṅkārabhūtesu, andhabhūte puthujjane; Atirocati paññāya, sammāsambuddhasāvako.", "r": "", "k": "쓰레기 같은 눈먼 범부들 가운데서도 바르게 깨달은 이의 제자는 지혜로 밝게 빛난다.", "z": "", "e": "So too, among those thought of as trash, a disciple of the perfect Buddha outshines with their wisdom the blind ordinary folk.", "w": []}], "soon": false}, {"id": "d5", "t": "제5품 우암품", "te": "Ch. 5: The Fool", "h": "愚闇品", "by": "60~75번 게송 (16구절)", "bye": "Verses 60–75", "d": "어리석은 사람", "de": "The Fool", "items": [{"n": 60, "h": "Dīghā jāgarato ratti, dīghaṁ santassa yojanaṁ; Dīgho bālāna saṁsāro, saddhammaṁ avijānataṁ.", "r": "", "k": "잠 못 드는 이에게 밤은 길고, 지친 이에게 길은 멀다. 바른 진리를 모르는 어리석은 이에게 윤회는 길다.", "z": "", "e": "Long is the night for the wakeful; long is the league for the weary; long transmigrate the fools who don’t understand the true teaching.", "w": ["윤회"]}, {"n": 61, "h": "Carañce nādhigaccheyya, Seyyaṁ sadisamattano; Ekacariyaṁ daḷhaṁ kayirā, Natthi bāle sahāyatā.", "r": "", "k": "길을 가다가 자기보다 낫거나 같은 벗을 만나지 못하면 차라리 홀로 굳건히 가라. 어리석은 이와는 벗할 수 없다.", "z": "나쁜 친구와 어울리느니 혼자가 낫다는 말씀 — 초발심자경문의 첫 구절과 통합니다.", "e": "If while wandering you find no partner equal or better than yourself, then firmly resolve to wander alone— there’s no fellowship with fools.", "w": ["선우"]}, {"n": 62, "h": "Puttā matthi dhanaṁ matthi, iti bālo vihaññati; Attā hi attano natthi, kuto puttā kuto dhanaṁ.", "r": "", "k": "\"내 자식, 내 재산\" 하며 어리석은 이는 괴로워한다. 자기 자신도 자기 것이 아닌데 어찌 자식과 재산이 자기 것이겠는가.", "z": "\"내 것\"이라는 집착이 괴로움을 만듭니다.", "e": "“Sons are mine, wealth is mine”— thus the fool frets. For even your self is not your own, let alone your sons or wealth.", "w": ["무아"]}, {"n": 63, "h": "Yo bālo maññati bālyaṁ, paṇḍito vāpi tena so; Bālo ca paṇḍitamānī, sa ve “bālo”ti vuccati.", "r": "", "k": "자신이 어리석은 줄 아는 어리석은 이는 그만큼 지혜롭다. 스스로 지혜롭다고 여기는 어리석은 이야말로 진짜 어리석다.", "z": "모른다는 것을 아는 것이 지혜의 시작입니다.", "e": "The fool who thinks they’re a fool is wise at least to that extent. But the true fool is said to be one who imagines that they are wise.", "w": []}, {"n": 64, "h": "Yāvajīvampi ce bālo, paṇḍitaṁ payirupāsati; Na so dhammaṁ vijānāti, dabbī sūparasaṁ yathā.", "r": "", "k": "어리석은 이는 평생 지혜로운 이를 가까이 모셔도 진리를 알지 못한다. 숟가락이 국 맛을 모르듯.", "z": "", "e": "Though a fool attends to the wise even for the rest of their life, they still don’t understand the teaching, like a spoon the taste of the soup.", "w": []}, {"n": 65, "h": "Muhuttamapi ce viññū, paṇḍitaṁ payirupāsati; Khippaṁ dhammaṁ vijānāti, jivhā sūparasaṁ yathā.", "r": "", "k": "지혜로운 이는 잠깐만 지혜로운 이를 가까이해도 곧 진리를 안다. 혀가 국 맛을 알듯.", "z": "같은 스승 곁에 있어도 마음이 열려 있어야 배울 수 있습니다.", "e": "If a clever person attends to the wise even just for an hour or so, they swiftly understand the teaching, like a tongue the taste of the soup.", "w": []}, {"n": 66, "h": "Caranti bālā dummedhā, amitteneva attanā; Karontā pāpakaṁ kammaṁ, yaṁ hoti kaṭukapphalaṁ.", "r": "", "k": "지혜가 없는 어리석은 이는 자기 자신을 원수처럼 대하며, 쓴 열매를 맺는 악업을 짓는다.", "z": "", "e": "Fools and simpletons behave like their own worst enemies, doing wicked deeds that ripen as bitter fruit.", "w": ["업"]}, {"n": 67, "h": "Na taṁ kammaṁ kataṁ sādhu, yaṁ katvā anutappati; Yassa assumukho rodaṁ, vipākaṁ paṭisevati.", "r": "", "k": "하고 나서 후회하고, 눈물 흘리며 그 결과를 받는 일은 잘한 일이 아니다.", "z": "", "e": "It’s not good to do a deed that plagues you later on, for which you weep and wail, as its effect stays with you.", "w": []}, {"n": 68, "h": "Tañca kammaṁ kataṁ sādhu, yaṁ katvā nānutappati; Yassa patīto sumano, vipākaṁ paṭisevati.", "r": "", "k": "하고 나서 후회하지 않고, 기쁘고 즐겁게 그 결과를 받는 일은 잘한 일이다.", "z": "\"나중에 후회할 일인가?\"를 행동의 기준으로 삼으세요.", "e": "It is good to do a deed that doesn’t plague you later on, that gladdens and cheers, as its effect stays with you.", "w": []}, {"n": 69, "h": "Madhuṁvā maññati bālo, yāva pāpaṁ na paccati; Yadā ca paccati pāpaṁ, atha dukkhaṁ nigacchati.", "r": "", "k": "악이 아직 익지 않았을 때 어리석은 이는 그것을 꿀처럼 여긴다. 그러나 악이 익으면 그때 괴로움을 겪는다.", "z": "", "e": "The fool imagines that evil is sweet, so long as it has not yet ripened. But as soon as that evil ripens, they fall into suffering.", "w": ["업"]}, {"n": 70, "h": "Māse māse kusaggena, bālo bhuñjeyya bhojanaṁ; Na so saṅkhātadhammānaṁ, kalaṁ agghati soḷasiṁ.", "r": "", "k": "어리석은 이가 달마다 풀잎 끝으로 음식을 먹는 고행을 하더라도, 진리를 깨달은 이의 16분의 1에도 미치지 못한다.", "z": "지나친 고행보다 바른 이해가 중요합니다.", "e": "Month after month a fool may eat food from a grass-blade’s tip; but they’ll never be worth a sixteenth part of one who has appraised the teaching.", "w": []}, {"n": 71, "h": "Na hi pāpaṁ kataṁ kammaṁ, Sajjukhīraṁva muccati; Ḍahantaṁ bālamanveti, Bhasmacchannova pāvako.", "r": "", "k": "악업은 갓 짜낸 우유처럼 곧바로 굳지 않는다. 재에 덮인 불씨처럼 타오르며 어리석은 이를 따라다닌다.", "z": "나쁜 행동의 결과는 늦게 오더라도 반드시 옵니다.", "e": "For a wicked deed that has been done does not curdle quickly like milk. Smoldering, it follows the fool, like a fire smothered over with ash.", "w": ["업"]}, {"n": 72, "h": "Yāvadeva anatthāya, ñattaṁ bālassa jāyati; Hanti bālassa sukkaṁsaṁ, muddhamassa vipātayaṁ.", "r": "", "k": "어리석은 이가 얻은 지식은 오히려 그를 해친다. 그의 좋은 몫을 망치고 그의 머리를 부순다.", "z": "", "e": "Whatever fame a fool may get, it only gives rise to harm. Whatever good features they have it ruins, and blows their head into bits.", "w": []}, {"n": 73, "h": "Asantaṁ bhāvanamiccheyya, Purekkhārañca bhikkhusu; Āvāsesu ca issariyaṁ, Pūjaṁ parakulesu ca.", "r": "", "k": "어리석은 이는 헛된 명성을 바라고, 비구들 사이에서는 앞자리를, 절에서는 권세를, 남의 집에서는 공양을 바란다.", "z": "", "e": "They’d seek the esteem that they lack, and status among the mendicants; authority over monasteries, and honor among other families.", "w": ["비구", "공양"]}, {"n": 74, "h": "Mameva kata maññantu, gihī pabbajitā ubho; Mamevātivasā assu, kiccākiccesu kismici; Iti bālassa saṅkappo, icchā māno ca vaḍḍhati.", "r": "", "k": "\"출가자나 재가자나 모두 내가 한 일인 줄 알게 하라. 크고 작은 모든 일에서 나를 따르게 하라.\" 이것이 어리석은 이의 생각이니, 욕심과 교만만 늘어난다.", "z": "", "e": "“Let both layfolk and renunciants think the work was done by me alone. In anything at all that’s to be done, let them fall under my sway alone.” So thinks the fool, their greed and pride only growing.", "w": ["아만"]}, {"n": 75, "h": "Aññā hi lābhūpanisā, aññā nibbānagāminī; Evametaṁ abhiññāya, bhikkhu buddhassa sāvako; Sakkāraṁ nābhinandeyya, vivekamanubrūhaye.", "r": "", "k": "이익을 얻는 길과 열반에 이르는 길은 다르다. 이것을 분명히 안 부처님의 제자 비구는 세상의 존경을 기뻐하지 말고 홀로 머묾을 닦아야 한다.", "z": "", "e": "For the means to profit and the path to quenching are two quite different things. A mendicant disciple of the Buddha, understanding what this really means, would never delight in honors, but rather would foster seclusion.", "w": ["비구", "열반"]}], "soon": false}, {"id": "d6", "t": "제6품 현철품", "te": "Ch. 6: The Astute", "h": "賢哲品", "by": "76~89번 게송 (14구절)", "bye": "Verses 76–89", "d": "지혜로운 사람", "de": "The Astute", "items": [{"n": 76, "h": "Nidhīnaṁva pavattāraṁ, yaṁ passe vajjadassinaṁ; Niggayhavādiṁ medhāviṁ, tādisaṁ paṇḍitaṁ bhaje; Tādisaṁ bhajamānassa, seyyo hoti na pāpiyo.", "r": "", "k": "내 허물을 지적해 주는 사람을 숨은 보물을 알려 주는 사람처럼 여겨라. 잘못을 꾸짖어 주는 그런 지혜로운 이를 가까이하라. 그런 이를 가까이하면 좋은 일이 생기고 나쁜 일은 없다.", "z": "쓴소리를 해 주는 사람이 진짜 보물입니다.", "e": "Regard one who sees your faults as a guide to a hidden treasure. Stay close to one so intelligent and astute who curbs you when you need it. Sticking close to such an impartial person, things get better, not worse.", "w": ["선우"]}, {"n": 77, "h": "Ovadeyyānusāseyya, asabbhā ca nivāraye; Satañhi so piyo hoti, asataṁ hoti appiyo.", "r": "", "k": "타이르고 가르치며 나쁜 짓을 막아라. 그러면 착한 이에게는 사랑받고, 나쁜 이에게만 미움받는다.", "z": "", "e": "Advise and instruct; curb wickedness: for you shall be loved by the good, and disliked by the bad.", "w": []}, {"n": 78, "h": "Na bhaje pāpake mitte, na bhaje purisādhame; Bhajetha mitte kalyāṇe, bhajetha purisuttame.", "r": "", "k": "나쁜 벗과 사귀지 말고 천한 사람과 어울리지 말라. 좋은 벗과 사귀고 훌륭한 사람과 어울려라.", "z": "", "e": "Don’t mix with bad friends, nor with the worst of men. Mix with spiritual friends, and with the best of men.", "w": ["선우", "악우"]}, {"n": 79, "h": "Dhammapīti sukhaṁ seti, vippasannena cetasā; Ariyappavedite dhamme, sadā ramati paṇḍito.", "r": "", "k": "진리를 마시는 이는 맑고 고요한 마음으로 편히 잠든다. 지혜로운 이는 성자가 설한 가르침을 늘 즐긴다.", "z": "", "e": "Through joy in the teaching you sleep at ease, with clear and confident heart. An astute person always delights in the teaching proclaimed by the Noble One.", "w": []}, {"n": 80, "h": "Udakañhi nayanti nettikā, Usukārā namayanti tejanaṁ; Dāruṁ namayanti tacchakā, Attānaṁ damayanti paṇḍitā.", "r": "", "k": "물 대는 이는 물길을 내고, 화살 만드는 이는 화살을 곧게 하며, 목수는 나무를 다듬고, 지혜로운 이는 자신을 다스린다.", "z": "각자 자기 일이 있듯, 지혜로운 이의 일은 자기 마음을 다듬는 것입니다.", "e": "While irrigators guide water, fletchers bend arrows straight, and carpenters bend timber straight, the astute tame themselves.", "w": []}, {"n": 81, "h": "Selo yathā ekaghano, vātena na samīrati; Evaṁ nindāpasaṁsāsu, na samiñjanti paṇḍitā.", "r": "", "k": "단단한 바위가 바람에 흔들리지 않듯, 지혜로운 이는 비난과 칭찬에 흔들리지 않는다.", "z": "남의 말 한마디에 오르락내리락하지 마세요.", "e": "As the wind cannot stir a solid mass of rock, so too blame and praise do not affect the wise.", "w": []}, {"n": 82, "h": "Yathāpi rahado gambhīro, vippasanno anāvilo; Evaṁ dhammāni sutvāna, vippasīdanti paṇḍitā.", "r": "", "k": "깊은 호수가 맑고 고요하듯, 지혜로운 이는 가르침을 듣고 마음이 맑고 고요해진다.", "z": "", "e": "Like a deep lake, clear and unclouded, so clear are the astute when they hear the teachings.", "w": []}, {"n": 83, "h": "Sabbattha ve sappurisā cajanti, Na kāmakāmā lapayanti santo; Sukhena phuṭṭhā atha vā dukhena, Na uccāvacaṁ paṇḍitā dassayanti.", "r": "", "k": "착한 이는 모든 것에 대한 집착을 버리고, 욕심 때문에 떠들지 않는다. 즐거움을 만나도 괴로움을 만나도 지혜로운 이는 들뜨거나 가라앉지 않는다.", "z": "", "e": "True persons give up everything, they don’t cajole for the things they desire. Though touched by sadness or happiness, the astute appear neither depressed nor elated.", "w": []}, {"n": 84, "h": "Na attahetu na parassa hetu, Na puttamicche na dhanaṁ na raṭṭhaṁ; Na iccheyya adhammena samiddhimattano, Sa sīlavā paññavā dhammiko siyā.", "r": "", "k": "자기를 위해서도 남을 위해서도 바르지 않은 방법으로 자식이나 재산이나 나라를 바라지 말고, 바르지 않은 방법으로 성공을 바라지 말라. 계행과 지혜를 갖추고 바르게 살아라.", "z": "", "e": "Never wish for success by unjust means, for your own sake or that of another, desiring children, wealth, or nation; rather, be virtuous, wise, and just.", "w": ["계행"]}, {"n": 85, "h": "Appakā te manussesu, ye janā pāragāmino; Athāyaṁ itarā pajā, tīramevānudhāvati.", "r": "", "k": "사람들 가운데 저 언덕에 건너가는 이는 적고, 나머지 사람들은 이쪽 기슭에서 헤맬 뿐이다.", "z": "\"저 언덕\"은 깨달음, \"이쪽 기슭\"은 괴로움의 세상입니다.", "e": "Few are those among humans who cross to the far shore. The rest just run around on the near shore.", "w": ["바라밀다"]}, {"n": 86, "h": "Ye ca kho sammadakkhāte, dhamme dhammānuvattino; Te janā pāramessanti, maccudheyyaṁ suduttaraṁ.", "r": "", "k": "바르게 설해진 진리를 따라 실천하는 이들은, 건너기 어려운 죽음의 영역을 건너 저 언덕에 이른다.", "z": "", "e": "When the teaching is well explained, the people who practice accordingly will cross over Death’s dominion so hard to pass.", "w": []}, {"n": 87, "h": "Kaṇhaṁ dhammaṁ vippahāya, Sukkaṁ bhāvetha paṇḍito; Okā anokamāgamma, Viveke yattha dūramaṁ.", "r": "", "k": "지혜로운 이는 어두운 법을 버리고 밝은 법을 닦아야 한다. 집을 떠나 집 없는 곳으로 와서, 즐기기 어려운 홀로 머묾 속에서,", "z": "87~89절은 이어지는 한 문장입니다.", "e": "Rid of dark qualities, an astute person would develop the bright. Having left home for homelessness in seclusion, where joy is hard,", "w": ["출가"]}, {"n": 88, "h": "Tatrābhiratimiccheyya, hitvā kāme akiñcano; Pariyodapeyya attānaṁ, cittaklesehi paṇḍito.", "r": "", "k": "그 안에서 기쁨을 찾아야 한다. 감각적 즐거움을 버리고 아무것도 갖지 않은 지혜로운 이는 마음의 더러움을 씻어 내야 한다.", "z": "", "e": "they’d long for satisfaction there. Forsaking sensual pleasures, owning nothing, an astute person would cleanse themselves of mental corruptions.", "w": ["번뇌"]}, {"n": 89, "h": "Yesaṁ sambodhiyaṅgesu, sammā cittaṁ subhāvitaṁ; Ādānapaṭinissagge, anupādāya ye ratā; Khīṇāsavā jutimanto, te loke parinibbutā.", "r": "", "k": "깨달음의 요소를 바르게 닦은 마음으로 집착을 버리고 붙잡지 않음을 기뻐하는 이들, 번뇌가 다한 빛나는 이들은 이 세상에서 열반에 든다.", "z": "", "e": "And those whose minds are rightly developed in the awakening factors; who, letting go of attachments, delight in not grasping: with defilements ended, brilliant, they are quenched in this world.", "w": ["번뇌", "열반"]}], "soon": false}, {"id": "d7", "t": "제7품 아라한품", "te": "Ch. 7: The Perfected Ones", "h": "阿羅漢品", "by": "90~99번 게송 (10구절)", "bye": "Verses 90–99", "d": "완성된 성자", "de": "The Perfected Ones", "items": [{"n": 90, "h": "Gataddhino visokassa, vippamuttassa sabbadhi; Sabbaganthappahīnassa, pariḷāho na vijjati.", "r": "", "k": "여행을 마치고 근심이 없으며, 모든 것에서 벗어나 모든 속박을 끊은 이에게는 번뇌의 열기가 없다.", "z": "90~99절은 아라한(완성된 성자)의 모습입니다.", "e": "At journey’s end, rid of sorrow; everywhere free, all ties given up, no fever is found in them.", "w": ["아라한"]}, {"n": 91, "h": "Uyyuñjanti satīmanto, na nikete ramanti te; Haṁsāva pallalaṁ hitvā, okamokaṁ jahanti te.", "r": "", "k": "마음챙김을 갖춘 이들은 부지런히 노력하며 어느 거처에도 집착하지 않는다. 백조가 늪을 떠나듯 그들은 이 집 저 집을 버리고 떠난다.", "z": "", "e": "The mindful apply themselves; they delight in no abode. Like a swan gone from the marsh, they leave home after home behind.", "w": ["정념"]}, {"n": 92, "h": "Yesaṁ sannicayo natthi, ye pariññātabhojanā; Suññato animitto ca, vimokkho yesaṁ gocaro; Ākāseva sakuntānaṁ, gati tesaṁ durannayā.", "r": "", "k": "쌓아 둔 것이 없고 음식을 바르게 알며, 텅 비고 모습 없는 해탈을 경계로 삼는 이들의 길은 하늘을 나는 새의 자취처럼 찾기 어렵다.", "z": "", "e": "Those with nothing stored up, who have understood their food, whose domain is the liberation of the signless and the empty: their path is hard to trace, like birds in the sky.", "w": ["해탈", "공"]}, {"n": 93, "h": "Yassāsavā parikkhīṇā, āhāre ca anissito; Suññato animitto ca, vimokkho yassa gocaro; Ākāseva sakuntānaṁ, padaṁ tassa durannayaṁ.", "r": "", "k": "번뇌가 다하고 음식에 집착하지 않으며, 텅 비고 모습 없는 해탈을 경계로 삼는 이의 자취는 하늘을 나는 새의 자취처럼 찾기 어렵다.", "z": "", "e": "One whose defilements have ended; who’s not attached to food; whose domain is the liberation of the signless and the empty: their track is hard to trace, like birds in the sky.", "w": ["해탈"]}, {"n": 94, "h": "Yassindriyāni samathaṅgatāni, Assā yathā sārathinā sudantā; Pahīnamānassa anāsavassa, Devāpi tassa pihayanti tādino.", "r": "", "k": "마부가 잘 길들인 말처럼 감각이 고요해지고, 교만과 번뇌를 버린 흔들림 없는 이는 신들조차 부러워한다.", "z": "", "e": "Whose faculties have become serene, like horses tamed by a charioteer, who has abandoned conceit and defilements; the unaffected one is envied by even the gods.", "w": ["아만"]}, {"n": 95, "h": "Pathavisamo no virujjhati, Indakhilupamo tādi subbato; Rahadova apetakaddamo, Saṁsārā na bhavanti tādino.", "r": "", "k": "땅처럼 성내지 않고, 문지방 기둥처럼 굳건하며, 진흙 없는 호수처럼 맑은 이 — 그런 이에게는 더 이상 윤회가 없다.", "z": "", "e": "Undisturbed like the earth, true to their vows, steady as Indra’s pillar, like a lake clear of mud; such a one does not transmigrate.", "w": ["윤회"]}, {"n": 96, "h": "Santaṁ tassa manaṁ hoti, santā vācā ca kamma ca; Sammadaññāvimuttassa, upasantassa tādino.", "r": "", "k": "바른 지혜로 해탈하여 고요해진 이는 마음이 고요하고, 말이 고요하고, 행동이 고요하다.", "z": "", "e": "Their mind is peaceful, peaceful are their speech and deeds. Such a one is at peace, rightly freed through enlightenment.", "w": ["해탈"]}, {"n": 97, "h": "Assaddho akataññū ca, sandhicchedo ca yo naro; Hatāvakāso vantāso, sa ve uttamaporiso.", "r": "", "k": "맹목적으로 믿지 않고, 만들어지지 않은 것(열반)을 알며, 윤회의 사슬을 끊고, 기회를 끝내고, 바람을 버린 이 — 그야말로 가장 높은 사람이다.", "z": "빨리어 원문은 말장난으로 되어 있어 겉으로는 나쁜 사람처럼 들리지만, 실은 성자를 칭찬하는 말입니다.", "e": "Lacking faith, a house-breaker, one who acknowledges nothing, purged of hope, they’ve wasted their chance: that is indeed the supreme person!", "w": ["열반"]}, {"n": 98, "h": "Gāme vā yadi vāraññe, Ninne vā yadi vā thale; Yattha arahanto viharanti, Taṁ bhūmirāmaṇeyyakaṁ.", "r": "", "k": "마을이든 숲이든 골짜기든 언덕이든, 아라한이 머무는 곳은 어디나 즐거운 곳이다.", "z": "", "e": "Whether in village or wilderness, in a valley or the uplands, wherever the perfected ones live is a delightful place.", "w": ["아라한"]}, {"n": 99, "h": "Ramaṇīyāni araññāni, yattha na ramatī jano; Vītarāgā ramissanti, na te kāmagavesino.", "r": "", "k": "사람들이 즐기지 않는 숲이 즐거운 곳이다. 탐욕을 떠난 이들은 그곳을 즐기지만, 감각적 쾌락을 찾는 이들은 그렇지 않다.", "z": "", "e": "Delightful are the wildernesses where no people delight. Those free of greed will delight there, not those who seek sensual pleasures.", "w": ["탐욕"]}], "soon": false}, {"id": "d8", "t": "제8품 술천품", "te": "Ch. 8: The Thousands", "h": "述千品", "by": "100~115번 게송 (16구절)", "bye": "Verses 100–115", "d": "천 마디보다 귀한 한 마디", "de": "The Thousands", "items": [{"n": 100, "h": "Sahassamapi ce vācā, anatthapadasaṁhitā; Ekaṁ atthapadaṁ seyyo, yaṁ sutvā upasammati.", "r": "", "k": "뜻 없는 말 천 마디보다, 듣고 마음이 고요해지는 뜻있는 말 한 마디가 낫다.", "z": "말은 많은 것보다 바른 것이 귀합니다.", "e": "Better than a thousand meaningless sayings is a single meaningful saying, hearing which brings you peace.", "w": []}, {"n": 101, "h": "Sahassamapi ce gāthā, anatthapadasaṁhitā; Ekaṁ gāthāpadaṁ seyyo, yaṁ sutvā upasammati.", "r": "", "k": "뜻 없는 시 천 구절보다, 듣고 마음이 고요해지는 한 구절의 시가 낫다.", "z": "", "e": "Better than a thousand meaningless verses is a single meaningful verse, hearing which brings you peace.", "w": []}, {"n": 102, "h": "Yo ca gāthā sataṁ bhāse, anatthapadasaṁhitā; Ekaṁ dhammapadaṁ seyyo, yaṁ sutvā upasammati.", "r": "", "k": "뜻 없는 시 백 구절을 외우는 것보다, 듣고 마음이 고요해지는 진리의 한 구절이 낫다.", "z": "", "e": "Better than reciting a hundred meaningless verses is a single saying of Dhamma, hearing which brings you peace.", "w": []}, {"n": 103, "h": "Yo sahassaṁ sahassena, saṅgāme mānuse jine; Ekañca jeyyamattānaṁ, sa ve saṅgāmajuttamo.", "r": "", "k": "전쟁터에서 백만 명을 이기는 것보다, 단 한 사람, 자기 자신을 이기는 이가 가장 훌륭한 승리자다.", "z": "법구경에서 가장 유명한 구절 가운데 하나입니다. 가장 큰 싸움은 나 자신과의 싸움입니다.", "e": "The supreme conqueror is not he who conquers a million men in battle, but he who conquers a single man: himself.", "w": []}, {"n": 104, "h": "Attā have jitaṁ seyyo, yā cāyaṁ itarā pajā; Attadantassa posassa, niccaṁ saññatacārino.", "r": "", "k": "자기를 이기는 것이 남들을 이기는 것보다 낫다. 자기를 다스리고 늘 절제하며 사는 사람,", "z": "", "e": "It is surely better to conquer oneself than all those other folk. When a person has tamed themselves, always living restrained,", "w": []}, {"n": 105, "h": "Neva devo na gandhabbo, na māro saha brahmunā; Jitaṁ apajitaṁ kayirā, tathārūpassa jantuno.", "r": "", "k": "그런 사람의 승리는 신도, 건달바도, 마라도, 범천도 패배로 바꿀 수 없다.", "z": "", "e": "no god nor centaur, nor Māra nor divinity, can undo the victory of such a personage.", "w": ["마라"]}, {"n": 106, "h": "Māse māse sahassena, yo yajetha sataṁ samaṁ; Ekañca bhāvitattānaṁ, muhuttamapi pūjaye; Sāyeva pūjanā seyyo, yañce vassasataṁ hutaṁ.", "r": "", "k": "백 년 동안 달마다 천 번씩 제사를 지내는 것보다, 자신을 닦은 이를 단 한 순간 공경하는 것이 낫다. 그 공양이 백 년 제사보다 낫다.", "z": "", "e": "Rather than a thousandfold sacrifice, every month for a full century, it’s better to honor for a single hour one who has developed themselves. That offering is better than the hundred year sacrifice.", "w": ["공양"]}, {"n": 107, "h": "Yo ca vassasataṁ jantu, aggiṁ paricare vane; Ekañca bhāvitattānaṁ, muhuttamapi pūjaye; Sāyeva pūjanā seyyo, yañce vassasataṁ hutaṁ.", "r": "", "k": "숲에서 백 년 동안 제사 불을 섬기는 것보다, 자신을 닦은 이를 단 한 순간 공경하는 것이 낫다. 그 공양이 백 년 제사보다 낫다.", "z": "", "e": "Rather than serve the sacred flame in the forest for a hundred years, it’s better to honor for a single hour a personage who has developed themselves. That offering is better than the hundred year sacrifice.", "w": ["공양"]}, {"n": 108, "h": "Yaṁ kiñci yiṭṭhaṁ va hutaṁ va loke, Saṁvaccharaṁ yajetha puññapekkho; Sabbampi taṁ na catubhāgameti, Abhivādanā ujjugatesu seyyo.", "r": "", "k": "복을 바라는 이가 이 세상에서 일 년 내내 어떤 제사나 공양을 올리더라도, 바른 이에게 절하는 공덕의 4분의 1에도 미치지 못한다.", "z": "", "e": "Whatever sacrifice or offering in the world a seeker of merit may make for a year, none of it is worth a quarter of bowing to the sincere.", "w": []}, {"n": 109, "h": "Abhivādanasīlissa, niccaṁ vuḍḍhāpacāyino; Cattāro dhammā vaḍḍhanti, āyu vaṇṇo sukhaṁ balaṁ.", "r": "", "k": "늘 공손하게 절하고 어른을 공경하는 이에게는 네 가지가 늘어난다. 수명과 아름다움과 행복과 힘이다.", "z": "어른을 공경하면 복이 늘어난다는 — 명심보감과도 통하는 가르침입니다.", "e": "For one in the habit of bowing, always honoring the elders, four blessings grow: lifespan, beauty, happiness, and strength.", "w": []}, {"n": 110, "h": "Yo ca vassasataṁ jīve, dussīlo asamāhito; Ekāhaṁ jīvitaṁ seyyo, sīlavantassa jhāyino.", "r": "", "k": "계행 없이 마음이 흩어진 채 백 년을 사는 것보다, 계행을 지키며 선정에 든 채 하루를 사는 것이 낫다.", "z": "110~115절: 헛되이 오래 사는 것보다 바르게 하루를 사는 것이 낫다는 가르침입니다.", "e": "Better to live a single day ethical and absorbed in meditation than to live a hundred years unethical and lacking immersion.", "w": ["계행", "선정"]}, {"n": 111, "h": "Yo ca vassasataṁ jīve, duppañño asamāhito; Ekāhaṁ jīvitaṁ seyyo, paññavantassa jhāyino.", "r": "", "k": "지혜 없이 마음이 흩어진 채 백 년을 사는 것보다, 지혜를 갖추고 선정에 든 채 하루를 사는 것이 낫다.", "z": "", "e": "Better to live a single day wise and absorbed in meditation than to live a hundred years witless and lacking immersion.", "w": ["지혜", "선정"]}, {"n": 112, "h": "Yo ca vassasataṁ jīve, kusīto hīnavīriyo; Ekāhaṁ jīvitaṁ seyyo, vīriyamārabhato daḷhaṁ.", "r": "", "k": "게으르고 노력 없이 백 년을 사는 것보다, 굳세게 노력하며 하루를 사는 것이 낫다.", "z": "", "e": "Better to live a single day energetic and strong, than to live a hundred years lazy and lacking energy.", "w": []}, {"n": 113, "h": "Yo ca vassasataṁ jīve, apassaṁ udayabbayaṁ; Ekāhaṁ jīvitaṁ seyyo, passato udayabbayaṁ.", "r": "", "k": "모든 것이 생겨나고 사라짐을 보지 못하고 백 년을 사는 것보다, 생겨나고 사라짐을 보며 하루를 사는 것이 낫다.", "z": "", "e": "Better to live a single day seeing rise and fall than to live a hundred years blind to rise and fall.", "w": ["무상"]}, {"n": 114, "h": "Yo ca vassasataṁ jīve, apassaṁ amataṁ padaṁ; Ekāhaṁ jīvitaṁ seyyo, passato amataṁ padaṁ.", "r": "", "k": "죽음 없는 경지를 보지 못하고 백 년을 사는 것보다, 죽음 없는 경지를 보며 하루를 사는 것이 낫다.", "z": "", "e": "Better to live a single day seeing the state free of death than to live a hundred years blind to the state free of death.", "w": ["열반"]}, {"n": 115, "h": "Yo ca vassasataṁ jīve, apassaṁ dhammamuttamaṁ; Ekāhaṁ jīvitaṁ seyyo, passato dhammamuttamaṁ.", "r": "", "k": "가장 높은 진리를 보지 못하고 백 년을 사는 것보다, 가장 높은 진리를 보며 하루를 사는 것이 낫다.", "z": "", "e": "Better to live a single day seeing the supreme teaching than to live a hundred years blind to the supreme teaching.", "w": []}], "soon": false}, {"id": "d9", "t": "제9품 악행품", "te": "Ch. 9: Wickedness", "h": "惡行品", "by": "116~128번 게송 (13구절)", "bye": "Verses 116–128", "d": "악을 짓지 말라", "de": "Wickedness", "items": [{"n": 116, "h": "Abhittharetha kalyāṇe, pāpā cittaṁ nivāraye; Dandhañhi karoto puññaṁ, pāpasmiṁ ramatī mano.", "r": "", "k": "선한 일은 서둘러 하고, 악으로부터 마음을 지켜라. 선을 느리게 하면 마음은 악을 즐기게 된다.", "z": "좋은 일은 미루지 마세요.", "e": "Rush to do good, shield your mind from evil; for when you’re slow to do good, your thoughts delight in wickedness.", "w": []}, {"n": 117, "h": "Pāpañce puriso kayirā, Na naṁ kayirā punappunaṁ; Na tamhi chandaṁ kayirātha, Dukkho pāpassa uccayo.", "r": "", "k": "악을 저질렀다면 되풀이하지 말고, 거기에 마음을 두지 말라. 악이 쌓이면 괴로움이 된다.", "z": "", "e": "If you do something bad, don’t do it again and again, don’t set your heart on it, for piling up evil is suffering.", "w": []}, {"n": 118, "h": "Puññañce puriso kayirā, kayirā naṁ punappunaṁ; Tamhi chandaṁ kayirātha, sukho puññassa uccayo.", "r": "", "k": "선을 행했다면 되풀이하고, 거기에 마음을 두어라. 선이 쌓이면 즐거움이 된다.", "z": "", "e": "If you do something good, do it again and again, set your heart on it, for piling up goodness is joyful.", "w": []}, {"n": 119, "h": "Pāpopi passati bhadraṁ, Yāva pāpaṁ na paccati; Yadā ca paccati pāpaṁ, Atha pāpo pāpāni passati.", "r": "", "k": "악이 아직 익지 않았을 때는 악한 사람도 좋은 일을 본다. 그러나 악이 익으면 그때 악한 사람은 나쁜 일을 겪는다.", "z": "", "e": "Even the wicked see good things, so long as their wickedness has not ripened. But as soon as that wickedness ripens, then the wicked see wicked things.", "w": ["업"]}, {"n": 120, "h": "Bhadropi passati pāpaṁ, Yāva bhadraṁ na paccati; Yadā ca paccati bhadraṁ, Atha bhadro bhadrāni passati.", "r": "", "k": "선이 아직 익지 않았을 때는 착한 사람도 나쁜 일을 겪는다. 그러나 선이 익으면 그때 착한 사람은 좋은 일을 본다.", "z": "착하게 사는데 왜 힘든가? — 아직 열매가 익지 않았을 뿐입니다.", "e": "Even the good see wicked things, so long as their goodness has not ripened. But as soon as that goodness ripens, then the good see good things.", "w": ["업"]}, {"n": 121, "h": "Māvamaññetha pāpassa, na mantaṁ āgamissati; Udabindunipātena, udakumbhopi pūrati; Bālo pūrati pāpassa, thokaṁ thokampi ācinaṁ.", "r": "", "k": "\"그것쯤이야 나에게 돌아오지 않겠지\" 하며 작은 악을 가볍게 여기지 말라. 물방울이 떨어져 항아리를 채우듯, 어리석은 이는 조금씩 쌓은 악으로 가득 찬다.", "z": "", "e": "Think not lightly of evil, that it won’t come back to you. The pot is filled with water falling drop by drop; the fool is filled with wickedness piled up bit by bit.", "w": ["업"]}, {"n": 122, "h": "Māvamaññetha puññassa, na mandaṁ āgamissati; Udabindunipātena, udakumbhopi pūrati; Dhīro pūrati puññassa, thokaṁ thokampi ācinaṁ.", "r": "", "k": "\"그것쯤이야 나에게 돌아오지 않겠지\" 하며 작은 선을 가볍게 여기지 말라. 물방울이 떨어져 항아리를 채우듯, 지혜로운 이는 조금씩 쌓은 선으로 가득 찬다.", "z": "작은 선행도 쌓이면 큰 복이 됩니다.", "e": "Think not lightly of goodness, that it won’t come back to you. The pot is filled with water falling drop by drop; the attentive one is filled with goodness piled up bit by bit.", "w": ["업"]}, {"n": 123, "h": "Vāṇijova bhayaṁ maggaṁ, appasattho mahaddhano; Visaṁ jīvitukāmova, pāpāni parivajjaye.", "r": "", "k": "귀한 짐을 가졌으나 동행이 적은 상인이 위험한 길을 피하듯, 살고 싶은 이가 독을 피하듯, 악을 피하라.", "z": "", "e": "Avoid wickedness, as a merchant with rich cargo and small escort would avoid a dangerous road, or one who loves life would avoid drinking poison.", "w": []}, {"n": 124, "h": "Pāṇimhi ce vaṇo nāssa, hareyya pāṇinā visaṁ; Nābbaṇaṁ visamanveti, natthi pāpaṁ akubbato.", "r": "", "k": "손에 상처가 없으면 독을 손에 들어도 된다. 상처 없는 곳에 독은 스며들지 못한다. 악을 짓지 않는 이에게는 악이 미치지 않는다.", "z": "", "e": "You can carry poison in your hand if it has no wound, for poison does not infect without a wound; nothing bad happens unless you do bad.", "w": []}, {"n": 125, "h": "Yo appaduṭṭhassa narassa dussati, Suddhassa posassa anaṅgaṇassa; Tameva bālaṁ pacceti pāpaṁ, Sukhumo rajo paṭivātaṁva khitto.", "r": "", "k": "허물 없고 깨끗하며 티 없는 사람을 해치면, 그 악은 바람을 거슬러 던진 먼지처럼 어리석은 그 자신에게 돌아온다.", "z": "", "e": "Whoever wrongs a man who has done no wrong, a pure man who has not a blemish, the evil backfires on the fool, like fine dust thrown upwind.", "w": []}, {"n": 126, "h": "Gabbhameke uppajjanti, nirayaṁ pāpakammino; Saggaṁ sugatino yanti, parinibbanti anāsavā.", "r": "", "k": "어떤 이는 다시 태에 들어 태어나고, 악을 지은 이는 지옥에 가며, 선을 행한 이는 하늘에 가고, 번뇌 없는 이는 열반에 든다.", "z": "", "e": "Some are born in a womb; evildoers go to hell; the virtuous go to heaven; the undefiled are fully extinguished.", "w": ["윤회", "열반"]}, {"n": 127, "h": "Na antalikkhe na samuddamajjhe, Na pabbatānaṁ vivaraṁ pavissa; Na vijjatī so jagatippadeso, Yatthaṭṭhito mucceyya pāpakammā.", "r": "", "k": "하늘에도 바다 한가운데에도 산속 동굴에도, 악업에서 벗어날 수 있는 곳은 이 세상 어디에도 없다.", "z": "", "e": "Not in midair, nor mid-ocean, nor hiding in a mountain cleft; you’ll find no place on the planet to escape your wicked deeds.", "w": ["업"]}, {"n": 128, "h": "Na antalikkhe na samuddamajjhe, Na pabbatānaṁ vivaraṁ pavissa; Na vijjatī so jagatippadeso, Yatthaṭṭhitaṁ nappasaheyya maccu.", "r": "", "k": "하늘에도 바다 한가운데에도 산속 동굴에도, 죽음에 정복되지 않을 곳은 이 세상 어디에도 없다.", "z": "", "e": "Not in midair, nor mid-ocean, nor hiding in a mountain cleft; you’ll find no place on the planet where you won’t be vanquished by death.", "w": ["무상"]}], "soon": false}, {"id": "d10", "t": "제10품 도장품", "te": "Ch. 10: The Rod", "h": "刀杖品", "by": "129~145번 게송 (17구절)", "bye": "Verses 129–145", "d": "폭력을 쓰지 말라", "de": "The Rod", "items": [{"n": 129, "h": "Sabbe tasanti daṇḍassa, sabbe bhāyanti maccuno; Attānaṁ upamaṁ katvā, na haneyya na ghātaye.", "r": "", "k": "모든 존재는 몽둥이를 두려워하고 모두가 죽음을 무서워한다. 자기를 견주어 남을 헤아려, 죽이지도 말고 죽이게 하지도 말라.", "z": "\"내가 싫은 것은 남도 싫다\" — 불살생(죽이지 않음)의 근본 이유입니다.", "e": "All tremble at the rod, all fear death. Treating others like oneself, neither kill nor incite to kill.", "w": ["오계"]}, {"n": 130, "h": "Sabbe tasanti daṇḍassa, sabbesaṁ jīvitaṁ piyaṁ; Attānaṁ upamaṁ katvā, na haneyya na ghātaye.", "r": "", "k": "모든 존재는 몽둥이를 두려워하고 모두가 삶을 사랑한다. 자기를 견주어 남을 헤아려, 죽이지도 말고 죽이게 하지도 말라.", "z": "", "e": "All tremble at the rod, all love life. Treating others like oneself, neither kill nor incite to kill.", "w": ["오계"]}, {"n": 131, "h": "Sukhakāmāni bhūtāni, yo daṇḍena vihiṁsati; Attano sukhamesāno, pecca so na labhate sukhaṁ.", "r": "", "k": "행복을 바라는 생명들을 자기 행복을 위해 몽둥이로 해치는 이는 죽은 뒤에 행복을 얻지 못한다.", "z": "", "e": "Creatures love happiness, so if you harm them with a stick in search of your own happiness, after death you won’t find happiness.", "w": []}, {"n": 132, "h": "Sukhakāmāni bhūtāni, yo daṇḍena na hiṁsati; Attano sukhamesāno, pecca so labhate sukhaṁ.", "r": "", "k": "행복을 바라는 생명들을 자기 행복을 위해 해치지 않는 이는 죽은 뒤에 행복을 얻는다.", "z": "", "e": "Creatures love happiness, so if you don’t harm them with a stick in search of your own happiness, after death you will find happiness.", "w": []}, {"n": 133, "h": "Māvoca pharusaṁ kañci, vuttā paṭivadeyyu taṁ; Dukkhā hi sārambhakathā, paṭidaṇḍā phuseyyu taṁ.", "r": "", "k": "누구에게도 거친 말을 하지 말라. 그 말은 너에게 되돌아온다. 성난 말은 괴로움을 낳고, 보복이 너에게 닿으리라.", "z": "", "e": "Don’t speak harshly, they may speak harshly back. For aggressive speech is painful, and the rod may spring back on you.", "w": []}, {"n": 134, "h": "Sace neresi attānaṁ, kaṁso upahato yathā; Esa pattosi nibbānaṁ, sārambho te na vijjati.", "r": "", "k": "깨진 징처럼 소리 내지 않고 고요히 있으면, 너는 이미 열반에 이른 것이다. 너에게는 다툼이 없다.", "z": "욕을 들어도 깨진 징처럼 울리지 않으면 다툼이 생기지 않습니다.", "e": "If you still yourself like a broken gong, you reach extinguishment and know no conflict.", "w": ["열반"]}, {"n": 135, "h": "Yathā daṇḍena gopālo, gāvo pājeti gocaraṁ; Evaṁ jarā ca maccu ca, āyuṁ pājenti pāṇinaṁ.", "r": "", "k": "목동이 막대기로 소들을 목장으로 몰고 가듯, 늙음과 죽음이 생명들의 목숨을 몰고 간다.", "z": "", "e": "As a cowherd drives the cows to pasture with the rod, so too old age and death drive life from living beings.", "w": ["무상"]}, {"n": 136, "h": "Atha pāpāni kammāni, karaṁ bālo na bujjhati; Sehi kammehi dummedho, aggidaḍḍhova tappati.", "r": "", "k": "어리석은 이는 악을 저지르면서도 그것을 모른다. 그 어리석은 이는 자기가 지은 업 때문에 불에 덴 듯 괴로워한다.", "z": "", "e": "The fool does not understand the evil that they do. But because of those deeds, that simpleton is tormented as if burnt by fire.", "w": ["업"]}, {"n": 137, "h": "Yo daṇḍena adaṇḍesu, appaduṭṭhesu dussati; Dasannamaññataraṁ ṭhānaṁ, khippameva nigacchati.", "r": "", "k": "해치지 않는 순한 이들을 몽둥이로 해치는 이는, 곧 열 가지 불행 가운데 하나를 만난다.", "z": "137~140절은 한 문장으로 이어집니다.", "e": "One who violently attacks the peaceful and the innocent swiftly falls to one of ten bad states:", "w": []}, {"n": 138, "h": "Vedanaṁ pharusaṁ jāniṁ, sarīrassa va bhedanaṁ; Garukaṁ vāpi ābādhaṁ, cittakkhepaṁ va pāpuṇe.", "r": "", "k": "혹독한 고통, 재산의 손실, 몸의 상해, 무거운 병, 또는 마음의 혼란,", "z": "", "e": "harsh pai
